<body>

<canvas id="game" width="900" height="600"></canvas>

<script>

const c=document.getElementById("game");
const ctx=c.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=900;
const H=600;

const ARENA={
  left:160,

  right:875,
  bottom:570
};

const GATE={
  x:845,

  w:30,
  h:120
};

let keys={};

let mouse={

  y:300,
  down:false
};

let p;
let enemies=[];
let balls=[];
let particles=[];

let score=0;
let coins=0;
let wave=1;
let elapsed=0;

let gameOver=false;
let paused=false;
let upgradeOpen=false;

let nextUpgrade=70;
let upgradeCost=10;

let upgradeCounts={
  health:0,
  damage:0,
  speed:0
};

let goblinHits=0;
let ogreHits=0;

let hearts=3;
let heartRegen=0;

let fireCooldown=0;

let bombCount=0;
let bombPickups=[];
let bombs=[];
let bombSpawnTimer=20;

let highscore=Number(
  localStorage.getItem("pixelNatureHighscore")||0
);

let bigBoss=null;
let nextBigBoss=200;

let bossCountdown=0;
let bossCountdownValue=0;

/* Gentle goblin leveling */
let goblinBuffLevel=0;

/* =========================
   SHIELD
========================= */

const SHIELD_DURATION=3;
const SHIELD_SPEED_MULTIPLIER=2;

/* =========================
   BIG BOSS VICTORY
========================= */

let victorySequence=false;
let victoryTimer=0;
let bossDefeated=false;

/* =========================
   BAT
========================= */

let batDropped=false;

let bat={
  x:0,
  y:0,
  active:false,
  collected:false,
  pulse:0
};

let batAbility=false;
let batCooldown=0;
const BAT_COOLDOWN=17;
let batSwing=0;

/* =========================
   SKELETONS
========================= */

let skeletonMode=false;
let skeletonUpgradeTimer=27;
let skeletonLevel=0;

/* =========================
   AUDIO
========================= */

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

const SOUND_VOLUME=2;

function startMusic(){

  if(musicStarted)return;

  try{

    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );

  }catch(err){

    console.log(
      "Music unavailable:",
      err
    );
  }
}

function tone(
  freq,
  duration,
  type="square",
  volume=.08
){

  if(!audioCtx)return;

  const now=
    audioCtx.currentTime;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume*SOUND_VOLUME,
    now+.01
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+duration+.02);
}

function playFireballSound(){
  tone(
    240,
    .10,
    "square",
    .07
  );
}

function playBombExplosionSound(){

  tone(
    70,
    .28,
    "square",
    .20
  );

  setTimeout(
    ()=>tone(
      900,
      .12,
      "square",
      .08
    ),
    10
  );
}

function playBossSound(){

  tone(
    80,
    .7,
    "square",
    .25
  );
}

function playBatSound(){

  tone(
    150,
    .18,
    "square",
    .18
  );

  setTimeout(
    ()=>tone(
      65,
      .25,
      "square",
      .14
    ),
    40
  );
}

function playPickupSound(){

  tone(
    500,
    .12,
    "square",
    .12
  );

  setTimeout(
    ()=>tone(
      800,
      .12,
      "square",
      .10
    ),
    80
  );
}

function playMusicStep(){

  if(
    !audioCtx||
    gameOver||
    paused
  ){
    return;
  }

  const notes=[
    110,
    130.81,
    146.83,
    164.81,
    196,
    164.81,
    146.83,
    130.81,
    110,
    146.83,
    164.81,
    196,
    220,
    196,
    164.81,
    146.83
  ];

  tone(
    notes[
      musicStep%notes.length
    ],
    .25,
    "triangle",
    .055
  );

  musicStep++;
}

/* =========================
   BUTTONS
========================= */

const fullscreenBtn=
  document.getElementById(
    "fullscreenBtn"
  );

fullscreenBtn.onclick=async()=>{

  try{

    if(!document.fullscreenElement){

      await document.documentElement.requestFullscreen();

      fullscreenBtn.textContent=
        "EXIT FULLSCREEN";

    }else{

      await document.exitFullscreen();

      fullscreenBtn.textContent=
        "FULLSCREEN";
    }

  }catch(e){}
};

document.addEventListener(
  "fullscreenchange",
  ()=>{

    fullscreenBtn.textContent=
      document.fullscreenElement
      ?"EXIT FULLSCREEN"
      :"FULLSCREEN";
  }
);

const pauseBtn=
  document.getElementById(
    "pauseBtn"
  );

function togglePause(){

  if(
    gameOver||
    victorySequence||
    bossCountdown>0||
    upgradeOpen
  ){
    return;
  }

  paused=!paused;

  pauseBtn.textContent=
    paused
    ?"RESUME"
    :"PAUSE";
}

pauseBtn.onclick=togglePause;

/* =========================
   INPUT
========================= */

window.addEventListener(
  "keydown",
  e=>{

    startMusic();

    const k=
      e.key.toLowerCase();

    keys[k]=true;

    if(
      k==="p" &&
      !e.repeat
    ){

      togglePause();
    }

    if(
      k==="r" &&
      gameOver
    ){

      reset();
      return;
    }

    if(
      k==="q" &&
      !e.repeat
    ){

      throwBomb();
    }

    if(
      k==="f" &&
      !e.repeat
    ){

      useBatAbility();
    }

    if(upgradeOpen){

      if(e.key==="1")
        buyUpgrade("health");

      if(e.key==="2")
        buyUpgrade("damage");

      if(e.key==="3")
        buyUpgrade("speed");

      if(e.key==="4")
        buyUpgrade("nothing");
    }
  }
);

window.addEventListener(
  "keyup",
  e=>{

    keys[
      e.key.toLowerCase()
    ]=false;
  }
);

c.addEventListener(
  "mousemove",
  e=>{

    const r=
      c.getBoundingClientRect();

    mouse.x=
      (e.clientX-r.left)*
      W/r.width;

    mouse.y=
      (e.clientY-r.top)*
      H/r.height;
  }
);

c.addEventListener(
  "mousedown",

    startMusic();
    mouse.down=true;
  }
);

window.addEventListener(
  "mouseup",
  ()=>{

    mouse.down=false;
  }
);

/* =========================
   RESET
========================= */

function reset(){

  p={
    x:430,
    y:305,

    speed:3.2,

    /* Increased player damage */
    damage:35,

    maxHp:100,
    hp:100,

    shieldTimer:0,
    speedBoostTimer:0
  };

  enemies=[];
  balls=[];
  particles=[];

  score=0;
  coins=0;
  wave=1;
  elapsed=0;

  gameOver=false;
  paused=false;
  upgradeOpen=false;

  nextUpgrade=70;
  upgradeCost=10;

  upgradeCounts={
    health:0,
    damage:0,
    speed:0
  };

  goblinHits=0;
  ogreHits=0;

  hearts=3;
  heartRegen=0;

  fireCooldown=0;

  bombCount=0;
  bombPickups=[];
  bombs=[];
  bombSpawnTimer=20;

  bigBoss=null;

  nextBigBoss=200;
  bossCountdown=0;
  bossCountdownValue=0;

  goblinBuffLevel=0;

  victorySequence=false;
  victoryTimer=0;
  bossDefeated=false;

  batDropped=false;

  bat={
    x:0,
    y:0,
    active:false,
    collected:false,
    pulse:0
  };

  batAbility=false;
  batCooldown=0;
  batSwing=0;

  skeletonMode=false;
  skeletonUpgradeTimer=27;
  skeletonLevel=0;

  window.lastBossMark=0;

  spawnWave(1);
}

reset();

/* =========================
   SPAWNING
========================= */

function gateSpawnPosition(){

  return{
    x:GATE.x-4,

    y:
      GATE.y+
      GATE.h/2+
      (Math.random()-.5)*45
  };
}

function spawnEnemy(
  type="goblin"
){

  if(
    bossDefeated||
    bigBoss||
    bossCountdown>0
  ){

    return;
  }

  const pos=
    gateSpawnPosition();

  const x=pos.x;
  const y=pos.y;

  if(type==="ogre"){

    const hp=
      260+
      Math.floor(
        elapsed/50
      )*35;

    enemies.push({

      type:"ogre",

      x,
      y,

      spawnX:x,
      spawnY:y,

      r:30,

      hp,
      maxHp:hp,

      speed:
        .42+
        Math.min(
          .18,
          elapsed/2000
        ),

      damage:3,

      attack:0,
      burn:0,
      burnTick:0,
      bossMark:0
    });

  }else{

    const buff=
      goblinBuffLevel;

    /*
      Gentle goblin upgrades:
      HP +8% per level
      Damage +1 every 2 levels
      Speed +0.035 per level
    */

    const hp=
      Math.round(
        (45+wave*8)*
        (1+buff*.08)
      );

    const damage=
      1+
      Math.floor(
        buff/2
      );

    const speed=
      .72+
      wave*.025+
      buff*.035;

    enemies.push({

      type:"goblin",

      x,
      y,

      spawnX:x,
      spawnY:y,

      r:14,

      hp,
      maxHp:hp,

      speed,
      damage,

      attack:0,
      burn:0,
      burnTick:0,
      bossMark:0
    });
  }
}

function spawnWave(n){

  if(
    bigBoss||
    bossCountdown>0||
    bossDefeated
  ){
    return;
  }

  for(
    let i=0;
    i<n;
    i++
  ){

    spawnEnemy("goblin");
  }
}

/* =========================
   BIG BOSS
========================= */

function spawnBigBoss(){

  if(
    bigBoss||
    bossDefeated
  ){
    return;
  }

  const pos=
    gateSpawnPosition();

  bigBoss={

    type:"bigboss",

    x:pos.x+5,
    y:pos.y,

    r:48,

    hp:2400,
    maxHp:2400,

    /* Big Boss speed = 3.1 */
    speed:3.1,

    attack:0,
    burn:0,
    burnTick:0,

    rotation:0,
    spawnFlash:35
  };

  enemies=[];

  playBossSound();
}

function defeatBigBoss(){

  if(
    !bigBoss||
    victorySequence
  ){
    return;
  }

  score+=50;
  coins+=50;

  const bossX=
    bigBoss.x;

  const bossY=
    bigBoss.y;

  burst(
    bossX,
    bossY,
    60
  );

  for(
    let i=0;
    i<35;
    i++
  ){

    particles.push({

      x:bossX,
      y:bossY,

      vx:
        (Math.random()-.5)*9,

      vy:
        (Math.random()-.5)*9,

      life:
        25+
        Math.random()*30
    });
  }

  /*
    Stop all normal spawning.
  */

  bossDefeated=true;
  skeletonMode=true;

  /*
    Existing enemies become skeletons.
  */

  convertEnemiesToSkeletons();

  /*
    Freeze the world for the defeat
    sequence.
  */

  victorySequence=true;

  victoryTimer=4;

  batDropped=false;

  bat.active=false;

  bigBoss=null;

  playBossSound();
}

/* =========================
   SKELETON SYSTEM
========================= */

function convertEnemiesToSkeletons(){

  for(
    const e of enemies
  ){

    e.type=
      e.type==="ogre"
      ?"skeletonOgre"
      :"skeletonGoblin";

    e.maxHp=
      Math.round(
        e.maxHp*1.45
      );

    e.hp=e.maxHp;

    e.speed*=1.25;

    if(
      e.type==="skeletonGoblin"
    ){

      e.damage=
        (e.damage||2)*1.5;

      e.r=15;

    }else{

      e.r=31;

      e.speed*=.9;

      e.damage=3;
    }
  }

  skeletonLevel=0;

  skeletonUpgradeTimer=27;
}

function upgradeSkeletons(){

  skeletonLevel++;

  for(
    const e of enemies
  ){

    e.maxHp=
      Math.round(
        e.maxHp*1.25
      );

    e.hp=e.maxHp;

    e.speed*=1.10;

    if(
      e.type==="skeletonGoblin"
    ){

      e.damage*=1.18;

    }else if(
      e.type==="skeletonOgre"
    ){

      e.damage*=1.20;
    }
  }
}

/* =========================
   BAT
========================= */

function dropBat(){

  if(batDropped)return;

  batDropped=true;

  bat.x=
    W/2;

  bat.y=
    H/2+40;

  bat.active=true;
  bat.collected=false;
  bat.pulse=0;
}

function collectBat(){

  if(
    !bat.active||
    bat.collected||
    !victorySequence||
    gameOver
  ){
    return;
  }

  const d=
    Math.hypot(
      p.x-bat.x,
      p.y-bat.y
    );

  if(d<32){

    bat.collected=true;
    bat.active=false;

    batAbility=true;

    playPickupSound();

    /*
      End the cutscene once the bat
      has actually been collected.
    */

    victorySequence=false;
  }
}

function useBatAbility(){

  if(
    !batAbility||
    batCooldown>0||
    gameOver||
    paused||
    victorySequence||
    upgradeOpen
  ){
    return;
  }

  batCooldown=
    BAT_COOLDOWN;

  batSwing=.45;

  playBatSound();

  /*
    Instantly destroy every enemy,
    including skeletons and skeleton
    mini bosses.
  */

  for(
    const e of enemies
  ){

    burst(
      e.x,
      e.y,
      18
    );

    e.hp=0;
  }

  enemies=[];
}

/* =========================
   HEART / SHIELD
========================= */

function damagePlayer(e){

  e.attack=45;

  /*
    Shield makes the player
    completely invincible.
  */

  if(
    p.shieldTimer>0
  ){

    return;
  }

  if(
    e.type==="goblin"||
    e.type==="skeletonGoblin"
  ){

    goblinHits+=
      e.damage||1;

    if(
      goblinHits>=4
    ){

      goblinHits=0;

      loseHeart();
    }

  }else{

    ogreHits++;

    if(
      ogreHits>=2
    ){

      ogreHits=0;

      loseHeart();
    }
  }
}

function loseHeart(){

  if(
    hearts<=0||
    p.shieldTimer>0
  ){
    return;
  }

  hearts--;

  heartRegen=30;

  /*
    3 seconds:
    - invincible
    - blue shield
    - 2x speed
  */

  p.shieldTimer=
    SHIELD_DURATION;

  p.speedBoostTimer=
    SHIELD_DURATION;

  burst(
    p.x,
    p.y,
    25
  );

  if(
    hearts<=0
  ){

    endGame();
  }
}

function regainHeart(){

  if(
    hearts<3
  ){

    hearts++;

    heartRegen=0;
  }
}

function endGame(){

  gameOver=true;

  p.shieldTimer=0;
  p.speedBoostTimer=0;

  if(
    score>highscore
  ){

    highscore=score;

    localStorage.setItem(
      "pixelNatureHighscore",
      highscore
    );
  }
}

/* =========================
   UPGRADES
========================= */

function buyUpgrade(kind){

  if(
    !upgradeOpen
  ){
    return;
  }

  if(
    kind==="nothing"
  ){

    upgradeOpen=false;

    return;
  }

  if(
    coins<upgradeCost
  ){

    return;
  }

  coins-=upgradeCost;

  if(
    kind==="health"
  ){

    p.maxHp+=20;

    p.hp=
      Math.min(
        p.maxHp,
        p.hp+20
      );
  }

  if(
    kind==="damage"
  ){

    p.damage+=12;
  }

  if(
    kind==="speed"
  ){

    p.speed+=.4;
  }

  upgradeCounts[kind]++;

  upgradeCost+=10;

  /*
    Closing this screen immediately
    resumes the game.
  */

  upgradeOpen=false;
}

/* =========================
   PROJECTILES
========================= */

function shoot(){

  if(
    fireCooldown>0||
    upgradeOpen||
    gameOver||
    paused||
    victorySequence||
    bossCountdown>0
  ){

    return;
  }

  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );

  balls.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*8,

    vy:
      Math.sin(a)*8,

    r:7,
    life:90
  });

  fireCooldown=60;

  playFireballSound();
}

/* =========================
   BOMBS
========================= */

function spawnBombPickup(){

  if(
    bigBoss||
    bossCountdown>0||
    bossDefeated
  ){
    return;
  }

  const x=
    ARENA.left+
    50+
    Math.random()*
    (
      ARENA.right-
      ARENA.left-
      100
    );

  const y=
    90+
    Math.random()*430;

  bombPickups.push({

    x,
    y,

    life:7
  });
}

const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=22;

function throwBomb(){

  if(
    gameOver||
    upgradeOpen||
    paused||
    victorySequence||
    bossCountdown>0||
    bombCount<=0
  ){

    return;
  }

  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );

  bombCount--;

  bombs.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*7,

    vy:
      Math.sin(a)*7,

    life:120,

    r:9,

    distance:0,

    exploded:false,

    disintegrate:0,

    rotation:0
  });
}

function explodeBomb(b){

  if(
    b.exploded
  ){
    return;
  }

  b.exploded=true;

  b.disintegrate=
    BOMB_DISINTEGRATE_TIME;

  b.vx=0;
  b.vy=0;

  playBombExplosionSound();

  burst(
    b.x,
    b.y,
    42
  );

  for(
    let i=0;
    i<18;
    i++
  ){

    particles.push({

      x:b.x,
      y:b.y,

      vx:
        (Math.random()-.5)*7,

      vy:
        (Math.random()-.5)*7,

      life:
        18+
        Math.random()*15
    });
  }

  if(bigBoss){

    const d=
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      );

    if(
      d<145
    ){

      bigBoss.hp-=
        bigBoss.maxHp*.20;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );
    }
  }

  for(
    const e of enemies
  ){

    const d=
      Math.hypot(
        b.x-e.x,
        b.y-e.y
      );

    if(
      d<115
    ){

      e.hp-=
        (
          e.type==="ogre"||
          e.type==="skeletonOgre"
        )
        ?e.maxHp*.5
        :e.maxHp*.75;

      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;
    }
  }
}

/* =========================
   PARTICLES
========================= */

function burst(
  x,
  y,
  n=8
){

  for(
    let i=0;
    i<n;
    i++
  ){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*4,

      vy:
        (Math.random()-.5)*4,

      life:22
    });
  }
}

function rectPixel(
  x,
  y,
  w,
  h,
  color
){

  ctx.fillStyle=color;

  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,
    h
  );
}

/* =========================
   BETTER GATE
========================= */

function drawGate(){

  /*

/* =========================
   LOW HEALTH
========================= */

function drawLowHealthOverlay(){

  if(
    hearts!==1
  ){
    return;
  }

  const corner=145;

  ctx.save();

  ctx.globalAlpha=.28;

  ctx.fillStyle="#ff2020";

  /*
    Top-left.
  */

  ctx.beginPath();

  ctx.moveTo(0,0);
  ctx.lineTo(corner,0);
  ctx.lineTo(0,corner);

  ctx.closePath();
  ctx.fill();

  /*
    Top-right.
  */

  ctx.beginPath();

  ctx.moveTo(W,0);
  ctx.lineTo(W-corner,0);
  ctx.lineTo(W,corner);

  ctx.closePath();
  ctx.fill();

  /*
    Bottom-left.
  */

  ctx.beginPath();

  ctx.moveTo(0,H);
  ctx.lineTo(0,H-corner);
  ctx.lineTo(corner,H);

  ctx.closePath();
  ctx.fill();

  /*
    Bottom-right.
  */

  ctx.beginPath();

  ctx.moveTo(W,H);
  ctx.lineTo(W-corner,H);
  ctx.lineTo(W,H-corner);

  ctx.closePath();
  ctx.fill();

  /*
    Pixelated edge pieces.
  */

  ctx.globalAlpha=.18;

  for(
    let i=0;
    i<7;
    i++
  ){

    rectPixel(
      i*12,
      0,
      8,
      5,
      "#ff2020"
    );

    rectPixel(
      0,
      i*12,
      5,
      8,
      "#ff2020"
    );

    rectPixel(
      W-i*12-8,
      0,
      8,
      5,
      "#ff2020"
    );

    rectPixel(
      W-5,
      i*12,
      5,
      8,
      "#ff2020"
    );
  }

  ctx.restore();
}

/* =========================
   PLAYER UPDATE
========================= */

function updatePlayer(){

  if(
    upgradeOpen||
    victorySequence||
    bossCountdown>0
  ){
    return;
  }

  let dx=
    (
      keys.d||
      keys.arrowright
      ?1
      :0
    )-
    (
      keys.a||
      keys.arrowleft
      ?1
      :0
    );

  let dy=
    (
      keys.s||
      keys.arrowdown
      ?1
      :0
    )-
    (
      keys.w||
      keys.arrowup
      ?1
      :0
    );

  const m=
    Math.hypot(
      dx,
      dy
    )||1;

  let speed=
    p.speed;

  if(
    p.speedBoostTimer>0
  ){

    speed*=
      SHIELD_SPEED_MULTIPLIER;
  }

  p.x+=
    dx/m*
    speed;

  p.y+=
    dy/m*
    speed;

  p.x=
    Math.max(
      ARENA.left+15,
      Math.min(
        ARENA.right-20,
        p.x
      )
    );

  p.y=
    Math.max(
      ARENA.top+20,
      Math.min(
        ARENA.bottom-30,
        p.y
      )
    );

  if(
    mouse.down
  ){

    shoot();
  }
}

/* =========================
   BALL UPDATE
========================= */

function updateBalls(){

  for(
    const b of balls
  ){

    b.x+=b.vx;
    b.y+=b.vy;
    b.life--;
  }

  balls=
    balls.filter(
      b=>
        b.life>0&&
        b.x>ARENA.left&&
        b.x<ARENA.right&&
        b.y>ARENA.top&&
        b.y<ARENA.bottom
    );
}

/* =========================
   BOMB UPDATE
========================= */

function updateBombs(){

  for(
    const b of bombs
  ){

    if(
      !b.exploded
    ){

      b.x+=b.vx;
      b.y+=b.vy;

      b.distance+=
        Math.hypot(
          b.vx,
          b.vy
        );

      b.life--;

      b.rotation+=.15;

      if(
        b.distance>=
        BOMB_THROW_DISTANCE||
        b.x<=ARENA.left||
        b.x>=ARENA.right||
        b.y<=ARENA.top||
        b.y>=ARENA.bottom
      ){

        explodeBomb(b);
      }

      if(
        !b.exploded
      ){

        const hit=
          enemies.find(
            e=>
              Math.hypot(
                b.x-e.x,
                b.y-e.y
              )<
              e.r+b.r
          );

        if(hit){

          explodeBomb(b);
        }
      }

    }else{

      b.disintegrate--;
    }
  }

  bombs=
    bombs.filter(
      b=>
        !b.exploded||
        b.disintegrate>0
    );
}

/* =========================
   ENEMY UPDATE
========================= */

function updateEnemies(){

  for(
    const e of enemies
  ){

    const dx=
      p.x-e.x;

    const dy=
      p.y-e.y;

    const d=
      Math.hypot(
        dx,
        dy
      )||1;

    e.x+=
      dx/d*
      e.speed;

    e.y+=
      dy/d*
      e.speed;

    if(
      e.attack>0
    ){

      e.attack--;
    }

    if(
      d<e.r+14&&
      e.attack<=0
    ){

      damagePlayer(e);
    }

    /*
      Fireball damage.
    */

    for(
      const b of balls
    ){

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )<
        e.r+b.r
      ){

        const impactX=
          b.x;

        const impactY=
          b.y;

        e.hp-=p.damage;

        e.burn=
          Math.max(
            e.burn,
            42
          );

        e.burnTick=0;

        b.life=0;

        burst(
          impactX,
          impactY,
          10
        );

        /*
          Small splash damage.
        */

        for(
          const other of enemies
        ){

          if(
            other!==e&&
            other.hp>0&&
            Math.hypot(
              other.x-impactX,
              other.y-impactY
            )<58
          ){

            other.hp-=
              Math.max(
                6,
                p.damage*.45
              );

            other.burn=
              Math.max(
                other.burn,
                42
              );

            other.burnTick=0;
          }
        }
      }
    }

    /*
      Burn damage.
    */

    if(
      e.burn>0
    ){

      e.burn--;
      e.burnTick++;

      if(
        e.burnTick%7===0
      ){

        e.hp-=
          e.type==="skeletonOgre"
          ?4
          :2.5;
      }
    }
  }

  /*
    Rewards.
  */

  const dead=
    enemies.filter(
      e=>e.hp<=0
    );

  for(
    const e of dead
  ){

    let reward=1;

    if(
      e.type==="ogre"
    ){

      reward=7;

    }else if(
      e.type==="skeletonGoblin"
    ){

      reward=2;

    }else if(
      e.type==="skeletonOgre"
    ){

      reward=10;
    }

    coins+=reward;
    score+=reward;

    burst(
      e.x,
      e.y,
      12
    );
  }

  enemies=
    enemies.filter(
      e=>e.hp>0
    );
}

/* =========================
   BIG BOSS UPDATE
========================= */

function updateBoss(){

  if(!bigBoss)return;

  const dx=
    p.x-bigBoss.x;

  const dy=
    p.y-bigBoss.y;

  const d=
    Math.hypot(
      dx,
      dy
    )||1;

  /*
    Big Boss = 3.1 speed.
  */

  bigBoss.x+=
    dx/d*
    bigBoss.speed;

  bigBoss.y+=
    dy/d*
    bigBoss.speed;

  if(
    bigBoss.attack>0
  ){

    bigBoss.attack--;
  }

  if(
    d<bigBoss.r+16&&
    bigBoss.attack<=0
  ){

    bigBoss.attack=35;

    loseHeart();
  }

  /*
    Fireballs damage boss.
  */

  for(
    const b of balls
  ){

    if(
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      )<
      bigBoss.r+b.r
    ){

      bigBoss.hp-=p.damage;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

      bigBoss.burnTick=0;

      b.life=0;

      burst(
        b.x,
        b.y,
        14
      );
    }
  }

  /*
    Boss burn.
  */

  if(
    bigBoss.burn>0
  ){

    bigBoss.burn--;
    bigBoss.burnTick++;

    if(
      bigBoss.burnTick%7===0
    ){

      bigBoss.hp-=3;
    }
  }

  if(
    bigBoss.hp<=0
  ){

    defeatBigBoss();
  }
}

/* =========================
   PARTICLES
========================= */

function updateParticles(){

  for(
    const s of particles
  ){

    s.x+=s.vx;
    s.y+=s.vy;
    s.life--;
  }

  particles=
    particles.filter(
      s=>s.life>0
    );
}

/* =========================
   SHIELD UPDATE
========================= */

function updateShield(){

  if(
    p.shieldTimer>0
  ){

    p.shieldTimer-=
      1/60;

    p.speedBoostTimer-=
      1/60;

    if(
      p.shieldTimer<=0
    ){

      p.shieldTimer=0;
      p.speedBoostTimer=0;
    }

    if(
      p.speedBoostTimer<0
    ){

      p.speedBoostTimer=0;
    }
  }
}

/* =========================
   VICTORY UPDATE
========================= */

function updateVictory(){

  if(
    !victorySequence
  ){
    return;
  }

  /*
    This timer is the Big Boss
    disintegration cutscene.
  */

  victoryTimer-=1/60;

  if(
    victoryTimer<=0&&
    !batDropped
  ){

    dropBat();
  }
}

/* =========================
   MAIN LOOP
========================= */

function loop(){

  requestAnimationFrame(
    loop
  );

  /*
    Manual pause completely freezes
    the game.
  */

  if(
    !gameOver&&
    !paused
  ){

    /*
      Victory sequence:
      the world is frozen except for
      the bat pickup.
    */

    if(
      victorySequence
    ){

      updateVictory();

      updateParticles();

      /*
        Player can move during the bat
        pickup portion of the cutscene.
      */

      if(
        !bat.collected
      ){

        updatePlayer();

        collectBat();
      }

    }else{

      /*
        Boss countdown.

        The countdown itself continues,
        but all normal gameplay is frozen.
      */

      if(
        !bigBoss&&
        !bossDefeated&&
        bossCountdown<=0&&
        elapsed>=nextBigBoss
      ){

        bossCountdown=3;
        bossCountdownValue=3;
      }

      if(
        bossCountdown>0
      ){

        bossCountdown-=
          1/60;

        const newValue=
          Math.ceil(
            bossCountdown
          );

        if(
          newValue!==bossCountdownValue&&
          newValue>=1
        ){

          bossCountdownValue=
            newValue;
        }

        if(
          bossCountdown<=0
        ){

          bossCountdown=0;

          spawnBigBoss();
        }

        /*
          IMPORTANT:
          Do NOT update the normal game
          while boss countdown is active.
        */

      }else{

        /*
          Normal elapsed time.
        */

        elapsed+=1/60;

        /*
          Cooldowns.
        */

        if(
          fireCooldown>0
        ){

          fireCooldown--;
        }

        if(
          batCooldown>0
        ){

          batCooldown-=
            1/60;

          if(
            batCooldown<0
          ){

            batCooldown=0;
          }
        }

        if(
          batSwing>0
        ){

          batSwing-=
            1/60;
        }

        updateShield();

        /*
          Goblin levels before Big Boss.
        */

        if(
          !bossDefeated
        ){

          const newGoblinBuff=
            Math.floor(
              elapsed/27
            );

          if(
            newGoblinBuff>
            goblinBuffLevel
          ){

            goblinBuffLevel=
              newGoblinBuff;
          }
        }

        /*
          Skeleton upgrades after Big Boss.
        */

        if(
          bossDefeated
        ){

          skeletonUpgradeTimer-=
            1/60;

          if(
            skeletonUpgradeTimer<=0
          ){

            upgradeSkeletons();

            skeletonUpgradeTimer=27;
          }
        }

        /*
          Big Boss.
        */

        if(
          bigBoss
        ){

          updateBoss();

        }else if(
          !bossDefeated
        ){

          /*
            Bomb spawning.
          */

          bombSpawnTimer-=
            1/60;

          if(
            bombSpawnTimer<=0
          ){

            spawnBombPickup();

            bombSpawnTimer=20;
          }

          for(
            const bp of bombPickups
          ){

            bp.life-=
              1/60;
          }

          bombPickups=
            bombPickups.filter(
              bp=>bp.life>0
            );

          /*
            Collect bombs.
          */

          if(
            bombCount<3
          ){

            for(
              let i=
                bombPickups.length-1;
              i>=0;
              i--
            ){

              if(
                Math.hypot(
                  bombPickups[i].x-p.x,
                  bombPickups[i].y-p.y
                )<28
              ){

                bombCount++;

                bombPickups.splice(
                  i,
                  1
                );
              }
            }
          }

          /*
            Upgrade screen.

            Once opened, normal updates stop
            for the rest of this frame and
            every frame afterward until the
            player chooses.
          */

          if(
            elapsed>=nextUpgrade
          ){

            upgradeOpen=true;

            nextUpgrade+=70;
          }

          /*
            Waves.
          */

          const newWave=
            Math.floor(
              elapsed/10
            )+1;

          if(
            newWave>wave
          ){

            wave=newWave;

            spawnWave(wave);
          }

          /*
            Mini boss every 50 seconds.
          */

          const bossMark=
            Math.floor(
              elapsed/50
            );

          if(
            bossMark>0&&
            !enemies.some(
              e=>
                e.type==="ogre"&&
                e.bossMark===bossMark
            )
          ){

            if(
              !window.lastBossMark
            ){

              window.lastBossMark=0;
            }

            if(
              bossMark>
              window.lastBossMark
            ){

              spawnEnemy(
                "ogre"
              );

              if(
                enemies.length
              ){

                enemies[
                  enemies.length-1
                ].bossMark=
                  bossMark;
              }

              window.lastBossMark=
                bossMark;
            }
          }
        }

        /*
          If an upgrade opened this frame,
          do not continue normal updates.
        */

        if(
          !upgradeOpen
        ){

          updatePlayer();

          updateBalls();

          updateBombs();

          updateEnemies();

          collectBat();

          updateParticles();

          if(
            heartRegen>0
          ){

            heartRegen-=
              1/60;

            if(
              heartRegen<=0
            ){

              regainHeart();
            }
          }
        }
      }
    }
  }

  draw();
}

loop();

</script>
