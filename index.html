<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Too Many Green Dudes</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#252525;
  font-family:monospace;
}

canvas{
  display:block;
  margin:auto;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  cursor:crosshair;
}

button{
  position:fixed;
  z-index:20;
  padding:8px 12px;
  background:#1e3d20;
  color:#fff;
  border:2px solid #65b95b;
  font-family:monospace;
  font-size:14px;
  cursor:pointer;
}

button:hover{
  background:#2c5a2f;
}

#fullscreenBtn{
  top:10px;
  right:10px;
}

#pauseBtn{
  top:10px;
  left:10px;
}
</style>
</head>

<body>

<button id="pauseBtn">PAUSE</button>
<button id="fullscreenBtn">FULLSCREEN</button>

<canvas id="game" width="900" height="600"></canvas>

<script>

const c=document.getElementById("game");
const ctx=c.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=900,H=600;

/* =========================
   ARENA
   ========================= */

const ARENA={
  left:25,
  top:45,
  right:875,
  bottom:570
};

const GATE={
  x:805,
  y:245,
  w:55,
  h:125
};


/* =========================
   INPUT
   ========================= */

let keys={};

let mouse={
  x:450,
  y:300,
  down:false
};


/* =========================
   GAME VARIABLES
   ========================= */

let p;
let enemies=[];
let balls=[];
let particles=[];
let bombs=[];
let bombPickups=[];

let score=0;
let coins=0;
let wave=1;
let elapsed=0;

let gameOver=false;
let paused=false;
let upgradeOpen=false;

let nextUpgrade=70;
let upgradeCost=10;

let upgradeCounts={
  health:0,
  damage:0,
  speed:0
};

let goblinHits=0;
let ogreHits=0;

let hearts=3;
let heartRegen=0;

let fireCooldown=0;

let bombCount=0;
let bombSpawnTimer=20;

let highscore=Number(
  localStorage.getItem("pixelNatureHighscore")||0
);


/* =========================
   BIG BOSS
   ========================= */

const BIG_BOSS_INTERVAL=200;

let bigBossActive=false;
let bigBossCountdown=false;
let bigBossCountdownTimer=0;

let nextBigBossTime=BIG_BOSS_INTERVAL;

let bossDefeatedCount=0;


/* =========================
   BOSS STOMP
   ========================= */

const STOMP_COOLDOWN=12;

let stompTimer=STOMP_COOLDOWN;

let stompState="ready";
let stompWarningTimer=0;
let stompImpactTimer=0;

let stompX=0;
let stompY=0;

let groundShake=0;


/* =========================
   AUDIO
   ========================= */

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;


/*
  All sound is approximately 2x louder.
*/

const SOUND_MULTIPLIER=2;


function startMusic(){

  if(musicStarted)return;

  try{

    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );

  }catch(err){

    console.log(
      "Music unavailable:",
      err
    );
  }
}


function playFireballSound(){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(
    240,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    90,
    now+0.09
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.07*SOUND_MULTIPLIER/2,
    now+0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.10
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.11);
}


function playBombExplosionSound(){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const boom=audioCtx.createOscillator();
  const boomGain=audioCtx.createGain();

  boom.type="square";

  boom.frequency.setValueAtTime(
    105,
    now
  );

  boom.frequency.exponentialRampToValueAtTime(
    38,
    now+0.22
  );

  boomGain.gain.setValueAtTime(
    0.0001,
    now
  );

  boomGain.gain.exponentialRampToValueAtTime(
    0.24,
    now+0.015
  );

  boomGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.25
  );

  boom.connect(boomGain);
  boomGain.connect(audioCtx.destination);

  boom.start(now);
  boom.stop(now+0.27);


  const crack=audioCtx.createOscillator();
  const crackGain=audioCtx.createGain();

  crack.type="square";

  crack.frequency.setValueAtTime(
    900,
    now
  );

  crack.frequency.exponentialRampToValueAtTime(
    180,
    now+0.12
  );

  crackGain.gain.setValueAtTime(
    0.0001,
    now
  );

  crackGain.gain.exponentialRampToValueAtTime(
    0.11,
    now+0.005
  );

  crackGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.14
  );

  crack.connect(crackGain);
  crackGain.connect(audioCtx.destination);

  crack.start(now);
  crack.stop(now+0.15);
}


function playStompSound(){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(
    80,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    30,
    now+0.35
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.3,
    now+0.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.4
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.42);
}


function playMusicStep(){

  if(
    !audioCtx||
    gameOver||
    paused
  )return;

  const notes=[
    110,130.81,146.83,164.81,
    196,164.81,146.83,130.81,
    110,146.83,164.81,196,
    220,196,164.81,146.83
  ];

  const bass=[
    55,55,65.41,65.41,
    73.42,73.42,82.41,82.41
  ];

  const now=audioCtx.currentTime;

  const note=
    notes[musicStep%notes.length];

  const bassNote=
    bass[musicStep%bass.length];


  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="triangle";
  osc.frequency.value=note;

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.13,
    now+0.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.25
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.26);


  const bassOsc=audioCtx.createOscillator();
  const bassGain=audioCtx.createGain();

  bassOsc.type="sine";
  bassOsc.frequency.value=bassNote;

  bassGain.gain.setValueAtTime(
    0.0001,
    now
  );

  bassGain.gain.exponentialRampToValueAtTime(
    0.15,
    now+0.02
  );

  bassGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.24
  );

  bassOsc.connect(bassGain);
  bassGain.connect(audioCtx.destination);

  bassOsc.start(now);
  bassOsc.stop(now+0.25);

  musicStep++;
}


/* =========================
   BUTTONS
   ========================= */

const pauseBtn=
  document.getElementById("pauseBtn");

pauseBtn.onclick=()=>{

  if(gameOver)return;

  paused=!paused;

  pauseBtn.textContent=
    paused
    ?"RESUME"
    :"PAUSE";
};


const fullscreenBtn=
  document.getElementById(
    "fullscreenBtn"
  );

fullscreenBtn.onclick=async()=>{

  try{

    if(!document.fullscreenElement){

      await document.documentElement.requestFullscreen();

    }else{

      await document.exitFullscreen();

    }

  }catch(err){

    console.log(err);

  }
};


document.addEventListener(
  "fullscreenchange",
  ()=>{

    fullscreenBtn.textContent=
      document.fullscreenElement
      ?"EXIT FULLSCREEN"
      :"FULLSCREEN";

  }
);


/* =========================
   RESET
   ========================= */

function reset(){

  p={
    x:430,
    y:310,
    speed:3.2,
    damage:28,
    maxHp:100,
    hp:100
  };

  enemies=[];
  balls=[];
  particles=[];
  bombs=[];
  bombPickups=[];

  score=0;
  coins=0;
  wave=1;
  elapsed=0;

  gameOver=false;
  paused=false;
  upgradeOpen=false;

  nextUpgrade=70;
  upgradeCost=10;

  upgradeCounts={
    health:0,
    damage:0,
    speed:0
  };

  goblinHits=0;
  ogreHits=0;

  hearts=3;
  heartRegen=0;

  fireCooldown=0;

  bombCount=0;
  bombSpawnTimer=20;

  bigBossActive=false;
  bigBossCountdown=false;
  bigBossCountdownTimer=0;
  nextBigBossTime=BIG_BOSS_INTERVAL;

  stompTimer=STOMP_COOLDOWN;
  stompState="ready";
  stompWarningTimer=0;
  stompImpactTimer=0;
  groundShake=0;

  bossDefeatedCount=0;

  spawnWave(1);
}

reset();


/* =========================
   INPUT
   ========================= */

window.addEventListener(
  "keydown",
  e=>{

    startMusic();

    const k=e.key.toLowerCase();

    keys[k]=true;


    if(
      k==="p" &&
      !e.repeat
    ){

      paused=!paused;

      pauseBtn.textContent=
        paused
        ?"RESUME"
        :"PAUSE";

      return;
    }


    if(
      k==="r" &&
      gameOver
    ){

      reset();
      return;

    }


    if(
      k==="q" &&
      !e.repeat
    ){

      throwBomb();

    }


    if(upgradeOpen){

      if(e.key==="1")
        buyUpgrade("health");

      if(e.key==="2")
        buyUpgrade("damage");

      if(e.key==="3")
        buyUpgrade("speed");

      if(e.key==="4")
        buyUpgrade("nothing");
    }

  }
);


window.addEventListener(
  "keyup",
  e=>{

    keys[
      e.key.toLowerCase()
    ]=false;

  }
);


c.addEventListener(
  "mousemove",
  e=>{

    const r=
      c.getBoundingClientRect();

    mouse.x=
      (e.clientX-r.left)*
      W/r.width;

    mouse.y=
      (e.clientY-r.top)*
      H/r.height;

  }
);


c.addEventListener(
  "mousedown",
  ()=>{

    startMusic();

    mouse.down=true;

  }
);


window.addEventListener(
  "mouseup",
  ()=>{

    mouse.down=false;

  }
);


/* =========================
   ENEMIES
   ========================= */

function gateSpawnPosition(){

  return {
    x:GATE.x-35,
    y:GATE.y+GATE.h/2
  };
}


function spawnEnemy(type="goblin"){

  /*
    ALL NORMAL ENEMIES NOW COME
    FROM THE GATE.
  */

  const pos=gateSpawnPosition();

  let x=pos.x;
  let y=pos.y;


  if(type==="ogre"){

    const hp=
      260+
      Math.floor(elapsed/50)*35;


    enemies.push({

      type:"ogre",

      x,
      y,

      r:30,

      hp,
      maxHp:hp,

      speed:
        .42+
        Math.min(
          .18,
          elapsed/2000
        ),

      attack:0,
      burn:0,
      burnTick:0,

      bossMark:
        Math.floor(elapsed/50)

    });

  }else{

    const hp=
      45+
      wave*8;


    enemies.push({

      type:"goblin",

      x,
      y,

      r:14,

      hp,
      maxHp:hp,

      speed:
        .72+
        wave*.025,

      attack:0,
      burn:0,
      burnTick:0,

      buffLevel:
        Math.floor(
          elapsed/27
        )

    });

  }
}


/* =========================
   BIG BOSS
   ========================= */

function spawnBigBoss(){

  const pos=gateSpawnPosition();

  /*
    Boss is slightly less buff than before,
    but has speed 10% higher than player.
  */

  const hp=1700+
    bossDefeatedCount*250;


  enemies.push({

    type:"bigboss",

    x:pos.x,
    y:pos.y,

    r:42,

    hp,
    maxHp:hp,

    speed:p.speed*1.10,

    attack:0,

    burn:0,
    burnTick:0,

    stompCooldown:12,

    stompState:"ready",
    stompTimer:12,

    stompX:0,
    stompY:0

  });

  bigBossActive=true;
  bigBossCountdown=false;

  /*
    Normal enemies stop spawning while
    the big boss is alive.
  */

}


function startBigBossCountdown(){

  if(
    bigBossActive||
    bigBossCountdown
  )return;

  bigBossCountdown=true;

  bigBossCountdownTimer=3;

  enemies=
    enemies.filter(
      e=>e.type==="bigboss"
    );

}


function updateBigBossCountdown(dt){

  if(!bigBossCountdown)return;

  bigBossCountdownTimer-=dt;

  if(bigBossCountdownTimer<=0){

    bigBossCountdown=false;

    spawnBigBoss();

  }

}


/* =========================
   WAVES
   ========================= */

function spawnWave(n){

  if(
    bigBossActive||
    bigBossCountdown
  )return;


  for(
    let i=0;
    i<n;
    i++
  ){

    spawnEnemy("goblin");

  }
}


/* =========================
   COINS
   ========================= */

function addCoins(n){

  coins+=n;

}


function killEnemy(e){

  if(e.type==="bigboss"){

    addCoins(50);

    score+=50;

    bossDefeatedCount++;

    bigBossActive=false;

    stompState="ready";

    stompTimer=STOMP_COOLDOWN;

    burst(
      e.x,
      e.y,
      60
    );

    /*
      Normal spawning can resume.
    */

    wave=
      Math.max(
        wave,
        Math.floor(elapsed/10)+1
      );

  }else if(e.type==="ogre"){

    addCoins(7);

    score+=7;

    burst(
      e.x,
      e.y,
      22
    );

  }else{

    addCoins(1);

    score++;

    burst(
      e.x,
      e.y,
      10
    );

  }
}


/* =========================
   SHOOTING
   ========================= */

function shoot(){

  if(
    fireCooldown>0||
    upgradeOpen||
    gameOver||
    paused
  )return;


  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );


  balls.push({

    x:p.x,
    y:p.y,

    vx:Math.cos(a)*8,
    vy:Math.sin(a)*8,

    r:7,
    life:90

  });


  fireCooldown=60;

  playFireballSound();
}


/* =========================
   BOMBS
   ========================= */

const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=22;


function spawnBombPickup(){

  const x=
    75+
    Math.random()*750;

  const y=
    90+
    Math.random()*420;


  bombPickups.push({

    x,
    y,
    life:7

  });
}


function throwBomb(){

  if(
    gameOver||
    paused||
    upgradeOpen||
    bombCount<=0
  )return;


  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );


  bombCount--;


  bombs.push({

    x:p.x,
    y:p.y,

    vx:Math.cos(a)*7,
    vy:Math.sin(a)*7,

    life:120,
    r:9,

    distance:0,

    exploded:false,

    disintegrate:0

  });
}


function explodeBomb(b){

  if(b.exploded)return;

  b.exploded=true;

  b.disintegrate=
    BOMB_DISINTEGRATE_TIME;

  b.vx=0;
  b.vy=0;

  playBombExplosionSound();

  burst(
    b.x,
    b.y,
    42
  );


  for(
    let i=0;
    i<18;
    i++
  ){

    particles.push({

      x:b.x,
      y:b.y,

      vx:(Math.random()-.5)*7,
      vy:(Math.random()-.5)*7,

      life:18+
        Math.random()*15

    });

  }


  for(
    const e of enemies
  ){

    const d=
      Math.hypot(
        b.x-e.x,
        b.y-e.y
      );


    if(d<115){

      e.hp-=
        e.type==="bigboss"
        ?e.maxHp*.25
        :e.type==="ogre"
        ?e.maxHp*.5
        :e.maxHp*.75;

      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

    }

  }

}


/* =========================
   PLAYER DAMAGE
   ========================= */

function damagePlayer(e){

  e.attack=45;


  if(e.type==="goblin"){

    goblinHits++;

    if(goblinHits>=4){

      goblinHits=0;

      loseHeart();

    }

  }else if(e.type==="bigboss"){

    loseHeart();

  }else{

    ogreHits++;

    if(ogreHits>=2){

      ogreHits=0;

      loseHeart();

    }

  }
}


function loseHeart(){

  if(hearts<=0)return;

  hearts--;

  heartRegen=30;


  if(hearts<=0){

    endGame();

  }

}


function regainHeart(){

  if(hearts<3){

    hearts++;

    heartRegen=0;

  }
}


function endGame(){

  gameOver=true;

  paused=false;


  if(score>highscore){

    highscore=score;

    localStorage.setItem(
      "pixelNatureHighscore",
      highscore
    );

  }

}


/* =========================
   BIG BOSS STOMP
   ========================= */

function startStomp(e){

  if(
    e.type!=="bigboss"||
    e.stompState!=="ready"
  )return;


  e.stompState="warning";

  e.stompTimer=12;

  e.stompX=p.x;
  e.stompY=p.y;

  stompX=p.x;
  stompY=p.y;

  stompWarningTimer=0.9;
}


function updateBigBossStomp(e,dt){

  if(e.type!=="bigboss")return;


  if(
    e.stompState==="ready"
  ){

    e.stompTimer-=dt;

    if(e.stompTimer<=0){

      startStomp(e);

    }

    return;
  }


  if(
    e.stompState==="warning"
  ){

    /*
      Boss stops moving while warning appears.
    */

    stompWarningTimer-=dt;

    if(stompWarningTimer<=0){

      e.stompState="impact";

      stompImpactTimer=.45;

      stompX=p.x;
      stompY=p.y;

      playStompSound();

    }

    return;
  }


  if(
    e.stompState==="impact"
  ){

    stompImpactTimer-=dt;

    groundShake=10;

    if(stompImpactTimer<=0){

      doStompDamage(e);

      e.stompState="ready";

      e.stompTimer=STOMP_COOLDOWN;

      stompTimer=STOMP_COOLDOWN;

      groundShake=0;

    }

  }

}


function doStompDamage(e){

  const d=
    Math.hypot(
      p.x-stompX,
      p.y-stompY
    );


  /*
    Small circular spike radius.
  */

  if(d<70){

    /*
      Stomp costs TWO hearts.
    */

    if(hearts>0){

      hearts=
        Math.max(
          0,
          hearts-2
        );

      heartRegen=30;

      if(hearts<=0){

        endGame();

      }

    }

  }


  /*
    Extra pixel particles around
    the impact circle.
  */

  for(
    let i=0;
    i<26;
    i++
  ){

    const a=
      Math.random()*
      Math.PI*2;

    const r=
      20+
      Math.random()*55;


    particles.push({

      x:
        stompX+
        Math.cos(a)*r,

      y:
        stompY+
        Math.sin(a)*r,

      vx:
        Math.cos(a)*2,

      vy:
        Math.sin(a)*2,

      life:25

    });

  }

}


/* =========================
   UPGRADES
   ========================= */

function buyUpgrade(kind){

  if(kind==="nothing"){

    upgradeOpen=false;
    return;

  }


  if(
    !upgradeOpen||
    coins<upgradeCost
  )return;


  coins-=upgradeCost;


  if(kind==="health"){

    p.maxHp+=20;

    p.hp=
      Math.min(
        p.maxHp,
        p.hp+20
      );

  }


  if(kind==="damage"){

    p.damage+=12;

  }


  if(kind==="speed"){

    p.speed+=.4;

  }


  upgradeCounts[kind]++;

  upgradeCost+=10;

  upgradeOpen=false;
}


/* =========================
   PARTICLES
   ========================= */

function burst(x,y,n=8){

  for(
    let i=0;
    i<n;
    i++
  ){

    particles.push({

      x,
      y,

      vx:(Math.random()-.5)*4,
      vy:(Math.random()-.5)*4,

      life:22

    });

  }
}


function rectPixel(
  x,
  y,
  w,
  h,
  color
){

  ctx.fillStyle=color;

  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,
    h
  );

}


/* =========================
   GATE DRAWING
   ========================= */

function drawGate(){

  /*
    Stone opening.
  */

  rectPixel(
    GATE.x-8,
    GATE.y-10,
    GATE.w+16,
    GATE.h+20,
    "#171717"
  );


  rectPixel(
    GATE.x-4,
    GATE.y-5,

/* =========================
   DRAW STOMP WARNING
   ========================= */

function drawStompWarning(){

  if(
    !bigBossActive||
    stompWarningTimer<=0
  )return;


  const pulse=
    1+
    Math.sin(
      performance.now()/60
    )*.08;


  ctx.save();

  ctx.globalAlpha=.72;

  ctx.strokeStyle="#ff2222";

  ctx.lineWidth=5;


  ctx.beginPath();

  ctx.arc(
    stompX,
    stompY,
    70*pulse,
    0,
    Math.PI*2
  );

  ctx.stroke();


  ctx.globalAlpha=.35;

  ctx.fillStyle="#ff1111";

  ctx.beginPath();

  ctx.arc(
    stompX,
    stompY,
    65*pulse,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();


  /*
    Warning X.
  */

  ctx.strokeStyle="#ff3333";

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    stompX-18,
    stompY-18
  );

  ctx.lineTo(
    stompX+18,
    stompY+18
  );

  ctx.moveTo(
    stompX+18,
    stompY-18
  );

  ctx.lineTo(
    stompX-18,
    stompY+18
  );

  ctx.stroke();

}


/* =========================
   DRAW SPIKES
   ========================= */

function drawStompSpikes(){

  if(
    stompState!=="impact"
  )return;


  for(
    let i=0;
    i<12;
    i++
  ){

    const a=
      i/12*Math.PI*2;

    const r=
      12+
      Math.abs(
        Math.sin(
          performance.now()/50+i
        )
      )*45;


    const x=
      stompX+
      Math.cos(a)*r;

    const y=
      stompY+
      Math.sin(a)*r;


    ctx.fillStyle="#bdbdbd";

    ctx.beginPath();

    ctx.moveTo(
      x,
      y-15
    );

    ctx.lineTo(
      x-7,
      y+8
    );

    ctx.lineTo(
      x+7,
      y+8
    );

    ctx.closePath();

    ctx.fill();

  }

}

/* =========================
   DRAW
   ========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Ground shake.
  */

  let shakeX=0;
  let shakeY=0;

  if(groundShake>0){

    shakeX=
      (Math.random()-.5)*
      groundShake;

    shakeY=
      (Math.random()-.5)*
      groundShake;
  }


  ctx.save();

  ctx.translate(
    shakeX,
    shakeY
  );


  /*
    Arena.
  */

  ctx.fillStyle="#303030";

  ctx.fillRect(
    ARENA.left,
    ARENA.top,
    ARENA.right-ARENA.left,
    ARENA.bottom-ARENA.top
  );


  ctx.strokeStyle="#444";

  ctx.lineWidth=6;

  ctx.strokeRect(
    ARENA.left,
    ARENA.top,
    ARENA.right-ARENA.left,
    ARENA.bottom-ARENA.top
  );


  /*
    Floor pixels.
  */

  for(
    let i=0;
    i<100;
    i++
  ){

    const x=
      ARENA.left+15+
      Math.random()*
      (ARENA.right-ARENA.left-30);

    const y=
      ARENA.top+15+
      Math.random()*
      (ARENA.bottom-ARENA.top-30);


    rectPixel(
      x,
      y,
      3,
      3,
      i%2
      ?"#353535"
      :"#3b3b3b"
    );

  }


  /*
    Gate.
  */

  drawGate();


  /*
    Enemies.
  */

  for(
    const e of enemies
  ){

    if(e.type==="goblin")
      drawGoblin(e);

    else if(e.type==="ogre")
      drawOgre(e);

    else
      drawBigBoss(e);


    /*
      Burning effect.
    */

    if(e.burn>0){

      rectPixel(
        e.x-e.r-3,
        e.y+e.r-4,
        5,
        7,
        "#ff8c22"
      );

      rectPixel(
        e.x+e.r-2,
        e.y+e.r-8,
        4,
        7,
        "#ffd45a"
      );

    }


    /*
      Health bar.
    */

    const bw=
      e.type==="bigboss"
      ?100
      :e.type==="ogre"
      ?64
      :34;

    const bx=e.x-bw/2;
    const by=e.y-e.r-15;


    rectPixel(
      bx-2,
      by-2,
      bw+4,
      10,
      "#111"
    );

    rectPixel(
      bx,
      by,
      bw,
      6,
      "#542b2b"
    );

    rectPixel(
      bx,
      by,
      bw*
      Math.max(
        0,
        e.hp/e.maxHp
      ),
      6,
      "#55c84a"
    );

  }


  /*
    Bomb pickups.
  */

  for(
    const bp of bombPickups
  ){

    rectPixel(
      bp.x-7,
      bp.y-7,
      14,
      14,
      "#111"
    );

    rectPixel(

      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.fillStyle="#fff";

    ctx.font="32px monospace";

    ctx.fillText(
      "CHOOSE YOUR UPGRADE",
      245,
      125
    );

    drawCoin(
      365,
      150
    );

    ctx.font="20px monospace";

    ctx.fillStyle="#ffe875";

    ctx.fillText(
      "COINS: "+coins,
      390,
      165
    );

    ctx.fillStyle="#fff";

    ctx.font="16px monospace";

    ctx.fillText(
      "Cost: "+
      upgradeCost+
      " coins   (1 / 2 / 3 / 4)",
      285,
      195
    );


    const cards=[
      ["1","HEALTH","+20 MAX HP",90],
      ["2","DAMAGE","+12 FIREBALL",295],
      ["3","SPEED","+0.4 MOVE",500],
      ["4","NOTHING","FREE",705]
    ];


    for(
      const [n,t,d,x]
      of cards
    ){

      ctx.fillStyle=
        t==="NOTHING"
        ?"#183c1d"
        :"#1e3d20";

      ctx.fillRect(
        x,
        235,
        170,
        130
      );

      ctx.strokeStyle=
        t==="NOTHING"
        ?"#8ee889"
        :"#65b95b";

      ctx.lineWidth=4;

      ctx.strokeRect(
        x,
        235,
        170,
        130
      );

      ctx.fillStyle="#bdebb5";

      ctx.font="21px monospace";

      ctx.fillText(
        n+". "+t,
        x+15,
        275
      );

      ctx.font="14px monospace";

      ctx.fillText(
        d,
        x+25,
        310
      );

      ctx.fillText(
        t==="NOTHING"
        ?"SKIP"
        :"BUY",
        x+60,
        340
      );

    }

  }


  /*
    Pause screen.
  */

  if(paused){

    ctx.fillStyle="#000";

    ctx.globalAlpha=.7;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.fillStyle="#fff";

    ctx.font="44px monospace";

    ctx.fillText(
      "PAUSED",
      370,
      285
    );

    ctx.font="18px monospace";

    ctx.fillText(
      "Press P or click RESUME",
      315,
      325
    );

  }


  /*
    One-heart red warning.
  */

  drawLowHealthWarning();


  /*
    Game over.
  */

  if(gameOver){

    ctx.fillStyle="#000";

    ctx.globalAlpha=.82;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.fillStyle="#fff";

    ctx.font="42px monospace";

    ctx.fillText(
      "GAME OVER",
      350,
      260
    );

    ctx.font="18px monospace";

    ctx.fillText(
      "Score: "+
      score+
      "   High Score: "+
      highscore,
      320,
      300
    );

    ctx.fillText(
      "Press R to restart",
      355,
      340
    );

  }

}


/* =========================
   GAME UPDATE
   ========================= */

function update(){

  if(
    gameOver||
    paused
  )return;


  const dt=1/60;


  /*
    Big boss countdown.
  */

  if(bigBossCountdown){

    updateBigBossCountdown(dt);

    return;

  }


  /*
    Time.
  */

  elapsed+=dt;


  /*
    Every 200 seconds start
    the huge boss.
  */

  if(
    !bigBossActive&&
    elapsed>=nextBigBossTime
  ){

    startBigBossCountdown();

    nextBigBossTime+=BIG_BOSS_INTERVAL;

    return;

  }


  /*
    Bomb spawning.
  */

  bombSpawnTimer-=dt;

  if(
    bombSpawnTimer<=0
  ){

    spawnBombPickup();

    bombSpawnTimer=20;

  }


  for(
    const bp of bombPickups
  ){

    bp.life-=dt;

  }


  bombPickups=
    bombPickups.filter(
      bp=>bp.life>0
    );


  /*
    Pick up bombs.
  */

  if(bombCount<3){

    for(
      let i=bombPickups.length-1;
      i>=0;
      i--
    ){

      if(
        Math.hypot(
          bombPickups[i].x-p.x,
          bombPickups[i].y-p.y
        )<28
      ){

        bombCount++;

        bombPickups.splice(
          i,
          1
        );

      }

    }

  }


  /*
    Upgrade timer.
  */

  if(
    elapsed>=nextUpgrade&&
    !bigBossActive
  ){

    upgradeOpen=true;

    nextUpgrade+=70;

  }


  /*
    Normal waves.

    Completely disabled during big boss.
  */

  const newWave=
    Math.floor(
      elapsed/10
    )+1;


  if(
    newWave>wave&&
    !bigBossActive
  ){

    wave=newWave;

    spawnWave(wave);

  }


  /*
    Mini bosses every 50 seconds,
    also from the gate.
  */

  const bossMark=
    Math.floor(
      elapsed/50
    );


  if(
    bossMark>0&&
    !bigBossActive&&
    !enemies.some(
      e=>
        e.type==="ogre"&&
        e.bossMark===bossMark
    )
  ){

    spawnEnemy("ogre");

  }


  /*
    Movement.
  */

  if(!upgradeOpen){

    let dx=
      (
        keys.d||
        keys.arrowright
        ?1
        :0
      )-
      (
        keys.a||
        keys.arrowleft
        ?1
        :0
      );


    let dy=
      (
        keys.s||
        keys.arrowdown
        ?1
        :0
      )-
      (
        keys.w||
        keys.arrowup
        ?1
        :0
      );


    const m=
      Math.hypot(
        dx,
        dy
      )||1;


    p.x+=
      dx/m*
      p.speed;

    p.y+=
      dy/m*
      p.speed;


    /*
      Player cannot walk into gate.
    */

    p.x=
      Math.max(
        ARENA.left+15,
        Math.min(
          ARENA.right-15,
          p.x
        )
      );

    p.y=
      Math.max(
        ARENA.top+20,
        Math.min(
          ARENA.bottom-20,
          p.y
        )
      );


    /*
      Shooting.
    */

    if(mouse.down){

      shoot();

    }

  }


  /*
    Fire cooldown.
  */

  if(fireCooldown>0){

    fireCooldown--;

  }


  /*
    Fireballs.
  */

  for(
    const b of balls
  ){

    b.x+=b.vx;
    b.y+=b.vy;

    b.life--;

  }


  balls=
    balls.filter(
      b=>
        b.life>0&&
        b.x>ARENA.left&&
        b.x<ARENA.right&&
        b.y>ARENA.top&&
        b.y<ARENA.bottom
    );


  /*
    Bomb movement.
  */

  for(
    const b of bombs
  ){

    if(!b.exploded){

      b.x+=b.vx;
      b.y+=b.vy;

      b.distance+=
        Math.hypot(
          b.vx,
          b.vy
        );

      b.life--;


      if(
        b.distance>=BOMB_THROW_DISTANCE||
        b.x<=ARENA.left||
        b.x>=ARENA.right||
        b.y<=ARENA.top||
        b.y>=ARENA.bottom
      ){

        explodeBomb(b);

      }


      if(!b.exploded){

        const hit=
          enemies.find(
            e=>
              Math.hypot(
                b.x-e.x,
                b.y-e.y
              )<
              e.r+b.r
          );


        if(hit){

          explodeBomb(b);

        }

      }

    }else{

      b.disintegrate--;

    }

  }


  bombs=
    bombs.filter(
      b=>
        !b.exploded||
        b.disintegrate>0
    );


  /*
    Enemy movement.
  */

  for(
    const e of enemies
  ){

    /*
      Big boss stomp state.
    */

    if(e.type==="bigboss"){

      updateBigBossStomp(
        e,
        dt
      );

    }


    /*
      Big boss does not move during stomp.
    */

    const frozen=
      e.type==="bigboss"&&
      e.stompState!=="ready";


    if(!frozen){

      const dx=
        p.x-e.x;

      const dy=
        p.y-e.y;

      const d=
        Math.hypot(
          dx,
          dy
        )||1;


      e.x+=
        dx/d*
        e.speed;

      e.y+=
        dy/d*
        e.speed;

    }


    /*
      Keep enemies inside arena except
      while they are entering from gate.
    */

    e.x=
      Math.max(
        ARENA.left+10,
        Math.min(
          ARENA.right-10,
          e.x
        )
      );

    e.y=
      Math.max(
        ARENA.top+10,
        Math.min(
          ARENA.bottom-10,
          e.y
        )
      );


    if(e.attack>0){

      e.attack--;

    }


    const dPlayer=
      Math.hypot(
        p.x-e.x,
        p.y-e.y
      );


    if(
      dPlayer<e.r+14&&
      e.attack<=0
    ){

      damagePlayer(e);

    }


    /*
      Fireball collisions.
    */

    for(
      const b of balls
    ){

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )<
        e.r+b.r
      ){

        const impactX=b.x;
        const impactY=b.y;


        e.hp-=p.damage;

        e.burn=
          Math.max(
            e.burn,
            42
          );

        e.burnTick=0;

        b.life=0;


        burst(
          impactX,
          impactY,
          10
        );


        /*
          Splash damage.
        */

        for(
          const other of enemies
        ){

          if(
            other!==e&&
            other.hp>0&&
            Math.hypot(
              other.x-impactX,
              other.y-impactY
            )<58
          ){

            other.hp-=
              Math.max(
                6,
                p.damage*.45
              );

            other.burn=
              Math.max(
                other.burn,
                42
              );

            other.burnTick=0;

          }

        }

      }

    }


    /*
      Burn.
    */

    if(e.burn>0){

      e.burn--;

      e.burnTick++;


      if(
        e.burnTick%7===0
      ){

        e.hp-=
          e.type==="bigboss"
          ?1.5
          :2.5;

      }

    }

  }


  /*
    Remove dead enemies.
  */

  const dead=
    enemies.filter(
      e=>e.hp<=0
    );


  dead.forEach(
    killEnemy
  );


  enemies=
    enemies.filter(
      e=>e.hp>0
    );


  /*
    Particles.
  */

  for(
    const s of particles
  ){

    s.x+=s.vx;
    s.y+=s.vy;

    s.life--;

  }


  particles=
    particles.filter(
      s=>s.life>0
    );


  /*
    Heart regeneration.
  */

  if(heartRegen>0){

    heartRegen-=dt;

    if(
      heartRegen<=0
    ){

      regainHeart();

    }

  }


  /*
    Ground shake decay.
  */

  if(groundShake>0){

    groundShake-=.5;

    if(groundShake<0)
      groundShake=0;

  }

}


/* =========================
   LOOP
   ========================= */

function loop(){

  requestAnimationFrame(loop);

  update();

  draw();

}


loop();

</script>
