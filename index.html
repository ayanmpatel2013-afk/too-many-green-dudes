<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Too Many Green Dudes</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#252525;font-family:monospace}
canvas{display:block;margin:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}
button{font-family:monospace;cursor:pointer}
#fullscreenBtn,#pauseBtn{position:fixed;top:10px;z-index:10;padding:8px 12px;color:#fff;font-size:14px}
#fullscreenBtn{right:10px;background:#1e3d20;border:2px solid #65b95b}
#pauseBtn{right:145px;background:#3d301e;border:2px solid #d6b85a}
</style>
</head>
<body>
<button id="pauseBtn">PAUSE</button>
<button id="fullscreenBtn">FULLSCREEN</button>
<canvas id="game" width="900" height="600"></canvas>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
ctx.imageSmoothingEnabled=false;
const W=900,H=600;
const ARENA={left:160,top:45,right:875,bottom:570};
const GATE={x:845,y:260,w:30,h:120};

let keys={},mouse={x:450,y:300,down:false};
let p,enemies,balls,particles,score,coins,wave,elapsed,gameOver,upgradeOpen,nextUpgrade;
let paused=false,upgradeCost=10;
let upgradeCounts={health:0,damage:0,speed:0};
let goblinHits=0,ogreHits=0,hearts=3,heartRegen=0;
let shieldTimer=0;
const SHIELD_DURATION=180; // 3 seconds at 60 FPS
const SHIELD_SPEED_MULTIPLIER=2;
let fireCooldown=0;
let bombCount=0,bombPickups=[],bombs=[],bombSpawnTimer=20;
let highscore=Number(localStorage.getItem("pixelNatureHighscore")||0);
let bigBoss=null,nextBigBoss=200,bossCountdown=0,bossCountdownValue=0,goblinBuffLevel=0;
let audioCtx=null,musicStarted=false,musicTimer=null,musicStep=0;
const SOUND_VOLUME=2;

function startMusic(){
 if(musicStarted)return;
 try{
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  musicStarted=true;
  if(audioCtx.state==="suspended")audioCtx.resume();
  musicTimer=setInterval(playMusicStep,280);
 }catch(err){}
}
function tone(freq,dur,type="square",vol=.07){
 if(!audioCtx)return;
 const now=audioCtx.currentTime,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(freq,now);
 gain.gain.setValueAtTime(.0001,now);
 gain.gain.exponentialRampToValueAtTime(vol*SOUND_VOLUME,now+.01);
 gain.gain.exponentialRampToValueAtTime(.0001,now+dur);
 osc.connect(gain);gain.connect(audioCtx.destination);
 osc.start(now);osc.stop(now+dur+.01);
}
function playFireballSound(){tone(240,.1)}
function playBossSound(){tone(80,.7,"square",.28)}
function playBombExplosionSound(){tone(105,.25,"square",.24)}
function playMusicStep(){
 if(!audioCtx||gameOver||paused)return;
 const notes=[110,130.81,146.83,164.81,196,164.81,146.83,130.81];
 tone(notes[musicStep++%notes.length],.25,"triangle",.06);
}

const fullscreenBtn=document.getElementById("fullscreenBtn");
fullscreenBtn.onclick=async()=>{
 try{
  if(!document.fullscreenElement){
   await document.documentElement.requestFullscreen();
   fullscreenBtn.textContent="EXIT FULLSCREEN";
  }else{
   await document.exitFullscreen();
   fullscreenBtn.textContent="FULLSCREEN";
  }
 }catch(e){}
};
document.addEventListener("fullscreenchange",()=>{
 fullscreenBtn.textContent=document.fullscreenElement?"EXIT FULLSCREEN":"FULLSCREEN";
});
const pauseBtn=document.getElementById("pauseBtn");
function togglePause(){if(gameOver)return;paused=!paused;pauseBtn.textContent=paused?"RESUME":"PAUSE"}
pauseBtn.onclick=togglePause;

function reset(){
 p={x:430,y:305,speed:3.2,damage:28,maxHp:100,hp:100};
 enemies=[];balls=[];particles=[];score=0;coins=0;wave=1;elapsed=0;
 gameOver=false;paused=false;upgradeOpen=false;nextUpgrade=70;upgradeCost=10;
 upgradeCounts={health:0,damage:0,speed:0};
 goblinHits=0;ogreHits=0;hearts=3;heartRegen=0;fireCooldown=0;
 bombCount=0;bombPickups=[];bombs=[];bombSpawnTimer=20;
 bigBoss=null;nextBigBoss=200;bossCountdown=0;bossCountdownValue=0;
 goblinBuffLevel=0;shieldTimer=0;window.lastBossMark=0;
 pauseBtn.textContent="PAUSE";
 spawnWave(1);
}
reset();

window.addEventListener("keydown",e=>{
 startMusic();
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="r"&&gameOver"){reset();return}
 if(e.key.toLowerCase()==="p"&&!e.repeat)togglePause();
 if(e.key.toLowerCase()==="q"&&!e.repeat)throwBomb();
 if(upgradeOpen){
  if(e.key==="1")buyUpgrade("health");
  if(e.key==="2")buyUpgrade("damage");
  if(e.key==="3")buyUpgrade("speed");
  if(e.key==="4")buyUpgrade("nothing");
 }
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
c.addEventListener("mousemove",e=>{
 const r=c.getBoundingClientRect();
 mouse.x=(e.clientX-r.left)*W/r.width;
 mouse.y=(e.clientY-r.top)*H/r.height;
});
c.addEventListener("mousedown",()=>{startMusic();mouse.down=true});
window.addEventListener("mouseup",()=>mouse.down=false);

function gateSpawnPosition(){
 return{x:GATE.x-4,y:GATE.y+GATE.h/2+(Math.random()-.5)*45};
}
function spawnEnemy(type="goblin"){
 if(bigBoss||bossCountdown>0)return;
 const pos=gateSpawnPosition(),x=pos.x,y=pos.y;
 if(type==="ogre"){
  const hp=260+Math.floor(elapsed/50)*35;
  enemies.push({type,x,y,r:30,hp,maxHp:hp,speed:.42+Math.min(.18,elapsed/2000),attack:0,burn:0,burnTick:0});
 }else{
  const buff=goblinBuffLevel;
  const hp=Math.round((45+wave*8)*(1+buff*.20));
  enemies.push({type:"goblin",x,y,r:14,hp,maxHp:hp,
   speed:.72+wave*.025+buff*.10,damage:1+buff,attack:0,burn:0,burnTick:0});
 }
}
function spawnWave(n){if(bigBoss||bossCountdown>0)return;for(let i=0;i<n;i++)spawnEnemy("goblin")}

function spawnBigBoss(){
 if(bigBoss)return;
 const pos=gateSpawnPosition();
 bigBoss={type:"bigboss",x:pos.x+5,y:pos.y,r:48,hp:2400,maxHp:2400,
  speed:3.3,attack:0,burn:0,burnTick:0,spawnFlash:35};
 enemies=[];
 playBossSound();
}
function defeatBigBoss(){
 if(!bigBoss)return;
 score+=50;coins+=50;burst(bigBoss.x,bigBoss.y,60);
 bigBoss=null;
 nextBigBoss=Math.ceil((elapsed+.01)/200)*200;
}
function killEnemy(e){
 if(e.type==="ogre"){coins+=7;score+=7;burst(e.x,e.y,22)}
 else{coins++;score++;burst(e.x,e.y,10)}
}
function shoot(){
 if(fireCooldown>0||upgradeOpen||gameOver||paused)return;
 const a=Math.atan2(mouse.y-p.y,mouse.x-p.x);
 balls.push({x:p.x,y:p.y,vx:Math.cos(a)*8,vy:Math.sin(a)*8,r:7,life:90});
 fireCooldown=60;playFireballSound();
}

const BOMB_THROW_DISTANCE=300,BOMB_DISINTEGRATE_TIME=22;
function spawnBombPickup(){
 if(bigBoss||bossCountdown>0)return;
 bombPickups.push({x:ARENA.left+50+Math.random()*(ARENA.right-ARENA.left-100),
  y:90+Math.random()*430,life:7});
}
function throwBomb(){
 if(gameOver||upgradeOpen||paused||bombCount<=0)return;
 const a=Math.atan2(mouse.y-p.y,mouse.x-p.x);
 bombCount--;
 bombs.push({x:p.x,y:p.y,vx:Math.cos(a)*7,vy:Math.sin(a)*7,life:120,r:9,distance:0,exploded:false,disintegrate:0});
}
function explodeBomb(b){
 if(b.exploded)return;
 b.exploded=true;b.disintegrate=BOMB_DISINTEGRATE_TIME;b.vx=0;b.vy=0;
 playBombExplosionSound();burst(b.x,b.y,42);
 if(bigBoss&&Math.hypot(b.x-bigBoss.x,b.y-bigBoss.y)<145){
  bigBoss.hp-=bigBoss.maxHp*.20;bigBoss.burn=Math.max(bigBoss.burn,42);
 }
 for(const e of enemies){
  if(Math.hypot(b.x-e.x,b.y-e.y)<115){
   e.hp-=e.type==="ogre"?e.maxHp*.5:e.maxHp*.75;
   e.burn=Math.max(e.burn,42);e.burnTick=0;
  }
 }
}

function damagePlayer(e){
 e.attack=45;
 if(e.type==="goblin"){
  goblinHits+=e.damage||1;
  if(goblinHits>=4){goblinHits=0;loseHeart()}
 }else{
  ogreHits++;
  if(ogreHits>=2){ogreHits=0;loseHeart()}
 }
}
function loseHeart(){
 if(hearts<=0||shieldTimer>0)return;
 hearts--;
 heartRegen=30;
 if(hearts>0){
  // Every lost heart starts a fresh 3-second shield and 2x movement boost.
  shieldTimer=SHIELD_DURATION;
 }else endGame();
}
function regainHeart(){if(hearts<3){hearts++;heartRegen=0}}
function endGame(){
 gameOver=true;
 if(score>highscore){highscore=score;localStorage.setItem("pixelNatureHighscore",highscore)}
}
function buyUpgrade(kind){
 if(kind==="nothing"){upgradeOpen=false;return}
 if(!upgradeOpen||coins<upgradeCost)return;
 coins-=upgradeCost;
 if(kind==="health"){p.maxHp+=20;p.hp=Math.min(p.maxHp,p.hp+20)}
 if(kind==="damage")p.damage+=12;
 if(kind==="speed")p.speed+=.4;
 upgradeCounts[kind]++;upgradeCost+=10;upgradeOpen=false;
}
function burst(x,y,n=8){
 for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:22});
}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}

function drawGate(){
 rect(GATE.x-10,GATE.y-10,GATE.w+20,GATE.h+20,"#111");
 rect(GATE.x-5,GATE.y-5,GATE.w+10,GATE.h+10,"#5a3824");
 rect(GATE.x,GATE.y,GATE.w,GATE.h,"#090909");
 for(let i=0;i<5;i++){rect(GATE.x+3+i*6,GATE.y+3,4,GATE.h-6,"#888");rect(GATE.x+4+i*6,GATE.y+3,2,GATE.h-6,"#bbb")}
 for(let i=0;i<4;i++)rect(GATE.x,GATE.y+18+i*25,GATE.w,5,"#777");
}
function drawHeart(x,y,full){
 const col=full?"#e83e3e":"#3a3a3a";
 rect(x+4,y,10,4,col);rect(x,y+4,18,10,col);rect(x+4,y+14,10,4,col);rect(x+8,y+18,2,2,col);
 if(!full)ctx.clearRect(x+5,y+5,8,8);
}
function drawCoin(x,y){rect(x,y,16,16,"#f3c62e");rect(x+4,y+2,8,12,"#ffe875");rect(x+2,y+3,2,10,"#b77b16");rect(x+12,y+3,2,10,"#b77b16")}

function drawBigBoss(){
 if(!bigBoss)return;
 const e=bigBoss;
 rect(e.x-42,e.y+40,84,12,"#151515");
 rect(e.x-40,e.y-30,80,78,"#28652c");
 rect(e.x-55,e.y-23,18,38,"#327b35");rect(e.x+37,e.y-23,18,38,"#327b35");
 rect(e.x-34,e.y-55,68,55,"#3c8f3d");
 rect(e.x-22,e.y-38,15,8,"#111");rect(e.x+7,e.y-38,15,8,"#111");
 rect(e.x-18,e.y-36,5,4,"#e8d35c");rect(e.x+10,e.y-36,5,4,"#e8d35c");
 rect(e.x-18,e.y-12,36,9,"#132d13");
 rect(e.x-12,e.y-9,7,4,"#eee");rect(e.x+5,e.y-9,7,4,"#eee");
 ctx.save();ctx.translate(e.x+35,e.y+10);ctx.rotate(-.65+Math.sin(performance.now()/110)*.12);
 rect(0,-5,12,75,"#5a351d");rect(3,-5,6,75,"#8a5129");
 rect(-16,-45,42,55,"#4b2c1c");rect(-20,-38,50,40,"#61391f");ctx.restore();
 const bw=180,bh=10,bx=e.x-bw/2,by=e.y-78;
 rect(bx-3,by-3,bw+6,bh+6,"#111");rect(bx,by,bw,bh,"#681f25");
 rect(bx,by,bw*Math.max(0,e.hp/e.maxHp),bh,"#e33b3b");
}

function drawShield(){
 if(shieldTimer<=0)return;
 const fade=Math.min(1,shieldTimer/35);
 ctx.save();
 ctx.globalAlpha=.28+fade*.55;
 // Large, clearly visible pixelated blue shield.
 rect(p.x-25,p.y-30,50,5,"#4da6ff");
 rect(p.x-30,p.y-25,5,50,"#4da6ff");
 rect(p.x+25,p.y-25,5,50,"#4da6ff");
 rect(p.x-25,p.y+25,50,5,"#4da6ff");
 rect(p.x-22,p.y-25,10,5,"#80c4ff");rect(p.x+12,p.y-25,10,5,"#80c4ff");
 rect(p.x-22,p.y+20,10,5,"#80c4ff");rect(p.x+12,p.y+20,10,5,"#80c4ff");
 rect(p.x-30,p.y-12,5,24,"#80c4ff");rect(p.x+25,p.y-12,5,24,"#80c4ff");
 // Extra inner pixels make it impossible to miss.
 rect(p.x-18,p.y-18,36,3,"#b8ddff");
 rect(p.x-21,p.y+15,42,3,"#b8ddff");
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#303030";ctx.fillRect(ARENA.left,ARENA.top,ARENA.right-ARENA.left,ARENA.bottom-ARENA.top);
 ctx.strokeStyle="#444";ctx.lineWidth=6;ctx.strokeRect(ARENA.left,ARENA.top,ARENA.right-ARENA.left,ARENA.bottom-ARENA.top);
 for(let i=0;i<85;i++)rect(ARENA.left+15+Math.random()*(ARENA.right-ARENA.left-30),60+Math.random()*490,3,3,i%2?"#353535":"#3b3b3b");

 // Information panel is outside the arena on the left.
 ctx.fillStyle="#202020";ctx.fillRect(8,75,135,125);
 ctx.strokeStyle="#444";ctx.lineWidth=2;ctx.strokeRect(8,75,135,125);
 ctx.font="14px monospace";ctx.fillStyle="#ffcf4d";ctx.fillText("NEXT UPGRADE",17,98);
 ctx.fillStyle="#fff";ctx.fillText(Math.max(0,Math.ceil(nextUpgrade-elapsed))+"s",17,118);
 ctx.fillStyle="#7ee879";ctx.fillText("GOBLIN LV",17,145);
 ctx.fillStyle="#fff";ctx.fillText(String(goblinBuffLevel),17,165);
 ctx.fillStyle="#ffcf4d";ctx.fillText("BIG BOSS",82,145);
 ctx.fillStyle=bigBoss?"#ff4444":"#fff";
 ctx.fillText(bigBoss?"ACTIVE":Math.max(0,Math.ceil(nextBigBoss-elapsed))+"s",82,165);

 drawGate();

 for(const e of enemies){
  if(e.type==="goblin"){
   rect(e.x-12,e.y-7,24,22,"#3c8f3d");
   rect(e.x-17,e.y-5,6,12,"#2e7130");rect(e.x+11,e.y-5,6,12,"#2e7130");
   rect(e.x-8,e.y-12,16,5,"#4ba747");
   rect(e.x-8,e.y-6,6,3,"#111");rect(e.x+2,e.y-6,6,3,"#111");
   rect(e.x-5,e.y+8,10,3,"#183c19");
  }else{
   rect(e.x-25,e.y-25,50,48,"#397d36");rect(e.x-31,e.y-18,7,17,"#2b622c");rect(e.x+24,e.y-18,7,17,"#2b622c");
   rect(e.x-16,e.y-16,11,5,"#111");rect(e.x+5,e.y-16,11,5,"#111");
   rect(e.x-12,e.y+8,24,5,"#132d13");
  }
  if(e.burn>0){rect(e.x-e.r-3,e.y+e.r-4,5,7,"#ff8c22");rect(e.x+e.r-2,e.y+e.r-8,4,7,"#ffd45a")}
  const bw=e.type==="ogre"?64:34,bx=e.x-bw/2,by=e.y-e.r-15;
  rect(bx-2,by-2,bw+4,10,"#111");rect(bx,by,bw,6,"#542b2b");rect(bx,by,bw*Math.max(0,e.hp/e.maxHp),6,"#55c84a");
 }
 drawBigBoss();

 for(const bp of bombPickups){
  rect(bp.x-7,bp.y-7,14,14,"#111");rect(bp.x-5,bp.y-5,10,12,"#444");rect(bp.x-3,bp.y-7,6,4,"#777");
 }
 for(const b of bombs){
  if(!b.exploded){rect(b.x-8,b.y-7,16,14,"#111");rect(b.x-6,b.y-6,12,12,"#444")}
  else{ctx.globalAlpha=Math.max(0,b.disintegrate/BOMB_DISINTEGRATE_TIME);rect(b.x-9,b.y-9,18,18,"#444");ctx.globalAlpha=1}
 }
 for(const b of balls){rect(b.x-6,b.y-6,12,12,"#d85b18");rect(b.x-3,b.y-8,6,16,"#ff9b25");rect(b.x-2,b.y-4,4,7,"#ffe27a")}
 for(const s of particles){ctx.globalAlpha=Math.min(1,s.life/22);rect(s.x,s.y,5,5,"#ff9c29");ctx.globalAlpha=1}

 // Player.
 rect(p.x-12,p.y-12,24,24,"#b47b4e");rect(p.x-16,p.y-8,4,10,"#6f4933");rect(p.x+12,p.y-8,4,10,"#6f4933");
 rect(p.x-7,p.y-5,5,5,"#252525");rect(p.x+3,p.y-5,5,5,"#252525");rect(p.x-5,p.y+7,10,3,"#613b2c");
 const a=Math.atan2(mouse.y-p.y,mouse.x-p.x);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(a);rect(9,-3,22,6,"#7d4b28");ctx.restore();

 // Shield is drawn after the player so it is always visible.
 drawShield();

 // Red transparent corner warning at one heart.
 if(hearts===1){
  const pulse=.16+Math.sin(performance.now()/180)*.035;
  ctx.save();ctx.globalAlpha=pulse;ctx.fillStyle="red";
  ctx.fillRect(0,0,W,120);ctx.fillRect(0,H-120,W,120);ctx.fillRect(0,0,120,H);ctx.fillRect(W-120,0,120,H);
  ctx.restore();
 }

 ctx.font="16px monospace";ctx.fillStyle="#fff";
 ctx.fillText("SCORE "+score,25,25);ctx.fillText("HIGH "+highscore,145,25);
 for(let i=0;i<3;i++)drawHeart(270+i*28,10,i<hearts);
 drawCoin(780,8);ctx.fillText("COINS",802,17);ctx.fillStyle="#ffe875";ctx.fillText(String(coins),802,33);
 ctx.fillStyle="#fff";ctx.fillText("x"+bombCount,187,562);
 ctx.fillText(fireCooldown>0?(fireCooldown/60).toFixed(1):"READY",800,562);
 ctx.fillText("WASD move • Mouse aim • Click fire • Q bomb • P pause",160,585);

 if(shieldTimer>0){ctx.fillStyle="#8dccff";ctx.fillText("SHIELD "+(shieldTimer/60).toFixed(1)+"s  •  2X SPEED",15,220)}

 if(bossCountdown>0){
  ctx.fillStyle="#120000";ctx.globalAlpha=.88;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;ctx.textAlign="center";
  ctx.fillStyle="#ff4444";ctx.font="38px monospace";ctx.fillText("BOSS INCOMING",W/2,190);
  ctx.fillStyle="#fff";ctx.font="100px monospace";ctx.fillText(bossCountdownValue,W/2,320);
  ctx.font="18px monospace";ctx.fillText("THE GATE IS OPENING...",W/2,370);ctx.textAlign="left";
 }

 if(upgradeOpen){
  ctx.fillStyle="#0a130d";ctx.globalAlpha=.92;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  ctx.fillStyle="#fff";ctx.font="32px monospace";ctx.fillText("CHOOSE YOUR UPGRADE",245,125);
  drawCoin(365,150);ctx.font="20px monospace";ctx.fillStyle="#ffe875";ctx.fillText("COINS: "+coins,390,165);
  ctx.fillStyle="#fff";ctx.font="16px monospace";ctx.fillText("Cost: "+upgradeCost+" coins   (1 / 2 / 3 / 4)",285,195);
  const cards=[["1","HEALTH","+20 MAX HP",90],["2","DAMAGE","+12 FIREBALL",295],["3","SPEED","+0.4 MOVE",500],["4","NOTHING","FREE",705]];
  for(const [n,t,d,x] of cards){
   ctx.fillStyle=t==="NOTHING"?"#183c1d":"#1e3d20";ctx.fillRect(x,235,170,130);
   ctx.strokeStyle=t==="NOTHING"?"#8ee889":"#65b95b";ctx.lineWidth=4;ctx.strokeRect(x,235,170,130);
   ctx.fillStyle="#bdebb5";ctx.font="21px monospace";ctx.fillText(n+". "+t,x+15,275);
   ctx.font="14px monospace";ctx.fillText(d,x+25,310);ctx.fillText(t==="NOTHING"?"SKIP":"BUY",x+60,340);
  }
 }
 if(paused){
  ctx.fillStyle="#000";ctx.globalAlpha=.72;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;ctx.textAlign="center";
  ctx.fillStyle="#fff";ctx.font="46px monospace";ctx.fillText("PAUSED",W/2,280);ctx.font="18px monospace";ctx.fillText("Press P or click RESUME",W/2,320);ctx.textAlign="left";
 }
 if(gameOver){
  ctx.fillStyle="#000";ctx.globalAlpha=.8;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
  ctx.fillStyle="#fff";ctx.font="42px monospace";ctx.fillText("GAME OVER",350,260);
  ctx.font="18px monospace";ctx.fillText("Score: "+score+"   High Score: "+highscore,320,300);ctx.fillText("Press R to restart",355,340);
 }
}

function loop(){
 requestAnimationFrame(loop);
 if(!gameOver&&!paused){
  if(!bigBoss&&bossCountdown<=0&&elapsed>=nextBigBoss){bossCountdown=3;bossCountdownValue=3}
  if(bossCountdown>0){
   bossCountdown-=1/60;const nv=Math.ceil(bossCountdown);
   if(nv!==bossCountdownValue&&nv>=1)bossCountdownValue=nv;
   if(bossCountdown<=0){bossCountdown=0;spawnBigBoss()}
  }
  elapsed+=1/60;

  if(shieldTimer>0){
   shieldTimer--;
   if(shieldTimer<0)shieldTimer=0;
  }

  const newGoblinBuff=Math.floor(elapsed/27);
  if(newGoblinBuff>goblinBuffLevel)goblinBuffLevel=newGoblinBuff;

  if(bigBoss){
   const dx=p.x-bigBoss.x,dy=p.y-bigBoss.y,d=Math.hypot(dx,dy)||1;
   bigBoss.x+=dx/d*bigBoss.speed;bigBoss.y+=dy/d*bigBoss.speed;
   if(bigBoss.attack>0)bigBoss.attack--;
   if(d<bigBoss.r+16&&bigBoss.attack<=0){bigBoss.attack=35;loseHeart()}
   for(const b of balls){
    if(Math.hypot(b.x-bigBoss.x,b.y-bigBoss.y)<bigBoss.r+b.r){
     bigBoss.hp-=p.damage;bigBoss.burn=Math.max(bigBoss.burn,42);bigBoss.burnTick=0;b.life=0;burst(b.x,b.y,14);
    }
   }
   if(bigBoss.burn>0){bigBoss.burn--;bigBoss.burnTick++;if(bigBoss.burnTick%7===0)bigBoss.hp-=3}
   if(bigBoss.hp<=0)defeatBigBoss();
  }

  if(!bigBoss&&bossCountdown<=0){
   bombSpawnTimer-=1/60;
   if(bombSpawnTimer<=0){spawnBombPickup();bombSpawnTimer=20}
   for(const bp of bombPickups)bp.life-=1/60;
   bombPickups=bombPickups.filter(bp=>bp.life>0);
   if(bombCount<3)for(let i=bombPickups.length-1;i>=0;i--){
    if(Math.hypot(bombPickups[i].x-p.x,bombPickups[i].y-p.y)<28){bombCount++;bombPickups.splice(i,1)}
   }
   if(elapsed>=nextUpgrade){upgradeOpen=true;nextUpgrade+=70}
   const newWave=Math.floor(elapsed/10)+1;
   if(newWave>wave){wave=newWave;spawnWave(wave)}
   const bossMark=Math.floor(elapsed/50);
   if(bossMark>0&&!enemies.some(e=>e.type==="ogre"&&e.bossMark===bossMark)){
    if(!window.lastBossMark)window.lastBossMark=0;
    if(bossMark>window.lastBossMark){
     spawnEnemy("ogre");
     if(enemies.length)enemies[enemies.length-1].bossMark=bossMark;
     window.lastBossMark=bossMark;
    }
   }
  }

  if(!upgradeOpen){
   let dx=((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0);
   let dy=((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0);
   const m=Math.hypot(dx,dy)||1;
   const moveSpeed=shieldTimer>0?p.speed*SHIELD_SPEED_MULTIPLIER:p.speed;
   p.x+=dx/m*moveSpeed;p.y+=dy/m*moveSpeed;
   p.x=Math.max(ARENA.left+15,Math.min(ARENA.right-20,p.x));
   p.y=Math.max(ARENA.top+20,Math.min(ARENA.bottom-30,p.y));
   if(mouse.down)shoot();
   if(fireCooldown>0)fireCooldown--;

   for(const b of balls){b.x+=b.vx;b.y+=b.vy;b.life--}
   balls=balls.filter(b=>b.life>0&&b.x>ARENA.left&&b.x<ARENA.right&&b.y>ARENA.top&&b.y<ARENA.bottom);

   for(const b of bombs){
    if(!b.exploded){
     b.x+=b.vx;b.y+=b.vy;b.distance+=Math.hypot(b.vx,b.vy);b.life--;
     if(b.distance>=BOMB_THROW_DISTANCE)explodeBomb(b);
     if(!b.exploded&&enemies.find(e=>Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r))explodeBomb(b);
     if(!b.exploded&&(b.x<=ARENA.left||b.x>=ARENA.right||b.y<=ARENA.top||b.y>=ARENA.bottom))explodeBomb(b);
    }else b.disintegrate--;
   }
   bombs=bombs.filter(b=>!b.exploded||b.disintegrate>0);

   for(const e of enemies){
    const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
    e.x+=dx/d*e.speed;e.y+=dy/d*e.speed;
    if(e.attack>0)e.attack--;
    // Shield makes the player completely invincible for the full 3 seconds.
    if(d<e.r+14&&e.attack<=0){
     if(shieldTimer<=0)damagePlayer(e);
     else e.attack=20;
    }
    for(const b of balls){
     if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){
      const ix=b.x,iy=b.y;e.hp-=p.damage;e.burn=Math.max(e.burn,42);e.burnTick=0;b.life=0;burst(ix,iy,10);
      for(const other of enemies)if(other!==e&&other.hp>0&&Math.hypot(other.x-ix,other.y-iy)<58){
       other.hp-=Math.max(6,p.damage*.45);other.burn=Math.max(other.burn,42);other.burnTick=0;
      }
     }
    }
    if(e.burn>0){e.burn--;e.burnTick++;if(e.burnTick%7===0)e.hp-=2.5}
   }
   const dead=enemies.filter(e=>e.hp<=0);dead.forEach(killEnemy);enemies=enemies.filter(e=>e.hp>0);
   for(const s of particles){s.x+=s.vx;s.y+=s.vy;s.life--}
   particles=particles.filter(s=>s.life>0);
   if(heartRegen>0){heartRegen-=1/60;if(heartRegen<=0)regainHeart()}
  }
 }
 draw();
}
loop();
</script>
</body>
</html>
