<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Too Many Green Dudes</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#252525;
  font-family:monospace;
}

canvas{
  display:block;
  margin:auto;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  cursor:crosshair;
}

button{
  font-family:monospace;
  cursor:pointer;
}

#fullscreenBtn,
#pauseBtn{
  position:fixed;
  top:10px;
  z-index:20;
  padding:8px 12px;
  color:#fff;
  font-size:14px;
}

#fullscreenBtn{
  right:10px;
  background:#1e3d20;
  border:2px solid #65b95b;
}

#fullscreenBtn:hover{
  background:#2c5a2f;
}

#pauseBtn{
  right:145px;
  background:#3d301e;
  border:2px solid #d6b85a;
}

#pauseBtn:hover{
  background:#594728;
}
</style>
</head>

<body>

<button id="pauseBtn">PAUSE</button>
<button id="fullscreenBtn">FULLSCREEN</button>

<canvas id="game" width="900" height="600"></canvas>

<script>

const c=document.getElementById("game");
const ctx=c.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=900;
const H=600;

const ARENA={
  left:160,
  top:45,
  right:875,
  bottom:570
};

const GATE={
  x:845,
  y:260,
  w:30,
  h:120
};

/* =========================================================
   INPUT
========================================================= */

let keys={};

let mouse={
  x:450,
  y:300,
  down:false
};

/* =========================================================
   GAME STATE
========================================================= */

let p;
let enemies=[];
let balls=[];
let particles=[];

let score=0;
let coins=0;
let wave=1;
let elapsed=0;

let gameOver=false;
let paused=false;
let upgradeOpen=false;

/* PLAY SCREEN */
let startScreen=true;

/* =========================================================
   UPGRADES
========================================================= */

let nextUpgrade=70;
let upgradeCost=10;

let upgradeCounts={
  health:0,
  damage:0,
  speed:0
};

/* =========================================================
   PLAYER HEALTH
========================================================= */

let goblinHits=0;
let ogreHits=0;

let hearts=3;
let heartRegen=0;

let shieldTimer=0;
let speedBoostTimer=0;

const SHIELD_DURATION=3;
const SHIELD_SPEED_MULTIPLIER=2;

/* =========================================================
   FIREBALL
========================================================= */

let fireCooldown=0;

/* =========================================================
   BOMBS
========================================================= */

let bombCount=0;
let bombPickups=[];
let bombs=[];

let bombSpawnTimer=20;

const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=22;

/* =========================================================
   BIG BOSS
========================================================= */

let bigBoss=null;

let nextBigBoss=200;

let bossCountdown=0;
let bossCountdownValue=0;

/* =========================================================
   NORMAL GOBLIN LEVEL
========================================================= */

let goblinBuffLevel=0;

const GOBLIN_HP_LEVEL_BONUS=.08;
const GOBLIN_SPEED_LEVEL_BONUS=.035;
const GOBLIN_DAMAGE_LEVEL_BONUS=.20;

/* =========================================================
   VICTORY / BAT
========================================================= */

let bossDefeated=false;

let victorySequence=false;
let victoryTimer=0;

let batDropped=false;

let bat={
  x:0,
  y:0,
  active:false,
  collected:false,
  pulse:0
};

/* =========================================================
   BAT ABILITY
========================================================= */

let batAbility=false;

let batCooldown=0;

const BAT_COOLDOWN=17;

let batSwing=0;

/* =========================================================
   SKELETON SYSTEM
========================================================= */

let skeletonMode=false;

let skeletonLevel=0;

let skeletonUpgradeTimer=27;

/* Skeletons spawn from gate every 12 seconds */
let skeletonSpawnTimer=12;

const SKELETON_SPAWN_TIME=12;

/* =========================================================
   HIGH SCORE
========================================================= */

let highscore=Number(
  localStorage.getItem(
    "pixelNatureHighscore"
  )||0
);

/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

const SOUND_VOLUME=2;

function startMusic(){

  if(musicStarted)return;

  try{

    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );

  }catch(err){

    console.log(
      "Music unavailable:",
      err
    );

  }

}

function tone(
  freq,
  duration,
  type="square",
  volume=.08
){

  if(!audioCtx)return;

  const now=
    audioCtx.currentTime;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type=type;

  osc.frequency.value=freq;

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume*SOUND_VOLUME,
    now+.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(
    now+duration+.02
  );

}

function playFireballSound(){

  tone(
    240,
    .10,
    "square",
    .07
  );

}

function playBombExplosionSound(){

  tone(
    80,
    .30,
    "square",
    .20
  );

  setTimeout(
    ()=>tone(
      800,
      .12,
      "square",
      .10
    ),
    20
  );

}

function playBossSound(){

  tone(
    65,
    .65,
    "square",
    .25
  );

}

function playBatSound(){

  tone(
    170,
    .12,
    "square",
    .15
  );

  setTimeout(
    ()=>tone(
      75,
      .25,
      "sawtooth",
      .20
    ),
    50
  );

}

function playPickupSound(){

  tone(
    500,
    .08,
    "square",
    .10
  );

  setTimeout(
    ()=>tone(
      750,
      .12,
      "square",
      .10
    ),
    70
  );

}

function playMusicStep(){

  if(
    !audioCtx||
    gameOver||
    paused||
    startScreen
  ){

    return;

  }

  const notes=[
    110,
    130.81,
    146.83,
    164.81,
    196,
    164.81,
    146.83,
    130.81,
    110,
    146.83,
    164.81,
    196,
    220,
    196,
    164.81,
    146.83
  ];

  const bass=[
    55,
    55,
    65.41,
    65.41,
    73.42,
    73.42,
    82.41,
    82.41
  ];

  tone(
    notes[
      musicStep%notes.length
    ],
    .24,
    "triangle",
    .08
  );

  tone(
    bass[
      musicStep%bass.length
    ],
    .23,
    "sine",
    .10
  );

  musicStep++;

}

/* =========================================================
   BUTTONS
========================================================= */

const fullscreenBtn=
  document.getElementById(
    "fullscreenBtn"
  );

fullscreenBtn.addEventListener(
  "click",
  async()=>{

    try{

      if(
        !document.fullscreenElement
      ){

        await document.documentElement.requestFullscreen();

        fullscreenBtn.textContent=
          "EXIT FULLSCREEN";

      }else{

        await document.exitFullscreen();

        fullscreenBtn.textContent=
          "FULLSCREEN";

      }

    }catch(err){

      console.log(
        "Fullscreen unavailable:",
        err
      );

    }

  }
);

document.addEventListener(
  "fullscreenchange",
  ()=>{

    fullscreenBtn.textContent=
      document.fullscreenElement
      ?"EXIT FULLSCREEN"
      :"FULLSCREEN";

  }
);

const pauseBtn=
  document.getElementById(
    "pauseBtn"
  );

function togglePause(){

  if(
    gameOver||
    startScreen||
    victorySequence||
    upgradeOpen||
    bossCountdown>0
  ){

    return;

  }

  paused=!paused;

  pauseBtn.textContent=
    paused
    ?"RESUME"
    :"PAUSE";

}

pauseBtn.addEventListener(
  "click",
  togglePause
);

/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    startMusic();

    const k=
      e.key.toLowerCase();

    keys[k]=true;

    /* PLAY SCREEN */
    if(
      startScreen&&
      (
        k==="enter"||
        k===" "
      )
    ){

      startGame();

      return;

    }

    if(
      k==="p"&&
      !e.repeat
    ){

      togglePause();

    }

    if(
      k==="r"&&
      gameOver
    ){

      reset();

      return;

    }

    if(
      k==="q"&&
      !e.repeat
    ){

      throwBomb();

    }

    if(
      k==="f"&&
      !e.repeat
    ){

      useBatAbility();

    }

    if(
      upgradeOpen
    ){

      if(e.key==="1")
        buyUpgrade("health");

      if(e.key==="2")
        buyUpgrade("damage");

      if(e.key==="3")
        buyUpgrade("speed");

      if(e.key==="4")
        buyUpgrade("nothing");

    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    keys[
      e.key.toLowerCase()
    ]=false;

  }
);

/* =========================================================
   MOUSE
========================================================= */

c.addEventListener(
  "mousemove",
  e=>{

    const r=
      c.getBoundingClientRect();

    mouse.x=
      (e.clientX-r.left)*
      W/r.width;

    mouse.y=
      (e.clientY-r.top)*
      H/r.height;

  }
);

c.addEventListener(
  "mousedown",
  ()=>{

    startMusic();

    if(startScreen){

      startGame();

      return;

    }

    mouse.down=true;

  }
);

window.addEventListener(
  "mouseup",
  ()=>{

    mouse.down=false;

  }
);

/* =========================================================
   START GAME
========================================================= */

function startGame(){

  if(!startScreen)return;

  startScreen=false;

  reset();

  startMusic();

}

/* =========================================================
   RESET
========================================================= */

function reset(){

  p={

    x:430,
    y:305,

    speed:3.2,

    /* slightly stronger damage */
    damage:34,

    maxHp:100,
    hp:100,

    shieldTimer:0,
    speedBoostTimer:0

  };

  enemies=[];
  balls=[];
  particles=[];

  score=0;
  coins=0;

  wave=1;
  elapsed=0;

  gameOver=false;
  paused=false;
  upgradeOpen=false;

  nextUpgrade=70;
  upgradeCost=10;

  upgradeCounts={
    health:0,
    damage:0,
    speed:0
  };

  goblinHits=0;
  ogreHits=0;

  hearts=3;
  heartRegen=0;

  fireCooldown=0;

  bombCount=0;
  bombPickups=[];
  bombs=[];

  bombSpawnTimer=20;

  bigBoss=null;

  nextBigBoss=200;

  bossCountdown=0;
  bossCountdownValue=0;

  goblinBuffLevel=0;

  bossDefeated=false;

  victorySequence=false;
  victoryTimer=0;

  batDropped=false;

  bat={
    x:0,
    y:0,
    active:false,
    collected:false,
    pulse:0
  };

  batAbility=false;

  batCooldown=0;
  batSwing=0;

  skeletonMode=false;
  skeletonLevel=0;
  skeletonUpgradeTimer=27;
  skeletonSpawnTimer=12;

  window.lastBossMark=0;

}

/* =========================================================
   SPAWN POSITION
========================================================= */

function gateSpawnPosition(){

  return{

    x:GATE.x-8,

    y:
      GATE.y+
      GATE.h/2+
      (Math.random()-.5)*60

  };

}

/* =========================================================
   NORMAL ENEMY SPAWNING
========================================================= */

function spawnEnemy(
  type="goblin"
){

  /*
    Normal enemies are permanently
    disabled after the Big Boss.
  */

  if(
    bossDefeated||
    bigBoss||
    bossCountdown>0
  ){

    return;

  }

  const pos=
    gateSpawnPosition();

  const x=pos.x;
  const y=pos.y;

  if(
    type==="ogre"
  ){

    const hp=
      260+
      Math.floor(
        elapsed/50
      )*20;

    enemies.push({

      type:"ogre",

      x,
      y,

      r:30,

      hp,
      maxHp:hp,

      speed:
        .42+
        Math.min(
          .18,
          elapsed/2000
        ),

      damage:3,

      attack:0,

      burn:0,
      burnTick:0,

      bossMark:0

    });

    return;

  }

  const level=
    goblinBuffLevel;

  const hp=
    Math.round(
      (45+wave*6)*
      (
        1+
        level*
        GOBLIN_HP_LEVEL_BONUS
      )
    );

  const damage=
    1+
    level*
    GOBLIN_DAMAGE_LEVEL_BONUS;

  const speed=
    .72+
    wave*.018+
    level*
    GOBLIN_SPEED_LEVEL_BONUS;

  enemies.push({

    type:"goblin",

    x,
    y,

    r:14,

    hp,
    maxHp:hp,

    speed,
    damage,

    attack:0,

    burn:0,
    burnTick:0,

    bossMark:0

  });

}

function spawnWave(n){

  if(
    bossDefeated||
    bigBoss||
    bossCountdown>0
  ){

    return;

  }

  for(
    let i=0;
    i<n;
    i++
  ){

    spawnEnemy(
      "goblin"
    );

  }

}

/* =========================================================
   BIG BOSS
========================================================= */

function spawnBigBoss(){

  if(
    bigBoss||
    bossDefeated
  ){

    return;

  }

  const pos=
    gateSpawnPosition();

  bigBoss={

    type:"bigboss",

    x:pos.x+5,
    y:pos.y,

    r:48,

    hp:2400,
    maxHp:2400,

    /* requested speed */
    speed:3.1,

    attack:0,

    burn:0,
    burnTick:0,

    rotation:0,

    spawnFlash:35

  };

  enemies=[];

  balls=[];

  bombPickups=[];

  playBossSound();

}

/* =========================================================
   BIG BOSS DEFEATED
========================================================= */

function defeatBigBoss(){

  if(
    !bigBoss||
    bigBoss.type!=="bigboss"||
    victorySequence
  ){

    return;

  }

  score+=50;
  coins+=50;

  const bx=
    bigBoss.x;

  const by=
    bigBoss.y;

  /*
    Completely stop normal spawning.
  */

  bossDefeated=true;

  skeletonMode=false;

  enemies=[];

  balls=[];

  bombPickups=[];

  bombs=[];

  /*
    Keep boss alive as a cutscene object.
  */

  bigBoss={

    type:"defeatedBoss",

    x:bx,
    y:by,

    r:48,

    hp:0,
    maxHp:2400,

    animation:4,
    maxAnimation:4,

    rotation:0

  };

  victorySequence=true;

  victoryTimer=4;

  batDropped=false;

  bat.active=false;

  bat.collected=false;

  playBossSound();

}

/* =========================================================
   SKELETON CREATION
========================================================= */

function createSkeletonGoblin(){

  const pos=
    gateSpawnPosition();

  const hp=
    105+
    skeletonLevel*15;

  return{

    type:"skeletonGoblin",

    x:pos.x,
    y:pos.y,

    r:15,

    hp,
    maxHp:hp,

    speed:
      .95+
      skeletonLevel*.045,

    damage:
      1.8+
      skeletonLevel*.10,

    attack:0,

    burn:0,
    burnTick:0

  };

}

function createSkeletonOgre(){

  const pos=
    gateSpawnPosition();

  const hp=
    460+
    skeletonLevel*35;

  return{

    type:"skeletonOgre",

    x:pos.x,
    y:pos.y,

    r:31,

    hp,
    maxHp:hp,

    speed:
      .62+
      skeletonLevel*.025,

    damage:
      3.5+
      skeletonLevel*.15,

    attack:0,

    burn:0,
    burnTick:0

  };

}

/* =========================================================
   SKELETON GATE SPAWNING
========================================================= */

function spawnSkeletonWave(){

  if(
    !bossDefeated||
    !batAbility||
    victorySequence||
    upgradeOpen||
    paused||
    gameOver
  ){

    return;

  }

  /*
    Always spawn several skeleton goblins.
  */

  const count=
    3+
    Math.min(
      3,
      Math.floor(
        skeletonLevel/2
      )
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    enemies.push(
      createSkeletonGoblin()
    );

  }

  /*
    Every second skeleton wave also
    gets a skeleton mini boss.
  */

  if(
    skeletonLevel%2===0||
    Math.random()<.35
  ){

    enemies.push(
      createSkeletonOgre()
    );

  }

  skeletonSpawnTimer=
    SKELETON_SPAWN_TIME;

}

/* =========================================================
   SKELETON UPGRADES
========================================================= */

function upgradeSkeletons(){

  skeletonLevel++;

  for(
    const e of enemies
  ){

    e.maxHp=
      Math.round(
        e.maxHp*1.10
      );

    e.hp=e.maxHp;

    e.speed*=1.04;

    e.damage*=1.08;

  }

}

/* =========================================================
   VICTORY CUTSCENE
========================================================= */

function updateVictory(){

  if(
    !victorySequence
  ){

    return;

  }

  victoryTimer-=1/60;

  /*
    Boss disintegrates.
  */

  if(
    bigBoss&&
    bigBoss.type==="defeatedBoss"
  ){

    bigBoss.animation=
      Math.max(
        0,
        victoryTimer
      );

    if(
      Math.random()<.65
    ){

      particles.push({

        x:
          bigBoss.x+
          (Math.random()-.5)*90,

        y:
          bigBoss.y+
          (Math.random()-.5)*100,

        vx:
          (Math.random()-.5)*3,

        vy:
          -Math.random()*3,

        life:
          20+
          Math.random()*30

      });

    }

    /*
      Cutscene finishes.
    */

    if(
      victoryTimer<=0
    ){

      bigBoss=null;

      dropBat();

    }

  }

}

/* =========================================================
   BAT DROP
========================================================= */

function dropBat(){

  if(
    batDropped
  ){

    return;

  }

  batDropped=true;

  bat.x=
    W/2;

  bat.y=
    H/2+55;

  bat.active=true;

  bat.collected=false;

  bat.pulse=0;

}

/* =========================================================
   BAT PICKUP
========================================================= */

function collectBat(){

  if(
    !bat.active||
    bat.collected||
    gameOver
  ){

    return;

  }

  const d=
    Math.hypot(
      p.x-bat.x,
      p.y-bat.y
    );

  if(
    d<35
  ){

    bat.collected=true;

    bat.active=false;

    batAbility=true;

    /*
      Now the cutscene is completely finished.
    */

    victorySequence=false;

    /*
      Skeletons begin spawning from the gate.
    */

    skeletonMode=true;

    skeletonLevel=0;

    skeletonSpawnTimer=1;

    playPickupSound();

  }

}

/* =========================================================
   BAT ABILITY
========================================================= */

function useBatAbility(){

  if(
    !batAbility||
    batCooldown>0||
    gameOver||
    paused||
    upgradeOpen||
    victorySequence||
    bossCountdown>0||
    startScreen
  ){

    return;

  }

  batCooldown=
    BAT_COOLDOWN;

  batSwing=.55;

  playBatSound();

  /*
    Instantly kill EVERY enemy.
  */

  for(
    const e of enemies
  ){

    burst(
      e.x,
      e.y,
      28
    );

    e.hp=0;

  }

  enemies=[];

}

/* =========================================================
   PLAYER DAMAGE
========================================================= */

function damagePlayer(e){

  e.attack=45;

  /*
    Shield blocks all damage.
  */

  if(
    p.shieldTimer>0
  ){

    return;

  }

  if(
    e.type==="goblin"||
    e.type==="skeletonGoblin"
  ){

    goblinHits+=
      e.damage||1;

    if(
      goblinHits>=4
    ){

      goblinHits=0;

      loseHeart();

    }

  }else{

    ogreHits++;

    if(
      ogreHits>=2
    ){

      ogreHits=0;

      loseHeart();

    }

  }

}

/* =========================================================
   HEARTS
========================================================= */

function loseHeart(){

  if(
    hearts<=0
  ){

    return;

  }

  hearts--;

  heartRegen=30;

  /*
    Blue shield and speed boost.
  */

  p.shieldTimer=
    SHIELD_DURATION;

  p.speedBoostTimer=
    SHIELD_DURATION;

  goblinHits=0;
  ogreHits=0;

  if(
    hearts<=0
  ){

    endGame();

  }

}

function regainHeart(){

  if(
    hearts<3
  ){

    hearts++;

    heartRegen=0;

  }

}

function endGame(){

  gameOver=true;

  if(
    score>highscore
  ){

    highscore=score;

    localStorage.setItem(
      "pixelNatureHighscore",
      highscore
    );

  }

}

/* =========================================================
   UPGRADES
========================================================= */

function buyUpgrade(kind){

  /*
    The game remains completely frozen
    while this menu is open.
  */

  if(
    !upgradeOpen
  ){

    return;

  }

  if(
    kind==="nothing"
  ){

    upgradeOpen=false;

    return;

  }

  if(
    coins<upgradeCost
  ){

    return;

  }

  coins-=upgradeCost;

  if(
    kind==="health"
  ){

    p.maxHp+=20;

    p.hp=
      Math.min(
        p.maxHp,
        p.hp+20
      );

  }

  if(
    kind==="damage"
  ){

    p.damage+=14;

  }

  if(
    kind==="speed"
  ){

    p.speed+=.4;

  }

  upgradeCounts[kind]++;

  upgradeCost+=10;

  upgradeOpen=false;

}

/* =========================================================
   BOMBS
========================================================= */

function spawnBombPickup(){

  if(
    bossDefeated||
    bigBoss||
    bossCountdown>0
  ){

  }

  const x=
    ARENA.left+
    50+
    Math.random()*
    (
      ARENA.right-
      ARENA.left-
      100
    );

    90+

function throwBomb(){

  if(
    gameOver||
    upgradeOpen||
    paused||
    victorySequence||
    bossCountdown>0||
    startScreen||
    bombCount<=0
  ){

    return;

  }

  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );

  bombCount--;

  bombs.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*7,

    vy:
      Math.sin(a)*7,

    life:120,

    r:9,

    distance:0,

    exploded:false,

    disintegrate:0,

    rotation:0

  });

}

function explodeBomb(b){

  if(
    b.exploded
  ){

    return;

  }

  b.exploded=true;

  b.disintegrate=
    BOMB_DISINTEGRATE_TIME;

  b.vx=0;
  b.vy=0;

  playBombExplosionSound();

  burst(
    b.x,
    b.y,
    50
  );

  /*
    Big Boss takes 20%.
  */

  if(
    bigBoss&&
    bigBoss.type==="bigboss"
  ){

    const d=
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      );

    if(
      d<145
    ){

      bigBoss.hp-=
        bigBoss.maxHp*.20;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

    }

  }

  /*
    Large enemy splash.
  */

  for(
    const e of enemies
  ){

    const d=
      Math.hypot(
        b.x-e.x,
        b.y-e.y
      );

    if(
      d<125
    ){

      e.hp-=
        (
          e.type==="ogre"||
          e.type==="skeletonOgre"
        )
        ?e.maxHp*.50
        :e.maxHp*.75;

      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

    }

  }

}

/* =========================================================
   FIREBALL SPLASH
========================================================= */

function fireballSplash(
  x,
  y,
  directEnemy
){

  /*
    Large splash radius.
  */

  const splashRadius=82;

  for(
    const e of enemies
  ){

    if(
      e===directEnemy
    ){

      continue;

    }

    const d=
      Math.hypot(
        x-e.x,
        y-e.y
      );

    if(
      d<splashRadius
    ){

      const falloff=
        1-
        d/splashRadius;

      const damage=
        Math.max(
          6,
          p.damage*
          .55*
          falloff
        );

      e.hp-=damage;

      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

      burst(
        e.x,
        e.y,
        5
      );

    }

  }

}

/* =========================================================
   FIREBALL UPDATE
========================================================= */

function updateBalls(){

  for(
    const b of balls
  ){

    b.x+=b.vx;
    b.y+=b.vy;

    b.life--;

    if(
      b.life<=0
    ){

      continue;

    }

    /*
      Big Boss hit.
    */

    if(
      bigBoss&&
      bigBoss.type==="bigboss"&&
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      )<
      bigBoss.r+b.r
    ){

      bigBoss.hp-=p.damage;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

      bigBoss.burnTick=0;

      fireballSplash(
        b.x,
        b.y,
        null
      );

      b.life=0;

      continue;

    }

    /*
      Enemy hit.
    */

    let hit=null;

    for(
      const e of enemies
    ){

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )<
        e.r+b.r
      ){

        hit=e;

        break;

      }

    }

    if(hit){

      hit.hp-=p.damage;

      hit.burn=
        Math.max(
          hit.burn,
          42
        );

      hit.burnTick=0;

      burst(
        b.x,
        b.y,
        12
      );

      /*
        BIG fireball splash.
      */

      fireballSplash(
        b.x,
        b.y,
        hit
      );

      b.life=0;

    }

  }

  balls=
    balls.filter(
      b=>
        b.life>0&&
        b.x>ARENA.left&&
        b.x<ARENA.right&&
        b.y>ARENA.top&&
        b.y<ARENA.bottom
    );

}

/* =========================================================
   ENEMY UPDATE
========================================================= */

function updateEnemies(){

  for(
    const e of enemies
  ){

    const dx=
      p.x-e.x;

    const dy=
      p.y-e.y;

    const d=
      Math.hypot(
        dx,
        dy
      )||1;

    e.x+=
      dx/d*
      e.speed;

    e.y+=
      dy/d*
      e.speed;

    if(
      e.attack>0
    ){

      e.attack--;

    }

    if(
      d<
      e.r+14&&
      e.attack<=0
    ){

      damagePlayer(e);

    }

    if(
      e.burn>0
    ){

      e.burn--;

      e.burnTick++;

      if(
        e.burnTick%7===0
      ){

        e.hp-=
          (
            e.type==="skeletonOgre"||
            e.type==="skeletonGoblin"
          )
          ?2.5
          :2;

      }

    }

  }

  const dead=
    enemies.filter(
      e=>e.hp<=0
    );

  for(
    const e of dead
  ){

    let reward=1;

    if(
      e.type==="ogre"
    ){

      reward=7;

    }

    if(
      e.type==="skeletonGoblin"
    ){

      reward=2;

    }

    if(
      e.type==="skeletonOgre"
    ){

      reward=10;

    }

    coins+=reward;
    score+=reward;

    burst(
      e.x,
      e.y,
      20
    );

  }

  enemies=
    enemies.filter(
      e=>e.hp>0
    );

}

/* =========================================================
   BIG BOSS UPDATE
========================================================= */

function updateBoss(){

  if(
    !bigBoss||
    bigBoss.type!=="bigboss"
  ){

    return;

  }

  const dx=
    p.x-bigBoss.x;

  const dy=
    p.y-bigBoss.y;

  const d=
    Math.hypot(
      dx,
      dy
    )||1;

  bigBoss.x+=
    dx/d*
    bigBoss.speed;

  bigBoss.y+=
    dy/d*
    bigBoss.speed;

  if(
    bigBoss.attack>0
  ){

    bigBoss.attack--;

  }

  if(
    d<
    bigBoss.r+16&&
    bigBoss.attack<=0
  ){

    bigBoss.attack=35;

    loseHeart();

  }

  if(
    bigBoss.burn>0
  ){

    bigBoss.burn--;

    bigBoss.burnTick++;

    if(
      bigBoss.burnTick%7===0
    ){

      bigBoss.hp-=3;

    }

  }

  if(
    bigBoss.hp<=0
  ){

    defeatBigBoss();

  }

}

/* =========================================================
   SHIELD
========================================================= */

function updateShield(){

  if(
    p.shieldTimer>0
  ){

    p.shieldTimer-=1/60;

    p.speedBoostTimer-=1/60;

    if(
      p.shieldTimer<=0
    ){

      p.shieldTimer=0;
      p.speedBoostTimer=0;

    }

  }

}

/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(){

  if(
    upgradeOpen||
    gameOver||
    startScreen||
    (
      victorySequence&&
      victoryTimer>0
    )
  ){

    return;

  }

  let dx=
    (
      keys.d||
      keys.arrowright
      ?1
      :0
    )-
    (
      keys.a||
      keys.arrowleft
      ?1
      :0
    );

  let dy=
    (
      keys.s||
      keys.arrowdown
      ?1
      :0
    )-
    (
      keys.w||
      keys.arrowup
      ?1
      :0
    );

  const m=
    Math.hypot(
      dx,
      dy
    )||1;

  let speed=
    p.speed;

  if(
    p.speedBoostTimer>0
  ){

    speed*=
      SHIELD_SPEED_MULTIPLIER;

  }

  p.x+=
    dx/m*
    speed;

  p.y+=
    dy/m*
    speed;

  p.x=
    Math.max(
      ARENA.left+15,
      Math.min(
        ARENA.right-20,
        p.x
      )
    );

  p.y=
    Math.max(
      ARENA.top+20,
      Math.min(
        ARENA.bottom-30,
        p.y
      )
    );

}

function burst(

  y,
  n=8
){

  for(

    i<n;

  ){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*5,

      vy:

      life:

function updateParticles(){

  for(
    const s of particles

    s.x+=s.vx;
    s.y+=s.vy;

    s.life--;

  }

  particles=
    particles.filter(
      s=>s.life>0
    );

}

    const bw=
      (
        e.type==="ogre"||

      drawSingleBomb(
        b.x,

/* =========================================================
   MAIN DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  if(
    startScreen
  ){

    drawStartScreen();

    return;

  }

  /*
    Arena.
  */

  ctx.fillStyle="#303030";

  ctx.fillRect(
    ARENA.left,
    ARENA.top,
    ARENA.right-ARENA.left,
    ARENA.bottom-ARENA.top
  );

  /*
    Arena border.
  */

  ctx.strokeStyle="#444";
  ctx.lineWidth=6;

  ctx.strokeRect(
    ARENA.left,
    ARENA.top,
    ARENA.right-ARENA.left,
    ARENA.bottom-ARENA.top
  );

  /*
    Pixel floor.
  */

  for(
    let i=0;
    i<85;
    i++
  ){

    const x=
      ARENA.left+
      15+
      Math.random()*
      (
        ARENA.right-
        ARENA.left-
        30
      );

    const y=
      60+
      Math.random()*490;

    rectPixel(
      x,
      y,
      3,
      3,
      i%2
      ?"#353535"
      :"#3b3b3b"

  /*
    Information panel.

  ctx.fillStyle="#202020";

  ctx.fillRect(
    8,
    75,
    135,

  ctx.strokeStyle="#444";
  ctx.lineWidth=2;

  ctx.strokeRect(
    8,
    75,
    135,
    145
  );

  ctx.fillStyle="#ffcf4d";

  ctx.fillText(
    "NEXT UPGRADE",

  ctx.fillStyle="#fff";

  ctx.fillText(
    Math.max(
      0,
      Math.ceil(
        nextUpgrade-elapsed

  );

  ctx.fillStyle="#7ee879";

  ctx.fillText(

            nextBigBoss-elapsed
          )
        )+"s",
        17,
        207
      );

    }

  }

  /*
    Gate.
  */

  drawGate();

  /*
    Enemies.
  */

  drawEnemies();

  /*
    Big Boss.
  */

  drawBigBoss();

  /*
    Bat.
  */

  drawBatPickup();

  /*
    Bombs.
  */

  drawBombs();

  /*
    Fireballs.
  */

  drawBalls();

  /*
    Particles.
  */

  for(
    const s of particles
  ){

    ctx.globalAlpha=
      Math.min(
        1,
        s.life/22
      );

    rectPixel(
      s.x,
      s.y,
      5,
      5,
      "#ff9c29"
    );

    ctx.globalAlpha=1;

  }

  /*
    Player.
  */

  drawPlayer();

  drawPlayerShield();

  /*
    Top HUD.
  */

  ctx.font="16px monospace";

  ctx.fillStyle="#fff";

  ctx.fillText(
    "SCORE "+score,
    25,
    25
  );

  ctx.fillText(
    "HIGH "+highscore,
    145,
    25
  );

  /*
    Hearts.
  */

  for(
    let i=0;
    i<3;
    i++
  ){

    drawHeart(
      270+i*28,
      10,
      i<hearts
    );

  }

  /*
    Coins.
  */

  drawCoin(
    780,
    8
  );

  ctx.fillStyle="#fff";

  ctx.fillText(
    "COINS",
    802,
    17
  );

  ctx.fillStyle="#ffe875";

  ctx.fillText(
    String(coins),
    802,
    33
  );

  /*
    Bomb HUD.
  */

  drawSingleBomb(
    171,
    556,
    false,
    0
  );

  ctx.fillStyle="#fff";

  ctx.fillText(
    "x"+bombCount,
    187,
    562
  );

  /*
    Fireball HUD.
  */

  rectPixel(
    770,
    548,
    18,
    18,
    "#9d3c12"
  );

  rectPixel(
    775,
    544,
    8,
    25,
    "#ff9b25"
  );

  rectPixel(
    777,
    549,
    5,
    10,
    "#ffe27a"
  );

  ctx.fillStyle="#fff";

  ctx.fillText(
    fireCooldown>0
    ?(
      fireCooldown/60
    ).toFixed(1)
    :"READY",
    800,
    562
  );

  /*
    Bat HUD.
  */

  if(
    batAbility
  ){

    ctx.fillStyle="#d9d9d9";

    ctx.fillText(
      "BAT [F]",
      650,
      535
    );

    ctx.fillStyle=
      batCooldown<=0
      ?"#8ee889"
      :"#ffcf4d";

    ctx.fillText(
      batCooldown<=0
      ?"READY"
      :(
        batCooldown
      ).toFixed(1)+"s",
      650,
      558
    );

  }

  /*
    Controls.
  */

  ctx.fillStyle="#fff";

  ctx.fillText(
    "WASD move • Mouse aim • Click fire • Q bomb • P pause",
    160,
    585
  );

  /*
    Boss countdown.
  */

  if(
    bossCountdown>0
  ){

    ctx.fillStyle="#120000";
    ctx.globalAlpha=.94;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.textAlign="center";

    ctx.fillStyle="#ff4444";
    ctx.font="38px monospace";

    ctx.fillText(
      "BOSS INCOMING",
      W/2,
      190
    );

    ctx.fillStyle="#fff";
    ctx.font="100px monospace";

    ctx.fillText(
      bossCountdownValue,
      W/2,
      320
    );

    ctx.font="18px monospace";

    ctx.fillText(
      "THE GAME IS FROZEN",
      W/2,
      370
    );

    ctx.textAlign="left";

  }

  /*
    Upgrade screen.
  */

  if(
    upgradeOpen
  ){

    ctx.fillStyle="#0a130d";
    ctx.globalAlpha=.97;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.textAlign="center";

    ctx.fillStyle="#fff";
    ctx.font="32px monospace";

    ctx.fillText(
      "CHOOSE YOUR UPGRADE",
      W/2,
      120
    );

    ctx.fillStyle="#ffe875";
    ctx.font="20px monospace";

    ctx.fillText(
      "COINS: "+coins,
      W/2,
      160
    );

    ctx.fillStyle="#fff";
    ctx.font="16px monospace";

    ctx.fillText(
      "COST: "+
      upgradeCost+
      " COINS",
      W/2,
      190
    );

    const cards=[

      [
        "1",
        "HEALTH",
        "+20 MAX HP",
        90
      ],

      [
        "2",
        "DAMAGE",
        "+14 FIREBALL",
        295
      ],

      [
        "3",
        "SPEED",
        "+0.4 MOVE",
        500
      ],

      [
        "4",
        "NOTHING",
        "SKIP",
        705
      ]

    ];

    for(
      const [n,t,d,x]
      of cards
    ){

      ctx.fillStyle=
        t==="NOTHING"
        ?"#183c1d"
        :"#1e3d20";

      ctx.fillRect(
        x,
        235,
        170,
        130
      );

      ctx.strokeStyle=
        t==="NOTHING"
        ?"#8ee889"
        :"#65b95b";

      ctx.lineWidth=4;

      ctx.strokeRect(
        x,
        235,
        170,
        130
      );

      ctx.fillStyle="#bdebb5";
      ctx.font="21px monospace";

      ctx.fillText(
        n+". "+t,
        x+85,
        275
      );

      ctx.font="14px monospace";

      ctx.fillText(
        d,
        x+85,
        310
      );

      ctx.fillText(
        t==="NOTHING"
        ?"SKIP"
        :"BUY",
        x+85,
        340
      );

    }

    ctx.fillStyle="#fff";
    ctx.font="14px monospace";

    ctx.fillText(
      "The entire game is paused until you choose.",
      W/2,
      405
    );

    ctx.textAlign="left";

  }

  /*
    Victory cutscene.
  */

  if(
    victorySequence
  ){

    ctx.fillStyle="#000";

    ctx.globalAlpha=.40;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.textAlign="center";

    ctx.fillStyle="#fff";
    ctx.font="30px monospace";

    ctx.fillText(
      "BIG BOSS DEFEATED!",
      W/2,
      100
    );

    if(
      bigBoss&&
      bigBoss.type==="defeatedBoss"
    ){

      ctx.font="18px monospace";

      ctx.fillStyle="#ffcf4d";

      ctx.fillText(
        "THE BIG BOSS IS DISINTEGRATING...",
        W/2,
        140
      );

    }else if(
      bat.active
    ){

      ctx.font="20px monospace";

      ctx.fillStyle="#ffe875";

      ctx.fillText(
        "THE BIG BOSS DROPPED HIS BAT!",
        W/2,
        140
      );

      ctx.fillStyle="#fff";
      ctx.font="16px monospace";

      ctx.fillText(
        "Walk into the bat to unlock the F ability.",
        W/2,
        170
      );

    }

    ctx.textAlign="left";

  }

  /*
    Pause screen.
  */

  if(
    paused
  ){

    ctx.fillStyle="#000";
    ctx.globalAlpha=.75;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.textAlign="center";

    ctx.fillStyle="#fff";
    ctx.font="46px monospace";

    ctx.fillText(
      "PAUSED",
      W/2,
      280
    );

    ctx.font="18px monospace";

    ctx.fillText(
      "Press P or click RESUME",
      W/2,
      320
    );

    ctx.textAlign="left";

  }

  /*
    Game over.
  */

  if(
    gameOver
  ){

    ctx.fillStyle="#000";
    ctx.globalAlpha=.82;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.textAlign="center";

    ctx.fillStyle="#fff";
    ctx.font="42px monospace";

    ctx.fillText(
      "GAME OVER",
      W/2,
      260
    );

    ctx.font="18px monospace";

    ctx.fillText(
      "Score: "+
      score+
      "   High Score: "+
      highscore,
      W/2,
      300
    );

    ctx.fillText(
      "Press R to restart",
      W/2,
      340
    );

    ctx.textAlign="left";

  }

  drawLowHealthOverlay();

}

/* =========================================================
   MAIN LOOP
========================================================= */

function loop(){

  requestAnimationFrame(loop);

  /*
    Start screen.
  */

  if(
    startScreen
  ){

    draw();

    return;

  }

  /*
    Game over.
  */

  if(
    gameOver
  ){

    draw();

    return;

  }

  /*
    Manual pause.
  */

  if(
    paused
  ){

    draw();

    return;

  }

  /*
    Upgrade pause.
  */

  if(
    upgradeOpen
  ){

    draw();

    return;

  }

  /*
    Victory cutscene.
  */

  if(
    victorySequence
  ){

    updateVictory();

    updateParticles();

    /*
      Player can only move after the
      actual disintegration is finished.
    */

    if(
      bat.active
    ){

      updatePlayer();

      collectBat();

    }

    draw();

    return;

  }

  /*
    Bat cooldown.
  */

  if(
    batCooldown>0
  ){

    batCooldown-=1/60;

    if(
      batCooldown<0
    ){

      batCooldown=0;

    }

  }

  /*
    Bat swing.
  */

  if(
    batSwing>0
  ){

    batSwing-=1/60;

    if(
      batSwing<0
    ){

      batSwing=0;

    }

  }

  /*
    Fireball cooldown.
  */

  if(
    fireCooldown>0
  ){

    fireCooldown--;

  }

  /*
    Shield.
  */

  updateShield();

  /*
    Time.
  */

  elapsed+=1/60;

  /* =======================================================
     BOSS COUNTDOWN
  ======================================================= */

  if(
    !bigBoss&&
    !bossDefeated&&
    bossCountdown<=0&&
    elapsed>=nextBigBoss
  ){

    bossCountdown=3;

    bossCountdownValue=3;

  }

  if(
    bossCountdown>0
  ){

    /*
      ONLY countdown changes.
      Everything else is frozen.
    */

    bossCountdown-=1/60;

    const newValue=
      Math.ceil(
        bossCountdown
      );

    if(
      newValue!==bossCountdownValue&&
      newValue>=1
    ){

      bossCountdownValue=
        newValue;

    }

    if(
      bossCountdown<=0
    ){

      bossCountdown=0;

      spawnBigBoss();

    }

    draw();

    return;

  }

  /* =======================================================
     NORMAL GOBLIN LEVEL
  ======================================================= */

  if(
    !bossDefeated
  ){

    const newGoblinBuff=
      Math.floor(
        elapsed/27
      );

    if(
      newGoblinBuff>
      goblinBuffLevel
    ){

      goblinBuffLevel=
        newGoblinBuff;

    }

  }

  /* =======================================================
     SKELETON LEVEL
  ======================================================= */

  if(
    bossDefeated&&
    skeletonMode&&
    batAbility
  ){

    skeletonUpgradeTimer-=1/60;

    if(
      skeletonUpgradeTimer<=0
    ){

      upgradeSkeletons();

      skeletonUpgradeTimer=27;

    }

    /*
      Spawn skeleton enemies from gate.
    */

    skeletonSpawnTimer-=1/60;

    if(
      skeletonSpawnTimer<=0
    ){

      spawnSkeletonWave();

    }

  }

  /* =======================================================
     BIG BOSS
  ======================================================= */

  if(
    bigBoss
  ){

    updateBoss();

  }

  /* =======================================================
     NORMAL WORLD
  ======================================================= */

  if(
    !bossDefeated
  ){

    /*
      Bomb pickups.
    */

    if(
      !bigBoss
    ){

      bombSpawnTimer-=1/60;

      if(
        bombSpawnTimer<=0
      ){

        spawnBombPickup();

        bombSpawnTimer=20;

      }

    }

    for(
      const bp of bombPickups
    ){

      bp.life-=1/60;

    }

    bombPickups=
      bombPickups.filter(
        bp=>bp.life>0
      );

    /*
      Bomb pickup collection.
    */

    if(
      bombCount<3
    ){

      for(
        let i=
          bombPickups.length-1;
        i>=0;
        i--
      ){

        if(
          Math.hypot(
            bombPickups[i].x-p.x,
            bombPickups[i].y-p.y
          )<28
        ){

          bombCount++;

          bombPickups.splice(
            i,
            1
          );

        }

      }

    }

    /*
      Upgrades continue normally.
    */

    if(
      elapsed>=nextUpgrade
    ){

      upgradeOpen=true;

      nextUpgrade+=70;

      /*
        Freeze immediately.
      */

      draw();

      return;

    }

    /*
      Waves.
    */

    const newWave=
      Math.floor(
        elapsed/10
      )+1;

    if(
      newWave>wave
    ){

      wave=newWave;

      spawnWave(wave);

    }

    /*
      Mini boss every 50 seconds.
    */

    const bossMark=
      Math.floor(
        elapsed/50
      );

    if(
      bossMark>0&&
      !enemies.some(
        e=>
          e.type==="ogre"&&
          e.bossMark===bossMark
      )
    ){

      if(
        !window.lastBossMark
      ){

        window.lastBossMark=0;

      }

      if(
        bossMark>
        window.lastBossMark
      ){

        spawnEnemy("ogre");

        if(
          enemies.length
        ){

          enemies[
            enemies.length-1
          ].bossMark=
            bossMark;

        }

        window.lastBossMark=
          bossMark;

      }

    }

  }else{

    /*
      IMPORTANT:
      Upgrades still happen after the
      Big Boss has been defeated.
    */

    if(
      elapsed>=nextUpgrade
    ){

      upgradeOpen=true;

      nextUpgrade+=70;

      draw();

      return;

    }

  }

  /* =======================================================
     PLAYER
  ======================================================= */

  updatePlayer();

  /* =======================================================
     FIREBALLS
  ======================================================= */

  if(
    mouse.down
  ){

    shoot();

  }

  updateBalls();

  /* =======================================================
     BOMBS
  ======================================================= */

  updateBombs();

  /* =======================================================
     ENEMIES
  ======================================================= */

  updateEnemies();

  /* =======================================================
     BAT COLLECTION
  ======================================================= */

  collectBat();

  /* =======================================================
     PARTICLES
  ======================================================= */

  updateParticles();

  /* =======================================================
     HEART REGEN
  ======================================================= */

  if(
    heartRegen>0
  ){

    heartRegen-=1/60;

    if(
      heartRegen<=0
    ){

      regainHeart();

    }

  }

  draw();

}

/* =========================================================
   BOMB UPDATE
========================================================= */

function updateBombs(){

  for(
    const b of bombs
  ){

    if(
      !b.exploded
    ){

      b.x+=b.vx;
      b.y+=b.vy;

      b.distance+=
        Math.hypot(
          b.vx,
          b.vy
        );

      b.life--;

      b.rotation+=.15;

      /*
        Distance reached.
      */

      if(
        b.distance>=
        BOMB_THROW_DISTANCE
      ){

        explodeBomb(b);

      }

      /*
        Enemy collision.
      */

      if(
        !b.exploded
      ){

        const hit=
          enemies.find(
            e=>
              Math.hypot(
                b.x-e.x,
                b.y-e.y
              )<
              e.r+b.r
          );

        if(hit){

          explodeBomb(b);

        }

      }

      /*
        Arena wall.
      */

      if(
        !b.exploded&&
        (
          b.x<=ARENA.left||
          b.x>=ARENA.right||
          b.y<=ARENA.top||
          b.y>=ARENA.bottom
        )
      ){

        explodeBomb(b);

      }

    }else{

      b.disintegrate--;

    }

  }

  bombs=
    bombs.filter(
      b=>
        !b.exploded||
        b.disintegrate>0
    );

}

/* =========================================================
   INITIAL LOOP
========================================================= */

reset();

loop();

</script>
