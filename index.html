<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Too Many Green Dudes</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#252525;
  font-family:monospace;
}

canvas{
  display:block;
  margin:auto;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  cursor:crosshair;
}

button{
  font-family:monospace;
  cursor:pointer;
}

#musicNote{
  position:fixed;
  left:10px;
  top:10px;
  z-index:20;
  padding:7px 10px;
  color:#d7d0b0;
  background:#171717;
  border:2px solid #514b3a;
  font:12px monospace;
}

#fullscreenBtn,
#pauseBtn{
  position:fixed;
  top:10px;
  z-index:20;
  padding:8px 12px;
  color:#fff;
  font-size:14px;
}

#fullscreenBtn{
  right:10px;
  background:#1e3d20;
  border:2px solid #65b95b;
}

#fullscreenBtn:hover{
  background:#2c5a2f;
}

#pauseBtn{
  right:145px;
  background:#3d301e;
  border:2px solid #d6b85a;
}

#pauseBtn:hover{
  background:#594728;
}
</style>
</head>

<body>

<button id="pauseBtn">PAUSE</button>
<button id="fullscreenBtn">FULLSCREEN</button>
<div id="musicNote">DUNGEON MUSIC: LOUD</div>

<canvas id="game" width="900" height="600"></canvas>

<script>

const c=document.getElementById("game");
const ctx=c.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=900;
const H=600;

const ARENA={
  left:160,
  top:45,
  right:875,
  bottom:570
};

const GATE={
  x:845,
  y:260,
  w:30,
  h:120
};

let keys={};

let mouse={
  x:450,
  y:300,
  down:false
};

let p;
let enemies=[];
let balls=[];
let particles=[];

let score=0;
let coins=0;
let wave=1;
let elapsed=0;

let gameOver=false;
let paused=false;
let upgradeOpen=false;

let startScreen=true;

let nextUpgrade=70;
let upgradeCost=10;

let upgradeCounts={
  health:0,
  damage:0,
  speed:0
};

let currentRandomUpgrade="damage";

let healthUpgradesSinceHeart=0;
let healthUpgradesNeededForHeart=1;

let goblinHits=0;
let ogreHits=0;

let hearts=3;
let heartRegen=0;

let shieldTimer=0;
let speedBoostTimer=0;

const SHIELD_DURATION=3;
const SHIELD_SPEED_MULTIPLIER=2;

let fireCooldown=0;

let bombCount=0;
let bombPickups=[];
let bombs=[];

let bombSpawnTimer=20;

const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=22;

let bigBoss=null;

let nextBigBoss=200;

let bossCountdown=0;
let bossCountdownValue=0;

let goblinBuffLevel=0;

const GOBLIN_HP_LEVEL_BONUS=.08;
const GOBLIN_SPEED_LEVEL_BONUS=.035;
const GOBLIN_DAMAGE_LEVEL_BONUS=.20;

let bossDefeated=false;

let victorySequence=false;
let victoryTimer=0;

let batDropped=false;

let bat={
  x:0,
  y:0,
  active:false,
  collected:false,
  pulse:0
};

let batAbility=false;

let batCooldown=0;

const BAT_COOLDOWN=17;

let batSwing=0;

let skeletonMode=false;

let skeletonLevel=0;

let skeletonUpgradeTimer=27;

let skeletonSpawnTimer=12;

const SKELETON_SPAWN_TIME=12;

let highscore=Number(
  localStorage.getItem(
    "pixelNatureHighscore"
  )||0
);

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

const SOUND_VOLUME=2;

function startMusic(){

  if(musicStarted)return;

  try{

    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );

  }catch(err){

    console.log(
      "Music unavailable:",
      err
    );

  }

}

function tone(
  freq,
  duration,
  type="square",
  volume=.08
){

  if(!audioCtx)return;

  const now=
    audioCtx.currentTime;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type=type;

  osc.frequency.value=freq;

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume*SOUND_VOLUME,
    now+.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);

  osc.stop(
    now+duration+.02
  );

}

function playFireballSound(){

  tone(
    240,
    .10,
    "square",
    .07
  );

}

function playBombExplosionSound(){

  tone(
    80,
    .30,
    "square",
    .20
  );

  setTimeout(
    ()=>tone(
      800,
      .12,
      "square",
      .10
    ),
    20
  );

}

function playBossSound(){

  tone(
    65,
    .65,
    "square",
    .25
  );

}

function playBatSound(){

  tone(
    170,
    .12,
    "square",
    .15
  );

  setTimeout(
    ()=>tone(
      75,
      .25,
      "sawtooth",
      .20
    ),
    50
  );

}

function playPickupSound(){

  tone(
    500,
    .08,
    "square",
    .10
  );

  setTimeout(
    ()=>tone(
      750,
      .12,
      "square",
      .10
    ),
    70
  );

}

function playMusicStep(){

  if(
    !audioCtx||
    gameOver||
    paused||
    startScreen
  ){
    return;
  }

  const melody=[
    110,110,130.81,146.83,
    110,98,110,82.41,
    110,130.81,146.83,164.81,
    146.83,130.81,110,98
  ];

  const bass=[
    55,55,65.41,55,
    49,49,55,41.20
  ];

  const now=audioCtx.currentTime;
  const step=musicStep;

  tone(
    melody[step%melody.length],
    .26,
    "triangle",
    .13
  );

  tone(
    bass[step%bass.length],
    .28,
    "sine",
    .16
  );

  if(step%2===0){
    tone(
      melody[(step+5)%melody.length]/2,
      .22,
      "sawtooth",
      .045
    );
  }

  if(step%4===0){
    tone(
      41.20,
      .18,
      "sine",
      .13
    );
  }

  if(step%8===7){
    tone(
      melody[(step+3)%melody.length]*2,
      .10,
      "square",
      .025
    );
  }

  musicStep++;
}

const fullscreenBtn=
  document.getElementById(
    "fullscreenBtn"
  );

fullscreenBtn.addEventListener(
  "click",
  async()=>{

    try{

      if(
        !document.fullscreenElement
      ){

        await document.documentElement.requestFullscreen();

        fullscreenBtn.textContent=
          "EXIT FULLSCREEN";

      }else{

        await document.exitFullscreen();

        fullscreenBtn.textContent=
          "FULLSCREEN";

      }

    }catch(err){

      console.log(
        "Fullscreen unavailable:",
        err
      );

    }

  }
);

document.addEventListener(
  "fullscreenchange",
  ()=>{

    fullscreenBtn.textContent=
      document.fullscreenElement
      ?"EXIT FULLSCREEN"
      :"FULLSCREEN";

  }
);

const pauseBtn=
  document.getElementById(
    "pauseBtn"
  );

function togglePause(){

  if(
    gameOver||
    startScreen||
    victorySequence||
    upgradeOpen||
    bossCountdown>0
  ){

    return;

  }

  paused=!paused;

  pauseBtn.textContent=
    paused
    ?"RESUME"
    :"PAUSE";

}

pauseBtn.addEventListener(
  "click",
  togglePause
);

window.addEventListener(
  "keydown",
  e=>{

    startMusic();

    const k=
      e.key.toLowerCase();

    keys[k]=true;

    if(
      startScreen&&
      (
        k==="enter"||
        k===" "
      )
    ){

      startGame();

      return;

    }

    if(
      k==="p"&&
      !e.repeat
    ){

      togglePause();

    }

    if(
      k==="r"&&
      gameOver
    ){

      reset();

      return;

    }

    if(
      k==="q"&&
      !e.repeat
    ){

      throwBomb();

    }

    if(
      k==="f"&&
      !e.repeat
    ){

      useBatAbility();

    }

    if(
      upgradeOpen
    ){

      if(e.key==="1")
        buyUpgrade(currentRandomUpgrade);

      if(e.key==="2")
        buyUpgrade("nothing");

    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    keys[
      e.key.toLowerCase()
    ]=false;

  }
);

c.addEventListener(
  "mousemove",
  e=>{

    const r=
      c.getBoundingClientRect();

    mouse.x=
      (e.clientX-r.left)*
      W/r.width;

    mouse.y=
      (e.clientY-r.top)*
      H/r.height;

  }
);

c.addEventListener(
  "mousedown",
  ()=>{

    startMusic();

    if(startScreen){

      startGame();

      return;

    }

    mouse.down=true;

  }
);

window.addEventListener(
  "mouseup",
  ()=>{

    mouse.down=false;

  }
);

function startGame(){

  if(!startScreen)return;

  startScreen=false;

  reset();

  startMusic();

}

function reset(){

  p={

    x:430,
    y:305,

    speed:3.2,

    damage:34,

    maxHp:100,
    hp:100,

    shieldTimer:0,
    speedBoostTimer:0

  };

  enemies=[];
  balls=[];
  particles=[];

  score=0;
  coins=0;

  wave=1;
  elapsed=0;

  gameOver=false;
  paused=false;
  upgradeOpen=false;

  nextUpgrade=70;
  upgradeCost=10;

  upgradeCounts={
    health:0,
    damage:0,
    speed:0
  };

  currentRandomUpgrade="damage";

  healthUpgradesSinceHeart=0;
  healthUpgradesNeededForHeart=1;

  goblinHits=0;
  ogreHits=0;

  hearts=3;
  heartRegen=0;

  fireCooldown=0;

  bombCount=0;
  bombPickups=[];
  bombs=[];

  bombSpawnTimer=20;

  bigBoss=null;

  nextBigBoss=200;

  bossCountdown=0;
  bossCountdownValue=0;

  goblinBuffLevel=0;

  bossDefeated=false;

  victorySequence=false;
  victoryTimer=0;

  batDropped=false;

  bat={
    x:0,
    y:0,
    active:false,
    collected:false,
    pulse:0
  };

  batAbility=false;

  batCooldown=0;
  batSwing=0;

  skeletonMode=false;
  skeletonLevel=0;

  skeletonUpgradeTimer=27;
  skeletonSpawnTimer=12;

  window.lastBossMark=0;

}

function gateSpawnPosition(){

  return{

    x:GATE.x-8,

    y:
      GATE.y+
      GATE.h/2+
      (Math.random()-.5)*60

  };

}

function spawnEnemy(
  type="goblin"
){

  if(
    bossDefeated||
    bigBoss||
    bossCountdown>0
  ){

    return;

  }

  const pos=
    gateSpawnPosition();

  const x=pos.x;
  const y=pos.y;

  if(
    type==="ogre"
  ){

    const hp=
      260+
      Math.floor(
        elapsed/50
      )*20;

    enemies.push({

      type:"ogre",

      x,
      y,

      r:30,

      hp,
      maxHp:hp,

      speed:
        .42+
        Math.min(
          .18,
          elapsed/2000
        ),

      damage:3,

      attack:0,

      burn:0,
      burnTick:0,

      bossMark:0

    });

    return;

  }

  const level=
    goblinBuffLevel;

  const hp=
    Math.round(
      (45+wave*6)*
      (
        1+
        level*
        GOBLIN_HP_LEVEL_BONUS
      )
    );

  const damage=
    1+
    level*
    GOBLIN_DAMAGE_LEVEL_BONUS;

  const speed=
    .72+
    wave*.018+
    level*
    GOBLIN_SPEED_LEVEL_BONUS;

  enemies.push({

    type:"goblin",

    x,
    y,

    r:14,

    hp,
    maxHp:hp,

    speed,
    damage,

    attack:0,

    burn:0,
    burnTick:0,

    bossMark:0

  });

}

function spawnWave(n){

  if(
    bossDefeated||
    bigBoss||
    bossCountdown>0
  ){

    return;

  }

  for(
    let i=0;
    i<n;
    i++
  ){

    spawnEnemy(
      "goblin"
    );

  }

}

function spawnBigBoss(){

  if(
    bigBoss||
    bossDefeated
  ){

    return;

  }

  const pos=
    gateSpawnPosition();

  bigBoss={

    type:"bigboss",

    x:pos.x+5,
    y:pos.y,

    r:48,

    hp:2400,
    maxHp:2400,

    speed:3.1,

    attack:0,

    burn:0,
    burnTick:0,

    rotation:0,

    spawnFlash:35

  };

  enemies=[];
  balls=[];
  bombPickups=[];

  playBossSound();

}

function defeatBigBoss(){

  if(
    !bigBoss||
    bigBoss.type!=="bigboss"||
    victorySequence
  ){

    return;

  }

  score+=50;
  coins+=50;

  const bx=
    bigBoss.x;

  const by=
    bigBoss.y;

  bossDefeated=true;
  skeletonMode=false;

  enemies=[];
  balls=[];
  bombPickups=[];
  bombs=[];

  bigBoss={

    type:"defeatedBoss",

    x:bx,
    y:by,

    r:48,

    hp:0,
    maxHp:2400,

    animation:4,
    maxAnimation:4,

    rotation:0

  };

  victorySequence=true;
  victoryTimer=4;

  batDropped=false;

  bat.active=false;
  bat.collected=false;

  playBossSound();

}

function createSkeletonGoblin(){

  const pos=
    gateSpawnPosition();

  const hp=
    105+
    skeletonLevel*15;

  return{

    type:"skeletonGoblin",

    x:pos.x,
    y:pos.y,

    r:15,

    hp,
    maxHp:hp,

    speed:
      .95+
      skeletonLevel*.045,

    damage:
      1.8+
      skeletonLevel*.10,

    attack:0,

    burn:0,
    burnTick:0

  };

}

function createSkeletonOgre(){

  const pos=
    gateSpawnPosition();

  const hp=
    460+
    skeletonLevel*35;

  return{

    type:"skeletonOgre",

    x:pos.x,
    y:pos.y,

    r:31,

    hp,
    maxHp:hp,

    speed:
      .62+
      skeletonLevel*.025,

    damage:
      3.5+
      skeletonLevel*.15,

    attack:0,

    burn:0,
    burnTick:0

  };

}

function spawnSkeletonWave(){

  if(
    !bossDefeated||
    !batAbility||
    victorySequence||
    upgradeOpen||
    paused||
    gameOver
  ){

    return;

  }

  const count=
    3+
    Math.min(
      3,
      Math.floor(
        skeletonLevel/2
      )
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    enemies.push(
      createSkeletonGoblin()
    );

  }

  if(
    skeletonLevel%2===0||
    Math.random()<.35
  ){

    enemies.push(
      createSkeletonOgre()
    );

  }

  skeletonSpawnTimer=
    SKELETON_SPAWN_TIME;

}

function upgradeSkeletons(){

  skeletonLevel++;

  for(
    const e of enemies
  ){

    e.maxHp=
      Math.round(
        e.maxHp*1.10
      );

    e.hp=e.maxHp;

    e.speed*=1.04;

    e.damage*=1.08;

  }

}

function updateVictory(){

  if(
    !victorySequence
  ){

    return;

  }

  victoryTimer-=1/60;

  if(
    bigBoss&&
    bigBoss.type==="defeatedBoss"
  ){

    bigBoss.animation=
      Math.max(
        0,
        victoryTimer
      );

    if(
      Math.random()<.65
    ){

      particles.push({

        x:
          bigBoss.x+
          (Math.random()-.5)*90,

        y:
          bigBoss.y+
          (Math.random()-.5)*100,

        vx:
          (Math.random()-.5)*3,

        vy:
          -Math.random()*3,

        life:
          20+
          Math.random()*30

      });

    }

    if(
      victoryTimer<=0
    ){

      bigBoss=null;

      dropBat();

    }

  }

}

function dropBat(){

  if(
    batDropped
  ){

    return;

  }

  batDropped=true;

  bat.x=
    W/2;

  bat.y=
    H/2+55;

  bat.active=true;

  bat.collected=false;

  bat.pulse=0;

}

function collectBat(){

  if(
    !bat.active||
    bat.collected||
    gameOver
  ){

    return;

  }

  const d=
    Math.hypot(
      p.x-bat.x,
      p.y-bat.y
    );

  if(
    d<35
  ){

    bat.collected=true;

    bat.active=false;

    batAbility=true;

    victorySequence=false;

    skeletonMode=true;

    skeletonLevel=0;

    skeletonSpawnTimer=1;

    playPickupSound();

  }

}

function useBatAbility(){

  if(
    !batAbility||
    batCooldown>0||
    gameOver||
    paused||
    upgradeOpen||
    victorySequence||
    bossCountdown>0||
    startScreen
  ){

    return;

  }

  batCooldown=
    BAT_COOLDOWN;

  batSwing=.55;

  playBatSound();

  for(
    const e of enemies
  ){

    burst(
      e.x,
      e.y,
      28
    );

    e.hp=0;

  }

  enemies=[];

}

function damagePlayer(e){

  e.attack=45;

  if(
    p.shieldTimer>0
  ){

    return;

  }

  if(
    e.type==="goblin"||
    e.type==="skeletonGoblin"
  ){

    goblinHits+=
      e.damage||1;

    if(
      goblinHits>=4
    ){

      goblinHits=0;

      loseHeart();

    }

  }else{

    ogreHits++;

    if(
      ogreHits>=2
    ){

      ogreHits=0;

      loseHeart();

    }

  }

}

function loseHeart(){

  if(
    hearts<=0
  ){

    return;

  }

  hearts--;

  heartRegen=30;

  p.shieldTimer=
    SHIELD_DURATION;

  p.speedBoostTimer=
    SHIELD_DURATION;

  goblinHits=0;
  ogreHits=0;

  if(
    hearts<=0
  ){

    endGame();

  }

}

function regainHeart(){

  if(
    hearts<3
  ){

    hearts++;

    heartRegen=0;

  }

}

function endGame(){

  gameOver=true;

  if(
    score>highscore
  ){

    highscore=score;

    localStorage.setItem(
      "pixelNatureHighscore",
      highscore
    );

  }

}

function openUpgradeMenu(){

  const choices=[
    "health",
    "damage",
    "speed"
  ];

  currentRandomUpgrade=
    choices[
      Math.floor(
        Math.random()*choices.length
      )
    ];

  upgradeOpen=true;

}

function buyUpgrade(kind){

  if(
    !upgradeOpen
  ){

    return;

  }

  if(
    kind==="nothing"
  ){

    upgradeOpen=false;

    return;

  }

  if(
    coins<upgradeCost
  ){

    return;

  }

  coins-=upgradeCost;

  if(
    kind==="health"
  ){

    p.maxHp+=20;

    p.hp=
      Math.min(
        p.maxHp,
        p.hp+20
      );

    healthUpgradesSinceHeart++;

    if(
      healthUpgradesSinceHeart>=
      healthUpgradesNeededForHeart
    ){

      if(hearts<3){
        hearts++;
      }

      healthUpgradesSinceHeart=0;

      healthUpgradesNeededForHeart++;

    }

  }

  if(
    kind==="damage"
  ){

    p.damage+=14;

  }

  if(
    kind==="speed"
  ){

    p.speed+=.4;

  }

  upgradeCounts[kind]++;

  upgradeCost+=10;

  upgradeOpen=false;

}

function spawnBombPickup(){

  if(
    bossDefeated||
    bigBoss||
    bossCountdown>0
  ){

    return;

  }

  const x=
    ARENA.left+
    50+
    Math.random()*
    (
      ARENA.right-
      ARENA.left-
      100
    );

  const y=
    90+
    Math.random()*430;

  bombPickups.push({

    x,
    y,

    life:7

  });

}

function throwBomb(){

  if(
    gameOver||
    upgradeOpen||
    paused||
    victorySequence||
    bossCountdown>0||
    startScreen||
    bombCount<=0
  ){

    return;

  }

  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );

  bombCount--;

  bombs.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*7,

    vy:
      Math.sin(a)*7,

    life:120,

    r:9,

    distance:0,

    exploded:false,

    disintegrate:0,

    rotation:0

  });

}

function explodeBomb(b){

  if(
    b.exploded
  ){

    return;

  }

  b.exploded=true;

  b.disintegrate=
    BOMB_DISINTEGRATE_TIME;

  b.vx=0;
  b.vy=0;

  playBombExplosionSound();

  burst(
    b.x,
    b.y,
    50
  );

  if(
    bigBoss&&
    bigBoss.type==="bigboss"
  ){

    const d=
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      );

    if(
      d<145
    ){

      bigBoss.hp-=
        bigBoss.maxHp*.20;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

    }

  }

  for(
    const e of enemies
  ){

    const d=
      Math.hypot(
        b.x-e.x,
        b.y-e.y
      );

    if(
      d<125
    ){

      e.hp-=
        (
          e.type==="ogre"||
          e.type==="skeletonOgre"
        )
        ?e.maxHp*.50
        :e.maxHp*.75;

      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

    }

  }

}

function shoot(){

  if(
    fireCooldown>0||
    upgradeOpen||
    gameOver||
    paused||
    victorySequence||
    bossCountdown>0||
    startScreen
  ){

    return;

  }

  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );

  balls.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*8,

    vy:
      Math.sin(a)*8,

    r:7,

    life:90

  });

  fireCooldown=60;

  playFireballSound();

}

function fireballSplash(
  x,
  y,
  directEnemy
){

  const splashRadius=82;

  for(
    const e of enemies
  ){

    if(
      e===directEnemy
    ){

      continue;

    }

    const d=
      Math.hypot(
        x-e.x,
        y-e.y
      );

    if(
      d<splashRadius
    ){

      const falloff=
        1-
        d/splashRadius;

      const damage=
        Math.max(
          6,
          p.damage*
          .55*
          falloff
        );

      e.hp-=damage;

      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

      burst(
        e.x,
        e.y,
        5
      );

    }

  }

}

function updateBalls(){

  for(
    const b of balls
  ){

    b.x+=b.vx;
    b.y+=b.vy;

    b.life--;

    if(
      b.life<=0
    ){

      continue;

    }

    if(
      bigBoss&&
      bigBoss.type==="bigboss"&&
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      )<
      bigBoss.r+b.r
    ){

      bigBoss.hp-=p.damage;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

      bigBoss.burnTick=0;

      fireballSplash(
        b.x,
        b.y,
        null
      );

      b.life=0;

      continue;

    }

    let hit=null;

    for(
      const e of enemies
    ){

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )<
        e.r+b.r
      ){

        hit=e;

        break;

      }

    }

    if(hit){

      hit.hp-=p.damage;

      hit.burn=
        Math.max(
          hit.burn,
          42
        );

      hit.burnTick=0;

      burst(
        b.x,
        b.y,
        12
      );

      fireballSplash(
        b.x,
        b.y,
        hit
      );

      b.life=0;

    }

  }

  balls=
    balls.filter(
      b=>
        b.life>0&&
        b.x>ARENA.left&&
        b.x<ARENA.right&&
        b.y>ARENA.top&&
        b.y<ARENA.bottom
    );

}

function updateEnemies(){

  for(
    const e of enemies
  ){

    const dx=
      p.x-e.x;

    const dy=
      p.y-e.y;

    const d=
      Math.hypot(
        dx,
        dy
      )||1;

    e.x+=
      dx/d*
      e.speed;

    e.y+=
      dy/d*
      e.speed;

    if(
      e.attack>0
    ){

      e.attack--;

    }

    if(
      d<
      e.r+14&&
      e.attack<=0
    ){

      damagePlayer(e);

    }

    if(
      e.burn>0
    ){

      e.burn--;

      e.burnTick++;

      if(
        e.burnTick%7===0
      ){

        e.hp-=
          (
            e.type==="skeletonOgre"||
            e.type==="skeletonGoblin"
          )
          ?2.5
          :2;

      }

    }

  }

  const dead=
    enemies.filter(
      e=>e.hp<=0
    );

  for(
    const e of dead
  ){

    let reward=1;

    if(
      e.type==="ogre"
    ){

      reward=7;

    }

    if(
      e.type==="skeletonGoblin"
    ){

      reward=2;

    }

    if(
      e.type==="skeletonOgre"
    ){

      reward=10;

    }

    coins+=reward;

    score+=reward;

    burst(
      e.x,
      e.y,
      20
    );

  }

  enemies=
    enemies.filter(
      e=>e.hp>0
    );

}

function updateBoss(){

  if(
    !bigBoss||
    bigBoss.type!=="bigboss"
  ){

    return;

  }

  const dx=
    p.x-bigBoss.x;

  const dy=
    p.y-bigBoss.y;

  const d=
    Math.hypot(
      dx,
      dy
    )||1;

  bigBoss.x+=
    dx/d*
    bigBoss.speed;

  bigBoss.y+=
    dy/d*
    bigBoss.speed;

  if(
    bigBoss.attack>0
  ){

    bigBoss.attack--;

  }

  if(
    d<
    bigBoss.r+16&&
    bigBoss.attack<=0
  ){

    bigBoss.attack=35;

    loseHeart();

  }

  if(
    bigBoss.burn>0
  ){

    bigBoss.burn--;

    bigBoss.burnTick++;

    if(
      bigBoss.burnTick%7===0
    ){

      bigBoss.hp-=3;

    }

  }

  if(
    bigBoss.hp<=0
  ){

    defeatBigBoss();

  }

}

function updateShield(){

  if(
    p.shieldTimer>0
  ){

    p.shieldTimer-=1/60;

    p.speedBoostTimer-=1/60;

    if(
      p.shieldTimer<=0
    ){

      p.shieldTimer=0;
      p.speedBoostTimer=0;

    }

  }

}

function updatePlayer(){

  if(
    upgradeOpen||
    gameOver||
    startScreen||
    (
      victorySequence&&
      victoryTimer>0
    )
  ){

    return;

  }

  let dx=
    (
      keys.d||
      keys.arrowright
      ?1
      :0
    )-
    (
      keys.a||
      keys.arrowleft
      ?1
      :0
    );

  let dy=
    (
      keys.s||
      keys.arrowdown
      ?1
      :0
    )-
    (
      keys.w||
      keys.arrowup
      ?1
      :0
    );

  const m=
    Math.hypot(
      dx,
      dy
    )||1;

  let speed=
    p.speed;

  if(
    p.speedBoostTimer>0
  ){

    speed*=
      SHIELD_SPEED_MULTIPLIER;

  }

  p.x+=
    dx/m*
    speed;

  p.y+=
    dy/m*
    speed;

  p.x=
    Math.max(
      ARENA.left+15,
      Math.min(
        ARENA.right-20,
        p.x
      )
    );

  p.y=
    Math.max(
      ARENA.top+20,
      Math.min(
        ARENA.bottom-30,
        p.y
      )
    );

}

function burst(
  x,
  y,
  n=8
){

  for(
    let i=0;
    i<n;
    i++
  ){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*5,

      vy:
        (Math.random()-.5)*5,

      life:
        22+
        Math.random()*18

    });

  }

}

function updateParticles(){

  for(
    const s of particles
  ){

    s.x+=s.vx;
    s.y+=s.vy;

    s.life--;

  }

  particles=
    particles.filter(
      s=>s.life>0
    );

}
