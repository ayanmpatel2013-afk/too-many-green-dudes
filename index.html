/* =========================
   AUDIO
========================= */

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

function startMusic(){
  if(musicStarted)return;

  try{
    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );
  }catch(err){}
}

function tone(freq,duration,type="square",volume=.08){
  if(!audioCtx)return;

  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(
    volume,
    now+.02
  );
  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+duration+.02);
}

function playFireballSound(){
  tone(240,.10,"square",.12);
}

function playBombExplosionSound(){
  tone(70,.28,"square",.25);
  setTimeout(
    ()=>tone(900,.12,"square",.10),
    10
  );
}

function playBossSound(){
  tone(80,.7,"square",.25);
}

function playBatSound(){
  tone(150,.18,"square",.18);
  setTimeout(
    ()=>tone(65,.25,"square",.14),
    40
  );
}

function playPickupSound(){
  tone(500,.12,"square",.12);
  setTimeout(
    ()=>tone(800,.12,"square",.10),
    80
  );
}

function playMusicStep(){
  if(!audioCtx||gameOver||paused)return;

  const notes=[
    110,130.81,146.83,164.81,
    196,164.81,146.83,130.81,
    110,146.83,164.81,196,
    220,196,164.81,146.83
  ];

  tone(
    notes[musicStep%notes.length],
    .25,
    "triangle",
    .055
  );

  musicStep++;
}

document.getElementById(

window.addEventListener("keydown",e=>{

/* =========================
   SPAWNING
========================= */

function gateSpawnPosition(){
  return{
    x:GATE.x-4,
    y:
      GATE.y+
      GATE.h/2+
      (Math.random()-.5)*45
  };
}

function spawnEnemy(type="goblin"){

  if(bossDefeated)return;
  if(bigBoss||bossCountdown>0)return;

  const pos=gateSpawnPosition();

  const x=pos.x;
  const y=pos.y;

  if(type==="ogre"){

    const hp=
      260+

    enemies.push({
      type:"ogre",
      x,y,
      r:30,

      burnTick:0,

    });

  }else{

    const buff=goblinBuffLevel;

    const hp=Math.round(
      (45+wave*8)*

    );

    enemies.push({
      type:"goblin",
      x,y,
      r:14,
      hp,
      maxHp:hp,
      speed:

        buff*.10,
      damage:1+buff,
      attack:0,
      burn:0,
      burnTick:0,
      bossMark:0
    });
  }
}

function spawnWave(n){

  if(
    bigBoss||
    bossCountdown>0||
    bossDefeated
  )return;

  for(let i=0;i<n;i++){
    spawnEnemy("goblin");
  }
}

/* =========================
   BIG BOSS
========================= */

function spawnBigBoss(){

  if(bigBoss||bossDefeated)return;

  const pos=gateSpawnPosition();

  bigBoss={
    type:"bigboss",

    x:pos.x+5,
    y:pos.y,

    r:48,

    /* FIXED */
    hp:2400,
    maxHp:2400,

    /* FIXED BOSS SPEED */
    speed:3.1,

    attack:0,
    burn:0,
    burnTick:0
  };

  enemies=[];

  playBossSound();
}

function defeatBigBoss(){

  if(!bigBoss||victorySequence)return;

  const bx=bigBoss.x;
  const by=bigBoss.y;

  score+=50;
  coins+=50;

  /* Stop all normal spawning */
  bossDefeated=true;
  skeletonMode=true;

  /* Convert enemies already alive */
  convertEnemiesToSkeletons();

  /* Clear projectiles and pickups */
  balls=[];
  bombs=[];
  bombPickups=[];

  /* Start victory sequence */
  victorySequence=true;
  victoryTimer=4;

  batDropped=false;

  /* Leave boss object visible for the
     disintegration animation */
  bigBoss.disintegrating=true;
  bigBoss.disintegrateTimer=2.5;
  bigBoss.x=bx;
  bigBoss.y=by;

  playBossSound();
}

/* =========================
   SKELETONS
========================= */

function convertEnemiesToSkeletons(){

  for(const e of enemies){

    e.type=
      e.type==="ogre"
      ?"skeletonOgre"
      :"skeletonGoblin";

    e.maxHp=
      Math.round(e.maxHp*1.45);

    e.hp=e.maxHp;
    e.speed*=1.25;

    if(e.type==="skeletonGoblin"){

      e.damage=
        (e.damage||2)*1.5;

      e.r=15;

    }else{

      e.damage=4;
      e.r=31;
    }
  }

  skeletonLevel=0;
  skeletonUpgradeTimer=27;
}

function upgradeSkeletons(){

  skeletonLevel++;

  for(const e of enemies){

    e.maxHp=
      Math.round(e.maxHp*1.25);

    e.hp=e.maxHp;

    e.speed*=1.10;

    if(e.type==="skeletonGoblin"){
      e.damage*=1.18;
    }

    if(e.type==="skeletonOgre"){
      e.damage*=1.20;
    }
  }
}

/* =========================
   BAT
========================= */

function dropBat(){

  if(batDropped)return;

  batDropped=true;

  bat.x=
    bigBoss
    ?bigBoss.x
    :W/2;

  bat.y=
    bigBoss
    ?bigBoss.y+35
    :H/2+40;

  bat.active=true;
  bat.collected=false;
  bat.pulse=0;
}

function collectBat(){

  if(
    !bat.active||
    bat.collected||
    gameOver
  )return;

  const d=Math.hypot(
    p.x-bat.x,
    p.y-bat.y
  );

  if(d<32){

    bat.collected=true;
    bat.active=false;
    batAbility=true;

    playPickupSound();
  }
}

function useBatAbility(){

  if(
    !batAbility||
    batCooldown>0||
    gameOver||
    paused||
    victorySequence||
    upgradeOpen
  )return;

  batCooldown=BAT_COOLDOWN;
  batSwing=.5;

  playBatSound();

  for(const e of enemies){

    burst(
      e.x,
      e.y,
      18
    );

    e.hp=0;
  }

  enemies=[];
}

/* =========================
   HEART / DAMAGE
========================= */

function damagePlayer(e){

  e.attack=45;

  if(shieldTimer>0){
    return;
  }

  if(
    e.type==="goblin"||
    e.type==="skeletonGoblin"
  ){

    goblinHits+=e.damage||1;

    if(goblinHits>=4){

      goblinHits=0;
      loseHeart();
    }

  }else{

    ogreHits++;

    if(ogreHits>=2){

      ogreHits=0;
      loseHeart();
    }
  }
}

function loseHeart(){

  if(hearts<=0)return;

  hearts--;

  heartRegen=30;

  /* 3 second shield + 2x speed */
  shieldTimer=SHIELD_DURATION;

  if(hearts<=0){
    endGame();
  }
}

function regainHeart(){

  if(hearts<3){
    hearts++;
    heartRegen=0;
  }
}

function endGame(){

  gameOver=true;

  if(score>highscore){

    highscore=score;

    localStorage.setItem(
      "pixelNatureHighscore",
      highscore
    );
  }
}

/* =========================
   UPGRADES
========================= */

function buyUpgrade(kind){

  if(kind==="nothing"){
    upgradeOpen=false;
    return;
  }

  if(
    !upgradeOpen||
    coins<upgradeCost
  )return;

  coins-=upgradeCost;

  if(kind==="health"){
    p.maxHp+=20;
    p.hp=Math.min(
      p.maxHp,
      p.hp+20
    );
  }

  if(kind==="damage"){
    p.damage+=12;
  }

  if(kind==="speed"){
    p.speed+=.4;
  }

  upgradeCounts[kind]++;
  upgradeCost+=10;

  upgradeOpen=false;
}

/* =========================
   FIREBALLS
========================= */

function shoot(){

  if(
    fireCooldown>0||
    upgradeOpen||
    gameOver||
    paused||
    victorySequence
  )return;

  const a=Math.atan2(
    mouse.y-p.y,
    mouse.x-p.x
  );

  balls.push({
    x:p.x,
    y:p.y,
    vx:Math.cos(a)*8,
    vy:Math.sin(a)*8,
    r:7,
    life:90
  });

  fireCooldown=60;

  playFireballSound();
}

/* =========================
   BOMBS
========================= */

const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=22;

function spawnBombPickup(){

  if(
    bigBoss||
    bossCountdown>0||
    bossDefeated
  )return;

  bombPickups.push({
    x:
      ARENA.left+50+
      Math.random()*
      (ARENA.right-
       ARENA.left-100),

    y:
      90+
      Math.random()*430,

    life:7
  });
}

function throwBomb(){

  if(
    gameOver||
    upgradeOpen||
    paused||
    victorySequence||
    bombCount<=0
  )return;

  const a=Math.atan2(
    mouse.y-p.y,
    mouse.x-p.x
  );

  bombCount--;

  bombs.push({
    x:p.x,
    y:p.y,
    vx:Math.cos(a)*7,
    vy:Math.sin(a)*7,
    r:9,
    life:120,
    distance:0,
    exploded:false,
    disintegrate:0
  });
}

function explodeBomb(b){

  if(b.exploded)return;

  b.exploded=true;
  b.disintegrate=
    BOMB_DISINTEGRATE_TIME;

  b.vx=0;
  b.vy=0;

  playBombExplosionSound();

  burst(
    b.x,
    b.y,
    42
  );

  if(bigBoss&&!bigBoss.disintegrating){

    const d=Math.hypot(
      b.x-bigBoss.x,
      b.y-bigBoss.y
    );

    if(d<145){

      bigBoss.hp-=
        bigBoss.maxHp*.20;
    }
  }

  for(const e of enemies){

    const d=Math.hypot(
      b.x-e.x,
      b.y-e.y
    );

    if(d<115){

      e.hp-=
        e.type==="ogre"||
        e.type==="skeletonOgre"
        ?e.maxHp*.5
        :e.maxHp*.75;
    }
  }
}

/* =========================
   PARTICLES
========================= */

function burst(x,y,n=8){

  for(let i=0;i<n;i++){

    particles.push({
      x,y,
      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.5)*5,
      life:22+
        Math.random()*20
    });
  }
}

function updateParticles(){

  for(const s of particles){

    s.x+=s.vx;
    s.y+=s.vy;
    s.life--;
  }

  particles=
    particles.filter(
      s=>s.life>0
    );
}

/* =========================
   DRAW HELPERS
========================= */

function rectPixel(
  x,y,w,h,color
){

  ctx.fillStyle=color;

  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,h
  );
}

function drawHeart(x,y,full){

  const color=
    full
    ?"#e83e3e"
    :"#3a3a3a";

  rectPixel(x+4,y,10,4,color);
  rectPixel(x,y+4,18,10,color);
  rectPixel(x+4,y+14,10,4,color);
  rectPixel(x+8,y+18,2,2,color);
}

function drawCoin(x,y){

  rectPixel(
    x,y,16,16,
    "#f3c62e"
  );

  rectPixel(
    x+4,y+2,8,12,
    "#ffe875"
  );

  rectPixel(
    x+2,y+3,2,10,
    "#b77b16"
  );

  rectPixel(
    x+12,y+3,2,10,
    "#b77b16"
  );
}

/* =========================
   GATE
========================= */

function drawGate(){

  rectPixel(
    GATE.x-10,
    GATE.y-10,
    GATE.w+20,
    GATE.h+20,
    "#111"
  );

  rectPixel(

  );

  rectPixel(

    GATE.y,
    GATE.w,

  );

    rectPixel(

      GATE.y+3,

/* =========================
   BIG BOSS DRAW
========================= */

function drawBigBoss(){

  if(!bigBoss)return;

  const e=bigBoss;

  const fade=
    e.disintegrating
    ?Math.max(
      0,
      e.disintegrateTimer/2.5
    )
    :1;

  ctx.save();
  ctx.globalAlpha=fade;

  rectPixel(
    e.x-42,e.y+40,
    84,12,
    "#151515"
  );

  rectPixel(
    e.x-40,e.y-30,
    80,78,
    "#28652c"
  );

  rectPixel(
    e.x-55,e.y-23,
    18,38,
    "#327b35"
  );

  rectPixel(
    e.x+37,e.y-23,
    18,38,
    "#327b35"
  );

  rectPixel(
    e.x-34,e.y-55,
    68,55,
    "#3c8f3d"
  );

  rectPixel(
    e.x-22,e.y-38,
    15,8,
    "#111"
  );

  rectPixel(
    e.x+7,e.y-38,
    15,8,
    "#111"
  );

  rectPixel(
    e.x-18,e.y-36,
    5,4,
    "#e8d35c"
  );

  rectPixel(
    e.x+10,e.y-36,
    5,4,
    "#e8d35c"
  );

  rectPixel(
    e.x-18,e.y-12,
    36,9,
    "#132d13"
  );

  rectPixel(
    e.x-38,e.y+27,
    76,10,
    "#39271a"
  );

  rectPixel(
    e.x-8,e.y+26,
    16,12,
    "#d0a52b"
  );

  ctx.save();

  ctx.translate(
    e.x+35,
    e.y+10
  );

  ctx.rotate(-.65);

  rectPixel(
    0,-5,
    12,75,
    "#5a351d"
  );

  rectPixel(
    3,-5,
    6,75,
    "#8a5129"
  );

  rectPixel(
    -16,-45,
    42,55,
    "#4b2c1c"
  );

  rectPixel(
    -20,-38,
    50,40,
    "#61391f"
  );

  ctx.restore();
  ctx.restore();

  /* ALWAYS draw the Big Boss health bar */
  if(!e.disintegrating){

    const bw=220;
    const bh=14;

    const bx=e.x-bw/2;
    const by=e.y-85;

    rectPixel(
      bx-4,
      by-4,
      bw+8,
      bh+8,

    rectPixel(
      bx,
      by,

      bh,

    rectPixel(

      by,

          e.hp/e.maxHp

      ),
      bh,
      "#e33b3b"
    );

    ctx.fillStyle="#fff";
    ctx.font="14px monospace";
    ctx.textAlign="center";

    ctx.fillText(
      "BIG BOSS  "+
      Math.ceil(
        Math.max(0,e.hp)
      )+

/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer(){

  if(
    upgradeOpen||
    (victorySequence&&!bat.active)
  )return;

  let dx=
    (keys.d||keys.arrowright?1:0)-
    (keys.a||keys.arrowleft?1:0);

  let dy=
    (keys.s||keys.arrowdown?1:0)-
    (keys.w||keys.arrowup?1:0);

  const m=
    Math.hypot(dx,dy)||1;

  const speed=
    p.speed*
    (
      shieldTimer>0
      ?SHIELD_SPEED_MULTIPLIER
      :1
    );

  p.x+=dx/m*speed;
  p.y+=dy/m*speed;

  p.x=Math.max(
    ARENA.left+15,
    Math.min(
      ARENA.right-20,
      p.x
    )
  );

  p.y=Math.max(
    ARENA.top+20,
    Math.min(
      ARENA.bottom-30,
      p.y
    )
  );

  if(mouse.down){
    shoot();
  }
}

/* =========================
   UPDATE BOSS
========================= */

function updateBoss(){

  if(!bigBoss)return;

  /* Disintegration animation */
  if(bigBoss.disintegrating){

    bigBoss.disintegrateTimer-=1/60;

    if(
      Math.random()<.45
    ){

      burst(
        bigBoss.x+
          (Math.random()-.5)*70,
        bigBoss.y+
          (Math.random()-.5)*80,
        2
      );
    }

    if(
      bigBoss.disintegrateTimer<=0
    ){

      dropBat();

      bigBoss=null;
      victoryTimer=0;
    }

    return;
  }

  const dx=p.x-bigBoss.x;
  const dy=p.y-bigBoss.y;

  const d=
    Math.hypot(dx,dy)||1;

  /* EXACT boss speed: 3.1 */
  bigBoss.x+=
    dx/d*3.1;

  bigBoss.y+=
    dy/d*3.1;

  if(bigBoss.attack>0){
    bigBoss.attack--;
  }

  if(
    d<bigBoss.r+16&&
    bigBoss.attack<=0
  ){

    bigBoss.attack=35;

    loseHeart();
  }

  for(const b of balls){

    if(
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      )<
      bigBoss.r+b.r
    ){

      /* FIXED PLAYER DAMAGE */
      bigBoss.hp-=p.damage;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

      bigBoss.burnTick=0;

      b.life=0;

      burst(
        b.x,
        b.y,
        14
      );
    }
  }

  if(bigBoss.burn>0){

    bigBoss.burn--;
    bigBoss.burnTick++;

    if(
      bigBoss.burnTick%7===0
    ){

      bigBoss.hp-=3;
    }
  }

  if(bigBoss.hp<=0){

    bigBoss.hp=0;

    defeatBigBoss();
  }
}

/* =========================
   UPDATE ENEMIES
========================= */

function updateEnemies(){

  for(const e of enemies){

    const dx=p.x-e.x;
    const dy=p.y-e.y;

    const d=
      Math.hypot(dx,dy)||1;

    e.x+=
      dx/d*e.speed;

    e.y+=
      dy/d*e.speed;

    if(e.attack>0){
      e.attack--;
    }

    if(
      d<e.r+14&&
      e.attack<=0
    ){

      damagePlayer(e);
    }

    for(const b of balls){

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )<
        e.r+b.r
      ){

        e.hp-=p.damage;

        e.burn=
          Math.max(
            e.burn,
            42
          );

        e.burnTick=0;

        b.life=0;

        burst(
          b.x,
          b.y,
          10
        );
      }
    }

    if(e.burn>0){

      e.burn--;
      e.burnTick++;

      if(
        e.burnTick%7===0
      ){

        e.hp-=
          e.type==="skeletonOgre"
          ?4
          :2.5;
      }
    }
  }

  const dead=
    enemies.filter(
      e=>e.hp<=0
    );

  for(const e of dead){

    const reward=
      e.type==="skeletonOgre"
      ?10
      :e.type==="skeletonGoblin"
      ?2
      :e.type==="ogre"
      ?7
      :1;

    coins+=reward;
    score+=reward;

    burst(
      e.x,
      e.y,
      12
    );
  }

  enemies=
    enemies.filter(
      e=>e.hp>0
    );
}

/* =========================
   MAIN LOOP
========================= */

function loop(){

  requestAnimationFrame(loop);

  if(gameOver||paused){

    draw();
    return;
  }

  /* Cooldowns */
  if(fireCooldown>0){
    fireCooldown--;
  }

  if(batCooldown>0){

    batCooldown-=1/60;

    if(batCooldown<0){
      batCooldown=0;
    }
  }

  if(batSwing>0){
    batSwing-=1/60;
  }

  if(shieldTimer>0){

    shieldTimer-=1/60;

    if(shieldTimer<0){
      shieldTimer=0;
    }
  }

  /* Victory sequence */
  if(victorySequence){

    updateBoss();

    updatePlayer();
    collectBat();
    updateParticles();

    draw();
    return;
  }

  elapsed+=1/60;

  /* Boss countdown */
  if(
    !bigBoss&&
    !bossDefeated&&
    bossCountdown<=0&&
    elapsed>=nextBigBoss
  ){

    bossCountdown=3;
    bossCountdownValue=3;
  }

  if(bossCountdown>0){

    bossCountdown-=1/60;

    const value=
      Math.ceil(
        bossCountdown
      );

    if(value>=1){
      bossCountdownValue=value;
    }

    if(bossCountdown<=0){

      bossCountdown=0;

      spawnBigBoss();
    }
  }

  /* Goblin upgrades */
  if(!bossDefeated){

    const newBuff=
      Math.floor(
        elapsed/27
      );

    if(
      newBuff>
      goblinBuffLevel
    ){

      goblinBuffLevel=
        newBuff;
    }
  }

  /* Skeleton upgrades every 27 seconds */
  if(bossDefeated){

    skeletonUpgradeTimer-=1/60;

    if(
      skeletonUpgradeTimer<=0
    ){

      upgradeSkeletons();

      skeletonUpgradeTimer=27;
    }
  }

  /* Big Boss */
  if(bigBoss){

    updateBoss();

  }else if(!bossDefeated){

    /* Bomb pickups */
    bombSpawnTimer-=1/60;

    if(
      bombSpawnTimer<=0
    ){

      spawnBombPickup();

      bombSpawnTimer=20;
    }

    for(const bp of bombPickups){
      bp.life-=1/60;
    }

    bombPickups=
      bombPickups.filter(
        bp=>bp.life>0
      );

    if(bombCount<3){

      for(
        let i=bombPickups.length-1;
        i>=0;
        i--
      ){

        if(
          Math.hypot(
            bombPickups[i].x-p.x,
            bombPickups[i].y-p.y
          )<28
        ){

          bombCount++;

          bombPickups.splice(
            i,
            1
          );
        }
      }
    }

    /* Upgrade screen is NEVER opened
       during the boss/cutscene */
    if(
      elapsed>=nextUpgrade&&
      !bigBoss&&
      !victorySequence
    ){

      upgradeOpen=true;

      nextUpgrade+=70;
    }

    /* Waves */
    const newWave=
      Math.floor(
        elapsed/10
      )+1;

    if(newWave>wave){

      wave=newWave;

      spawnWave(wave);
    }

    /* Mini boss */
    const bossMark=
      Math.floor(
        elapsed/50
      );

    if(
      bossMark>0&&
      !enemies.some(
        e=>
          e.type==="ogre"&&
          e.bossMark===bossMark
      )
    ){

      if(
        !window.lastBossMark
      ){

        window.lastBossMark=0;
      }

      if(
        bossMark>
        window.lastBossMark
      ){

        spawnEnemy("ogre");

        if(enemies.length){

          enemies[
            enemies.length-1
          ].bossMark=
            bossMark;
        }

        window.lastBossMark=
          bossMark;
      }
    }
  }

  /* Player and objects */
  updatePlayer();

  for(const b of balls){

    b.x+=b.vx;
    b.y+=b.vy;
    b.life--;
  }

  balls=
    balls.filter(
      b=>
        b.life>0&&
        b.x>ARENA.left&&
        b.x<ARENA.right&&
        b.y>ARENA.top&&
        b.y<ARENA.bottom
    );

  for(const b of bombs){

    if(!b.exploded){

      b.x+=b.vx;
      b.y+=b.vy;

      b.distance+=
        Math.hypot(
          b.vx,
          b.vy
        );

      if(
        b.distance>=
        BOMB_THROW_DISTANCE||
        b.x<=ARENA.left||
        b.x>=ARENA.right||
        b.y<=ARENA.top||
        b.y>=ARENA.bottom
      ){

        explodeBomb(b);
      }

      if(!b.exploded){

        const hit=
          enemies.find(
            e=>
              Math.hypot(
                b.x-e.x,
                b.y-e.y
              )<
              e.r+b.r
          );

        if(hit){
          explodeBomb(b);
        }
      }

    }else{

      b.disintegrate--;
    }
  }

  bombs=
    bombs.filter(
      b=>
        !b.exploded||
        b.disintegrate>0
    );

  updateEnemies();
  collectBat();
  updateParticles();

  if(heartRegen>0){

    heartRegen-=1/60;

    if(
      heartRegen<=0
    ){

      regainHeart();
    }
  }

  draw();
}

loop();
</script>
