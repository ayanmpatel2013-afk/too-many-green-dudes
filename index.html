<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Too Many Green Dudes</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#252525;
  font-family:monospace;
}

canvas{
  display:block;
  margin:auto;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  cursor:crosshair;
}

button{
  font-family:monospace;
  cursor:pointer;
}

#fullscreenBtn{
  position:fixed;
  top:10px;
  right:10px;
  z-index:10;
  padding:8px 12px;
  background:#1e3d20;
  color:#fff;
  border:2px solid #65b95b;
  font-size:14px;
}

#fullscreenBtn:hover{
  background:#2c5a2f;
}

#pauseBtn{
  position:fixed;
  top:10px;
  right:145px;
  z-index:10;
  padding:8px 12px;
  background:#3d301e;
  color:#fff;
  border:2px solid #d6b85a;
  font-size:14px;
}

#pauseBtn:hover{
  background:#594728;
}
</style>
</head>

<body>

<button id="pauseBtn">PAUSE</button>
<button id="fullscreenBtn">FULLSCREEN</button>

<canvas id="game" width="900" height="600"></canvas>

<script>

/* =========================================================
   CANVAS
========================================================= */

const c=document.getElementById("game");
const ctx=c.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=900;
const H=600;


/* =========================================================
   ARENA
========================================================= */

const ARENA={
  left:160,
  top:45,
  right:875,
  bottom:570
};

const GATE={
  x:845,
  y:260,
  w:30,
  h:120
};


/* =========================================================
   INPUT
========================================================= */

let keys={};

let mouse={
  x:450,
  y:300,
  down:false
};


/* =========================================================
   GAME STATE
========================================================= */

let p;

let enemies=[];
let balls=[];
let particles=[];

let score=0;
let coins=0;

let wave=1;
let elapsed=0;

let gameOver=false;
let paused=false;
let upgradeOpen=false;

let nextUpgrade=70;
let upgradeCost=10;

let upgradeCounts={
  health:0,
  damage:0,
  speed:0
};


/* =========================================================
   HEARTS
========================================================= */

let hearts=3;

let goblinHits=0;
let ogreHits=0;

let heartRegen=0;


/* =========================================================
   SHIELD
========================================================= */

const SHIELD_DURATION=3;
const SHIELD_SPEED_MULTIPLIER=2;


/* =========================================================
   FIREBALL
========================================================= */

let fireCooldown=0;

const FIREBALL_SPLASH_RADIUS=90;


/* =========================================================
   BOMBS
========================================================= */

let bombCount=0;
let bombPickups=[];
let bombs=[];

let bombSpawnTimer=20;

const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=24;


/* =========================================================
   BIG BOSS
========================================================= */

let bigBoss=null;

let nextBigBoss=200;

let bossCountdown=0;
let bossCountdownValue=0;


/* =========================================================
   NORMAL GOBLIN LEVELS
========================================================= */

let goblinBuffLevel=0;


/* =========================================================
   VICTORY / BAT
========================================================= */

let bossDefeated=false;

let victorySequence=false;
let victoryTimer=0;

let batDropped=false;

let bat={
  x:0,
  y:0,
  active:false,
  collected:false,
  pulse:0
};


/* =========================================================
   BAT ABILITY
========================================================= */

let batAbility=false;

let batCooldown=0;
let batSwing=0;

const BAT_COOLDOWN=17;


/* =========================================================
   SKELETON MODE
========================================================= */

let skeletonMode=false;

let skeletonLevel=0;

let skeletonUpgradeTimer=27;


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

function startMusic(){

  if(musicStarted)return;

  try{

    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );

  }catch(err){

    console.log("Audio unavailable");

  }

}


function tone(
  frequency,
  duration,
  type="square",
  volume=.08
){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=frequency;

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    now+.02
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+duration+.02);

}


function playFireballSound(){

  tone(
    240,
    .10,
    "square",
    .07
  );

}


function playBombExplosionSound(){

  tone(
    70,
    .28,
    "square",
    .20
  );

  setTimeout(
    ()=>{
      tone(
        900,
        .12,
        "square",
        .08
      );
    },
    10
  );

}


function playBossSound(){

  tone(
    80,
    .7,
    "square",
    .25
  );

}


function playBatSound(){

  tone(
    150,
    .18,
    "square",
    .18
  );

  setTimeout(
    ()=>{
      tone(
        65,
        .25,
        "square",
        .14
      );
    },
    40
  );

}


function playPickupSound(){

  tone(
    500,
    .12,
    "square",
    .12
  );

  setTimeout(
    ()=>{
      tone(
        800,
        .12,
        "square",
        .10
      );
    },
    80
  );

}


function playMusicStep(){

  if(
    !audioCtx||
    gameOver||
    paused
  ){
    return;
  }

  const notes=[
    110,
    130.81,
    146.83,
    164.81,
    196,
    164.81,
    146.83,
    130.81,
    110,
    146.83,
    164.81,
    196,
    220,
    196,
    164.81,
    146.83
  ];

  tone(
    notes[musicStep%notes.length],
    .25,
    "triangle",
    .055
  );

  musicStep++;

}


/* =========================================================
   BUTTONS
========================================================= */

const fullscreenBtn=
  document.getElementById(
    "fullscreenBtn"
  );

fullscreenBtn.onclick=
  async()=>{

    try{

      if(!document.fullscreenElement){

        await document.documentElement.requestFullscreen();

        fullscreenBtn.textContent=
          "EXIT FULLSCREEN";

      }else{

        await document.exitFullscreen();

        fullscreenBtn.textContent=
          "FULLSCREEN";

      }

    }catch(e){}

  };


document.addEventListener(
  "fullscreenchange",
  ()=>{

    fullscreenBtn.textContent=
      document.fullscreenElement
      ?"EXIT FULLSCREEN"
      :"FULLSCREEN";

  }
);


function togglePause(){

  if(
    gameOver||
    victorySequence||
    upgradeOpen||
    bossCountdown>0
  ){

    return;

  }

  paused=!paused;

  document.getElementById(
    "pauseBtn"
  ).textContent=
    paused
    ?"RESUME"
    :"PAUSE";

}


document.getElementById(
  "pauseBtn"
).onclick=togglePause;


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    startMusic();

    const k=
      e.key.toLowerCase();

    keys[k]=true;


    if(
      k==="r"&&
      gameOver
    ){

      reset();
      return;

    }


    if(
      k==="p"&&
      !e.repeat
    ){

      togglePause();

    }


    if(
      k==="q"&&
      !e.repeat
    ){

      throwBomb();

    }


    if(
      k==="f"&&
      !e.repeat
    ){

      useBatAbility();

    }


    /*
      Upgrade menu captures
      number keys.
    */

    if(upgradeOpen){

      if(e.key==="1")
        buyUpgrade("health");

      if(e.key==="2")
        buyUpgrade("damage");

      if(e.key==="3")
        buyUpgrade("speed");

      if(e.key==="4")
        buyUpgrade("nothing");

    }

  }
);


window.addEventListener(
  "keyup",
  e=>{

    keys[
      e.key.toLowerCase()
    ]=false;

  }
);


/* =========================================================
   MOUSE
========================================================= */

c.addEventListener(
  "mousemove",
  e=>{

    const r=
      c.getBoundingClientRect();

    mouse.x=
      (e.clientX-r.left)*
      W/r.width;

    mouse.y=
      (e.clientY-r.top)*
      H/r.height;

  }
);


c.addEventListener(
  "mousedown",
  ()=>{

    startMusic();

    mouse.down=true;

  }
);


window.addEventListener(
  "mouseup",
  ()=>{

    mouse.down=false;

  }
);


/* =========================================================
   RESET
========================================================= */

function reset(){

  p={

    x:430,
    y:305,

    speed:3.2,

    /*
      Slightly stronger starting damage.
    */
    damage:34,

    maxHp:100,
    hp:100,

    shieldTimer:0,
    speedBoostTimer:0

  };


  enemies=[];
  balls=[];
  particles=[];


  score=0;
  coins=0;

  wave=1;
  elapsed=0;


  gameOver=false;
  paused=false;
  upgradeOpen=false;


  nextUpgrade=70;
  upgradeCost=10;


  upgradeCounts={
    health:0,
    damage:0,
    speed:0
  };


  hearts=3;

  goblinHits=0;
  ogreHits=0;

  heartRegen=0;


  fireCooldown=0;


  bombCount=0;

  bombPickups=[];
  bombs=[];

  bombSpawnTimer=20;


  bigBoss=null;

  nextBigBoss=200;

  bossCountdown=0;
  bossCountdownValue=0;


  goblinBuffLevel=0;


  bossDefeated=false;


  victorySequence=false;
  victoryTimer=0;


  batDropped=false;

  bat={
    x:0,
    y:0,
    active:false,
    collected:false,
    pulse:0
  };


  batAbility=false;

  batCooldown=0;
  batSwing=0;


  skeletonMode=false;
  skeletonLevel=0;
  skeletonUpgradeTimer=27;


  window.lastBossMark=0;


  spawnWave(1);

}


/* =========================================================
   SPAWNING
========================================================= */

function gateSpawnPosition(){

  return{

    x:GATE.x-4,

    y:
      GATE.y+
      GATE.h/2+
      (Math.random()-.5)*45

  };

}


function spawnEnemy(
  type="goblin"
){

  /*
    Normal enemies NEVER spawn after
    the Big Boss has been defeated.
  */

  if(
    bossDefeated||
    bigBoss||
    bossCountdown>0
  ){

    return;

  }


  const pos=
    gateSpawnPosition();

  const x=pos.x;
  const y=pos.y;


  if(type==="ogre"){

    const hp=
      260+
      Math.floor(elapsed/50)*20;

    enemies.push({

      type:"ogre",

      x,
      y,

      spawnX:x,
      spawnY:y,

      r:30,

      hp,
      maxHp:hp,

      speed:
        .42+
        Math.min(
          .18,
          elapsed/2000
        ),

      damage:3,

      attack:0,

      burn:0,
      burnTick:0,

      bossMark:0

    });

    return;

  }


  const buff=
    goblinBuffLevel;


  /*
    Small normal goblin upgrades.
  */

  const hp=
    Math.round(
      (45+wave*8)*
      (1+buff*.10)
    );


  const damage=
    1+
    buff*.35;


  const speed=
    .72+
    wave*.018+
    buff*.035;


  enemies.push({

    type:"goblin",

    x,
    y,

    spawnX:x,
    spawnY:y,

    r:14,

    hp,
    maxHp:hp,

    speed,

    damage,

    attack:0,

    burn:0,
    burnTick:0,

    bossMark:0

  });

}


function spawnWave(n){

  if(
    bossDefeated||
    bigBoss||
    bossCountdown>0
  ){

    return;

  }


  for(
    let i=0;
    i<n;
    i++
  ){

    spawnEnemy("goblin");

  }

}


/* =========================================================
   BIG BOSS
========================================================= */

function spawnBigBoss(){

  if(
    bigBoss||
    bossDefeated
  ){

    return;

  }


  const pos=
    gateSpawnPosition();


  bigBoss={

    type:"bigboss",

    x:pos.x+5,
    y:pos.y,

    r:48,

    hp:2400,
    maxHp:2400,

    /*
      Requested Big Boss speed.
    */
    speed:3.1,

    attack:0,

    burn:0,
    burnTick:0,

    rotation:0,

    spawnFlash:35

  };


  /*
    Clear normal enemies when
    Big Boss enters.
  */

  enemies=[];
  balls=[];

  playBossSound();

}


function defeatBigBoss(){

  if(
    !bigBoss||
    bigBoss.type!=="bigboss"||
    victorySequence
  ){

    return;

  }


  score+=50;
  coins+=50;


  const bx=bigBoss.x;
  const by=bigBoss.y;


  /*
    Permanently stop normal spawning.
  */

  bossDefeated=true;

  skeletonMode=true;


  enemies=[];
  balls=[];
  bombPickups=[];
  bombs=[];


  /*
    Keep Big Boss alive as a
    defeated object for the cutscene.
  */

  bigBoss={

    type:"defeatedBoss",

    x:bx,
    y:by,

    r:48,

    hp:0,
    maxHp:2400,

    animation:4,
    maxAnimation:4

  };


  victorySequence=true;
  victoryTimer=4;


  batDropped=false;

  bat.active=false;
  bat.collected=false;


  playBossSound();

}


/* =========================================================
   SKELETONS
========================================================= */

function createSkeletonGoblin(){

  return{

    type:"skeletonGoblin",

    x:
      ARENA.left+
      80+
      Math.random()*560,

    y:
      ARENA.top+
      70+
      Math.random()*400,

    r:15,

    hp:90,
    maxHp:90,

    speed:.95,

    damage:1.8,

    attack:0,

    burn:0,
    burnTick:0,

    bossMark:0

  };

}


function createSkeletonOgre(){

  return{

    type:"skeletonOgre",

    x:
      ARENA.left+
      100+
      Math.random()*500,

    y:
      ARENA.top+
      80+
      Math.random()*380,

    r:31,

    hp:430,
    maxHp:430,

    speed:.62,

    damage:3.5,

    attack:0,

    burn:0,
    burnTick:0,

    bossMark:0

  };

}


function startSkeletons(){

  /*
    Prevent duplicate resets.
  */

  skeletonMode=true;

  enemies=[];


  /*
    Six skeleton goblins.
  */

  for(
    let i=0;
    i<6;
    i++
  ){

    enemies.push(
      createSkeletonGoblin()
    );

  }


  /*
    One skeleton mini-boss.
  */

  enemies.push(
    createSkeletonOgre()
  );


  skeletonLevel=0;

  /*
    First upgrade occurs 27 seconds
    after the bat is collected.
  */

  skeletonUpgradeTimer=27;

}


function upgradeSkeletons(){

  skeletonLevel++;


  for(
    const e of enemies
  ){

    /*
      Small but noticeable increases.
    */

    e.maxHp=
      Math.round(
        e.maxHp*1.10
      );

    e.hp=e.maxHp;


    e.speed*=1.04;


    e.damage*=1.08;

  }


  /*
    Upgrade particles.
  */

  for(
    const e of enemies
  ){

    burst(
      e.x,
      e.y,
      5
    );

  }

}


/* =========================================================
   VICTORY CUTSCENE
========================================================= */

function updateVictory(){

  if(!victorySequence){
    return;
  }


  victoryTimer-=1/60;


  if(
    bigBoss&&
    bigBoss.type==="defeatedBoss"
  ){

    bigBoss.animation=
      Math.max(
        0,
        victoryTimer
      );


    /*
      Disintegration particles.
    */

    if(
      Math.random()<.60
    ){

      particles.push({

        x:
          bigBoss.x+
          (Math.random()-.5)*90,

        y:
          bigBoss.y+
          (Math.random()-.5)*110,

        vx:
          (Math.random()-.5)*3,

        vy:
          -Math.random()*3,

        life:
          18+
          Math.random()*35

      });

    }


    if(
      victoryTimer<=0
    ){

      bigBoss=null;

      dropBat();

    }

  }

}


function dropBat(){

  if(batDropped){
    return;
  }


  batDropped=true;


  bat.x=W/2;
  bat.y=H/2+50;


  bat.active=true;
  bat.collected=false;
  bat.pulse=0;


  /*
    The cutscene is now waiting
    for the player to touch the bat.
  */

}


/* =========================================================
   BAT PICKUP
========================================================= */

function collectBat(){

  if(
    !bat.active||
    bat.collected||
    gameOver
  ){

    return;

  }


  const d=
    Math.hypot(
      p.x-bat.x,
      p.y-bat.y
    );


  if(d<40){

    bat.collected=true;
    bat.active=false;


    batAbility=true;


    /*
      End the victory sequence.
    */

    victorySequence=false;


    /*
      IMPORTANT:
      Skeletons start immediately.
    */

    startSkeletons();


    playPickupSound();

  }

}


/* =========================================================
   BAT ABILITY
========================================================= */

function useBatAbility(){

  if(
    !batAbility||
    batCooldown>0||
    gameOver||
    paused||
    upgradeOpen||
    victorySequence||
    bossCountdown>0
  ){

    return;

  }


  batCooldown=
    BAT_COOLDOWN;

  batSwing=.60;


  playBatSound();


  /*
    Kill every enemy instantly.
  */

  for(
    const e of enemies
  ){

    burst(
      e.x,
      e.y,
      24
    );

    e.hp=0;

  }


  enemies=[];

}


/* =========================================================
   HEART / SHIELD
========================================================= */

function damagePlayer(e){

  e.attack=45;


  /*
    Shield blocks all damage.
  */

  if(
    p.shieldTimer>0
  ){

    return;

  }


  if(
    e.type==="goblin"||
    e.type==="skeletonGoblin"
  ){

    goblinHits+=
      e.damage||1;


    if(
      goblinHits>=4
    ){

      goblinHits=0;

      loseHeart();

    }

  }else{

    ogreHits++;


    if(
      ogreHits>=2
    ){

      ogreHits=0;

      loseHeart();

    }

  }

}


function loseHeart(){

  if(
    hearts<=0||
    p.shieldTimer>0
  ){

    return;

  }


  hearts--;


  heartRegen=30;


  /*
    Three seconds:
    - invincible
    - blue shield
    - 2x speed
  */

  p.shieldTimer=
    SHIELD_DURATION;

  p.speedBoostTimer=
    SHIELD_DURATION;


  /*
    Reset hit counters.
  */

  goblinHits=0;
  ogreHits=0;


  burst(
    p.x,
    p.y,
    30
  );


  if(
    hearts<=0
  ){

    endGame();

  }

}


function updateShield(){

  if(
    p.shieldTimer>0
  ){

    p.shieldTimer-=1/60;

    p.speedBoostTimer-=1/60;


    if(
      p.shieldTimer<=0
    ){

      p.shieldTimer=0;
      p.speedBoostTimer=0;

    }

  }

}


function regainHeart(){

  if(
    hearts<3
  ){

    hearts++;

    heartRegen=0;

  }

}


function endGame(){

  gameOver=true;

  p.shieldTimer=0;
  p.speedBoostTimer=0;


  const high=
    Number(
      localStorage.getItem(
        "pixelNatureHighscore"
      )||0
    );


  if(
    score>high
  ){

    localStorage.setItem(
      "pixelNatureHighscore",
      score
    );

  }

}


/* =========================================================
   UPGRADES
========================================================= */

function buyUpgrade(kind){

  /*
    Nothing closes the menu.
  */

  if(
    kind==="nothing"
  ){

    upgradeOpen=false;

    return;

  }


  if(
    !upgradeOpen||
    coins<upgradeCost
  ){

    return;

  }


  coins-=upgradeCost;


  if(
    kind==="health"
  ){

    p.maxHp+=20;

    p.hp=
      Math.min(
        p.maxHp,
        p.hp+20
      );

  }


  if(
    kind==="damage"
  ){

    p.damage+=14;

  }


  if(
    kind==="speed"
  ){

    p.speed+=.4;

  }


  upgradeCounts[kind]++;

  upgradeCost+=10;


  /*
    Closing the menu unfreezes
    the game on the next frame.
  */

  upgradeOpen=false;

}


/* =========================================================
   FIREBALL
========================================================= */

function shoot(){

  if(
    fireCooldown>0||
    upgradeOpen||
    gameOver||
    paused||
    victorySequence||
    bossCountdown>0
  ){

    return;

  }


  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );


  balls.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*8,

    vy:
      Math.sin(a)*8,

    r:7,

    life:90

  });


  fireCooldown=60;


  playFireballSound();

}


function fireballSplash(
  x,
  y,
  directHit
){

  /*
    Large splash damage.
  */

  for(
    const e of enemies
  ){

    if(
      e===directHit
    ){

      continue;

    }


    const d=
      Math.hypot(
        x-e.x,
        y-e.y
      );


    if(
      d<=FIREBALL_SPLASH_RADIUS
    ){

      const falloff=
        1-
        d/
        FIREBALL_SPLASH_RADIUS;


      const damage=
        Math.max(
          8,
          p.damage*
          .55*
          falloff
        );


      e.hp-=damage;


      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

    }

  }


  burst(
    x,
    y,
    14
  );

}


function updateBalls(){

  for(
    const b of balls
  ){

    b.x+=b.vx;
    b.y+=b.vy;

    b.life--;


    if(
      b.life<=0
    ){

      continue;

    }


    /*
      Big Boss hit.
    */

    if(
      bigBoss&&
      bigBoss.type==="bigboss"&&
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      )<
      bigBoss.r+b.r
    ){

      bigBoss.hp-=p.damage;


      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

      bigBoss.burnTick=0;


      fireballSplash(
        b.x,
        b.y,
        null
      );


      b.life=0;

      continue;

    }


    /*
      Enemy hit.
    */

    let hit=null;


    for(
      const e of enemies
    ){

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )<
        e.r+b.r
      ){

        hit=e;
        break;

      }

    }


    if(hit){

      const impactX=b.x;
      const impactY=b.y;


      hit.hp-=p.damage;


      hit.burn=
        Math.max(
          hit.burn,
          42
        );

      hit.burnTick=0;


      fireballSplash(
        impactX,
        impactY,
        hit
      );


      b.life=0;


      /*
        Additional nearby splash.
      */

      for(
        const other of enemies
      ){

        if(
          other!==hit&&
          other.hp>0&&
          Math.hypot(
            other.x-impactX,
            other.y-impactY
          )<55
        ){

          other.hp-=
            Math.max(
              5,
              p.damage*.30
            );

        }

      }

    }

  }


  balls=
    balls.filter(
      b=>
        b.life>0&&
        b.x>ARENA.left-30&&
        b.x<ARENA.right+30&&
        b.y>ARENA.top-30&&
        b.y<ARENA.bottom+30
    );

}

   BOMBS
========================================================= */

function spawnBombPickup(){

  if(
    bigBoss||
    bossCountdown>0||
    bossDefeated
  ){

    return;

  }


  const x=
    ARENA.left+
    60+
    Math.random()*
    (ARENA.right-
     ARENA.left-
     120);


  const y=
    90+
    Math.random()*420;


  bombPickups.push({

    x,
    y,

    life:7

  });

}


function throwBomb(){

  if(
    gameOver||
    upgradeOpen||
    paused||
    victorySequence||
    bossCountdown>0||
    bombCount<=0
  ){

    return;

  }


  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );


  bombCount--;


  bombs.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*7,

    vy:
      Math.sin(a)*7,

    life:120,

    r:9,

    distance:0,

    exploded:false,

    disintegrate:0,

    rotation:0

  });

}


function explodeBomb(b){

  if(b.exploded){
    return;
  }


  b.exploded=true;

  b.disintegrate=
    BOMB_DISINTEGRATE_TIME;

  b.vx=0;
  b.vy=0;


  playBombExplosionSound();


  burst(
    b.x,
    b.y,
    45
  );


  /*
    Big Boss takes 20%.
  */

  if(
    bigBoss&&
    bigBoss.type==="bigboss"
  ){

    const d=
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      );


    if(
      d<145
    ){

      bigBoss.hp-=
        bigBoss.maxHp*.20;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

    }

  }


  /*
    Large enemy damage.
  */

  for(
    const e of enemies
  ){

    const d=
      Math.hypot(
        b.x-e.x,
        b.y-e.y
      );


    if(
      d<120
    ){

      e.hp-=
        e.type==="ogre"||
        e.type==="skeletonOgre"
        ?e.maxHp*.50
        :e.maxHp*.75;


      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

    }

  }

}


function updateBombs(){

  for(
    const b of bombs
  ){

    if(
      !b.exploded
    ){

      b.x+=b.vx;
      b.y+=b.vy;

      b.distance+=
        Math.hypot(
          b.vx,
          b.vy
        );

      b.life--;

      b.rotation+=.15;


      if(
        b.distance>=
        BOMB_THROW_DISTANCE
      ){

        explodeBomb(b);

      }


      if(
        !b.exploded
      ){

        for(
          const e of enemies
        ){

          if(
            Math.hypot(
              b.x-e.x,
              b.y-e.y
            )<
            e.r+b.r
          ){

            explodeBomb(b);
            break;

          }

        }

      }


      if(
        !b.exploded&&
        (
          b.x<=ARENA.left||
          b.x>=ARENA.right||
          b.y<=ARENA.top||
          b.y>=ARENA.bottom
        )
      ){

        explodeBomb(b);

      }

    }else{

      b.disintegrate--;

    }

  }


  bombs=
    bombs.filter(
      b=>
        !b.exploded||
        b.disintegrate>0
    );

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(){

  /*
    Cannot move during the actual
    Big Boss disintegration animation.
    Can move after the bat drops.
  */

  if(
    upgradeOpen||
    gameOver||
    (
      victorySequence&&
      victoryTimer>0
    )
  ){

    return;

  }


  let dx=
    (
      keys.d||
      keys.arrowright
      ?1
      :0
    )-
    (
      keys.a||
      keys.arrowleft
      ?1
      :0
    );


  let dy=
    (
      keys.s||
      keys.arrowdown
      ?1
      :0
    )-
    (
      keys.w||
      keys.arrowup
      ?1
      :0
    );


  const m=
    Math.hypot(
      dx,
      dy
    )||1;


  let speed=
    p.speed;


  if(
    p.speedBoostTimer>0
  ){

    speed*=
      SHIELD_SPEED_MULTIPLIER;

  }


  p.x+=
    dx/m*
    speed;

  p.y+=
    dy/m*
    speed;


  p.x=
    Math.max(
      ARENA.left+15,
      Math.min(
        ARENA.right-20,
        p.x
      )
    );


  p.y=
    Math.max(
      ARENA.top+20,
      Math.min(
        ARENA.bottom-30,
        p.y
      )
    );

}


/* =========================================================
   ENEMIES
========================================================= */

function updateEnemies(){

  for(
    const e of enemies
  ){

    const dx=
      p.x-e.x;

    const dy=
      p.y-e.y;


    const d=
      Math.hypot(
        dx,
        dy
      )||1;


    e.x+=
      dx/d*
      e.speed;

    e.y+=
      dy/d*
      e.speed;


    if(
      e.attack>0
    ){

      e.attack--;

    }


    if(
      d<
      e.r+14&&
      e.attack<=0
    ){

      damagePlayer(e);

    }


    /*
      Burn damage.
    */

    if(
      e.burn>0
    ){

      e.burn--;

      e.burnTick++;


      if(
        e.burnTick%7===0
      ){

        e.hp-=
          e.type==="skeletonGoblin"||
          e.type==="skeletonOgre"
          ?2.5
          :2;

      }

    }

  }


  /*
    Remove dead enemies.
  */

  const dead=
    enemies.filter(
      e=>e.hp<=0
    );


  dead.forEach(
    killEnemy
  );


  enemies=
    enemies.filter(
      e=>e.hp>0
    );

}


function killEnemy(e){

  if(
    e.type==="ogre"||
    e.type==="skeletonOgre"
  ){

    coins+=7;
    score+=7;


    burst(
      e.x,
      e.y,
      25
    );

  }else{

    coins+=1;
    score++;


    burst(
      e.x,
      e.y,
      12
    );

  }

}


/* =========================================================
   BIG BOSS UPDATE
========================================================= */

function updateBoss(){

  if(
    !bigBoss||
    bigBoss.type!=="bigboss"
  ){

    return;

  }


  const dx=
    p.x-bigBoss.x;

  const dy=
    p.y-bigBoss.y;


  const d=
    Math.hypot(
      dx,
      dy
    )||1;


  bigBoss.x+=
    dx/d*
    bigBoss.speed;

  bigBoss.y+=
    dy/d*
    bigBoss.speed;


  if(
    bigBoss.attack>0
  ){

    bigBoss.attack--;

  }


  if(
    d<
    bigBoss.r+16&&
    bigBoss.attack<=0
  ){

    bigBoss.attack=35;

    loseHeart();

  }


  if(
    bigBoss.burn>0
  ){

    bigBoss.burn--;

    bigBoss.burnTick++;


    if(
      bigBoss.burnTick%7===0
    ){

      bigBoss.hp-=3;

    }

  }


  if(
    bigBoss.hp<=0
  ){

    defeatBigBoss();

  }

}

========================================================= */

function burst(
  x,
  y,
  n=8
){

  for(
    let i=0;
    i<n;
    i++
  ){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*5,

      vy:
        (Math.random()-.5)*5,

      life:
        22+
        Math.random()*18

    });

  }

}


function updateParticles(){

  for(
    const s of particles
  ){

    s.x+=s.vx;
    s.y+=s.vy;

    s.vx*=.98;
    s.vy*=.98;

    s.life--;

  }


  particles=
    particles.filter(
      s=>s.life>0
    );

}

/* =========================================================

========================================================= */

function drawBigBoss(){

  if(!bigBoss){
    return;
  }


  const e=bigBoss;


  if(
    e.type==="defeatedBoss"
  ){

    const progress=
      e.animation/e.maxAnimation;


    ctx.save();

    ctx.globalAlpha=
      Math.max(
        0,
        progress
      );


    ctx.translate(
      e.x,
      e.y
    );


    ctx.scale(
      .75+
      progress*.25,
      .75+
      progress*.25
    );


    drawBossBody(
      0,
      0
    );


    ctx.restore();


    /*
      Falling debris.
    */

    for(
      let i=0;
      i<8;
      i++
    ){

      const angle=
        i*Math.PI/4+
        performance.now()/700;


      const dist=
        (1-progress)*55;


      rectPixel(
        e.x+
        Math.cos(angle)*dist,
        e.y+
        Math.sin(angle)*dist,
        5,
        5,
        i%2
        ?" #65b95b".trim()
        :"#8d8d8d"
      );

    }


    return;

  }


  drawBossBody(
    e.x,
    e.y
  );


  /*
    Big Boss health bar.
  */

  const bw=220;
  const bh=12;

  const bx=
    e.x-bw/2;

  const by=
    e.y-92;


  rectPixel(
    bx-4,
    by-4,
    bw+8,
    bh+8,
    "#111"
  );


  rectPixel(
    bx,
    by,
    bw,
    bh,
    "#5b2020"
  );


  rectPixel(
    bx,
    by,
    bw*
    Math.max(
      0,
      e.hp/e.maxHp
    ),
    bh,
    "#ef3e3e"
  );


  ctx.fillStyle="#fff";
  ctx.font="12px monospace";
  ctx.textAlign="center";


  ctx.fillText(
    "BIG BOSS",
    e.x,
    by-8
  );


  ctx.textAlign="left";

}

/* =========================================================

========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Arena.
  */

  ctx.fillStyle="#303030";

  ctx.fillRect(
    ARENA.left,
    ARENA.top,
    ARENA.right-ARENA.left,
    ARENA.bottom-ARENA.top
  );


  ctx.strokeStyle="#444";
  ctx.lineWidth=6;

  ctx.strokeRect(
    ARENA.left,
    ARENA.top,
    ARENA.right-ARENA.left,
    ARENA.bottom-ARENA.top
  );


  /*
    Static-looking floor pixels.
  */

  for(
    let i=0;
    i<85;
    i++
  ){

    const x=
      ARENA.left+
      15+
      ((i*73)%(
        ARENA.right-
        ARENA.left-
        30
      ));

    const y=
      65+
      ((i*47)%470);


    rectPixel(
      x,
      y,
      3,
      3,
      i%2
      ?"#353535"
      :"#3b3b3b"
    );

  }

  ctx.fillRect(

  );

    75,

    130
  );

  ctx.fillStyle="#ffcf4d";

    ctx.fillStyle="#ff4444";

    ctx.font="38px monospace";

    ctx.fillText(
      "BOSS INCOMING",
      W/2,
      190
    );


    ctx.fillStyle="#fff";

    ctx.font="100px monospace";

    ctx.fillText(
      bossCountdownValue,
      W/2,
      320
    );


    ctx.font="18px monospace";

    ctx.fillText(
      "THE GATE IS OPENING...",
      W/2,
      370
    );


    ctx.textAlign="left";

  }


  /*
    Upgrade menu.
    The game is completely frozen
    while this is displayed.
  */

  if(
    upgradeOpen
  ){

    ctx.fillStyle="#0a130d";

    ctx.globalAlpha=.96;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;


    ctx.fillStyle="#fff";

    ctx.font="32px monospace";

    ctx.fillText(
      "CHOOSE YOUR UPGRADE",
      245,
      125
    );


    ctx.font="20px monospace";

    ctx.fillStyle="#ffe875";

    ctx.fillText(
      "COINS: "+coins,
      390,
      165
    );


    ctx.fillStyle="#fff";

    ctx.font="16px monospace";

    ctx.fillText(
      "Cost: "+
      upgradeCost+
      " coins   (1 / 2 / 3 / 4)",
      285,
      195
    );


    const cards=[

      [
        "1",
        "HEALTH",
        "+20 MAX HP",
        90
      ],

      [
        "2",
        "DAMAGE",
        "+14 FIREBALL",
        295
      ],

      [
        "3",
        "SPEED",
        "+0.4 MOVE",
        500
      ],

      [
        "4",
        "NOTHING",
        "FREE",
        705
      ]

    ];


    for(
      const [
        n,
        title,
        desc,
        x
      ]
      of cards
    ){

      ctx.fillStyle=
        title==="NOTHING"
        ?"#183c1d"
        :"#1e3d20";


      ctx.fillRect(
        x,
        235,
        170,
        130
      );


      ctx.strokeStyle=
        title==="NOTHING"
        ?"#8ee889"
        :"#65b95b";


      ctx.lineWidth=4;


      ctx.strokeRect(
        x,
        235,
        170,
        130
      );


      ctx.fillStyle="#bdebb5";

      ctx.font="21px monospace";


      ctx.fillText(
        n+". "+title,
        x+15,
        275
      );


      ctx.font="14px monospace";


      ctx.fillText(
        desc,
        x+25,
        310
      );


      ctx.fillText(
        title==="NOTHING"
        ?"SKIP"
        :"BUY",
        x+60,
        340
      );

    }


    ctx.fillStyle="#fff";

    ctx.font="14px monospace";


    ctx.fillText(
      "The whole game is paused until you choose.",
      280,
      405
    );

  }


  /*
    Paused screen.
  */

  if(
    paused
  ){

    ctx.fillStyle="#000";

    ctx.globalAlpha=.72;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;


    ctx.textAlign="center";

    ctx.fillStyle="#fff";

    ctx.font="46px monospace";

    ctx.fillText(
      "PAUSED",
      W/2,
      280
    );


    ctx.font="18px monospace";

    ctx.fillText(
      "Press P or click RESUME",
      W/2,
      320
    );


    ctx.textAlign="left";

  }


  /*
    Low-health red corners must be last.
  */

  drawLowHealthOverlay();

}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(){

  requestAnimationFrame(loop);


  /*
    Always draw frozen states.
  */

  if(
    gameOver
  ){

    draw();

    return;

  }


  /*
    Manual pause.
  */

  if(
    paused
  ){

    draw();

    return;

  }


  /*
    Upgrade pause.
    NOTHING updates here.
  */

  if(
    upgradeOpen
  ){

    draw();

    return;

  }


  /*
    Victory cutscene.
  */

  if(
    victorySequence
  ){

    updateVictory();

    updateParticles();


    /*
      After the disintegration,
      the player can move toward the bat.
    */

    if(
      bat.active
    ){

      updatePlayer();

      collectBat();

    }


    draw();

    return;

  }


  /*
    Bat cooldown.
  */

  if(
    batCooldown>0
  ){

    batCooldown-=1/60;


    if(
      batCooldown<0
    ){

      batCooldown=0;

    }

  }


  /*
    Bat swing animation.
  */

  if(
    batSwing>0
  ){

    batSwing-=1/60;


    if(
      batSwing<0
    ){

      batSwing=0;

    }

  }


  /*
    Fireball cooldown.
  */

  if(
    fireCooldown>0
  ){

    fireCooldown--;

  }


  /*
    Shield timer.
  */

  updateShield();


  /*
    IMPORTANT:
    Normal game time advances only here.
  */

  elapsed+=1/60;


  /* =======================================================
     BOSS COUNTDOWN
     Only countdown changes.
  ======================================================= */

  if(
    !bigBoss&&
    !bossDefeated&&
    bossCountdown<=0&&
    elapsed>=nextBigBoss
  ){

    bossCountdown=3;

    bossCountdownValue=3;

  }


  if(
    bossCountdown>0
  ){

    bossCountdown-=1/60;


    const newValue=
      Math.ceil(
        bossCountdown
      );


    if(
      newValue!==bossCountdownValue&&
      newValue>=1
    ){

      bossCountdownValue=
        newValue;

    }


    if(
      bossCountdown<=0
    ){

      bossCountdown=0;

      spawnBigBoss();

    }


    /*
      Everything else stays frozen.
    */

    draw();

    return;

  }


  /* =======================================================
     NORMAL GOBLIN UPGRADES
  ======================================================= */

  if(
    !bossDefeated
  ){

    const newGoblinLevel=
      Math.floor(
        elapsed/27
      );


    if(
      newGoblinLevel>
      goblinBuffLevel
    ){

      goblinBuffLevel=
        newGoblinLevel;

    }

  }


  /* =======================================================
     SKELETON UPGRADES
  ======================================================= */

  if(
    bossDefeated&&
    skeletonMode
  ){

    skeletonUpgradeTimer-=1/60;


    if(
      skeletonUpgradeTimer<=0
    ){

      upgradeSkeletons();

      skeletonUpgradeTimer=27;

    }

  }


  /* =======================================================
     BIG BOSS
  ======================================================= */

  if(
    bigBoss&&
    bigBoss.type==="bigboss"
  ){

    updateBoss();

  }


  /* =======================================================
     NORMAL WORLD
  ======================================================= */

  if(
    !bigBoss&&
    !bossDefeated
  ){

    /*
      Bomb pickup spawning.
    */

    bombSpawnTimer-=1/60;


    if(
      bombSpawnTimer<=0
    ){

      spawnBombPickup();

      bombSpawnTimer=20;

    }


    /*
      Bomb pickup lifetime.
    */

    for(
      const bp of bombPickups
    ){

      bp.life-=1/60;

    }


    bombPickups=
      bombPickups.filter(
        bp=>bp.life>0
      );


    /*
      Collect bombs.
    */

    if(
      bombCount<3
    ){

      for(
        let i=
          bombPickups.length-1;
        i>=0;
        i--
      ){

        if(
          Math.hypot(
            bombPickups[i].x-p.x,
            bombPickups[i].y-p.y
          )<28
        ){

          bombCount++;

          bombPickups.splice(
            i,
            1
          );

        }

      }

    }


    /*
      NORMAL UPGRADE TIMER.

      This is intentionally independent
      from goblin spawning and is only
      disabled once the Big Boss is defeated.
    */

    if(
      elapsed>=nextUpgrade
    ){

      upgradeOpen=true;

      nextUpgrade+=70;


      /*
        Immediately draw the menu.
        The next loop frame is frozen.
      */

      draw();

      return;

    }


    /*
      Waves.
    */

    const newWave=
      Math.floor(
        elapsed/10
      )+1;


    if(
      newWave>wave
    ){

      wave=newWave;

      spawnWave(wave);

    }


    /*
      Mini boss every 50 seconds.
    */

    const bossMark=
      Math.floor(
        elapsed/50
      );


    if(
      bossMark>0&&
      !enemies.some(
        e=>
          e.type==="ogre"&&
          e.bossMark===bossMark
      )
    ){

      if(
        !window.lastBossMark
      ){

        window.lastBossMark=0;

      }


      if(
        bossMark>
        window.lastBossMark
      ){

        spawnEnemy("ogre");


        if(
          enemies.length
        ){

          enemies[
            enemies.length-1
          ].bossMark=
            bossMark;

        }


        window.lastBossMark=
          bossMark;

      }

    }

  }


  /* =======================================================
     PLAYER
  ======================================================= */

  updatePlayer();


  /* =======================================================
     FIREBALLS
  ======================================================= */

  if(
    mouse.down
  ){

    shoot();

  }


  updateBalls();


  /* =======================================================
     BOMBS
  ======================================================= */

  updateBombs();


  /* =======================================================
     ENEMIES
  ======================================================= */

  updateEnemies();


  /* =======================================================
     BAT
  ======================================================= */

  collectBat();


  /* =======================================================
     PARTICLES
  ======================================================= */

  updateParticles();


  /* =======================================================
     HEART REGEN
  ======================================================= */

  if(
    heartRegen>0
  ){

    heartRegen-=1/60;


    if(
      heartRegen<=0
    ){

      regainHeart();

    }

  }


  draw();

}


/* =========================================================
   START
========================================================= */

reset();

loop();

</script>
