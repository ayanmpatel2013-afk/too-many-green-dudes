<body>

<button id="pauseBtn">PAUSE</button>
<button id="fullscreenBtn">FULLSCREEN</button>

<canvas id="game" width="1000" height="650"></canvas>

<script>

const c=document.getElementById("game");
const ctx=c.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=1000,H=650;

/* Larger arena */
const ARENA={
  x:35,
  y:55,
  w:930,
  h:555
};

/* Gate on the right */
const GATE={
  x:925,
  y:260,
  w:40,
  h:130
};

let keys={};
let mouse={x:500,y:325,down:false};

let p,enemies,balls,particles,score,coins,wave,elapsed,
    gameOver,upgradeOpen,nextUpgrade,paused;

let upgradeCost=10;

let upgradeCounts={
  health:0,
  damage:0,
  speed:0
};

let goblinHits=0;
let ogreHits=0;
let hearts=3;
let heartRegen=0;

let fireCooldown=0;

let bombCount=0;
let bombPickups=[];
let bombs=[];
let bombSpawnTimer=20;

let highscore=Number(
  localStorage.getItem("pixelNatureHighscore")||0
);


/* =========================
   AUDIO
   ========================= */

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

/* 2x sound volume */
const SOUND_MULTIPLIER=2;

function startMusic(){

  if(musicStarted)return;

  try{

    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );

  }catch(err){

    console.log("Music unavailable:",err);

  }
}


function playFireballSound(){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(240,now);

  osc.frequency.exponentialRampToValueAtTime(
    90,
    now+0.09
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.035*SOUND_MULTIPLIER,
    now+0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.10
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.11);
}


function playBombExplosionSound(){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const boom=audioCtx.createOscillator();
  const boomGain=audioCtx.createGain();

  boom.type="square";

  boom.frequency.setValueAtTime(
    105,
    now
  );

  boom.frequency.exponentialRampToValueAtTime(
    38,
    now+0.22
  );

  boomGain.gain.setValueAtTime(
    0.0001,
    now
  );

  boomGain.gain.exponentialRampToValueAtTime(
    0.12*SOUND_MULTIPLIER,
    now+0.015
  );

  boomGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.25
  );

  boom.connect(boomGain);
  boomGain.connect(audioCtx.destination);

  boom.start(now);
  boom.stop(now+0.27);


  const crack=audioCtx.createOscillator();
  const crackGain=audioCtx.createGain();

  crack.type="square";

  crack.frequency.setValueAtTime(
    900,
    now
  );

  crack.frequency.exponentialRampToValueAtTime(
    180,
    now+0.12
  );

  crackGain.gain.setValueAtTime(
    0.0001,
    now
  );

  crackGain.gain.exponentialRampToValueAtTime(
    0.055*SOUND_MULTIPLIER,
    now+0.005
  );

  crackGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.14
  );

  crack.connect(crackGain);
  crackGain.connect(audioCtx.destination);

  crack.start(now);
  crack.stop(now+0.15);


  const click=audioCtx.createOscillator();
  const clickGain=audioCtx.createGain();

  click.type="square";
  click.frequency.value=1400;

  clickGain.gain.setValueAtTime(
    0.025*SOUND_MULTIPLIER,
    now
  );

  clickGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.035
  );

  click.connect(clickGain);
  clickGain.connect(audioCtx.destination);

  click.start(now);
  click.stop(now+0.04);
}


function playMusicStep(){

  if(!audioCtx||gameOver||paused)return;

  const notes=[
    110,130.81,146.83,164.81,
    196,164.81,146.83,130.81,
    110,146.83,164.81,196,
    220,196,164.81,146.83
  ];

  const bass=[
    55,55,65.41,65.41,
    73.42,73.42,82.41,82.41
  ];

  const now=audioCtx.currentTime;

  const note=
    notes[musicStep%notes.length];

  const bassNote=
    bass[musicStep%bass.length];


  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="triangle";
  osc.frequency.value=note;

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.065*SOUND_MULTIPLIER,
    now+0.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.25
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.26);


  const bassOsc=audioCtx.createOscillator();
  const bassGain=audioCtx.createGain();

  bassOsc.type="sine";
  bassOsc.frequency.value=bassNote;

  bassGain.gain.setValueAtTime(
    0.0001,
    now
  );

  bassGain.gain.exponentialRampToValueAtTime(
    0.075*SOUND_MULTIPLIER,
    now+0.02
  );

  bassGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.24
  );

  bassOsc.connect(bassGain);
  bassGain.connect(audioCtx.destination);

  bassOsc.start(now);
  bassOsc.stop(now+0.25);

  musicStep++;
}


/* =========================
   PAUSE
   ========================= */

const pauseBtn=document.getElementById("pauseBtn");

function togglePause(){

  if(gameOver||upgradeOpen)return;

  paused=!paused;

  pauseBtn.textContent=
    paused
    ?"RESUME"
    :"PAUSE";

  if(paused&&audioCtx){
    /* Music simply stops producing new notes */
  }
}

pauseBtn.addEventListener(
  "click",
  ()=>{
    startMusic();
    togglePause();
  }
);


/* =========================
   FULLSCREEN
   ========================= */

const fullscreenBtn=
  document.getElementById("fullscreenBtn");

fullscreenBtn.addEventListener(
  "click",
  async()=>{

    try{

      if(!document.fullscreenElement){

        await document.documentElement.requestFullscreen();

        fullscreenBtn.textContent=
          "EXIT FULLSCREEN";

      }else{

        await document.exitFullscreen();

        fullscreenBtn.textContent=
          "FULLSCREEN";

      }

    }catch(err){

      console.log(
        "Fullscreen unavailable:",
        err
      );

    }
  }
);


document.addEventListener(
  "fullscreenchange",
  ()=>{

    fullscreenBtn.textContent=
      document.fullscreenElement
      ?"EXIT FULLSCREEN"
      :"FULLSCREEN";

  }
);


/* =========================
   GAME RESET
   ========================= */

function reset(){

  p={
    x:500,
    y:325,
    speed:3.2,
    damage:28,
    maxHp:100,
    hp:100
  };

  enemies=[];
  balls=[];
  particles=[];

  score=0;
  coins=0;
  wave=1;
  elapsed=0;
  gameOver=false;
  paused=false;

  pauseBtn.textContent="PAUSE";

  upgradeOpen=false;

  nextUpgrade=70;

  upgradeCost=10;

  upgradeCounts={
    health:0,
    damage:0,
    speed:0
  };

  goblinHits=0;
  ogreHits=0;

  hearts=3;
  heartRegen=0;

  fireCooldown=0;

  bombCount=0;
  bombPickups=[];
  bombs=[];
  bombSpawnTimer=20;

  window.lastBossMark=0;

  spawnWave(1);
}

reset();


/* =========================
   INPUT
   ========================= */

window.addEventListener(
  "keydown",
  e=>{

    startMusic();

    const key=e.key.toLowerCase();

    keys[key]=true;


    if(key==="p"&&!e.repeat){

      togglePause();

      return;
    }


    if(key==="r"&&gameOver){

      reset();
      return;

    }


    if(key==="q"&&!e.repeat){

      throwBomb();

    }


    if(upgradeOpen){

      if(e.key==="1")
        buyUpgrade("health");

      if(e.key==="2")
        buyUpgrade("damage");

      if(e.key==="3")
        buyUpgrade("speed");

      if(e.key==="4")
        buyUpgrade("nothing");

    }

  }
);


window.addEventListener(
  "keyup",
  e=>{

    keys[e.key.toLowerCase()]=false;

  }
);


c.addEventListener(
  "mousemove",
  e=>{

    const r=c.getBoundingClientRect();

    mouse.x=
      (e.clientX-r.left)*
      W/r.width;

    mouse.y=
      (e.clientY-r.top)*
      H/r.height;

  }
);


c.addEventListener(
  "mousedown",
  ()=>{

    startMusic();

    mouse.down=true;

  }
);


window.addEventListener(
  "mouseup",
  ()=>{

    mouse.down=false;

  }
);


/* =========================
   GATE SPAWN
   ========================= */

/*
  Every enemy now starts at the gate.

  The gate is on the right side of the
  arena, so enemies enter from there.
*/

function getGateSpawn(){

  return {
    x:GATE.x-18,
    y:
      GATE.y+
      20+
      Math.random()*
      (GATE.h-40)
  };
}


function spawnEnemy(type="goblin"){

  const spawn=getGateSpawn();

  const x=spawn.x;
  const y=spawn.y;


  if(type==="ogre"){

    const hp=
      260+
      Math.floor(elapsed/50)*35;

    enemies.push({

      type:"ogre",

      x,
      y,

      r:30,

      hp,
      maxHp:hp,

      speed:
        .42+
        Math.min(
          .18,
          elapsed/2000
        ),

      attack:0,
      burn:0,
      burnTick:0,

      bossMark:0

    });

  }else{

    const hp=
      45+
      wave*8;

    enemies.push({

      type:"goblin",

      x,
      y,

      r:14,

      hp,
      maxHp:hp,

      speed:
        .72+
        wave*.025,

      attack:0,
      burn:0,
      burnTick:0

    });

  }
}


function spawnWave(n){

  for(
    let i=0;
    i<n;
    i++
  ){

    spawnEnemy("goblin");

  }
}


/* =========================
   SCORE / COINS
   ========================= */

function addCoins(n){

  coins+=n;

}


function killEnemy(e){

  if(e.type==="ogre"){

    addCoins(7);
    score+=7;

    burst(
      e.x,
      e.y,
      22
    );

  }else{

    addCoins(1);
    score++;

    burst(
      e.x,
      e.y,
      10
    );

  }
}


/* =========================
   SHOOTING
   ========================= */

function shoot(){

  if(
    fireCooldown>0||
    upgradeOpen||
    gameOver||
    paused
  ){

    return;

  }


  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );


  balls.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*8,

    vy:
      Math.sin(a)*8,

    r:7,
    life:90

  });


  fireCooldown=60;

  playFireballSound();
}


/* =========================
   BOMBS
   ========================= */

function spawnBombPickup(){

  const x=
    ARENA.x+35+
    Math.random()*
    (ARENA.w-70);

  const y=
    ARENA.y+45+
    Math.random()*
    (ARENA.h-90);


  bombPickups.push({

    x,
    y,
    life:7

  });
}


const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=22;


function throwBomb(){

  if(
    gameOver||
    upgradeOpen||
    paused||
    bombCount<=0
  ){

    return;

  }


  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );


  bombCount--;


  bombs.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*7,

    vy:
      Math.sin(a)*7,

    life:120,

    r:9,

    distance:0,

    exploded:false,

    disintegrate:0,

    rotation:0

  });
}


function explodeBomb(b){

  if(b.exploded)return;

  b.exploded=true;

  b.disintegrate=
    BOMB_DISINTEGRATE_TIME;

  b.vx=0;
  b.vy=0;

  playBombExplosionSound();

  burst(
    b.x,
    b.y,
    42
  );


  for(
    let i=0;
    i<18;
    i++
  ){

    particles.push({

      x:b.x,
      y:b.y,

      vx:
        (Math.random()-.5)*7,

      vy:
        (Math.random()-.5)*7,

      life:
        18+
        Math.random()*15

    });

  }


  for(
    const e of enemies
  ){

    const d=
      Math.hypot(
        b.x-e.x,
        b.y-e.y
      );

    if(d<115){

      e.hp-=
        e.type==="ogre"
        ?e.maxHp*.5
        :e.maxHp*.75;

      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

    }
  }
}


/* =========================
   PLAYER DAMAGE
   ========================= */

function damagePlayer(e){

  e.attack=45;

  if(e.type==="goblin"){

    goblinHits++;

    if(goblinHits>=4){

      goblinHits=0;

      loseHeart();

    }

  }else{

    ogreHits++;

    if(ogreHits>=2){

      ogreHits=0;

      loseHeart();

    }

  }
}


function loseHeart(){

  if(hearts<=0)return;

  hearts--;

  heartRegen=30;

  if(hearts<=0){

    endGame();

  }
}


function regainHeart(){

  if(hearts<3){

    hearts++;

    heartRegen=0;

  }
}


function endGame(){

  gameOver=true;

  if(score>highscore){

    highscore=score;

    localStorage.setItem(
      "pixelNatureHighscore",
      highscore
    );

  }
}


/* =========================
   UPGRADES
   ========================= */

function buyUpgrade(kind){

  if(kind==="nothing"){

    upgradeOpen=false;

    return;

  }


  if(
    !upgradeOpen||
    coins<upgradeCost
  ){

    return;

  }


  coins-=upgradeCost;


  if(kind==="health"){

    p.maxHp+=20;

    p.hp=
      Math.min(
        p.maxHp,
        p.hp+20
      );

  }


  if(kind==="damage"){

    p.damage+=12;

  }


  if(kind==="speed"){

    p.speed+=.4;

  }


  upgradeCounts[kind]++;

  upgradeCost+=10;

  upgradeOpen=false;
}


/* =========================
   PARTICLES
   ========================= */

function burst(x,y,n=8){

  for(
    let i=0;
    i<n;
    i++
  ){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*4,

      vy:
        (Math.random()-.5)*4,

      life:22

    });

  }
}


function rectPixel(
  x,
  y,
  w,
  h,
  color
){

  ctx.fillStyle=color;

  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,
    h
  );
}


/* =========================
   GATE DRAWING
   ========================= */

function drawGate(){

  /*
    Dark opening
  */

  rectPixel(
    GATE.x-10,
    GATE.y-10,
    GATE.w+20,
    GATE.h+20,
    "#111"
  );

  rectPixel(
    GATE.x,
    GATE.y,
    GATE.w,
    GATE.h,
    "#171717"
  );


  /*
    Pixel stone frame
  */

  rectPixel(
    GATE.x-10,
    GATE.y-10,
    10,
    GATE.h+20,
    "#555"
  );

  rectPixel(
    GATE.x+GATE.w,
    GATE.y-10,
    10,
    GATE.h+20,
    "#555"
  );

  rectPixel(
    GATE.x-10,
    GATE.y-10,
    GATE.w+20,
    10,
    "#666"
  );

  rectPixel(
    GATE.x-10,
    GATE.y+GATE.h,
    GATE.w+20,
    10,
    "#444"
  );


  /*
    Pixelated iron bars
  */

  for(
    let x=GATE.x+4;
    x<GATE.x+GATE.w;
    x+=10
  ){

    rectPixel(
      x,
      GATE.y+5,
      5,
      GATE.h-10,
      "#999"
    );

    rectPixel(
      x+1,
      GATE.y+5,
      2,
      GATE.h-10,
      "#d0d0d0"
    );

  }


  /*
    Horizontal supports
  */

  rectPixel(
    GATE.x,
    GATE.y+35,
    GATE.w,
    6,
    "#777"
  );

  rectPixel(
    GATE.x,
    GATE.y+85,
    GATE.w,
    6,
    "#777"
  );


  /*
    Gate highlights
  */

  rectPixel(
    GATE.x-5,
    GATE.y+15,
    4,
    18,
    "#888"
  );

  rectPixel(
    GATE.x+GATE.w+1,
    GATE.y+65,
    4,
    18,
    "#777"
  );
}


/* =========================
   HUD
   ========================= */

function drawHeart(x,y,full){

  rectPixel(
    x+4,
    y,
    10,
    4,
    full
      ?"#e83e3e"
      :"#3a3a3a"
  );

  rectPixel(
    x,
    y+4,
    18,
    10,
    full
      ?"#e83e3e"
      :"#3a3a3a"
  );

  rectPixel(
    x+4,
    y+14,
    10,
    4,
    full
      ?"#e83e3e"
      :"#3a3a3a"
  );

  rectPixel(
    x+8,
    y+18,
    2,
    2,
    full
      ?"#e83e3e"
      :"#3a3a3a"
  );

  if(!full){

    ctx.clearRect(
      x+5,
      y+5,
      8,
      8
    );

  }
}


function drawCoin(x,y){

  ctx.fillStyle="#f3c62e";

  ctx.fillRect(
    x,
    y,
    16,
    16
  );

  ctx.fillStyle="#ffe875";

  ctx.fillRect(
    x+4,
    y+2,
    8,
    12
  );

  ctx.fillStyle="#b77b16";

  ctx.fillRect(
    x+2,
    y+3,
    2,
    10
  );

  ctx.fillRect(
    x+12,
    y+3,
    2,
    10
  );
}


/* =========================
   DRAW
   ========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Larger arena
  */

  ctx.fillStyle="#303030";

  ctx.fillRect(
    ARENA.x,
    ARENA.y,
    ARENA.w,
    ARENA.h
  );


  ctx.strokeStyle="#444";

  ctx.lineWidth=6;

  ctx.strokeRect(
    ARENA.x,
    ARENA.y,
    ARENA.w,
    ARENA.h
  );


  /*
    Floor pixels
  */

  for(
    let i=0;
    i<100;
    i++
  ){

    const x=
      ARENA.x+15+
      Math.random()*
      (ARENA.w-30);

    const y=
      ARENA.y+15+
      Math.random()*
      (ARENA.h-30);

    rectPixel(
      x,
      y,
      3,
      3,
      i%2
        ?"#353535"
        :"#3b3b3b"
    );
  }


  /*
    Gate is drawn behind enemies.
  */

  drawGate();


  /* =========================
     ENEMIES
     ========================= */

  for(const e of enemies){

    if(e.type==="goblin"){

      rectPixel(
        e.x-12,
        e.y-7,
        24,
        22,
        "#3c8f3d"
      );


      const punchRange=
        Math.hypot(
          p.x-e.x,
          p.y-e.y
        )<72;


      rectPixel(
        e.x-17,
        e.y-5,
        6,
        12,
        "#2e7130"
      );


      if(punchRange){

        const dir=
          p.x<e.x
          ?-1
          :1;

        rectPixel(
          e.x+dir*12,
          e.y-4,
          10,
          6,
          "#4ba747"
        );

        rectPixel(
          e.x+dir*20,
          e.y-6,
          7,
          10,
          "#2e7130"
        );

      }else{

        rectPixel(
          e.x+11,
          e.y-5,
          6,

/* =========================
   GAME LOOP
   ========================= */

function loop(){

  requestAnimationFrame(loop);


  if(
    !gameOver&&
    !paused
  ){

    if(!upgradeOpen){

      elapsed+=1/60;


      /* Bomb spawning */

      bombSpawnTimer-=1/60;

      if(bombSpawnTimer<=0){

        spawnBombPickup();

        bombSpawnTimer=20;

      }


      for(
        const bp of bombPickups
      ){

        bp.life-=1/60;

      }


      bombPickups=
        bombPickups.filter(
          bp=>bp.life>0
        );


      /* Pick up bombs */

      if(bombCount<3){

        for(
          let i=
            bombPickups.length-1;
          i>=0;
          i--
        ){

          if(
            Math.hypot(
              bombPickups[i].x-p.x,
              bombPickups[i].y-p.y
            )<28
          ){

            bombCount++;

            bombPickups.splice(
              i,
              1
            );

          }

        }

      }


      /* Upgrade timer */

      if(
        elapsed>=nextUpgrade
      ){

        upgradeOpen=true;

        nextUpgrade+=70;

      }


      /* Waves */

      const newWave=
        Math.floor(
          elapsed/10
        )+1;


      if(newWave>wave){

        wave=newWave;

        spawnWave(wave);

      }


      /* =========================
         MINI BOSSES
         ========================= */

      const bossMark=
        Math.floor(
          elapsed/50
        );


      if(
        bossMark>0&&
        !enemies.some(
          e=>
            e.type==="ogre"&&
            e.bossMark===bossMark
        )
      ){

        if(!window.lastBossMark){

          window.lastBossMark=0;

        }


        if(
          bossMark>
          window.lastBossMark
        ){

          /*
            spawnEnemy("ogre") now
            automatically uses the gate.
          */

          spawnEnemy("ogre");

          enemies[
            enemies.length-1
          ].bossMark=bossMark;

          window.lastBossMark=
            bossMark;

        }

      }


      /* =========================
         MOVEMENT
         ========================= */

      let dx=
        (
          keys.d||
          keys.arrowright
          ?1
          :0
        )-
        (
          keys.a||
          keys.arrowleft
          ?1
          :0
        );


      let dy=
        (
          keys.s||
          keys.arrowdown
          ?1
          :0
        )-
        (
          keys.w||
          keys.arrowup
          ?1
          :0
        );


      const m=
        Math.hypot(
          dx,
          dy
        )||1;


      p.x+=
        dx/m*
        p.speed;

      p.y+=
        dy/m*
        p.speed;


      /*
        Keep player inside the new
        larger arena and away from
        the gate wall.
      */

      p.x=
        Math.max(
          ARENA.x+20,
          Math.min(
            ARENA.x+ARENA.w-25,
            p.x
          )
        );

      p.y=
        Math.max(
          ARENA.y+20,
          Math.min(
            ARENA.y+ARENA.h-25,
            p.y
          )
        );


      /* Shooting */

      if(mouse.down){

        shoot();

      }


      if(fireCooldown>0){

        fireCooldown--;

      }


      /* Fireballs */

      for(
        const b of balls
      ){

        b.x+=b.vx;
        b.y+=b.vy;
        b.life--;

      }


      balls=
        balls.filter(
          b=>
            b.life>0&&
            b.x>ARENA.x&&
            b.x<ARENA.x+ARENA.w&&
            b.y>ARENA.y&&
            b.y<ARENA.y+ARENA.h
        );


      /* =========================
         BOMBS
         ========================= */

      for(
        const b of bombs
      ){

        if(!b.exploded){

          b.x+=b.vx;
          b.y+=b.vy;

          b.distance+=
            Math.hypot(
              b.vx,
              b.vy
            );

          b.life--;

          b.rotation+=0.15;


          if(
            b.distance>=BOMB_THROW_DISTANCE
          ){

            explodeBomb(b);

          }


          if(!b.exploded){

            const hit=
              enemies.find(
                e=>
                  Math.hypot(
                    b.x-e.x,
                    b.y-e.y
                  )<
                  e.r+b.r
              );

            if(hit){

              explodeBomb(b);

            }

          }


          if(
            !b.exploded&&
            (
              b.x<=ARENA.x||
              b.x>=ARENA.x+ARENA.w||
              b.y<=ARENA.y||
              b.y>=ARENA.y+ARENA.h
            )
          ){

            explodeBomb(b);

          }

        }else{

          b.disintegrate--;

        }

      }


      bombs=
        bombs.filter(
          b=>
            !b.exploded||
            b.disintegrate>0
        );


      /* =========================
         ENEMY MOVEMENT / COMBAT
         ========================= */

      for(
        const e of enemies
      ){

        const dx=
          p.x-e.x;

        const dy=
          p.y-e.y;

        const d=
          Math.hypot(
            dx,
            dy
          )||1;


        e.x+=
          dx/d*
          e.speed;

        e.y+=
          dy/d*
          e.speed;


        if(e.attack>0){

          e.attack--;

        }


        if(
          d<e.r+14&&
          e.attack<=0
        ){

          damagePlayer(e);

        }


        /* Fireball collisions */

        for(
          const b of balls
        ){

          if(
            Math.hypot(
              b.x-e.x,
              b.y-e.y
            )<
            e.r+b.r
          ){

            const impactX=b.x;
            const impactY=b.y;

            e.hp-=p.damage;

            e.burn=
              Math.max(
                e.burn,
                42
              );

            e.burnTick=0;

            b.life=0;

            burst(
              impactX,
              impactY,
              10
            );


            /* Splash damage */

            for(
              const other of enemies
            ){

              if(
                other!==e&&
                other.hp>0&&
                Math.hypot(
                  other.x-impactX,
                  other.y-impactY
                )<58
              ){

                other.hp-=
                  Math.max(
                    6,
                    p.damage*.45
                  );

                other.burn=
                  Math.max(
                    other.burn,
                    42
                  );

                other.burnTick=0;

              }

            }

          }

        }


        /* Burn damage */

        if(e.burn>0){

          e.burn--;

          e.burnTick++;

          if(
            e.burnTick%7===0
          ){

            e.hp-=2.5;

          }

        }

      }


      /* Remove dead enemies */

      const dead=
        enemies.filter(
          e=>e.hp<=0
        );

      dead.forEach(
        killEnemy
      );

      enemies=
        enemies.filter(
          e=>e.hp>0
        );


      /* Particles */

      for(
        const s of particles
      ){

        s.x+=s.vx;
        s.y+=s.vy;
        s.life--;

      }

      particles=
        particles.filter(
          s=>s.life>0
        );


      /* Heart regeneration */

      if(heartRegen>0){

        heartRegen-=1/60;

        if(
          heartRegen<=0
        ){

          regainHeart();

        }

      }

    }

  }


  draw();

}


loop();
