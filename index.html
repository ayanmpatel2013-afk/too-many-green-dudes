<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Too Many Green Dudes</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#252525;
  font-family:monospace;
}

canvas{
  display:block;
  margin:auto;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  cursor:crosshair;
}

button{
  font-family:monospace;
  cursor:pointer;
}

#musicNote{
  position:fixed;
  left:10px;
  top:10px;
  z-index:20;
  padding:7px 10px;
  color:#d7d0b0;
  background:#171717;
  border:2px solid #514b3a;
  font:12px monospace;
}

#fullscreenBtn,
#pauseBtn{
  position:fixed;
  top:10px;
  z-index:20;
  padding:8px 12px;
  color:#fff;
  font-size:14px;
}

#fullscreenBtn{
  right:10px;
  background:#1e3d20;
  border:2px solid #65b95b;
}

#pauseBtn{
  right:145px;
  background:#3d301e;
  border:2px solid #d6b85a;
}
</style>
</head>

<body>

<button id="pauseBtn">PAUSE</button>
<button id="fullscreenBtn">FULLSCREEN</button>
<div id="musicNote">DUNGEON MUSIC: LOUD</div>

<canvas id="game" width="900" height="600"></canvas>

<script>

const c=document.getElementById("game");
const ctx=c.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=900;
const H=600;

const ARENA={
  left:160,
  top:45,
  right:875,
  bottom:570
};

const GATE={
  x:845,
  y:260,
  w:30,
  h:120
};

let keys={};

let mouse={
  x:450,
  y:300,
  down:false
};

let p;
let enemies=[];
let balls=[];
let particles=[];

let score=0;
let coins=0;
let wave=1;
let elapsed=0;

let gameOver=false;
let paused=false;
let upgradeOpen=false;

let startScreen=true;

let nextUpgrade=70;
let upgradeCost=10;

let upgradeCounts={
  health:0,
  damage:0,
  speed:0
};

let currentRandomUpgrade="damage";

let healthUpgradesSinceHeart=0;
let healthUpgradesNeededForHeart=1;

let goblinHits=0;
let ogreHits=0;

let hearts=3;
let heartRegen=0;

let shieldTimer=0;
let speedBoostTimer=0;

const SHIELD_DURATION=3;
const SHIELD_SPEED_MULTIPLIER=2;

let fireCooldown=0;

let bombCount=0;
let bombPickups=[];
let bombs=[];

let bombSpawnTimer=20;

const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=22;

let bigBoss=null;

let nextBigBoss=200;

let bossCountdown=0;
let bossCountdownValue=0;

let goblinBuffLevel=0;

const GOBLIN_HP_LEVEL_BONUS=.08;
const GOBLIN_SPEED_LEVEL_BONUS=.035;
const GOBLIN_DAMAGE_LEVEL_BONUS=.20;

let bossDefeated=false;

let victorySequence=false;
let victoryTimer=0;

let batDropped=false;

let bat={
  x:0,
  y:0,
  active:false,
  collected:false,
  pulse:0
};

let batAbility=false;

let batCooldown=0;

const BAT_COOLDOWN=17;

let batSwing=0;

let skeletonMode=false;

let skeletonLevel=0;

let skeletonUpgradeTimer=27;

let skeletonSpawnTimer=12;

const SKELETON_SPAWN_TIME=12;

let highscore=Number(
  localStorage.getItem(
    "pixelNatureHighscore"
  )||0
);

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

const SOUND_VOLUME=2;

function startMusic(){

  if(musicStarted)return;

  try{

    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );

  }catch(err){

    console.log(
      "Music unavailable:",
      err
    );

  }

}

function tone(
  freq,
  duration,
  type="square",
  volume=.08
){

  if(!audioCtx)return;

  const now=
    audioCtx.currentTime;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type=type;

  osc.frequency.value=freq;

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume*SOUND_VOLUME,
    now+.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);

  osc.stop(
    now+duration+.02
  );

}

function playMusicStep(){

  if(
    !audioCtx||
    gameOver||
    paused||
    startScreen
  ){
    return;
  }

  /*
    LOUD DUNGEON MUSIC
    Dark minor-key melody + deep bass + low drone + pulse.
    It is intentionally stronger than the other game sounds.
  */

  const melody=[
    110,110,130.81,146.83,
    110,98,110,82.41,
    110,130.81,146.83,164.81,
    146.83,130.81,110,98
  ];

  const bass=[
    55,55,65.41,55,
    49,49,55,41.20
  ];

  const now=audioCtx.currentTime;
  const step=musicStep;

  tone(
    melody[step%melody.length],
    .26,
    "triangle",
    .13
  );

  tone(
    bass[step%bass.length],
    .28,
    "sine",
    .16
  );

  if(step%2===0){
    tone(
      melody[(step+5)%melody.length]/2,
      .22,
      "sawtooth",
      .045
    );
  }

  if(step%4===0){
    tone(
      41.20,
      .18,
      "sine",
      .13
    );
  }

  if(step%8===7){
    tone(
      melody[(step+3)%melody.length]*2,
      .10,
      "square",
      .025
    );
  }

  musicStep++;
}
