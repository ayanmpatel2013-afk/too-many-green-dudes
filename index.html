<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Too Many Green Dudes</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#252525;
  font-family:monospace;
}

canvas{
  display:block;
  margin:auto;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  cursor:crosshair;
}

button{
  font-family:monospace;
  cursor:pointer;
}

#fullscreenBtn,
#pauseBtn{
  position:fixed;
  top:10px;
  z-index:10;
  padding:8px 12px;
  color:#fff;
  font-size:14px;
}

#fullscreenBtn{
  right:10px;
  background:#1e3d20;
  border:2px solid #65b95b;
}

#pauseBtn{
  right:145px;
  background:#3d301e;
  border:2px solid #d6b85a;
}
</style>
</head>

<body>

<button id="pauseBtn">PAUSE</button>
<button id="fullscreenBtn">FULLSCREEN</button>

<canvas id="game" width="900" height="600"></canvas>

<script>

const c=document.getElementById("game");
const ctx=c.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=900;
const H=600;

const ARENA={
  left:160,
  top:45,
  right:875,
  bottom:570
};

const GATE={
  x:845,
  y:260,
  w:30,
  h:120
};

let keys={};

let mouse={
  x:450,
  y:300,
  down:false
};

let p;
let enemies;
let balls;
let particles;
let score;
let coins;
let wave;
let elapsed;
let gameOver;
let upgradeOpen;
let nextUpgrade;

let paused=false;

let upgradeCost=10;

let upgradeCounts={
  health:0,
  damage:0,
  speed:0
};

let goblinHits=0;
let ogreHits=0;

let hearts=3;
let heartRegen=0;

/* SHIELD */
let shieldTimer=0;
const SHIELD_DURATION=3;

let fireCooldown=0;

let bombCount=0;
let bombPickups=[];
let bombs=[];
let bombSpawnTimer=20;

let highscore=Number(
  localStorage.getItem("pixelNatureHighscore")||0
);

let bigBoss=null;

let nextBigBoss=200;
let bossCountdown=0;
let bossCountdownValue=0;

let goblinBuffLevel=0;

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

const SOUND_VOLUME=2;


/* =========================
   AUDIO
========================= */

function startMusic(){

  if(musicStarted)return;

  try{

    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );

  }catch(err){

    console.log(
      "Music unavailable:",
      err
    );

  }
}


function playFireballSound(){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(
    240,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    90,
    now+0.09
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.07*SOUND_VOLUME,
    now+0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.10
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.11);
}


function playBombExplosionSound(){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const boom=audioCtx.createOscillator();
  const boomGain=audioCtx.createGain();

  boom.type="square";

  boom.frequency.setValueAtTime(
    105,
    now
  );

  boom.frequency.exponentialRampToValueAtTime(
    38,
    now+0.22
  );

  boomGain.gain.setValueAtTime(
    0.0001,
    now
  );

  boomGain.gain.exponentialRampToValueAtTime(
    0.24*SOUND_VOLUME,
    now+0.015
  );

  boomGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.25
  );

  boom.connect(boomGain);
  boomGain.connect(audioCtx.destination);

  boom.start(now);
  boom.stop(now+0.27);

  const crack=audioCtx.createOscillator();
  const crackGain=audioCtx.createGain();

  crack.type="square";

  crack.frequency.setValueAtTime(
    900,
    now
  );

  crack.frequency.exponentialRampToValueAtTime(
    180,
    now+0.12
  );

  crackGain.gain.setValueAtTime(
    0.0001,
    now
  );

  crackGain.gain.exponentialRampToValueAtTime(
    0.11*SOUND_VOLUME,
    now+0.005
  );

  crackGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.14
  );

  crack.connect(crackGain);
  crackGain.connect(audioCtx.destination);

  crack.start(now);
  crack.stop(now+0.15);

  const click=audioCtx.createOscillator();
  const clickGain=audioCtx.createGain();

  click.type="square";
  click.frequency.value=1400;

  clickGain.gain.setValueAtTime(
    0.05*SOUND_VOLUME,
    now
  );

  clickGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.035
  );

  click.connect(clickGain);
  clickGain.connect(audioCtx.destination);

  click.start(now);
  click.stop(now+0.04);
}


function playBossSound(){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(
    80,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    35,
    now+0.6
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.28*SOUND_VOLUME,
    now+0.05
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.7
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.72);
}


function playMusicStep(){

  if(!audioCtx||gameOver)return;
  if(paused)return;

  const notes=[
    110,130.81,146.83,164.81,
    196,164.81,146.83,130.81,
    110,146.83,164.81,196,
    220,196,164.81,146.83
  ];

  const bass=[
    55,55,65.41,65.41,
    73.42,73.42,82.41,82.41
  ];

  const now=audioCtx.currentTime;

  const note=
    notes[musicStep%notes.length];

  const bassNote=
    bass[musicStep%bass.length];

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="triangle";
  osc.frequency.value=note;

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.13*SOUND_VOLUME,
    now+0.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.25
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.26);

  const bassOsc=audioCtx.createOscillator();
  const bassGain=audioCtx.createGain();

  bassOsc.type="sine";
  bassOsc.frequency.value=bassNote;

  bassGain.gain.setValueAtTime(
    0.0001,
    now
  );

  bassGain.gain.exponentialRampToValueAtTime(
    0.15*SOUND_VOLUME,
    now+0.02
  );

  bassGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.24
  );

  bassOsc.connect(bassGain);
  bassGain.connect(audioCtx.destination);

  bassOsc.start(now);
  bassOsc.stop(now+0.25);

  musicStep++;
}


/* =========================
   BUTTONS
========================= */

const fullscreenBtn=
  document.getElementById(
    "fullscreenBtn"
  );

fullscreenBtn.addEventListener(
  "click",
  async()=>{

    try{

      if(!document.fullscreenElement){

        await document.documentElement.requestFullscreen();

        fullscreenBtn.textContent=
          "EXIT FULLSCREEN";

      }else{

        await document.exitFullscreen();

        fullscreenBtn.textContent=
          "FULLSCREEN";

      }

    }catch(err){

      console.log(
        "Fullscreen unavailable:",
        err
      );

    }

  }
);


document.addEventListener(
  "fullscreenchange",
  ()=>{

    fullscreenBtn.textContent=
      document.fullscreenElement
      ?"EXIT FULLSCREEN"
      :"FULLSCREEN";

  }
);


const pauseBtn=
  document.getElementById(
    "pauseBtn"
  );


function togglePause(){

  if(gameOver)return;

  paused=!paused;

  pauseBtn.textContent=
    paused
    ?"RESUME"
    :"PAUSE";
}


pauseBtn.addEventListener(
  "click",
  togglePause
);


window.addEventListener(
  "keydown",
  e=>{

    if(
      e.key.toLowerCase()==="p" &&
      !e.repeat
    ){

      togglePause();

    }

  }
);


/* =========================
   RESET
========================= */

function reset(){

  p={
    x:430,
    y:305,
    speed:3.2,
    damage:28,
    maxHp:100,
    hp:100
  };

  enemies=[];
  balls=[];
  particles=[];

  score=0;
  coins=0;
  wave=1;
  elapsed=0;
  gameOver=false;

  paused=false;
  upgradeOpen=false;

  nextUpgrade=70;

  upgradeCost=10;

  upgradeCounts={
    health:0,
    damage:0,
    speed:0
  };

  goblinHits=0;
  ogreHits=0;

  hearts=3;
  heartRegen=0;

  shieldTimer=0;

  fireCooldown=0;

  bombCount=0;
  bombPickups=[];
  bombs=[];
  bombSpawnTimer=20;

  bigBoss=null;

  nextBigBoss=200;
  bossCountdown=0;
  bossCountdownValue=0;

  goblinBuffLevel=0;

  window.lastBossMark=0;

  spawnWave(1);
}


reset();


/* =========================
   INPUT
========================= */

window.addEventListener(
  "keydown",
  e=>{

    startMusic();

    keys[
      e.key.toLowerCase()
    ]=true;

    if(
      e.key.toLowerCase()==="r" &&
      gameOver
    ){

      reset();
      return;

    }

    if(
      e.key.toLowerCase()==="q" &&
      !e.repeat
    ){

      throwBomb();

    }

    if(upgradeOpen){

      if(e.key==="1")
        buyUpgrade("health");

      if(e.key==="2")
        buyUpgrade("damage");

      if(e.key==="3")
        buyUpgrade("speed");

      if(e.key==="4")
        buyUpgrade("nothing");

    }

  }
);


window.addEventListener(
  "keyup",
  e=>{

    keys[
      e.key.toLowerCase()
    ]=false;

  }
);


c.addEventListener(
  "mousemove",
  e=>{

    const r=
      c.getBoundingClientRect();

    mouse.x=
      (e.clientX-r.left)*
      W/r.width;

    mouse.y=
      (e.clientY-r.top)*
      H/r.height;

  }
);


c.addEventListener(
  "mousedown",
  ()=>{

    startMusic();

    mouse.down=true;

  }
);


window.addEventListener(
  "mouseup",
  ()=>{

    mouse.down=false;

  }
);


/* =========================
   SPAWNING
========================= */

function gateSpawnPosition(){

  return{
    x:GATE.x-4,
    y:
      GATE.y+
      GATE.h/2+
      (Math.random()-0.5)*45
  };

}


function spawnEnemy(type="goblin"){

  if(
    bigBoss||
    bossCountdown>0
  ){

    return;

  }

  const pos=gateSpawnPosition();

  const x=pos.x;
  const y=pos.y;

  if(type==="ogre"){

    const hp=
      260+
      Math.floor(elapsed/50)*35;

    enemies.push({

      type:"ogre",

      x,
      y,

      spawnX:x,
      spawnY:y,

      r:30,

      hp,
      maxHp:hp,

      speed:
        .42+
        Math.min(
          .18,
          elapsed/2000
        ),

      attack:0,
      burn:0,
      burnTick:0

    });

  }else{

    const buff=
      goblinBuffLevel;

    const hp=
      Math.round(
        (45+wave*8)*
        (1+buff*.20)
      );

    const damage=
      1+buff;

    const speed=
      .72+
      wave*.025+
      buff*.10;

    enemies.push({

      type:"goblin",

      x,
      y,

      spawnX:x,
      spawnY:y,

      r:14,

      hp,
      maxHp:hp,

      speed,

      damage,

      attack:0,
      burn:0,
      burnTick:0

    });

  }

}


function spawnWave(n){

  if(bigBoss||bossCountdown>0)return;

  for(
    let i=0;
    i<n;
    i++
  ){

    spawnEnemy("goblin");

  }

}


/* =========================
   BIG BOSS
========================= */

function spawnBigBoss(){

  if(bigBoss)return;

  const pos=
    gateSpawnPosition();

  bigBoss={

    type:"bigboss",

    x:pos.x+5,
    y:pos.y,

    r:48,

    hp:2400,
    maxHp:2400,

    /* BIG BOSS SPEED = 3.3 */
    speed:3.3,

    attack:0,
    burn:0,
    burnTick:0,

    rotation:0,

    spawnFlash:35

  };

  enemies=[];

  playBossSound();

}


function defeatBigBoss(){

  if(!bigBoss)return;

  score+=50;
  coins+=50;

  burst(
    bigBoss.x,
    bigBoss.y,
    60
  );

  for(
    let i=0;
    i<35;
    i++
  ){

    particles.push({

      x:bigBoss.x,
      y:bigBoss.y,

      vx:
        (Math.random()-.5)*9,

      vy:
        (Math.random()-.5)*9,

      life:
        25+
        Math.random()*30

    });

  }

  bigBoss=null;

  nextBigBoss=
    Math.ceil(
      (elapsed+.01)/200
    )*200;

}


function addCoins(n){
  coins+=n;
}


function killEnemy(e){

  if(e.type==="ogre"){

    addCoins(7);
    score+=7;

    burst(
      e.x,
      e.y,
      22
    );

  }else{

    addCoins(1);
    score++;

    burst(
      e.x,
      e.y,
      10
    );

  }

}


/* =========================
   SHOOTING
========================= */

function shoot(){

  if(
    fireCooldown>0||
    upgradeOpen||
    gameOver||
    paused
  ){

    return;

  }

  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );

  balls.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*8,

    vy:
      Math.sin(a)*8,

    r:7,
    life:90

  });

  fireCooldown=60;

  playFireballSound();

}


/* =========================
   BOMBS
========================= */

function spawnBombPickup(){

  if(bigBoss||bossCountdown>0)return;

  const x=
    ARENA.left+50+
    Math.random()*
    (ARENA.right-ARENA.left-100);

  const y=
    90+
    Math.random()*430;

  bombPickups.push({

    x,
    y,
    life:7

  });

}


const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=22;


function throwBomb(){

  if(
    gameOver||
    upgradeOpen||
    paused||
    bombCount<=0
  ){

    return;

  }

  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );

  bombCount--;

  bombs.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*7,

    vy:
      Math.sin(a)*7,

    life:120,

    r:9,

    distance:0,

    exploded:false,

    disintegrate:0,

    rotation:0

  });

}


function explodeBomb(b){

  if(b.exploded)return;

  b.exploded=true;

  b.disintegrate=
    BOMB_DISINTEGRATE_TIME;

  b.vx=0;
  b.vy=0;

  playBombExplosionSound();

  burst(
    b.x,
    b.y,
    42
  );

  for(
    let i=0;
    i<18;
    i++
  ){

    particles.push({

      x:b.x,
      y:b.y,

      vx:
        (Math.random()-.5)*7,

      vy:
        (Math.random()-.5)*7,

      life:
        18+
        Math.random()*15

    });

  }

  if(bigBoss){

    const d=
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      );

    if(d<145){

      bigBoss.hp-=
        bigBoss.maxHp*.20;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

    }

  }

  for(
    const e of enemies
  ){

    const d=
      Math.hypot(
        b.x-e.x,
        b.y-e.y
      );

    if(d<115){

      e.hp-=
        e.type==="ogre"
        ?e.maxHp*.5
        :e.maxHp*.75;

      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

    }

  }

}


/* =========================
   HEART / DAMAGE SYSTEM
========================= */

function damagePlayer(e){

  e.attack=45;

  if(e.type==="goblin"){

    goblinHits+=e.damage||1;

    if(goblinHits>=4){

      goblinHits=0;
      loseHeart();

    }

  }else{

    ogreHits++;

    if(ogreHits>=2){

      ogreHits=0;
      loseHeart();

    }

  }

}


function loseHeart(){

  if(hearts<=0)return;

  hearts--;

  /*
    SHIELD ACTIVATES EVERY TIME
    THE PLAYER LOSES A HEART.
  */
  shieldTimer=SHIELD_DURATION;

  heartRegen=30;

  if(hearts<=0){
    endGame();
  }

}


function regainHeart(){

  if(hearts<3){

    hearts++;
    heartRegen=0;

  }

}


function endGame(){

  gameOver=true;

  if(score>highscore){

    highscore=score;

    localStorage.setItem(
      "pixelNatureHighscore",
      highscore
    );

  }

}


/* =========================
   UPGRADES
========================= */

function buyUpgrade(kind){

  if(kind==="nothing"){

    upgradeOpen=false;
    return;

  }

  if(
    !upgradeOpen||
    coins<upgradeCost
  ){

    return;

  }

  coins-=upgradeCost;

  if(kind==="health"){

    p.maxHp+=20;

    p.hp=
      Math.min(
        p.maxHp,
        p.hp+20
      );

  }

  if(kind==="damage"){
    p.damage+=12;
  }

  if(kind==="speed"){
    p.speed+=.4;
  }

  upgradeCounts[kind]++;

  upgradeCost+=10;

  upgradeOpen=false;

}


/* =========================
   PARTICLES
========================= */

function burst(x,y,n=8){

  for(
    let i=0;
    i<n;
    i++
  ){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*4,

      vy:
        (Math.random()-.5)*4,

      life:22

    });

  }

}


/* =========================
   DRAW HELPERS
========================= */

function rectPixel(
  x,
  y,
  w,
  h,
  color
){

  ctx.fillStyle=color;

  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,
    h
  );

}


/* =========================
   GATE
========================= */

function drawGate(){

  rectPixel(
    GATE.x-10,
    GATE.y-10,
    GATE.w+20,
    GATE.h+20,
    "#111"
  );

  rectPixel(
    GATE.x-5,
    GATE.y-5,
    GATE.w+10,
    GATE.h+10,
    "#5a3824"
  );

  rectPixel(
    GATE.x,
    GATE.y,
    GATE.w,
    GATE.h,
    "#090909"
  );

  for(
    let i=0;
    i<5;
    i++
  ){

    rectPixel(
      GATE.x+3+i*6,
      GATE.y+3,
      4,
      GATE.h-6,
      "#888"
    );

    rectPixel(
      GATE.x+4+i*6,
      GATE.y+3,
      2,
      GATE.h-6,
      "#bbb"
    );

  }

  for(
    let i=0;
    i<4;
    i++
  ){

    rectPixel(
      GATE.x,
      GATE.y+18+i*25,
      GATE.w,
      5,
      "#777"
    );

  }

  rectPixel(
    GATE.x-8,
    GATE.y+12,
    8,
    12,
    "#333"
  );

  rectPixel(
    GATE.x-8,
    GATE.y+GATE.h-24,
    8,
    12,
    "#333"
  );

}


/* =========================
   BIG BOSS DRAW
========================= */

function drawBigBoss(){

  if(!bigBoss)return;

  const e=bigBoss;

  ctx.save();

  rectPixel(
    e.x-42,
    e.y+40,
    84,
    12,
    "#151515"
  );

  rectPixel(
    e.x-40,
    e.y-30,
    80,
    78,
    "#28652c"
  );

  rectPixel(
    e.x-55,
    e.y-23,
    18,
    38,
    "#327b35"
  );

  rectPixel(
    e.x+37,
    e.y-23,
    18,
    38,
    "#327b35"
  );

  rectPixel(
    e.x-34,
    e.y-55,
    68,
    55,
    "#3c8f3d"
  );

  rectPixel(
    e.x-45,
    e.y-40,
    12,

        "+0.4 MOVE",
        500
      ],

      [
        "4",
        "NOTHING",
        "FREE",
        705
      ]

    ];

    for(
      const [n,t,d,x]
      of cards
    ){

      ctx.fillStyle=
        t==="NOTHING"
        ?"#183c1d"
        :"#1e3d20";

      ctx.fillRect(
        x,
        235,
        170,
        130
      );

      ctx.strokeStyle=
        t==="NOTHING"
        ?"#8ee889"
        :"#65b95b";

      ctx.lineWidth=4;

      ctx.strokeRect(
        x,
        235,
        170,
        130
      );

      ctx.fillStyle="#bdebb5";
      ctx.font="21px monospace";

      ctx.fillText(
        n+". "+t,
        x+15,
        275
      );

      ctx.font="14px monospace";

      ctx.fillText(
        d,
        x+25,
        310
      );

      ctx.fillText(
        t==="NOTHING"
        ?"SKIP"
        :"BUY",
        x+60,
        340
      );

    }

    ctx.fillStyle="#fff";
    ctx.font="14px monospace";

    ctx.fillText(
      "If you can't afford an upgrade, choose NOTHING.",
      275,
      405
    );

  }


  /* =========================
     LOW HEALTH RED CORNERS
  ========================= */

  if(
    hearts===1 &&
    !gameOver
  ){

    const pulse=
      0.16+
      0.07*
      (
        0.5+
        0.5*
        Math.sin(
          performance.now()/180
        )
      );

    ctx.save();


    /* TOP */

    const gTop=
      ctx.createLinearGradient(
        0,
        0,
        0,
        120
      );

    gTop.addColorStop(
      0,
      `rgba(255,0,0,${pulse})`
    );

    gTop.addColorStop(
      1,
      "rgba(255,0,0,0)"
    );

    ctx.fillStyle=gTop;

    ctx.fillRect(
      0,
      0,
      W,
      120
    );


    /* BOTTOM */

    const gBottom=
      ctx.createLinearGradient(
        0,
        H-120,
        0,
        H
      );

    gBottom.addColorStop(
      0,
      "rgba(255,0,0,0)"
    );

    gBottom.addColorStop(
      1,
      `rgba(255,0,0,${pulse})`
    );

    ctx.fillStyle=gBottom;

    ctx.fillRect(
      0,
      H-120,
      W,
      120
    );


    /* LEFT */

    const gLeft=
      ctx.createLinearGradient(
        0,
        0,
        120,
        0
      );

    gLeft.addColorStop(
      0,
      `rgba(255,0,0,${pulse})`
    );

    gLeft.addColorStop(
      1,
      "rgba(255,0,0,0)"
    );

    ctx.fillStyle=gLeft;

    ctx.fillRect(
      0,
      0,
      120,
      H
    );


    /* RIGHT */

    const gRight=
      ctx.createLinearGradient(
        W,
        0,
        W-120,
        0
      );

    gRight.addColorStop(
      0,
      `rgba(255,0,0,${pulse})`
    );

    gRight.addColorStop(
      1,
      "rgba(255,0,0,0)"
    );

    ctx.fillStyle=gRight;

    ctx.fillRect(
      W-120,
      0,
      120,
      H
    );

    ctx.restore();

  }


  /* =========================
     PAUSED
  ========================= */

  if(paused){

    ctx.fillStyle="#000";
    ctx.globalAlpha=.72;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.textAlign="center";

    ctx.fillStyle="#fff";
    ctx.font="46px monospace";

    ctx.fillText(
      "PAUSED",
      W/2,
      280
    );

    ctx.font="18px monospace";

    ctx.fillText(
      "Press P or click RESUME",
      W/2,
      320
    );

    ctx.textAlign="left";

  }


  /* =========================
     GAME OVER
  ========================= */

  if(gameOver){

    ctx.fillStyle="#000";
    ctx.globalAlpha=.8;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.fillStyle="#fff";
    ctx.font="42px monospace";

    ctx.fillText(
      "GAME OVER",
      350,
      260
    );

    ctx.font="18px monospace";

    ctx.fillText(
      "Score: "+
      score+
      "   High Score: "+
      highscore,
      320,
      300
    );

    ctx.fillText(
      "Press R to restart",
      355,
      340
    );

  }

}


/* =========================
   GAME LOOP
========================= */

function loop(){

  requestAnimationFrame(loop);

  if(
    !gameOver &&
    !paused
  ){

    /* =========================
       BOSS COUNTDOWN
    ========================= */

    if(
      !bigBoss &&
      bossCountdown<=0 &&
      elapsed>=nextBigBoss
    ){

      bossCountdown=3;
      bossCountdownValue=3;

    }


    if(bossCountdown>0){

      bossCountdown-=1/60;

      const newValue=
        Math.ceil(
          bossCountdown
        );

      if(
        newValue!==bossCountdownValue &&
        newValue>=1
      ){

        bossCountdownValue=newValue;

      }

      if(bossCountdown<=0){

        bossCountdown=0;

        spawnBigBoss();

      }

    }


    elapsed+=1/60;


    /* =========================
       SHIELD TIMER
    ========================= */

    if(shieldTimer>0){

      shieldTimer=
        Math.max(
          0,
          shieldTimer-1/60
        );

    }


    /* =========================
       GOBLIN LEVEL
    ========================= */

    const newGoblinBuff=
      Math.floor(
        elapsed/27
      );

    if(
      newGoblinBuff>
      goblinBuffLevel
    ){

      goblinBuffLevel=
        newGoblinBuff;

    }


    /* =========================
       BIG BOSS MOVEMENT
    ========================= */

    if(bigBoss){

      const dx=
        p.x-bigBoss.x;

      const dy=
        p.y-bigBoss.y;

      const d=
        Math.hypot(
          dx,
          dy
        )||1;


      /* BIG BOSS SPEED = 3.3 */

      bigBoss.x+=
        dx/d*
        bigBoss.speed;

      bigBoss.y+=
        dy/d*
        bigBoss.speed;


      if(bigBoss.attack>0){
        bigBoss.attack--;
      }


      /*
        SHIELD PREVENTS DAMAGE.
      */

      if(
        d<bigBoss.r+16&&
        bigBoss.attack<=0
      ){

        bigBoss.attack=35;

        if(shieldTimer<=0){

          loseHeart();

        }

      }


      /* Boss hit by fireballs */

      for(
        const b of balls
      ){

        if(
          Math.hypot(
            b.x-bigBoss.x,
            b.y-bigBoss.y
          )<
          bigBoss.r+b.r
        ){

          bigBoss.hp-=p.damage;

          bigBoss.burn=
            Math.max(
              bigBoss.burn,
              42
            );

          bigBoss.burnTick=0;

          b.life=0;

          burst(
            b.x,
            b.y,
            14
          );

        }

      }


      if(bigBoss.burn>0){

        bigBoss.burn--;
        bigBoss.burnTick++;

        if(
          bigBoss.burnTick%7===0
        ){

          bigBoss.hp-=3;

        }

      }


      if(bigBoss.hp<=0){

        defeatBigBoss();

      }

    }


    /* =========================
       NORMAL SPAWNING
    ========================= */

    if(
      !bigBoss &&
      bossCountdown<=0
    ){

      bombSpawnTimer-=1/60;

      if(bombSpawnTimer<=0){

        spawnBombPickup();

        bombSpawnTimer=20;

      }


      for(
        const bp of bombPickups
      ){

        bp.life-=1/60;

      }


      bombPickups=
        bombPickups.filter(
          bp=>bp.life>0
        );


      if(bombCount<3){

        for(
          let i=
            bombPickups.length-1;
          i>=0;
          i--
        ){

          if(
            Math.hypot(
              bombPickups[i].x-p.x,
              bombPickups[i].y-p.y
            )<28
          ){

            bombCount++;

            bombPickups.splice(
              i,
              1
            );

          }

        }

      }


      /* Upgrade timer */

      if(
        elapsed>=nextUpgrade
      ){

        upgradeOpen=true;

        nextUpgrade+=70;

      }


      /* Waves */

      const newWave=
        Math.floor(
          elapsed/10
        )+1;

      if(newWave>wave){

        wave=newWave;

        spawnWave(wave);

      }


      /* Ogre */

      const bossMark=
        Math.floor(
          elapsed/50
        );

      if(
        bossMark>0 &&
        !enemies.some(
          e=>
            e.type==="ogre" &&
            e.bossMark===bossMark
        )
      ){

        if(!window.lastBossMark){

          window.lastBossMark=0;

        }

        if(
          bossMark>
          window.lastBossMark
        ){

          spawnEnemy("ogre");

          if(enemies.length){

            enemies[
              enemies.length-1
            ].bossMark=
              bossMark;

          }

          window.lastBossMark=
            bossMark;

        }

      }

    }


    /* =========================
       PLAYER MOVEMENT
    ========================= */

    if(!upgradeOpen){

      let dx=
        (
          keys.d||
          keys.arrowright
          ?1
          :0
        )-
        (
          keys.a||
          keys.arrowleft
          ?1
          :0
        );

      let dy=
        (
          keys.s||
          keys.arrowdown
          ?1
          :0
        )-
        (
          keys.w||
          keys.arrowup
          ?1
          :0
        );


      const m=
        Math.hypot(
          dx,
          dy
        )||1;


      /*
        NORMAL SPEED = p.speed
        SHIELD SPEED = p.speed * 2
      */

      const currentMoveSpeed=
        p.speed*
        (
          shieldTimer>0
          ?2
          :1
        );


      p.x+=
        dx/m*
        currentMoveSpeed;

      p.y+=
        dy/m*
        currentMoveSpeed;


      p.x=
        Math.max(
          ARENA.left+15,
          Math.min(
            ARENA.right-20,
            p.x
          )
        );


      p.y=
        Math.max(
          ARENA.top+20,
          Math.min(
            ARENA.bottom-30,
            p.y
          )
        );


      if(mouse.down){
        shoot();
      }


      if(fireCooldown>0){
        fireCooldown--;
      }


      /* =========================
         FIREBALL MOVEMENT
      ========================= */

      for(
        const b of balls
      ){

        b.x+=b.vx;
        b.y+=b.vy;

        b.life--;

      }


      balls=
        balls.filter(
          b=>
            b.life>0&&
            b.x>ARENA.left&&
            b.x<ARENA.right&&
            b.y>ARENA.top&&
            b.y<ARENA.bottom
        );


      /* =========================
         BOMB MOVEMENT
      ========================= */

      for(
        const b of bombs
      ){

        if(!b.exploded){

          b.x+=b.vx;
          b.y+=b.vy;

          b.distance+=
            Math.hypot(
              b.vx,
              b.vy
            );

          b.life--;

          b.rotation+=0.15;


          if(
            b.distance>=
            BOMB_THROW_DISTANCE
          ){

            explodeBomb(b);

          }


          if(!b.exploded){

            const hit=
              enemies.find(
                e=>
                  Math.hypot(
                    b.x-e.x,
                    b.y-e.y
                  )<
                  e.r+b.r
              );

            if(hit){

              explodeBomb(b);

            }

          }


          if(
            !b.exploded&&
            (
              b.x<=ARENA.left||
              b.x>=ARENA.right||
              b.y<=ARENA.top||
              b.y>=ARENA.bottom
            )
          ){

            explodeBomb(b);

          }

        }else{

          b.disintegrate--;

        }

      }


      bombs=
        bombs.filter(
          b=>
            !b.exploded||
            b.disintegrate>0
        );


      /* =========================
         ENEMY MOVEMENT
      ========================= */

      for(
        const e of enemies
      ){

        const dx=
          p.x-e.x;

        const dy=
          p.y-e.y;

        const d=
          Math.hypot(
            dx,
            dy
          )||1;


        e.x+=
          dx/d*
          e.speed;

        e.y+=
          dy/d*
          e.speed;


        if(e.attack>0){
          e.attack--;
        }


        /*
          SHIELD PROTECTS PLAYER
          FROM ENEMY DAMAGE.
        */

        if(
          d<e.r+14&&
          e.attack<=0
        ){

          if(shieldTimer<=0){

            damagePlayer(e);

          }else{

            /*
              Enemy still gets its
              attack cooldown while
              the shield blocks it.
            */

            e.attack=45;

          }

        }


        /* Enemy hit by fireballs */

        for(
          const b of balls
        ){

          if(
            Math.hypot(
              b.x-e.x,
              b.y-e.y
            )<
            e.r+b.r
          ){

            const impactX=b.x;
            const impactY=b.y;

            e.hp-=p.damage;

            e.burn=
              Math.max(
                e.burn,
                42
              );

            e.burnTick=0;

            b.life=0;

            burst(
              impactX,
              impactY,
              10
            );


            for(
              const other of enemies
            ){

              if(
                other!==e&&
                other.hp>0&&
                Math.hypot(
                  other.x-impactX,
                  other.y-impactY
                )<58
              ){

                other.hp-=
                  Math.max(
                    6,
                    p.damage*.45
                  );

                other.burn=
                  Math.max(
                    other.burn,
                    42
                  );

                other.burnTick=0;

              }

            }

          }

        }


        /* Burn damage */

        if(e.burn>0){

          e.burn--;

          e.burnTick++;

          if(
            e.burnTick%7===0
          ){

            e.hp-=2.5;

          }

        }

      }


      /* =========================
         DEAD ENEMIES
      ========================= */

      const dead=
        enemies.filter(
          e=>e.hp<=0
        );

      dead.forEach(
        killEnemy
      );

      enemies=
        enemies.filter(
          e=>e.hp>0
        );


      /* =========================
         PARTICLES
      ========================= */

      for(
        const s of particles
      ){

        s.x+=s.vx;
        s.y+=s.vy;

        s.life--;

      }


      particles=
        particles.filter(
          s=>s.life>0
        );


      /* =========================
         HEART REGEN
      ========================= */

      if(heartRegen>0){

        heartRegen-=1/60;

        if(
          heartRegen<=0
        ){

          regainHeart();

        }

      }

    }

  }


  draw();

}


loop();

</script>
