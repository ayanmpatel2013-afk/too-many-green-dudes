<script>

const c=document.getElementById("game");
const ctx=c.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=900,H=600;


/* =========================
   ARENA
   ========================= */

const ARENA={
  left:25,
  top:45,
  right:875,
  bottom:555
};


/* =========================
   INPUT
   ========================= */

let keys={};

let mouse={
  x:450,
  y:300,
  down:false
};


/* =========================
   GAME STATE
   ========================= */

let p,enemies,balls,particles,score,coins,wave,elapsed,gameOver,upgradeOpen,nextUpgrade;

let upgradeCost=10;

let upgradeCounts={
  health:0,
  damage:0,
  speed:0
};

let goblinHits=0;
let ogreHits=0;
let hearts=3;
let heartRegen=0;

let fireCooldown=0;

let bombCount=0;
let bombPickups=[];
let bombs=[];
let bombSpawnTimer=20;

let paused=false;


/* =========================
   BIG BOSS
   ========================= */

let bigBoss=null;

let bossCountdownActive=false;
let bossCountdown=0;
let bossCountdownTimer=0;

let nextBigBossTime=200;

let bossDefeatedCount=0;


/* =========================
   GATE
   ========================= */

const GATE_X=835;
const GATE_Y=265;
const GATE_W=55;
const GATE_H=150;

let gateAnimation=0;


/* =========================
   HIGH SCORE
   ========================= */

let highscore=Number(
  localStorage.getItem("pixelNatureHighscore")||0
);


/* =========================
   AUDIO
   ========================= */

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;


/*
  EVERYTHING IS 2X LOUDER.
*/

const AUDIO_VOLUME_MULTIPLIER=2;


function startMusic(){

  if(musicStarted)return;

  try{

    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );

  }catch(err){

    console.log(
      "Music unavailable:",
      err
    );
  }
}


/* =========================
   FIREBALL SOUND
   ========================= */

function playFireballSound(){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(
    240,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    90,
    now+0.09
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.035* AUDIO_VOLUME_MULTIPLIER,
    now+0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.10
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.11);
}


/* =========================
   BOMB SOUND
   ========================= */

function playBombExplosionSound(){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;


  const boom=
    audioCtx.createOscillator();

  const boomGain=
    audioCtx.createGain();

  boom.type="square";

  boom.frequency.setValueAtTime(
    105,
    now
  );

  boom.frequency.exponentialRampToValueAtTime(
    38,
    now+0.22
  );

  boomGain.gain.setValueAtTime(
    0.0001,
    now
  );

  boomGain.gain.exponentialRampToValueAtTime(
    0.12*AUDIO_VOLUME_MULTIPLIER,
    now+0.015
  );

  boomGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.25
  );

  boom.connect(boomGain);
  boomGain.connect(audioCtx.destination);

  boom.start(now);
  boom.stop(now+0.27);


  const crack=
    audioCtx.createOscillator();

  const crackGain=
    audioCtx.createGain();

  crack.type="square";

  crack.frequency.setValueAtTime(
    900,
    now
  );

  crack.frequency.exponentialRampToValueAtTime(
    180,
    now+0.12
  );

  crackGain.gain.setValueAtTime(
    0.0001,
    now
  );

  crackGain.gain.exponentialRampToValueAtTime(

  );

  crackGain.gain.exponentialRampToValueAtTime(

  );

  crack.connect(crackGain);

  crack.start(now);

  const click=

    audioCtx.createGain();

  click.frequency.value=1400;

  clickGain.gain.setValueAtTime(

/* =========================
   BOSS SOUND
   ========================= */

function playBossSound(){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sawtooth";

  osc.frequency.setValueAtTime(
    75,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    28,
    now+0.8
  );

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.22*AUDIO_VOLUME_MULTIPLIER,
    now+0.05
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.9
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.95);
}


/* =========================
   MUSIC
   ========================= */

function playMusicStep(){

  if(
    !audioCtx||
    gameOver||
    paused
  )return;

  const notes=[
    110,130.81,146.83,164.81,
    196,164.81,146.83,130.81,
    110,146.83,164.81,196,
    220,196,164.81,146.83
  ];

  const bass=[
    55,55,65.41,65.41,
    73.42,73.42,82.41,82.41
  ];

  const now=audioCtx.currentTime;

  const note=
    notes[musicStep%notes.length];

  const bassNote=
    bass[musicStep%bass.length];


  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type="triangle";
  osc.frequency.value=note;

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.065*AUDIO_VOLUME_MULTIPLIER,
    now+0.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.25
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.26);


  const bassOsc=
    audioCtx.createOscillator();

  const bassGain=
    audioCtx.createGain();

  bassOsc.type="sine";
  bassOsc.frequency.value=bassNote;

  bassGain.gain.setValueAtTime(
    0.0001,
    now
  );

  bassGain.gain.exponentialRampToValueAtTime(
    0.075*AUDIO_VOLUME_MULTIPLIER,
    now+0.02
  );

  bassGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+0.24
  );

  bassOsc.connect(bassGain);
  bassGain.connect(audioCtx.destination);

  bassOsc.start(now);
  bassOsc.stop(now+0.25);

  musicStep++;
}

const fullscreenBtn=

    "fullscreenBtn"
  );

    try{

      if(!document.fullscreenElement){

        fullscreenBtn.textContent=

        fullscreenBtn.textContent=

      }

      console.log(

      );

);

  "fullscreenchange",
  ()=>{

      document.fullscreenElement

  }
);


/* =========================
   PAUSE
   ========================= */

const pauseBtn=
  document.getElementById(
    "pauseBtn"
  );


function togglePause(){

  if(gameOver)return;

  paused=!paused;

  pauseBtn.textContent=
    paused
    ?"RESUME"
    :"PAUSE";

}


pauseBtn.addEventListener(
  "click",
  ()=>{

    startMusic();
    togglePause();

  }
);


/* =========================
   RESET
   ========================= */

function reset(){

  p={
    x:430,
    y:300,
    speed:3.2,
    damage:28,
    maxHp:100,
    hp:100
  };

  enemies=[];
  balls=[];
  particles=[];

  score=0;
  coins=0;
  wave=1;
  elapsed=0;
  gameOver=false;
  paused=false;

  upgradeOpen=false;

  nextUpgrade=70;

  upgradeCost=10;

  upgradeCounts={
    health:0,
    damage:0,
    speed:0
  };

  goblinHits=0;
  ogreHits=0;

  hearts=3;
  heartRegen=0;

  fireCooldown=0;

  bombCount=0;
  bombPickups=[];
  bombs=[];
  bombSpawnTimer=20;

  bigBoss=null;

  bossCountdownActive=false;
  bossCountdown=0;
  bossCountdownTimer=0;

  nextBigBossTime=200;
  bossDefeatedCount=0;

  gateAnimation=0;

  window.lastBossMark=0;

  pauseBtn.textContent="PAUSE";

  spawnWave(1);
}


reset();


/* =========================
   INPUT
   ========================= */

window.addEventListener(
  "keydown",
  e=>{

    startMusic();

    const key=
      e.key.toLowerCase();

    keys[key]=true;


    if(key==="p"&&!e.repeat){

      togglePause();
      return;

    }


    if(
      key==="r" &&
      gameOver
    ){

      reset();
      return;
    }


    if(
      key==="q" &&
      !e.repeat
    ){

      throwBomb();
    }


    if(upgradeOpen){

      if(e.key==="1")
        buyUpgrade("health");

      if(e.key==="2")
        buyUpgrade("damage");

      if(e.key==="3")
        buyUpgrade("speed");

      if(e.key==="4")
        buyUpgrade("nothing");

    }

  }
);


window.addEventListener(
  "keyup",
  e=>{

    keys[
      e.key.toLowerCase()
    ]=false;

  }
);


c.addEventListener(
  "mousemove",
  e=>{

    const r=
      c.getBoundingClientRect();

    mouse.x=
      (e.clientX-r.left)*
      W/r.width;

    mouse.y=
      (e.clientY-r.top)*
      H/r.height;

  }
);


c.addEventListener(
  "mousedown",
  ()=>{

    startMusic();

    mouse.down=true;

  }
);


window.addEventListener(
  "mouseup",
  ()=>{

    mouse.down=false;

  }
);


/* =========================
   GATE SPAWN
   ========================= */

function getGateSpawnPosition(){

  return {

    x:GATE_X-12,
    y:
      GATE_Y+25+
      Math.random()*
      (GATE_H-50)

  };

}


/* =========================
   ENEMIES
   ========================= */

function spawnEnemy(type="goblin"){

  const pos=
    getGateSpawnPosition();

  const x=pos.x;
  const y=pos.y;


  if(type==="ogre"){

    const hp=
      260+
      Math.floor(elapsed/50)*35;

    enemies.push({

      type:"ogre",

      x,
      y,

      r:30,

      hp,
      maxHp:hp,

      speed:
        .42+
        Math.min(
          .18,
          elapsed/2000
        ),

      attack:0,
      burn:0,
      burnTick:0,

      gateSpawn:true

    });

  }else{

    const hp=
      45+wave*8;

    enemies.push({

      type:"goblin",

      x,
      y,

      r:14,

      hp,
      maxHp:hp,

      speed:
        .72+
        wave*.025,

      attack:0,
      burn:0,
      burnTick:0,

      gateSpawn:true

    });

  }

}


function spawnWave(n){

  if(
    bigBoss||
    bossCountdownActive
  )return;

  for(
    let i=0;
    i<n;
    i++
  ){

    spawnEnemy("goblin");

  }

}


/* =========================
   BIG BOSS
   ========================= */

function spawnBigBoss(){

  const pos=
    getGateSpawnPosition();

  const hp=
    3200+
    bossDefeatedCount*900+
    Math.floor(elapsed/200)*400;

  bigBoss={

    type:"bigboss",

    x:pos.x,
    y:pos.y,

    r:48,

    hp:hp,
    maxHp:hp,

    speed:.30,

    attack:0,

    burn:0,
    burnTick:0,

    gateSpawn:true,

    scarFlash:0

  };


  enemies=
    enemies.filter(
      e=>false
    );


  gateAnimation=1;

  playBossSound();

}


function startBossCountdown(){

  if(
    bossCountdownActive||
    bigBoss||
    gameOver
  )return;

  bossCountdownActive=true;

  bossCountdown=3;

  bossCountdownTimer=1;

}


function updateBossCountdown(){

  if(!bossCountdownActive)return;

  bossCountdownTimer-=1/60;

  if(
    bossCountdownTimer<=0
  ){

    bossCountdown--;

    bossCountdownTimer=1;


    if(bossCountdown<=0){

      bossCountdownActive=false;

      spawnBigBoss();

    }

  }

}


/* =========================
   SCORE / COINS
   ========================= */

function addCoins(n){

  coins+=n;

}


function killEnemy(e){

  if(e.type==="ogre"){

    addCoins(7);

    score+=7;

    burst(
      e.x,
      e.y,
      22
    );

  }else{

    addCoins(1);

    score++;

    burst(
      e.x,
      e.y,
      10
    );

  }

}


function killBigBoss(){

  if(!bigBoss)return;

  score+=100;
  coins+=50;

  burst(
    bigBoss.x,
    bigBoss.y,
    80
  );

  for(
    let i=0;
    i<50;
    i++
  ){

    particles.push({

      x:bigBoss.x,
      y:bigBoss.y,

      vx:
        (Math.random()-.5)*10,

      vy:
        (Math.random()-.5)*10,

      life:
        25+
        Math.random()*30

    });

  }


  bigBoss=null;

  bossDefeatedCount++;

  nextBigBossTime=
    Math.ceil(
      elapsed/200
    )*200+200;

}


/* =========================
   SHOOTING
   ========================= */

function shoot(){

  if(
    fireCooldown>0||
    upgradeOpen||
    gameOver||
    paused||
    bossCountdownActive
  ){

    return;
  }


  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );


  balls.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*8,

    vy:
      Math.sin(a)*8,

    r:7,
    life:90

  });


  fireCooldown=60;

  playFireballSound();
}


/* =========================
   BOMBS
   ========================= */

function spawnBombPickup(){

  const x=
    75+
    Math.random()*730;

  const y=
    90+
    Math.random()*410;


  bombPickups.push({

    x,
    y,
    life:7

  });

}


const BOMB_THROW_DISTANCE=300;

const BOMB_DISINTEGRATE_TIME=22;


function throwBomb(){

  if(
    gameOver||
    upgradeOpen||
    paused||
    bossCountdownActive||
    bombCount<=0
  ){

    return;
  }


  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );


  bombCount--;


  bombs.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*7,

    vy:
      Math.sin(a)*7,

    life:120,

    r:9,

    distance:0,

    exploded:false,

    disintegrate:0,

    rotation:0

  });

}


function explodeBomb(b){

  if(b.exploded)return;

  b.exploded=true;

  b.disintegrate=
    BOMB_DISINTEGRATE_TIME;

  b.vx=0;
  b.vy=0;

  playBombExplosionSound();

  burst(
    b.x,
    b.y,
    42
  );


  for(
    let i=0;
    i<18;
    i++
  ){

    particles.push({

      x:b.x,
      y:b.y,

      vx:
        (Math.random()-.5)*7,

      vy:
        (Math.random()-.5)*7,

      life:
        18+
        Math.random()*15

    });

  }


  for(
    const e of enemies
  ){

    const d=
      Math.hypot(
        b.x-e.x,
        b.y-e.y
      );


    if(d<115){

      e.hp-=
        e.type==="ogre"
        ?e.maxHp*.5
        :e.maxHp*.75;


      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

    }

  }


  if(bigBoss){

    const d=
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      );

    if(d<135){

      bigBoss.hp-=
        bigBoss.maxHp*.18;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

    }

  }

}


/* =========================
   PLAYER DAMAGE
   ========================= */

function damagePlayer(e){

  e.attack=45;


  if(e.type==="goblin"){

    goblinHits++;

    if(goblinHits>=4){

      goblinHits=0;

      loseHeart();

    }

  }else{

    ogreHits++;

    if(ogreHits>=2){

      ogreHits=0;

      loseHeart();

    }

  }

}


function loseHeart(){

  if(hearts<=0)return;

  hearts--;

  heartRegen=30;


  if(hearts<=0){

    endGame();

  }

}


function regainHeart(){

  if(hearts<3){

    hearts++;

    heartRegen=0;

  }

}


function endGame(){

  gameOver=true;

  paused=false;

  pauseBtn.textContent="PAUSE";


  if(score>highscore){

    highscore=score;

    localStorage.setItem(
      "pixelNatureHighscore",
      highscore
    );

  }

}


/* =========================
   UPGRADES
   ========================= */

function buyUpgrade(kind){

  if(
    kind==="nothing"
  ){

    upgradeOpen=false;

    return;
  }


  if(
    !upgradeOpen||
    coins<upgradeCost
  ){

    return;
  }


  coins-=upgradeCost;


  if(kind==="health"){

    p.maxHp+=20;

    p.hp=
      Math.min(
        p.maxHp,
        p.hp+20
      );

  }


  if(kind==="damage"){

    p.damage+=12;

  }


  if(kind==="speed"){

    p.speed+=.4;

  }


  upgradeCounts[kind]++;

  upgradeCost+=10;

  upgradeOpen=false;

}


/* =========================
   PARTICLES
   ========================= */

function burst(x,y,n=8){

  for(
    let i=0;
    i<n;
    i++
  ){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*4,

      vy:
        (Math.random()-.5)*4,

      life:22

    });

  }

}


function rectPixel(
  x,
  y,
  w,
  h,
  color
){

  ctx.fillStyle=color;

  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,
    h
  );

}


/* =========================
   HEART
   ========================= */

function drawHeart(
  x,
  y,
  full
){

  rectPixel(
    x+4,
    y,
    10,
    4,
    full
      ?" #e83e3e"
      :"#3a3a3a"
  );

  rectPixel(
    x,
    y+4,
    18,
    10,
    full
      ?"#e83e3e"
      :"#3a3a3a"
  );

  rectPixel(
    x+4,
    y+14,
    10,
    4,
    full
      ?"#e83e3e"
      :"#3a3a3a"
  );

  rectPixel(
    x+8,
    y+18,
    2,
    2,
    full
      ?"#e83e3e"
      :"#3a3a3a"
  );


  if(!full){

    ctx.clearRect(
      x+5,
      y+5,
      8,
      8
    );

  }

}


/* =========================
   COIN
   ========================= */

function drawCoin(
  x,
  y
){

  ctx.fillStyle="#f3c62e";

  ctx.fillRect(
    x,
    y,
    16,
    16
  );


  ctx.fillStyle="#ffe875";

  ctx.fillRect(
    x+4,
    y+2,
    8,
    12
  );


  ctx.fillStyle="#b77b16";

/* =========================
   DRAW
   ========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /*
    Bigger arena
  */

  ctx.fillStyle="#303030";

  ctx.fillRect(
    ARENA.left,
    ARENA.top,
    ARENA.right-ARENA.left,
    ARENA.bottom-ARENA.top
  );


  ctx.strokeStyle="#444";

  ctx.lineWidth=6;

  ctx.strokeRect(
    ARENA.left,
    ARENA.top,
    ARENA.right-ARENA.left,
    ARENA.bottom-ARENA.top
  );


  /*
    Floor pixels
  */

  for(
    let i=0;
    i<85;
    i++
  ){

    const x=
      ARENA.left+15+
      Math.random()*
      (ARENA.right-ARENA.left-40);

    const y=
      ARENA.top+15+
      Math.random()*
      (ARENA.bottom-ARENA.top-40);


    rectPixel(
      x,
      y,
      3,
      3,
      i%2
        ?"#353535"
        :"#3b3b3b"
    );

  }


  /* Gate */

  drawGate();


  /* =========================
     ENEMIES
     ========================= */

  for(
    const e of enemies
  ){

    if(e.type==="goblin"){

      drawGoblin(e);

    }else{

      drawOgre(e);

    }


    if(e.burn>0){

      rectPixel(
        e.x-e.r-3,
        e.y+e.r-4,
        5,
        7,
        "#ff8c22"
      );


      rectPixel(
        e.x+e.r-2,
        e.y+e.r-8,
        4,
        7,
        "#ffd45a"
      );

    }


    const bw=
      e.type==="ogre"
      ?64
      :34;

    const bh=6;

    const bx=
      e.x-bw/2;

    const by=
      e.y-e.r-15;


    rectPixel(
      bx-2,
      by-2,
      bw+4,
      bh+4,
      "#111"
    );


    rectPixel(
      bx,
      by,
      bw,
      bh,
      "#542b2b"
    );


    rectPixel(
      bx,
      by,
      bw*
      Math.max(
        0,
        e.hp/e.maxHp
      ),
      bh,
      "#55c84a"
    );

  }


  /* Big boss */

  drawBigBoss();


  /* Bomb pickups */

  for(
    const bp of bombPickups
  ){

    rectPixel(
      bp.x-7,
      bp.y-7,
      14,
      14,
      "#111"
    );

    rectPixel(

    );

    rectPixel(
      bp.x+3,
      bp.y-10,
      5,
      3,
      "#ddd"
    );

  }


  /* Thrown bombs */

  for(
    const b of bombs
  ){

    if(!b.exploded){

      rectPixel(
        b.x-8,

        14,
        "#111"
      );

      rectPixel(

      rectPixel(

      );

    }else{

      const progress=
        b.disintegrate/
        BOMB_DISINTEGRATE_TIME;

      ctx.save();

      ctx.globalAlpha=
        Math.max(
          0,
          progress

      const size=
        7+
        Math.round(
          progress*5

      rectPixel(

      [
        "3",
        "SPEED",
        "+0.4 MOVE",
        500
      ],

      [
        "4",
        "NOTHING",
        "FREE",
        705
      ]

    ];


    for(
      const [n,t,d,x]
      of cards
    ){

      ctx.fillStyle=
        t==="NOTHING"
        ?" #183c1d"
        :"#1e3d20";

      ctx.fillRect(
        x,
        235,
        170,
        130
      );


      ctx.strokeStyle=
        t==="NOTHING"
        ?" #8ee889"
        :"#65b95b";

      ctx.lineWidth=4;


      ctx.strokeRect(
        x,
        235,
        170,
        130
      );


      ctx.fillStyle="#bdebb5";

      ctx.font="21px monospace";


      ctx.fillText(
        n+". "+t,
        x+15,
        275
      );


      ctx.font="14px monospace";


      ctx.fillText(
        d,
        x+25,
        310
      );


      ctx.fillText(
        t==="NOTHING"
        ?"SKIP"
        :"BUY",
        x+60,
        340
      );

    }


    ctx.fillStyle="#fff";

    ctx.font="14px monospace";


    ctx.fillText(
      "If you can't afford an upgrade, choose NOTHING.",
      275,
      405
    );

  }


  /* =========================
     GAME OVER
     ========================= */

  if(gameOver){

    ctx.fillStyle="#000";

    ctx.globalAlpha=.8;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;


    ctx.fillStyle="#fff";

    ctx.font="42px monospace";


    ctx.fillText(
      "GAME OVER",
      350,
      260
    );


    ctx.font="18px monospace";


    ctx.fillText(
      "Score: "+
      score+
      "   High Score: "+
      highscore,
      320,
      300
    );


    ctx.fillText(
      "Press R to restart",
      355,
      340
    );

  }

}


/* =========================
   GAME LOOP
   ========================= */

function loop(){

  requestAnimationFrame(loop);


  if(!gameOver&&!paused){

    /*
      Boss countdown.
    */

    if(bossCountdownActive){

      updateBossCountdown();

    }


    /*
      Normal game only runs when
      upgrade screen is closed.
    */

    if(!upgradeOpen){

      elapsed+=1/60;


      /* Gate animation */

      if(gateAnimation>0){

        gateAnimation-=1/60;

      }


      /* =========================
         BIG BOSS TIMER
         ========================= */

      if(
        !bigBoss&&
        !bossCountdownActive&&
        elapsed>=nextBigBossTime
      ){

        startBossCountdown();

      }


      /*
        During countdown or big boss,
        NORMAL ENEMIES DO NOT SPAWN.
      */


      /* Bomb spawning */

      bombSpawnTimer-=1/60;


      if(
        bombSpawnTimer<=0&&
        !bigBoss&&
        !bossCountdownActive
      ){

        spawnBombPickup();

        bombSpawnTimer=20;

      }


      for(
        const bp of bombPickups
      ){

        bp.life-=1/60;

      }


      bombPickups=
        bombPickups.filter(
          bp=>bp.life>0
        );


      /* Pick up bombs */

      if(bombCount<3){

        for(
          let i=
            bombPickups.length-1;
          i>=0;
          i--
        ){

          if(
            Math.hypot(
              bombPickups[i].x-p.x,
              bombPickups[i].y-p.y
            )<28
          ){

            bombCount++;

            bombPickups.splice(
              i,
              1
            );

          }

        }

      }


      /* Upgrade timer */

      if(
        elapsed>=nextUpgrade&&
        !bigBoss&&
        !bossCountdownActive
      ){

        upgradeOpen=true;

        nextUpgrade+=70;

      }


      /* =========================
         WAVES
         ========================= */

      const newWave=
        Math.floor(
          elapsed/10
        )+1;


      if(
        newWave>wave&&
        !bigBoss&&
        !bossCountdownActive
      ){

        wave=newWave;

        spawnWave(wave);

      }


      /* =========================
         MINI BOSSES
         ========================= */

      const bossMark=
        Math.floor(
          elapsed/50
        );


      if(
        bossMark>0&&
        !bigBoss&&
        !bossCountdownActive&&
        !enemies.some(
          e=>
            e.type==="ogre"&&
            e.bossMark===bossMark
        )
      ){

        if(!window.lastBossMark){

          window.lastBossMark=0;

        }


        if(
          bossMark>
          window.lastBossMark
        ){

          spawnEnemy("ogre");


          enemies[
            enemies.length-1
          ].bossMark=
            bossMark;


          window.lastBossMark=
            bossMark;

        }

      }


      /* =========================
         MOVEMENT
         ========================= */

      let dx=
        (
          keys.d||
          keys.arrowright
          ?1
          :0
        )-
        (
          keys.a||
          keys.arrowleft
          ?1
          :0
        );


      let dy=
        (
          keys.s||
          keys.arrowdown
          ?1
          :0
        )-
        (
          keys.w||
          keys.arrowup
          ?1
          :0
        );


      const m=
        Math.hypot(
          dx,
          dy
        )||1;


      p.x+=
        dx/m*
        p.speed;


      p.y+=
        dy/m*
        p.speed;


      /*
        Keep player inside the bigger arena.
      */

      p.x=
        Math.max(
          ARENA.left+30,
          Math.min(
            ARENA.right-30,
            p.x
          )
        );


      p.y=
        Math.max(
          ARENA.top+30,
          Math.min(
            ARENA.bottom-30,
            p.y
          )
        );


      /* Shooting */

      if(mouse.down){

        shoot();

      }


      if(fireCooldown>0){

        fireCooldown--;

      }


      /* =========================
         FIREBALLS
         ========================= */

      for(
        const b of balls
      ){

        b.x+=b.vx;
        b.y+=b.vy;
        b.life--;

      }


      balls=
        balls.filter(
          b=>
            b.life>0&&
            b.x>ARENA.left&&
            b.x<ARENA.right&&
            b.y>ARENA.top&&
            b.y<ARENA.bottom
        );


      /* =========================
         BOMBS
         ========================= */

      for(
        const b of bombs
      ){

        if(!b.exploded){

          b.x+=b.vx;
          b.y+=b.vy;

          b.distance+=
            Math.hypot(
              b.vx,
              b.vy
            );

          b.life--;

          b.rotation+=0.15;


          if(
            b.distance>=
            BOMB_THROW_DISTANCE
          ){

            explodeBomb(b);

          }


          if(!b.exploded){

            const hit=
              enemies.find(
                e=>
                  Math.hypot(
                    b.x-e.x,
                    b.y-e.y
                  )<
                  e.r+b.r
              );


            if(hit){

              explodeBomb(b);

            }

          }


          if(
            !b.exploded&&
            (
              b.x<=ARENA.left||
              b.x>=ARENA.right||
              b.y<=ARENA.top||
              b.y>=ARENA.bottom
            )
          ){

            explodeBomb(b);

          }


          if(
            !b.exploded&&
            bigBoss&&
            Math.hypot(
              b.x-bigBoss.x,
              b.y-bigBoss.y
            )<
            bigBoss.r+b.r
          ){

            explodeBomb(b);

          }


        }else{

          b.disintegrate--;

        }

      }


      bombs=
        bombs.filter(
          b=>
            !b.exploded||
            b.disintegrate>0
        );


      /* =========================
         ENEMY MOVEMENT
         ========================= */

      for(
        const e of enemies
      ){

        const dx=
          p.x-e.x;

        const dy=
          p.y-e.y;


        const d=
          Math.hypot(
            dx,
            dy
          )||1;


        e.x+=
          dx/d*
          e.speed;


        e.y+=
          dy/d*
          e.speed;


        if(e.attack>0){

          e.attack--;

        }


        if(
          d<e.r+14&&
          e.attack<=0
        ){

          damagePlayer(e);

        }


        /* Fireball collisions */

        for(
          const b of balls
        ){

          if(
            Math.hypot(
              b.x-e.x,
              b.y-e.y
            )<
            e.r+b.r
          ){

            const impactX=b.x;
            const impactY=b.y;


            e.hp-=p.damage;


            e.burn=
              Math.max(
                e.burn,
                42
              );


            e.burnTick=0;

            b.life=0;


            burst(
              impactX,
              impactY,
              10
            );


            for(
              const other of enemies
            ){

              if(
                other!==e&&
                other.hp>0&&
                Math.hypot(
                  other.x-impactX,
                  other.y-impactY
                )<58
              ){

                other.hp-=
                  Math.max(
                    6,
                    p.damage*.45
                  );


                other.burn=
                  Math.max(
                    other.burn,
                    42
                  );


                other.burnTick=0;

              }

            }

          }

        }


        /* Burn */

        if(e.burn>0){

          e.burn--;

          e.burnTick++;


          if(
            e.burnTick%7===0
          ){

            e.hp-=2.5;

          }

        }

      }


      /* =========================
         BIG BOSS MOVEMENT
         ========================= */

      if(bigBoss){

        const dx=
          p.x-bigBoss.x;

        const dy=
          p.y-bigBoss.y;

        const d=
          Math.hypot(
            dx,
            dy
          )||1;


        bigBoss.x+=
          dx/d*
          bigBoss.speed;

        bigBoss.y+=
          dy/d*
          bigBoss.speed;


        if(bigBoss.attack>0){

          bigBoss.attack--;

        }


        if(
          d<bigBoss.r+18&&
          bigBoss.attack<=0
        ){

          bigBoss.attack=70;

          loseHeart();

        }


        /*
          Big boss takes fireball damage.
        */

        for(
          const b of balls
        ){

          if(
            Math.hypot(
              b.x-bigBoss.x,
              b.y-bigBoss.y
            )<
            bigBoss.r+b.r
          ){

            bigBoss.hp-=p.damage;

            bigBoss.burn=
              Math.max(
                bigBoss.burn,
                42
              );

            bigBoss.burnTick=0;

            b.life=0;

            burst(
              b.x,
              b.y,
              14
            );

          }

        }


        if(bigBoss.burn>0){

          bigBoss.burn--;

          bigBoss.burnTick++;


          if(
            bigBoss.burnTick%7===0
          ){

            bigBoss.hp-=4;

          }

        }


        if(bigBoss.hp<=0){

          killBigBoss();

        }

      }


      /* =========================
         DEAD ENEMIES
         ========================= */

      const dead=
        enemies.filter(
          e=>e.hp<=0
        );


      dead.forEach(
        killEnemy
      );


      enemies=
        enemies.filter(
          e=>e.hp>0
        );


      /* =========================
         PARTICLES
         ========================= */

      for(
        const s of particles
      ){

        s.x+=s.vx;
        s.y+=s.vy;
        s.life--;

      }


      particles=
        particles.filter(
          s=>s.life>0
        );


      /* =========================
         HEART REGENERATION
         ========================= */

      if(heartRegen>0){

        heartRegen-=1/60;


        if(
          heartRegen<=0
        ){

          regainHeart();

        }

      }

    }

  }


  draw();

}


loop();

</script>
