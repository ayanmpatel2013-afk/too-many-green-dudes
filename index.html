<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Too Many Green Dudes</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#252525;font-family:monospace}
canvas{display:block;margin:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair}
</style>
</head>
<body>
<canvas id="game" width="900" height="600"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
ctx.imageSmoothingEnabled=false;

const W=900,H=600;

let keys={};
let mouse={x:450,y:300,down:false};

let p,enemies,balls,particles,score,coins,wave,elapsed,gameOver,upgradeOpen,nextUpgrade;

let upgradeCost=10;
let upgradeCounts={health:0,damage:0,speed:0};
let goblinHits=0;
let ogreHits=0;
let hearts=3;
let heartRegen=0;

let fireCooldown=0;
let spawnTimer=0;
let bombCount=0;
let bombPickups=[];
let bombs=[];
let bombSpawnTimer=20;

let highscore=Number(localStorage.getItem("pixelNatureHighscore")||0);

/* =========================
   MUSIC
   ========================= */

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

function startMusic(){
  if(musicStarted)return;

  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(playMusicStep,280);
  }catch(err){
    console.log("Music unavailable:",err);
  }
}

function playMusicStep(){
  if(!audioCtx||gameOver)return;

  const notes=[
    110,130.81,146.83,164.81,
    196,164.81,146.83,130.81,
    110,146.83,164.81,196,
    220,196,164.81,146.83
  ];

  const bass=[
    55,55,65.41,65.41,
    73.42,73.42,82.41,82.41
  ];

  const now=audioCtx.currentTime;
  const note=notes[musicStep%notes.length];
  const bassNote=bass[musicStep%bass.length];

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="triangle";
  osc.frequency.value=note;

  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(0.035,now+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+0.25);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+0.26);

  const bassOsc=audioCtx.createOscillator();
  const bassGain=audioCtx.createGain();

  bassOsc.type="sine";
  bassOsc.frequency.value=bassNote;

  bassGain.gain.setValueAtTime(0.0001,now);
  bassGain.gain.exponentialRampToValueAtTime(0.045,now+0.02);
  bassGain.gain.exponentialRampToValueAtTime(0.0001,now+0.24);

  bassOsc.connect(bassGain);
  bassGain.connect(audioCtx.destination);

  bassOsc.start(now);
  bassOsc.stop(now+0.25);

  musicStep++;
}

/* =========================
   GAME RESET
   ========================= */

function reset(){
  p={
    x:450,
    y:300,
    speed:3.2,
    damage:28,
    maxHp:100,
    hp:100
  };

  enemies=[];
  balls=[];
  particles=[];

  score=0;
  coins=0;
  wave=1;
  elapsed=0;
  gameOver=false;

  upgradeOpen=false;
  nextUpgrade=70;
  upgradeCost=10;
  upgradeCounts={health:0,damage:0,speed:0};

  goblinHits=0;
  ogreHits=0;
  hearts=3;
  heartRegen=0;

  fireCooldown=0;
  spawnTimer=0;

  bombCount=0;
  bombPickups=[];
  bombs=[];
  bombSpawnTimer=20;

  spawnWave(1);
}

reset();

/* =========================
   INPUT
   ========================= */

window.addEventListener("keydown",e=>{
  startMusic();

  keys[e.key.toLowerCase()]=true;

  if(e.key.toLowerCase()==="r" && gameOver){
    reset();
    return;
  }

  if(e.key.toLowerCase()==="q" && !e.repeat){
    throwBomb();
  }

  if(upgradeOpen){
    if(e.key==="1")buyUpgrade("health");
    if(e.key==="2")buyUpgrade("damage");
    if(e.key==="3")buyUpgrade("speed");
  }
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

c.addEventListener("mousemove",e=>{
  const r=c.getBoundingClientRect();

  mouse.x=(e.clientX-r.left)*W/r.width;
  mouse.y=(e.clientY-r.top)*H/r.height;
});

c.addEventListener("mousedown",()=>{
  startMusic();
  mouse.down=true;
});

window.addEventListener("mouseup",()=>{
  mouse.down=false;
});

/* =========================
   ENEMIES
   ========================= */

function spawnEnemy(type="goblin"){
  let side=Math.floor(Math.random()*4);
  let x,y;

  if(side===0){
    x=55;
    y=75+Math.random()*450;
  }else if(side===1){
    x=845;
    y=75+Math.random()*450;
  }else if(side===2){
    x=65+Math.random()*770;
    y=65;
  }else{
    x=65+Math.random()*770;
    y=535;
  }

  if(type==="ogre"){
    const hp=260+Math.floor(elapsed/50)*35;

    enemies.push({
      type:"ogre",
      x,
      y,
      r:30,
      hp,
      maxHp:hp,
      speed:.42+Math.min(.18,elapsed/2000),
      attack:0,
      burn:0,
      burnTick:0
    });
  }else{
    const hp=45+wave*8;

    enemies.push({
      type:"goblin",
      x,
      y,
      r:14,
      hp,
      maxHp:hp,
      speed:.72+wave*.025,
      attack:0,
      burn:0,
      burnTick:0
    });
  }
}

function spawnWave(n){
  for(let i=0;i<n;i++){
    spawnEnemy("goblin");
  }
}

/* =========================
   SCORE / COINS
   ========================= */

function addCoins(n){
  coins+=n;
}

function killEnemy(e){
  if(e.type==="ogre"){
    addCoins(7);
    score+=7;
    burst(e.x,e.y,22);
  }else{
    addCoins(1);
    score++;
    burst(e.x,e.y,10);
  }
}

/* =========================
   SHOOTING
   ========================= */

function shoot(){
  if(fireCooldown>0||upgradeOpen||gameOver)return;

  const a=Math.atan2(
    mouse.y-p.y,
    mouse.x-p.x
  );

  balls.push({
    x:p.x,
    y:p.y,
    vx:Math.cos(a)*8,
    vy:Math.sin(a)*8,
    r:7,
    life:90
  });

  fireCooldown=60;
}

/* =========================
   BOMBS
   ========================= */

function spawnBombPickup(){
  const x=75+Math.random()*750;
  const y=90+Math.random()*420;

  bombPickups.push({
    x,
    y,
    life:7
  });
}

function throwBomb(){
  if(gameOver||upgradeOpen||bombCount<=0)return;

  const a=Math.atan2(
    mouse.y-p.y,
    mouse.x-p.x
  );

  bombCount--;

  bombs.push({
    x:p.x,
    y:p.y,
    vx:Math.cos(a)*7,
    vy:Math.sin(a)*7,
    life:90,
    r:9
  });
}

function explodeBomb(b){
  burst(b.x,b.y,28);

  for(const e of enemies){
    const d=Math.hypot(
      b.x-e.x,
      b.y-e.y
    );

    if(d<115){
      e.hp-=e.type==="ogre"
        ?e.maxHp*.5
        :e.maxHp*.75;

      e.burn=Math.max(e.burn,42);
      e.burnTick=0;
    }
  }
}

/* =========================
   PLAYER DAMAGE
   ========================= */

function damagePlayer(e){
  e.attack=45;

  if(e.type==="goblin"){
    goblinHits++;

    if(goblinHits>=4){
      goblinHits=0;
      loseHeart();
    }
  }else{
    ogreHits++;

    if(ogreHits>=2){
      ogreHits=0;
      loseHeart();
    }
  }
}

function loseHeart(){
  if(hearts<=0)return;

  hearts--;
  heartRegen=30;

  if(hearts<=0){
    endGame();
  }
}

function regainHeart(){
  if(hearts<3){
    hearts++;
    heartRegen=0;
  }
}

function endGame(){
  gameOver=true;

  if(score>highscore){
    highscore=score;
    localStorage.setItem(
      "pixelNatureHighscore",
      highscore
    );
  }
}

/* =========================
   UPGRADES
   ========================= */

function buyUpgrade(kind){
  if(!upgradeOpen||coins<upgradeCost)return;

  coins-=upgradeCost;

  if(kind==="health"){
    p.maxHp+=20;
    p.hp=Math.min(p.maxHp,p.hp+20);
  }

  if(kind==="damage"){
    p.damage+=12;
  }

  if(kind==="speed"){
    p.speed+=.4;
  }

  upgradeCounts[kind]++;
  upgradeCost+=10;
  upgradeOpen=false;
}

/* =========================
   PARTICLES
   ========================= */

function burst(x,y,n=8){
  for(let i=0;i<n;i++){
    particles.push({
      x,
      y,
      vx:(Math.random()-.5)*4,
      vy:(Math.random()-.5)*4,
      life:22
    });
  }
}

function rectPixel(x,y,w,h,color){
  ctx.fillStyle=color;
  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,
    h
  );
}

/* =========================
   HUD
   ========================= */

function drawHeart(x,y,full){
  rectPixel(
    x+4,y,10,4,
    full?"#e83e3e":"#3a3a3a"
  );

  rectPixel(
    x,y+4,18,10,
    full?"#e83e3e":"#3a3a3a"
  );

  rectPixel(
    x+4,y+14,10,4,
    full?"#e83e3e":"#3a3a3a"
  );

  rectPixel(
    x+8,y+18,2,2,
    full?"#e83e3e":"#3a3a3a"
  );

  if(!full){
    ctx.clearRect(x+5,y+5,8,8);
  }
}

function drawCoin(x,y){
  ctx.fillStyle="#f3c62e";
  ctx.fillRect(x,y,16,16);

  ctx.fillStyle="#ffe875";
  ctx.fillRect(x+4,y+2,8,12);

  ctx.fillStyle="#b77b16";
  ctx.fillRect(x+2,y+3,2,10);
  ctx.fillRect(x+12,y+3,2,10);
}

/* =========================
   DRAW
   ========================= */

function draw(){
  ctx.clearRect(0,0,W,H);

  ctx.fillStyle="#303030";
  ctx.fillRect(40,55,820,490);

  ctx.strokeStyle="#444";
  ctx.lineWidth=6;
  ctx.strokeRect(40,55,820,490);

  /* Floor pixels */
  for(let i=0;i<70;i++){
    const x=55+Math.random()*790;
    const y=70+Math.random()*460;

    rectPixel(
      x,
      y,
      3,
      3,
      i%2?"#353535":"#3b3b3b"
    );
  }

  /* =========================
     ENEMIES
     ========================= */

  for(const e of enemies){

    if(e.type==="goblin"){

      rectPixel(
        e.x-12,
        e.y-7,
        24,
        22,
        "#3c8f3d"
      );

      const punchRange=
        Math.hypot(p.x-e.x,p.y-e.y)<72;

      rectPixel(
        e.x-17,
        e.y-5,
        6,
        12,
        "#2e7130"
      );

      if(punchRange){

        const dir=p.x<e.x?-1:1;

        rectPixel(
          e.x+dir*12,
          e.y-4,
          10,
          6,
          "#4ba747"
        );

        rectPixel(
          e.x+dir*20,
          e.y-6,
          7,
          10,
          "#2e7130"
        );

      }else{

        rectPixel(
          e.x+11,
          e.y-5,
          6,
          12,
          "#2e7130"
        );
      }

      rectPixel(
        e.x-8,
        e.y-12,
        16,
        5,
        "#4ba747"
      );

      /* Angry face */
      rectPixel(e.x-8,e.y-6,6,3,"#111");
      rectPixel(e.x+2,e.y-6,6,3,"#111");

      rectPixel(e.x-7,e.y-2,4,4,"#111");
      rectPixel(e.x+3,e.y-2,4,4,"#111");

      rectPixel(
        e.x-5,
        e.y+8,
        10,
        3,
        "#183c19"
      );

    }else{

      /* Ogre */
      rectPixel(
        e.x-25,
        e.y-25,
        50,
        48,
        "#397d36"
      );

      rectPixel(
        e.x-31,
        e.y-18,
        7,
        17,
        "#2b622c"
      );

      rectPixel(
        e.x+24,
        e.y-18,
        7,
        17,
        "#2b622c"
      );

      /* Angry face */
      rectPixel(
        e.x-16,
        e.y-16,
        11,
        5,
        "#111"
      );

      rectPixel(
        e.x+5,
        e.y-16,
        11,
        5,
        "#111"
      );

      rectPixel(
        e.x-13,
        e.y-10,
        8,
        8,
        "#111"
      );

      rectPixel(
        e.x+5,
        e.y-10,
        8,
        8,
        "#111"
      );

      rectPixel(
        e.x-12,
        e.y+8,
        24,
        5,
        "#132d13"
      );

      rectPixel(
        e.x-8,
        e.y+13,
        16,
        3,
        "#132d13"
      );

      /* Ogre bat */
      const closeOgre=
        Math.hypot(p.x-e.x,p.y-e.y)<105;

      const batDir=p.x<e.x?-1:1;

      ctx.save();
      ctx.translate(e.x,e.y);

      if(closeOgre){
        const swing=
          Math.sin(performance.now()/120)*.9;

        ctx.rotate(
          batDir*(0.45+swing)
        );
      }else{
        ctx.rotate(-0.65);
      }

      rectPixel(
        16,-30,
        7,44,
        "#714728"
      );

      rectPixel(
        11,-36,
        17,13,
        "#8d5b32"
      );

      ctx.restore();
    }

    if(e.burn>0){
      rectPixel(
        e.x-e.r-3,
        e.y+e.r-4,
        5,
        7,
        "#ff8c22"
      );

      rectPixel(
        e.x+e.r-2,
        e.y+e.r-8,
        4,
        7,
        "#ffd45a"
      );
    }

    /* Health bar */
    const bw=e.type==="ogre"?64:34;
    const bh=6;
    const bx=e.x-bw/2;
    const by=e.y-e.r-15;

    rectPixel(
      bx-2,
      by-2,
      bw+4,
      bh+4,
      "#111"
    );

    rectPixel(
      bx,
      by,
      bw,
      bh,
      "#542b2b"
    );

    rectPixel(
      bx,
      by,
      bw*Math.max(0,e.hp/e.maxHp),
      bh,
      "#55c84a"
    );
  }

  /* Bomb pickups */
  for(const bp of bombPickups){
    rectPixel(
      bp.x-7,
      bp.y-7,
      14,
      14,
      "#111"
    );

    rectPixel(
      bp.x-5,
      bp.y-5,
      10,
      12,
      "#444"
    );

    rectPixel(
      bp.x-3,
      bp.y-7,
      6,
      4,
      "#777"
    );

    rectPixel(
      bp.x+3,
      bp.y-10,
      5,
      3,
      "#ddd"
    );
  }

  /* Thrown bombs */
  for(const b of bombs){
    rectPixel(
      b.x-8,
      b.y-7,
      16,
      14,
      "#111"
    );

    rectPixel(
      b.x-6,
      b.y-6,
      12,
      12,
      "#444"
    );

    rectPixel(
      b.x-2,
      b.y-10,
      5,
      4,
      "#777"
    );
  }

  /* Fireballs */
  for(const b of balls){
    rectPixel(
      b.x-6,
      b.y-6,
      12,
      12,
      "#d85b18"
    );

    rectPixel(
      b.x-3,
      b.y-8,
      6,
      16,
      "#ff9b25"
    );

    rectPixel(
      b.x-2,
      b.y-4,
      4,
      7,
      "#ffe27a"
    );
  }

  /* Particles */
  for(const s of particles){
    ctx.globalAlpha=s.life/22;

    rectPixel(
      s.x,
      s.y,
      5,
      5,
      "#ff9c29"
    );

    ctx.globalAlpha=1;
  }

  /* =========================
     PLAYER
     ========================= */

  const a=Math.atan2(
    mouse.y-p.y,
    mouse.x-p.x
  );

  rectPixel(
    p.x-12,
    p.y-12,
    24,
    24,
    "#b47b4e"
  );

  rectPixel(
    p.x-16,
    p.y-8,
    4,
    10,
    "#6f4933"
  );

  rectPixel(
    p.x+12,
    p.y-8,
    4,
    10,
    "#6f4933"
  );

  rectPixel(
    p.x-7,
    p.y-5,
    5,
    5,
    "#252525"
  );

  rectPixel(
    p.x+3,
    p.y-5,
    5,
    5,
    "#252525"
  );

  rectPixel(
    p.x-5,
    p.y+7,
    10,
    3,
    "#613b2c"
  );

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(a);

  rectPixel(
    9,
    -3,
    22,
    6,
    "#7d4b28"
  );

  ctx.restore();

  /* =========================
     HUD
     ========================= */

  ctx.font="16px monospace";
  ctx.fillStyle="#fff";

  ctx.fillText(
    "SCORE "+score,
    25,
    25
  );

  ctx.fillText(
    "HIGH "+highscore,
    145,
    25
  );

  for(let i=0;i<3;i++){
    drawHeart(
      270+i*28,
      10,
      i<hearts
    );
  }

  drawCoin(780,8);

  ctx.fillText(
    String(coins),
    803,
    23
  );

  /* Bomb HUD */
  rectPixel(
    25,
    545,
    22,
    22,
    "#111"
  );

  rectPixel(
    28,
    548,
    16,
    16,
    "#444"
  );

  rectPixel(
    32,
    544,
    8,
    5,
    "#777"
  );

  rectPixel(
    40,
    541,
    7,
    3,
    "#ddd"
  );

  ctx.fillStyle="#fff";

  ctx.fillText(
    "x"+bombCount,
    52,
    562
  );

  /* Fireball cooldown */
  rectPixel(
    770,
    548,
    18,
    18,
    "#d85b18"
  );

  rectPixel(
    775,
    544,
    8,
    25,
    "#ff9b25"
  );

  rectPixel(
    777,
    549,
    5,
    10,
    "#ffe27a"
  );

  ctx.fillStyle="#fff";

  ctx.fillText(
    fireCooldown>0
      ?(fireCooldown/60).toFixed(1)
      :"READY",
    800,
    562
  );

  ctx.fillText(
    "WASD move • Mouse aim • Click fire • Q bomb",
    25,
    585
  );

  ctx.fillText(
    "NEXT UPGRADE "+
    Math.max(
      0,
      Math.ceil(nextUpgrade-elapsed)
    )+"s",
    610,
    25
  );

  /* =========================
     UPGRADE SCREEN
     ========================= */

  if(upgradeOpen){

    ctx.fillStyle="#0a130d";
    ctx.globalAlpha=.9;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;

    ctx.fillStyle="#fff";
    ctx.font="32px monospace";

    ctx.fillText(
      "CHOOSE YOUR UPGRADE",
      285,
      155
    );

    ctx.font="16px monospace";

    ctx.fillText(
      "Cost: "+upgradeCost+
      " coins   (1 / 2 / 3)",
      300,
      185
    );

    const cards=[
      ["1","HEALTH","+20 MAX HP",170],
      ["2","DAMAGE","+12 FIREBALL",370],
      ["3","SPEED","+0.4 MOVE",570]
    ];

    for(const [n,t,d,x] of cards){

      ctx.fillStyle="#1e3d20";
      ctx.fillRect(
        x,
        230,
        170,
        130
      );

      ctx.strokeStyle="#65b95b";
      ctx.lineWidth=4;

      ctx.strokeRect(
        x,
        230,
        170,
        130
      );

      ctx.fillStyle="#bdebb5";
      ctx.font="22px monospace";

      ctx.fillText(
        n+". "+t,
        x+18,
        270
      );

      ctx.font="14px monospace";

      ctx.fillText(
        d,
        x+25,
        305
      );

      ctx.fillText(
        "BUY",
        x+60,
        335
      );
    }
  }

  /* =========================
     GAME OVER
     ========================= */

  if(gameOver){

    ctx.fillStyle="#000";
    ctx.globalAlpha=.8;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;

    ctx.fillStyle="#fff";
    ctx.font="42px monospace";

    ctx.fillText(
      "GAME OVER",
      350,
      260
    );

    ctx.font="18px monospace";

    ctx.fillText(
      "Score: "+score+
      "   High Score: "+highscore,
      320,
      300
    );

    ctx.fillText(
      "Press R to restart",
      355,
      340
    );
  }
}

/* =========================
   GAME LOOP
   ========================= */

function loop(){

  requestAnimationFrame(loop);

  if(!gameOver){

    if(!upgradeOpen){

      elapsed+=1/60;

      /* Bomb spawning */
      bombSpawnTimer-=1/60;

      if(bombSpawnTimer<=0){
        spawnBombPickup();
        bombSpawnTimer=20;
      }

      for(const bp of bombPickups){
        bp.life-=1/60;
      }

      bombPickups=bombPickups.filter(
        bp=>bp.life>0
      );

      /* Pick up bombs */
      if(bombCount<3){

        for(
          let i=bombPickups.length-1;
          i>=0;
          i--
        ){

          if(
            Math.hypot(
              bombPickups[i].x-p.x,
              bombPickups[i].y-p.y
            )<28
          ){

            bombCount++;

            bombPickups.splice(i,1);
          }
        }
      }

      /* Upgrade timer */
      if(elapsed>=nextUpgrade){
        upgradeOpen=true;
        nextUpgrade+=70;
      }

      /* Waves */
      const newWave=
        Math.floor(elapsed/10)+1;

      if(newWave>wave){
        wave=newWave;
        spawnWave(wave);
      }

      /* Bosses */
      const bossMark=
        Math.floor(elapsed/50);

      if(
        bossMark>0 &&
        !enemies.some(
          e=>e.type==="ogre" &&
             e.bossMark===bossMark
        )
      ){

        if(!window.lastBossMark){
          window.lastBossMark=0;
        }

        if(
          bossMark>
          window.lastBossMark
        ){

          spawnEnemy("ogre");

          enemies[
            enemies.length-1
          ].bossMark=bossMark;

          window.lastBossMark=bossMark;
        }
      }

      /* Movement */
      let dx=
        (keys.d||keys.arrowright?1:0)-
        (keys.a||keys.arrowleft?1:0);

      let dy=
        (keys.s||keys.arrowdown?1:0)-
        (keys.w||keys.arrowup?1:0);

      const m=Math.hypot(dx,dy)||1;

      p.x+=dx/m*p.speed;
      p.y+=dy/m*p.speed;

      p.x=Math.max(
        55,
        Math.min(845,p.x)
      );

      p.y=Math.max(
        70,
        Math.min(530,p.y)
      );

      /* Shooting */
      if(mouse.down){
        shoot();
      }

      if(fireCooldown>0){
        fireCooldown--;
      }

      /* Fireballs */
      for(const b of balls){
        b.x+=b.vx;
        b.y+=b.vy;
        b.life--;
      }

      balls=balls.filter(
        b=>
          b.life>0 &&
          b.x>40 &&
          b.x<860 &&
          b.y>55 &&
          b.y<545
      );

      /* Bombs */
      for(const b of bombs){

        b.x+=b.vx;
        b.y+=b.vy;
        b.life--;

        if(
          b.life>0 &&
          b.x>40 &&
          b.x<860 &&
          b.y>55 &&
          b.y<545
        ){

          const hit=
            enemies.find(
              e=>
                Math.hypot(
                  b.x-e.x,
                  b.y-e.y
                )<e.r+b.r
            );

          if(hit){
            b.life=0;
            explodeBomb(b);
          }
        }
      }

      bombs=bombs.filter(
        b=>b.life>0
      );

      /* Enemy movement / combat */
      for(const e of enemies){

        const dx=p.x-e.x;
        const dy=p.y-e.y;

        const d=Math.hypot(dx,dy)||1;

        e.x+=dx/d*e.speed;
        e.y+=dy/d*e.speed;

        if(e.attack>0){
          e.attack--;
        }

        if(
          d<e.r+14 &&
          e.attack<=0
        ){
          damagePlayer(e);
        }

        /* Fireball collisions */
        for(const b of balls){

          if(
            Math.hypot(
              b.x-e.x,
              b.y-e.y
            )<e.r+b.r
          ){

            const impactX=b.x;
            const impactY=b.y;

            e.hp-=p.damage;

            e.burn=Math.max(
              e.burn,
              42
            );

            e.burnTick=0;

            b.life=0;

            burst(
              impactX,
              impactY,
              10
            );

            /* Splash damage */
            for(const other of enemies){

              if(
                other!==e &&
                other.hp>0 &&
                Math.hypot(
                  other.x-impactX,
                  other.y-impactY
                )<58
              ){

                other.hp-=Math.max(
                  6,
                  p.damage*.45
                );

                other.burn=Math.max(
                  other.burn,
                  42
                );

                other.burnTick=0;
              }
            }
          }
        }

        /* Burn damage */
        if(e.burn>0){

          e.burn--;

          e.burnTick++;

          if(e.burnTick%7===0){
            e.hp-=2.5;
          }
        }
      }

      /* Remove dead enemies */
      const dead=
        enemies.filter(
          e=>e.hp<=0
        );

      dead.forEach(killEnemy);

      enemies=enemies.filter(
        e=>e.hp>0
      );

      /* Particles */
      for(const s of particles){
        s.x+=s.vx;
        s.y+=s.vy;
        s.life--;
      }

      particles=particles.filter(
        s=>s.life>0
      );

      /* Heart regeneration */
      if(heartRegen>0){

        heartRegen-=1/60;

        if(heartRegen<=0){
          regainHeart();
        }
      }
    }
  }

  draw();
}

loop();
</script>
</body>
</html>
