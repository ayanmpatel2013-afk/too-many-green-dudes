<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Too Many Green Dudes</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#252525;
  font-family:monospace;
}

canvas{
  display:block;
  margin:auto;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  cursor:crosshair;
}

button{
  font-family:monospace;
  cursor:pointer;
}

#fullscreenBtn,
#pauseBtn{
  position:fixed;
  top:10px;
  z-index:10;
  padding:8px 12px;
  color:#fff;
  font-size:14px;
}

#fullscreenBtn{
  right:10px;
  background:#1e3d20;
  border:2px solid #65b95b;
}

#pauseBtn{
  right:145px;
  background:#3d301e;
  border:2px solid #d6b85a;
}
</style>
</head>

<body>

<button id="pauseBtn">PAUSE</button>
<button id="fullscreenBtn">FULLSCREEN</button>

<canvas id="game" width="900" height="600"></canvas>

<script>

const c=document.getElementById("game");
const ctx=c.getContext("2d");

ctx.imageSmoothingEnabled=false;

const W=900;
const H=600;

const ARENA={
  left:160,
  top:45,
  right:875,
  bottom:570
};

const GATE={
  x:845,
  y:260,
  w:30,
  h:120
};

/* =========================
   GAME VARIABLES
========================= */

let keys={};

let mouse={
  x:450,
  y:300,
  down:false
};

let p;
let enemies=[];
let balls=[];
let particles=[];

let score=0;
let coins=0;
let wave=1;
let elapsed=0;

let gameOver=false;
let paused=false;
let upgradeOpen=false;

let nextUpgrade=70;
let upgradeCost=10;

let upgradeCounts={
  health:0,
  damage:0,
  speed:0
};

let goblinHits=0;
let ogreHits=0;

let hearts=3;
let heartRegen=0;

let fireCooldown=0;

/* =========================
   BOMBS
========================= */

let bombCount=0;
let bombPickups=[];
let bombs=[];
let bombSpawnTimer=20;

const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=22;

/* =========================
   BIG BOSS
========================= */

let bigBoss=null;

let nextBigBoss=200;

let bossCountdown=0;
let bossCountdownValue=0;

/* =========================
   GOBLIN LEVEL
========================= */

let goblinBuffLevel=0;

/* Goblins only get small increases */
const GOBLIN_HP_LEVEL_BONUS=.08;
const GOBLIN_SPEED_LEVEL_BONUS=.035;
const GOBLIN_DAMAGE_LEVEL_BONUS=.20;

/* =========================
   SHIELD
========================= */

const SHIELD_DURATION=3;
const SHIELD_SPEED_MULTIPLIER=2;

/* =========================
   VICTORY / SKELETONS
========================= */

let bossDefeated=false;

let victorySequence=false;
let victoryTimer=0;

let skeletonMode=false;
let skeletonLevel=0;
let skeletonUpgradeTimer=27;

/* =========================
   BAT
========================= */

let batDropped=false;

let bat={
  x:0,
  y:0,
  active:false,
  collected:false,
  pulse:0
};

let batAbility=false;
let batCooldown=0;
let batSwing=0;

const BAT_COOLDOWN=17;

/* =========================
   AUDIO
========================= */

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

const SOUND_VOLUME=2;

function startMusic(){

  if(musicStarted)return;

  try{

    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );

  }catch(err){

    console.log("Music unavailable");

  }
}

function tone(
  freq,
  duration,
  type="square",
  volume=.08
){

  if(!audioCtx)return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume*SOUND_VOLUME,
    now+.01
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(
    now+duration+.02
  );
}

function playFireballSound(){
  tone(240,.10,"square",.07);
}

function playBombExplosionSound(){

  tone(
    70,
    .28,
    "square",
    .20
  );

  setTimeout(
    ()=>tone(
      900,
      .12,
      "square",
      .08
    ),
    10
  );
}

function playBossSound(){
  tone(
    80,
    .7,
    "square",
    .25
  );
}

function playBatSound(){

  tone(
    150,
    .18,
    "square",
    .18
  );

  setTimeout(
    ()=>tone(
      65,
      .25,
      "square",
      .14
    ),
    40
  );
}

function playPickupSound(){

  tone(
    500,
    .12,
    "square",
    .12
  );

  setTimeout(
    ()=>tone(
      800,
      .12,
      "square",
      .10
    ),
    80
  );
}

function playMusicStep(){

  if(
    !audioCtx||
    gameOver||
    paused
  ){
    return;
  }

  const notes=[
    110,
    130.81,
    146.83,
    164.81,
    196,
    164.81,
    146.83,
    130.81,
    110,
    146.83,
    164.81,
    196,
    220,
    196,
    164.81,
    146.83
  ];

  tone(
    notes[
      musicStep%notes.length
    ],
    .25,
    "triangle",
    .055
  );

  musicStep++;
}

/* =========================
   BUTTONS
========================= */

document
.getElementById("fullscreenBtn")
.onclick=async()=>{

  try{

    if(!document.fullscreenElement){

      await document
        .documentElement
        .requestFullscreen();

    }else{

      await document.exitFullscreen();

    }

  }catch(e){}

};

function togglePause(){

  if(
    gameOver||
    victorySequence||
    upgradeOpen||
    bossCountdown>0
  ){
    return;
  }

  paused=!paused;

  document
    .getElementById("pauseBtn")
    .textContent=
      paused
      ?"RESUME"
      :"PAUSE";
}

document
.getElementById("pauseBtn")
.addEventListener(
  "click",
  togglePause
);

/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  e=>{

    startMusic();

    const k=e.key.toLowerCase();

    keys[k]=true;

    if(
      k==="r"&&
      gameOver
    ){

      reset();
      return;

    }

    if(
      k==="p"&&
      !e.repeat
    ){

      togglePause();

    }

    if(
      k==="q"&&
      !e.repeat
    ){

      throwBomb();

    }

    if(
      k==="f"&&
      !e.repeat
    ){

      useBatAbility();

    }

    /*
      Upgrade screen captures the keys
      and the game world remains frozen.
    */

    if(upgradeOpen){

      if(e.key==="1"){
        buyUpgrade("health");
      }

      if(e.key==="2"){
        buyUpgrade("damage");
      }

      if(e.key==="3"){
        buyUpgrade("speed");
      }

      if(e.key==="4"){
        buyUpgrade("nothing");
      }

    }

  }
);

window.addEventListener(
  "keyup",
  e=>{
    keys[
      e.key.toLowerCase()
    ]=false;
  }
);

c.addEventListener(
  "mousemove",
  e=>{

    const r=
      c.getBoundingClientRect();

    mouse.x=
      (e.clientX-r.left)*
      W/r.width;

    mouse.y=
      (e.clientY-r.top)*
      H/r.height;

  }
);

c.addEventListener(
  "mousedown",
  ()=>{

    startMusic();

    mouse.down=true;

  }
);

window.addEventListener(
  "mouseup",
  ()=>{
    mouse.down=false;
  }
);

/* =========================
   RESET
========================= */

function reset(){

  p={
    x:430,
    y:305,

    speed:3.2,

    /*
      Increased player damage.
    */
    damage:34,

    maxHp:100,
    hp:100,

    shieldTimer:0,
    speedBoostTimer:0
  };

  enemies=[];
  balls=[];
  particles=[];

  score=0;
  coins=0;

  wave=1;
  elapsed=0;

  gameOver=false;
  paused=false;
  upgradeOpen=false;

  nextUpgrade=70;
  upgradeCost=10;

  upgradeCounts={
    health:0,
    damage:0,
    speed:0
  };

  goblinHits=0;
  ogreHits=0;

  hearts=3;
  heartRegen=0;

  fireCooldown=0;

  bombCount=0;
  bombPickups=[];
  bombs=[];
  bombSpawnTimer=20;

  bigBoss=null;

  nextBigBoss=200;

  bossCountdown=0;
  bossCountdownValue=0;

  goblinBuffLevel=0;

  bossDefeated=false;

  victorySequence=false;
  victoryTimer=0;

  skeletonMode=false;
  skeletonLevel=0;
  skeletonUpgradeTimer=27;

  batDropped=false;

  bat={
    x:0,
    y:0,
    active:false,
    collected:false,
    pulse:0
  };

  batAbility=false;
  batCooldown=0;
  batSwing=0;

  window.lastBossMark=0;

  spawnWave(1);

}

reset();

/* =========================
   GATE SPAWN
========================= */

function gateSpawnPosition(){

  return{

    x:GATE.x-4,

    y:
      GATE.y+
      GATE.h/2+
      (Math.random()-.5)*45

  };

}

/* =========================
   ENEMY SPAWNING
========================= */

function spawnEnemy(
  type="goblin"
){

  if(
    bossDefeated||
    bigBoss||
    bossCountdown>0
  ){

    return;

  }

  const pos=
    gateSpawnPosition();

  const x=pos.x;
  const y=pos.y;

  if(type==="ogre"){

    const hp=
      260+
      Math.floor(
        elapsed/50
      )*20;

    enemies.push({

      type:"ogre",

      x,
      y,

      spawnX:x,
      spawnY:y,

      r:30,

      hp,
      maxHp:hp,

      speed:
        .42+
        Math.min(
          .18,
          elapsed/2000
        ),

      damage:3,

      attack:0,

      burn:0,
      burnTick:0,

      bossMark:0

    });

    return;

  }

  const buff=
    goblinBuffLevel;

  /*
    Small level increases.
  */

  const hp=
    Math.round(
      (45+wave*6)*
      (1+buff*
        GOBLIN_HP_LEVEL_BONUS)
    );

  const damage=
    1+
    buff*
    GOBLIN_DAMAGE_LEVEL_BONUS;

  const speed=
    .72+
    wave*.018+
    buff*
    GOBLIN_SPEED_LEVEL_BONUS;

  enemies.push({

    type:"goblin",

    x,
    y,

    spawnX:x,
    spawnY:y,

    r:14,

    hp,
    maxHp:hp,

    speed,
    damage,

    attack:0,

    burn:0,
    burnTick:0,

    bossMark:0

  });

}

function spawnWave(n){

  if(
    bossDefeated||
    bigBoss||
    bossCountdown>0
  ){
    return;
  }

  for(
    let i=0;
    i<n;
    i++
  ){

    spawnEnemy("goblin");

  }

}

/* =========================
   BIG BOSS
========================= */

function spawnBigBoss(){

  if(
    bigBoss||
    bossDefeated
  ){
    return;
  }

  const pos=
    gateSpawnPosition();

  bigBoss={

    type:"bigboss",

    x:pos.x+5,
    y:pos.y,

    r:48,

    hp:2400,
    maxHp:2400,

    /*
      REQUESTED BIG BOSS SPEED
    */
    speed:3.1,

    attack:0,

    burn:0,
    burnTick:0,

    spawnFlash:35

  };

  /*
    Clear current enemies before boss.
  */

  enemies=[];

  playBossSound();

}

/* =========================
   BIG BOSS DEFEAT
========================= */

function defeatBigBoss(){

  if(
    !bigBoss||
    victorySequence
  ){
    return;
  }

  const bx=bigBoss.x;
  const by=bigBoss.y;

  score+=50;
  coins+=50;

  /*
    Big explosion.
  */

  burst(
    bx,
    by,
    70
  );

  for(
    let i=0;
    i<60;
    i++
  ){

    particles.push({

      x:bx,
      y:by,

      vx:
        (Math.random()-.5)*10,

      vy:
        (Math.random()-.5)*10,

      life:
        25+
        Math.random()*45

    });

  }

  /*
    Stop all normal spawning.
  */

  bossDefeated=true;

  skeletonMode=true;

  /*
    Convert enemies that were already alive
    into skeletons.
  */

  convertEnemiesToSkeletons();

  /*
    Start boss defeat cutscene.
  */

  victorySequence=true;

  victoryTimer=4;

  batDropped=false;

  bat.active=false;

  /*
    Remove Big Boss from active combat,
    but the animation is drawn separately.
  */

  bigBoss={
    type:"defeatedBoss",

    x:bx,
    y:by,

    r:48,

    hp:0,
    maxHp:2400,

    animation:4,

    batDropped:false
  };

  playBossSound();

}

/* =========================
   SKELETON SYSTEM
========================= */

function convertEnemiesToSkeletons(){

  for(
    const e of enemies
  ){

    if(
      e.type==="ogre"
    ){

      e.type="skeletonOgre";

      e.maxHp=
        Math.round(
          e.maxHp*1.35
        );

      e.hp=e.maxHp;

      e.speed*=1.15;

      e.damage=3.5;

      e.r=31;

    }else{

      e.type="skeletonGoblin";

      e.maxHp=
        Math.round(
          e.maxHp*1.35
        );

      e.hp=e.maxHp;

      e.speed*=1.15;

      e.damage=
        Math.max(
          1.5,
          e.damage*1.25
        );

      e.r=15;

    }

  }

  skeletonLevel=0;

  skeletonUpgradeTimer=27;

}

/*
  Every 27 seconds the skeletons
  become slightly stronger.
*/

function upgradeSkeletons(){

  skeletonLevel++;

  for(
    const e of enemies
  ){

    e.maxHp=
      Math.round(
        e.maxHp*1.15
      );

    e.hp=e.maxHp;

    e.speed*=1.06;

    if(
      e.type==="skeletonGoblin"
    ){

      e.damage*=1.10;

    }

    if(
      e.type==="skeletonOgre"
    ){

      e.damage*=1.10;

    }

  }

}

/* =========================
   BAT
========================= */

function dropBat(){

  if(batDropped)return;

  batDropped=true;

  bat.x=
    W/2;

  bat.y=
    H/2+50;

  bat.active=true;

  bat.collected=false;

  bat.pulse=0;

}

function collectBat(){

  if(
    !bat.active||
    bat.collected||
    gameOver
  ){
    return;
  }

  const d=
    Math.hypot(
      p.x-bat.x,
      p.y-bat.y
    );

  if(d<35){

    bat.collected=true;

    bat.active=false;

    batAbility=true;

    victorySequence=false;

    playPickupSound();

  }

}

function useBatAbility(){

  if(
    !batAbility||
    batCooldown>0||
    gameOver||
    paused||
    upgradeOpen||
    victorySequence||
    bossCountdown>0
  ){
    return;
  }

  batCooldown=
    BAT_COOLDOWN;

  batSwing=.45;

  playBatSound();

  /*
    The bat instantly kills
    goblins, mini bosses,
    skeleton goblins and
    skeleton mini bosses.
  */

  for(
    const e of enemies
  ){

    burst(
      e.x,
      e.y,
      20
    );

    e.hp=0;

  }

  enemies=[];

}

/* =========================
   PLAYER DAMAGE
========================= */

function damagePlayer(e){

  e.attack=45;

  /*
    Shield blocks all damage.
  */

  if(
    p.shieldTimer>0
  ){
    return;
  }

  if(
    e.type==="goblin"||
    e.type==="skeletonGoblin"
  ){

    goblinHits+=
      e.damage||1;

    if(
      goblinHits>=4
    ){

      goblinHits=0;

      loseHeart();

    }

  }else{

    ogreHits++;

    if(
      ogreHits>=2
    ){

      ogreHits=0;

      loseHeart();

    }

  }

}

function loseHeart(){

  if(
    hearts<=0
  ){
    return;
  }

  hearts--;

  heartRegen=30;

  /*
    3 second blue shield
    and 2x speed.
  */

  p.shieldTimer=
    SHIELD_DURATION;

  p.speedBoostTimer=
    SHIELD_DURATION;

  if(
    hearts<=0
  ){

    endGame();

  }

}

function regainHeart(){

  if(
    hearts<3
  ){

    hearts++;

    heartRegen=0;

  }

}

function endGame(){

  gameOver=true;

  const highscore=
    Number(
      localStorage.getItem(
        "pixelNatureHighscore"
      )||0
    );

  if(
    score>highscore
  ){

    localStorage.setItem(
      "pixelNatureHighscore",
      score
    );

  }

}

/* =========================
   UPGRADES
========================= */

function buyUpgrade(kind){

  /*
    Nothing closes the screen.
  */

  if(
    kind==="nothing"
  ){

    upgradeOpen=false;

    return;

  }

  if(
    !upgradeOpen||
    coins<upgradeCost
  ){
    return;
  }

  coins-=upgradeCost;

  if(
    kind==="health"
  ){

    p.maxHp+=20;

    p.hp=
      Math.min(
        p.maxHp,
        p.hp+20
      );

  }

  if(
    kind==="damage"
  ){

    /*
      Damage upgrade is meaningful
      but not excessive.
    */

    p.damage+=14;

  }

  if(
    kind==="speed"
  ){

    p.speed+=.4;

  }

  upgradeCounts[kind]++;

  upgradeCost+=10;

  upgradeOpen=false;

}

/* =========================
   FIREBALL
========================= */

function shoot(){

  if(
    fireCooldown>0||
    upgradeOpen||
    gameOver||
    paused||
    victorySequence||
    bossCountdown>0
  ){
    return;
  }

  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );

  balls.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*8,

    vy:
      Math.sin(a)*8,

    r:7,

    life:90

  });

  fireCooldown=60;

  playFireballSound();

}

/*
  BIG FIREBALL SPLASH RADIUS.
*/

const FIREBALL_SPLASH_RADIUS=110;

const FIREBALL_SPLASH_DAMAGE=.55;

function fireballSplash(
  x,
  y,
  directEnemy
){

  burst(
    x,
    y,
    18
  );

  /*
    Large visible splash.
  */

  for(
    let i=0;
    i<18;
    i++
  ){

    const angle=
      Math.random()*
      Math.PI*2;

    const distance=
      Math.random()*
      FIREBALL_SPLASH_RADIUS;

    particles.push({

      x:
        x+
        Math.cos(angle)*
        distance,

      y:
        y+
        Math.sin(angle)*
        distance,

      vx:
        Math.cos(angle)*2,

      vy:
        Math.sin(angle)*2,

      life:
        15+
        Math.random()*15

    });

  }

  /*
    Damage every enemy in the
    large splash radius.
  */

  for(
    const e of enemies
  ){

    if(
      e===directEnemy
    ){
      continue;
    }

    const d=
      Math.hypot(
        e.x-x,
        e.y-y
      );

    if(
      d<=FIREBALL_SPLASH_RADIUS
    ){

      e.hp-=
        Math.max(
          8,
          p.damage*
          FIREBALL_SPLASH_DAMAGE
        );

      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

    }

  }

}

/* =========================
   BOMB PICKUPS
========================= */

function spawnBombPickup(){

  if(
    bigBoss||
    bossCountdown>0||
    bossDefeated
  ){
    return;
  }

  const x=
    ARENA.left+
    50+
    Math.random()*
    (
      ARENA.right-
      ARENA.left-
      100
    );

  const y=
    90+
    Math.random()*430;

  bombPickups.push({

    x,
    y,

    life:7

  });

}

/* =========================
   BOMB
========================= */

function throwBomb(){

  if(
    gameOver||
    upgradeOpen||
    paused||
    victorySequence||
    bombCount<=0
  ){
    return;
  }

  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );

  bombCount--;

  bombs.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*7,

    vy:
      Math.sin(a)*7,

    life:120,

    r:9,

    distance:0,

    exploded:false,

    disintegrate:0,

    rotation:0

  });

}

function explodeBomb(b){

  if(
    b.exploded
  ){
    return;
  }

  b.exploded=true;

  b.disintegrate=
    BOMB_DISINTEGRATE_TIME;

  b.vx=0;
  b.vy=0;

  playBombExplosionSound();

  burst(
    b.x,
    b.y,
    45
  );

  for(
    let i=0;
    i<30;
    i++
  ){

    particles.push({

      x:b.x,
      y:b.y,

      vx:
        (Math.random()-.5)*8,

      vy:
        (Math.random()-.5)*8,

      life:
        18+
        Math.random()*20

    });

  }

  if(bigBoss){

    const d=
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      );

    if(
      d<145
    ){

      bigBoss.hp-=
        bigBoss.maxHp*.20;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

    }

  }

  for(
    const e of enemies
  ){

    const d=
      Math.hypot(
        b.x-e.x,
        b.y-e.y
      );

    if(
      d<115
    ){

      e.hp-=
        e.type==="ogre"||
        e.type==="skeletonOgre"
        ?e.maxHp*.5
        :e.maxHp*.75;

      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

    }

  }

}

/* =========================
   PLAYER UPDATE
========================= */

function updatePlayer(){

  /*
    Allow movement during the
    bat pickup cutscene.
  */

  if(
    upgradeOpen||
    gameOver
  ){
    return;
  }

  let dx=
    (
      keys.d||
      keys.arrowright
      ?1
      :0
    )-
    (
      keys.a||
      keys.arrowleft
      ?1
      :0
    );

  let dy=
    (
      keys.s||
      keys.arrowdown
      ?1
      :0
    )-
    (
      keys.w||
      keys.arrowup
      ?1
      :0
    );

  const m=
    Math.hypot(
      dx,
      dy
    )||1;

  let speed=
    p.speed;

  if(
    p.speedBoostTimer>0
  ){

    speed*=
      SHIELD_SPEED_MULTIPLIER;

  }

  p.x+=
    dx/m*
    speed;

  p.y+=
    dy/m*
    speed;

  p.x=
    Math.max(
      ARENA.left+15,
      Math.min(
        ARENA.right-20,
        p.x
      )
    );

  p.y=
    Math.max(
      ARENA.top+20,
      Math.min(
        ARENA.bottom-30,
        p.y
      )
    );

}

/* =========================
   BALL UPDATE
========================= */

function updateBalls(){

  for(
    const b of balls
  ){

    b.x+=b.vx;
    b.y+=b.vy;

    b.life--;

    if(
      b.life<=0
    ){
      continue;
    }

    /*
      Big Boss collision.
    */

    if(
      bigBoss&&
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      )<
      bigBoss.r+b.r
    ){

      bigBoss.hp-=p.damage;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

      bigBoss.burnTick=0;

      fireballSplash(
        b.x,
        b.y,
        null
      );

      b.life=0;

      continue;

    }

    /*
      Normal enemy collision.
    */

    let hit=null;

    for(
      const e of enemies
    ){

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )<
        e.r+b.r
      ){

        hit=e;
        break;

      }

    }

    if(hit){

      const impactX=b.x;
      const impactY=b.y;

      hit.hp-=p.damage;

      hit.burn=
        Math.max(
          hit.burn,
          42
        );

      hit.burnTick=0;

      /*
        Large splash damage.
      */

      fireballSplash(
        impactX,
        impactY,
        hit
      );

      b.life=0;

    }

  }

  balls=
    balls.filter(
      b=>
        b.life>0&&
        b.x>ARENA.left&&
        b.x<ARENA.right&&
        b.y>ARENA.top&&
        b.y<ARENA.bottom
    );

}

/* =========================
   BOMB UPDATE
========================= */

function updateBombs(){

  for(
    const b of bombs
  ){

    if(
      !b.exploded
    ){

      b.x+=b.vx;
      b.y+=b.vy;

      b.distance+=
        Math.hypot(
          b.vx,
          b.vy
        );

      b.life--;

      b.rotation+=.15;

      if(
        b.distance>=
        BOMB_THROW_DISTANCE
      ){

        explodeBomb(b);

      }

      if(
        !b.exploded
      ){

        const hit=
          enemies.find(
            e=>
              Math.hypot(
                b.x-e.x,
                b.y-e.y
              )<
              e.r+b.r
          );

        if(hit){
          explodeBomb(b);
        }

      }

      if(
        !b.exploded&&
        (
          b.x<=ARENA.left||
          b.x>=ARENA.right||
          b.y<=ARENA.top||
          b.y>=ARENA.bottom
        )
      ){

        explodeBomb(b);

      }

    }else{

      b.disintegrate--;

    }

  }

  bombs=
    bombs.filter(
      b=>
        !b.exploded||
        b.disintegrate>0
    );

}

/* =========================
   ENEMY UPDATE
========================= */

function updateEnemies(){

  for(
    const e of enemies
  ){

    const dx=
      p.x-e.x;

    const dy=
      p.y-e.y;

    const d=
      Math.hypot(
        dx,
        dy
      )||1;

    e.x+=
      dx/d*
      e.speed;

    e.y+=
      dy/d*
      e.speed;

    if(
      e.attack>0
    ){
      e.attack--;
    }

    if(
      d<
      e.r+14&&
      e.attack<=0
    ){

      damagePlayer(e);

    }

    if(
      e.burn>0
    ){

      e.burn--;
      e.burnTick++;

      if(
        e.burnTick%7===0
      ){

        e.hp-=
          e.type==="skeletonOgre"||
          e.type==="skeletonGoblin"
          ?2.5
          :2;

      }

    }

  }

  const dead=
    enemies.filter(
      e=>e.hp<=0
    );

  dead.forEach(
    killEnemy
  );

  enemies=
    enemies.filter(
      e=>e.hp>0
    );

}

/* =========================
   KILL ENEMY
========================= */

function killEnemy(e){

  if(
    e.type==="ogre"||
    e.type==="skeletonOgre"
  ){

    coins+=7;
    score+=7;

    burst(
      e.x,
      e.y,
      25
    );

  }else{

    coins+=1;
    score++;

    burst(
      e.x,
      e.y,
      12
    );

  }

}

/* =========================
   BIG BOSS UPDATE
========================= */

function updateBoss(){

  if(
    !bigBoss||
    bigBoss.type!=="bigboss"
  ){
    return;
  }

  const dx=
    p.x-bigBoss.x;

  const dy=
    p.y-bigBoss.y;

  const d=
    Math.hypot(
      dx,
      dy
    )||1;

  bigBoss.x+=
    dx/d*
    bigBoss.speed;

  bigBoss.y+=
    dy/d*
    bigBoss.speed;

  if(
    bigBoss.attack>0
  ){
    bigBoss.attack--;
  }

  if(
    d<
    bigBoss.r+16&&
    bigBoss.attack<=0
  ){

    bigBoss.attack=35;

    loseHeart();

  }

  if(
    bigBoss.burn>0
  ){

    bigBoss.burn--;

    bigBoss.burnTick++;

    if(
      bigBoss.burnTick%7===0
    ){

      bigBoss.hp-=3;

    }

  }

  if(
    bigBoss.hp<=0
  ){

    defeatBigBoss();

  }

}

/* =========================
   SHIELD UPDATE
========================= */

function updateShield(){

  if(
    p.shieldTimer>0
  ){

    p.shieldTimer-=1/60;

    p.speedBoostTimer-=1/60;

    if(
      p.shieldTimer<=0
    ){

      p.shieldTimer=0;
      p.speedBoostTimer=0;

    }

  }

}

========================= */

function updateVictory(){

  if(
    !victorySequence
  ){
    return;
  }

  victoryTimer-=1/60;

  /*
    Big Boss disintegration animation.
  */

  if(
    bigBoss&&
    bigBoss.type==="defeatedBoss"
  ){

    bigBoss.animation=
      Math.max(
        0,
        victoryTimer
      );

    if(
      Math.random()<.35
    ){

      particles.push({

        x:

          (Math.random()-.5)*80,

        y:
          bigBoss.y+
          (Math.random()-.5)*80,

        vx:
          (Math.random()-.5)*3,

        vy:
          -Math.random()*3,

        life:
          20+
          Math.random()*20

      });

    }

  }

  /*
    Drop the bat after the
    disintegration animation.
  */

  if(
    victoryTimer<=0&&
    !batDropped
  ){

    if(bigBoss){

      bigBoss=null;

    }

    dropBat();

  }

}

      280
    );

    ctx.font="18px monospace";

    ctx.fillText(
      "Press P or click RESUME",
      W/2,
      320
    );

    ctx.textAlign="left";

  }

  /*
    Boss defeat cutscene.
  */

  if(
    victorySequence
  ){

    ctx.fillStyle="#000";

    ctx.globalAlpha=.30;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.textAlign="center";

    ctx.fillStyle="#fff";

    ctx.font="28px monospace";

    ctx.fillText(
      "BIG BOSS DEFEATED!",
      W/2,
      105
    );

    if(
      victoryTimer>0
    ){

      ctx.font="18px monospace";

      ctx.fillText(
        "THE BIG BOSS IS DISINTEGRATING...",
        W/2,
        145
      );

    }else if(
      bat.active
    ){

      ctx.font="18px monospace";

      ctx.fillText(
        "THE BIG BOSS DROPPED HIS BAT!",
        W/2,
        145
      );

    }

    ctx.textAlign="left";

  }

  /*
    Game over.
  */

  if(
    gameOver
  ){

    ctx.fillStyle="#000";

    ctx.globalAlpha=.82;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.globalAlpha=1;

    ctx.fillStyle="#fff";

    ctx.font="42px monospace";

    ctx.fillText(
      "GAME OVER",
      350,
      260
    );

    ctx.font="18px monospace";

    ctx.fillText(
      "Score: "+
      score+
      "   High Score: "+
      Number(
        localStorage.getItem(
          "pixelNatureHighscore"
        )||0
      ),
      320,
      300
    );

    ctx.fillText(
      "Press R to restart",
      355,
      340
    );

  }

}

/* =========================
   MAIN GAME LOOP
========================= */

function loop(){

  requestAnimationFrame(loop);

  /*
    Completely freeze the world
    when manually paused or on upgrade.
  */

  if(
    gameOver
  ){

    draw();

    return;

  }

  if(
    paused
  ){

    draw();

    return;

  }

  /*
    Upgrade screen is also a complete
    game freeze.
  */

  if(
    upgradeOpen
  ){

    draw();

    return;

  }

  /*
    Victory sequence:
    only the cutscene and bat pickup
    can continue.
  */

  if(
    victorySequence
  ){

    updateVictory();

    updateParticles();

    /*
      Player can walk to the dropped bat.
    */

    if(
      bat.active
    ){

      updatePlayer();

      collectBat();

    }

    draw();

    return;

  }

  /*
    Fireball cooldown.
  */

  if(
    fireCooldown>0
  ){

    fireCooldown--;

  }

  /*
    Bat cooldown.
  */

  if(
    batCooldown>0
  ){

    batCooldown-=1/60;

    if(
      batCooldown<0
    ){

      batCooldown=0;

    }

  }

  if(
    batSwing>0
  ){

    batSwing-=1/60;

  }

  /*
    Shield.
  */

  updateShield();

  /*
    NORMAL TIME.
  */

  elapsed+=1/60;

  /*
    Big Boss countdown.
    The player, enemies, bullets and
    everything else are frozen here.
    Only the countdown changes.
  */

  if(
    !bigBoss&&
    !bossDefeated&&
    bossCountdown<=0&&
    elapsed>=nextBigBoss
  ){

    bossCountdown=3;

    bossCountdownValue=3;

  }

  if(
    bossCountdown>0
  ){

    bossCountdown-=1/60;

    const newValue=
      Math.ceil(
        bossCountdown
      );

    if(
      newValue!==bossCountdownValue&&
      newValue>=1
    ){

      bossCountdownValue=
        newValue;

    }

    /*
      Nothing else is updated
      during the countdown.
    */

    if(
      bossCountdown<=0
    ){

      bossCountdown=0;

      spawnBigBoss();

    }

    draw();

    return;

  }

  /*
    Goblin level upgrades.
  */

  if(
    !bossDefeated
  ){

    const newGoblinBuff=
      Math.floor(
        elapsed/27
      );

    if(
      newGoblinBuff>
      goblinBuffLevel
    ){

      goblinBuffLevel=
        newGoblinBuff;

    }

  }

  /*
    Skeleton level upgrades.
  */

  if(
    bossDefeated
  ){

    skeletonUpgradeTimer-=1/60;

    if(
      skeletonUpgradeTimer<=0
    ){

      upgradeSkeletons();

      skeletonUpgradeTimer=27;

    }

  }

  /*
    Big Boss.
  */

  if(
    bigBoss
  ){

    updateBoss();

  }

  /*
    Normal spawning only happens
    before the Big Boss is defeated.
  */

  if(
    !bigBoss&&
    !bossDefeated
  ){

    /*
      Bomb pickups.
    */

    bombSpawnTimer-=1/60;

    if(
      bombSpawnTimer<=0
    ){

      spawnBombPickup();

      bombSpawnTimer=20;

    }

    for(
      const bp of bombPickups
    ){

      bp.life-=1/60;

    }

    bombPickups=
      bombPickups.filter(
        bp=>bp.life>0
      );

    /*
      Collect bomb pickup.
    */

    if(
      bombCount<3
    ){

      for(
        let i=
          bombPickups.length-1;
        i>=0;
        i--
      ){

        if(
          Math.hypot(
            bombPickups[i].x-p.x,
            bombPickups[i].y-p.y
          )<28
        ){

          bombCount++;

          bombPickups.splice(
            i,
            1
          );

        }

      }

    }

    /*
      Upgrade.
    */

    if(
      elapsed>=nextUpgrade
    ){

      upgradeOpen=true;

      nextUpgrade+=70;

      /*
        Immediately freeze the game.
      */

      draw();

      return;

    }

    /*
      Waves.
    */

    const newWave=
      Math.floor(
        elapsed/10
      )+1;

    if(
      newWave>wave
    ){

      wave=newWave;

      spawnWave(wave);

    }

    /*
      Mini boss every 50 seconds.
    */

    const bossMark=
      Math.floor(
        elapsed/50
      );

    if(
      bossMark>0&&
      !enemies.some(
        e=>
          e.type==="ogre"&&
          e.bossMark===bossMark
      )
    ){

      if(
        !window.lastBossMark
      ){

        window.lastBossMark=0;

      }

      if(
        bossMark>
        window.lastBossMark
      ){

        spawnEnemy("ogre");

        if(
          enemies.length
        ){

          enemies[
            enemies.length-1
          ].bossMark=
            bossMark;

        }

        window.lastBossMark=
          bossMark;

      }

    }

  }

  /*
    Player.
  */

  updatePlayer();

  /*
    Fireballs.
  */

  if(
    mouse.down
  ){

    shoot();

  }

  updateBalls();

  /*
    Bombs.
  */

  updateBombs();

  /*
    Enemies.
    Includes skeletons after boss.
  */

  updateEnemies();

  /*
    Particles.
  */

  updateParticles();

  /*
    Heart regeneration.
  */

  if(
    heartRegen>0
  ){

    heartRegen-=1/60;

    if(
      heartRegen<=0
    ){

      regainHeart();

    }

  }

  draw();

}

loop();

</script>
