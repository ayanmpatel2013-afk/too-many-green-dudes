const GATE={

};

let keys={};

let p,enemies,balls,particles,score,coins,wave,elapsed;
let gameOver,upgradeOpen,nextUpgrade,paused;

let bombCount,bombPickups,bombs,bombSpawnTimer;

let highscore=Number(

);

let bigBoss=null;
let nextBigBoss=200;
let bossCountdown=0;
let bossCountdownValue=0;

let goblinBuffLevel=0;

/* NEW: Big Boss victory state */
let victorySequence=false;
let victoryTimer=0;
let bossDefeated=false;

};

/* NEW: Bat ability */

let batCooldown=0;

let batSwing=0;

/* NEW: Skeleton mode */
let skeletonMode=false;

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

const SOUND_VOLUME=2;

/* =========================
   AUDIO
========================= */

function startMusic(){
  if(musicStarted)return;
  try{
    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();
    musicStarted=true;
    if(audioCtx.state==="suspended")audioCtx.resume();
    musicTimer=setInterval(playMusicStep,280);
  }catch(err){}
}

function tone(freq,duration,type="square",volume=.08){
  if(!audioCtx)return;

  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(
    volume*SOUND_VOLUME,now+.01
  );
  gain.gain.exponentialRampToValueAtTime(
    .0001,now+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now+duration+.02);
}

function playFireballSound(){
  tone(240,.10,"square",.07);
}

function playBombExplosionSound(){
  tone(70,.28,"square",.20);
  setTimeout(()=>tone(900,.12,"square",.08),10);
}

function playBossSound(){
  tone(80,.7,"square",.25);
}

function playBatSound(){
  tone(150,.18,"square",.18);
  setTimeout(()=>tone(65,.25,"square",.14),40);
}

function playPickupSound(){
  tone(500,.12,"square",.12);
  setTimeout(()=>tone(800,.12,"square",.10),80);
}

function playMusicStep(){
  if(!audioCtx||gameOver||paused)return;

  const notes=[
    110,130.81,146.83,164.81,
    196,164.81,146.83,130.81,
    110,146.83,164.81,196,
    220,196,164.81,146.83
  ];

  tone(
    notes[musicStep%notes.length],
    .25,
    "triangle",
    .055
  );

  musicStep++;
}

========================= */

document.getElementById("fullscreenBtn").onclick=async()=>{
  try{

      await document.documentElement.requestFullscreen();
    }else{

  }catch(e){}
};

  if(gameOver||victorySequence)return;
  paused=!paused;
  document.getElementById("pauseBtn").textContent=
    paused?"RESUME":"PAUSE";
}

document.getElementById("pauseBtn").onclick=togglePause;

window.addEventListener("keydown",e=>{
  startMusic();

  const k=e.key.toLowerCase();
  keys[k]=true;

  if(k==="p"&&!e.repeat)togglePause();

  if(k==="r"&&gameOver){
    reset();
    return;
  }

  if(k==="q"&&!e.repeat)throwBomb();

  /* NEW: F bat ability */
  if(k==="f"&&!e.repeat){
    useBatAbility();
  }

  if(upgradeOpen){
    if(e.key==="1")buyUpgrade("health");
    if(e.key==="2")buyUpgrade("damage");

});

window.addEventListener("keyup",e=>{

========================= */

    x:430,y:305,
    speed:3.2,
    damage:28,
    maxHp:100,
    hp:100,

    /* NEW shield */

  };

  enemies=[];
  balls=[];
  particles=[];

  score=0;
  coins=0;

  upgradeOpen=false;

  upgradeCounts={

    speed:0
  };

/* =========================
   SPAWNING
========================= */

function gateSpawnPosition(){
  return{
    x:GATE.x-4,
    y:GATE.y+GATE.h/2+(Math.random()-.5)*45
  };
}

function spawnEnemy(type="goblin"){

  /* Once Big Boss is defeated, new enemies do not
     spawn through the normal system. */
  if(bossDefeated)return;

  if(bigBoss||bossCountdown>0)return;

  const pos=gateSpawnPosition();

  const x=pos.x;
  const y=pos.y;

  if(type==="ogre"){

    const hp=260+Math.floor(elapsed/50)*35;

    enemies.push({
      type:"ogre",
      x,y,
      spawnX:x,
      spawnY:y,
      r:30,
      hp,
      maxHp:hp,
      speed:.42+Math.min(.18,elapsed/2000),
      attack:0,
      burn:0,
      burnTick:0,
      bossMark:0
    });

  }else{

    const buff=goblinBuffLevel;

    const hp=Math.round(
      (45+wave*8)*(1+buff*.20)
    );

    enemies.push({
      type:"goblin",
      x,y,
      spawnX:x,
      spawnY:y,
      r:14,
      hp,
      maxHp:hp,
      speed:.72+wave*.025+buff*.10,
      damage:1+buff,
      attack:0,
      burn:0,
      burnTick:0,
      bossMark:0
    });
  }
}

function spawnWave(n){
  if(bigBoss||bossCountdown>0||bossDefeated)return;

  for(let i=0;i<n;i++){
    spawnEnemy("goblin");
  }
}

/* =========================
   BIG BOSS
========================= */

function spawnBigBoss(){

  if(bigBoss||bossDefeated)return;

  const pos=gateSpawnPosition();

  bigBoss={
    type:"bigboss",
    x:pos.x+5,
    y:pos.y,
    r:48,
    hp:2400,
    maxHp:2400,

    /* REQUESTED SPEED */
    speed:3.1,

    attack:0,
    burn:0,
    burnTick:0,
    rotation:0,
    spawnFlash:35
  };

  enemies=[];
  playBossSound();
}

function defeatBigBoss(){

  if(!bigBoss||victorySequence)return;

  score+=50;
  coins+=50;

  burst(bigBoss.x,bigBoss.y,60);

  for(let i=0;i<35;i++){
    particles.push({
      x:bigBoss.x,
      y:bigBoss.y,
      vx:(Math.random()-.5)*9,
      vy:(Math.random()-.5)*9,
      life:25+Math.random()*30
    });
  }

  /* Stop normal spawning permanently */
  bossDefeated=true;
  skeletonMode=true;

  /* Turn existing enemies into skeletons */
  convertEnemiesToSkeletons();

  victorySequence=true;
  victoryTimer=4;

  batDropped=false;
  bat.active=false;

  bigBoss=null;

  playBossSound();
}

/* =========================
   SKELETON SYSTEM
========================= */

function convertEnemiesToSkeletons(){

  for(const e of enemies){

    e.type=
      e.type==="ogre"
      ?"skeletonOgre"
      :"skeletonGoblin";

    e.maxHp=
      Math.round(e.maxHp*1.45);

    e.hp=e.maxHp;

    e.speed*=1.25;

    if(e.type==="skeletonGoblin"){
      e.damage=(e.damage||2)*1.5;
      e.r=15;
    }else{
      e.r=31;
      e.speed*=.9;
      e.damage=3;
    }
  }

  skeletonLevel=0;
  skeletonUpgradeTimer=27;
}

function upgradeSkeletons(){

  skeletonLevel++;

  for(const e of enemies){

    e.maxHp=Math.round(e.maxHp*1.25);
    e.hp=e.maxHp;

    e.speed*=1.10;

    if(e.type==="skeletonGoblin"){
      e.damage*=1.18;
    }else if(e.type==="skeletonOgre"){
      e.damage*=1.20;
    }
  }
}

/* =========================
   BAT
========================= */

function dropBat(){

  if(batDropped)return;

  batDropped=true;

  bat.x=W/2;
  bat.y=H/2+40;
  bat.active=true;
  bat.collected=false;
  bat.pulse=0;
}

function collectBat(){

  if(
    !bat.active||
    bat.collected||
    victorySequence||
    gameOver
  )return;

  const d=Math.hypot(
    p.x-bat.x,
    p.y-bat.y
  );

  if(d<30){

    bat.collected=true;
    bat.active=false;
    batAbility=true;

    playPickupSound();
  }
}

function useBatAbility(){

  if(
    !batAbility||
    batCooldown>0||
    gameOver||
    paused||
    victorySequence||
    upgradeOpen
  )return;

  batCooldown=BAT_COOLDOWN;
  batSwing=.45;

  playBatSound();

  /* Instant kill ALL enemy types */
  for(const e of enemies){

    burst(e.x,e.y,18);

    e.hp=0;
  }

  enemies=[];

  /* If enemies somehow spawn during skeleton mode,
     the ability still handles them. */
}

/* =========================
   HEART / SHIELD
========================= */

function damagePlayer(e){

  e.attack=45;

  if(p.shieldTimer>0){
    return;
  }

  if(e.type==="goblin"||e.type==="skeletonGoblin"){

    goblinHits+=e.damage||1;

    if(goblinHits>=4){
      goblinHits=0;
      loseHeart();
    }

  }else{

    ogreHits++;

    if(ogreHits>=2){
      ogreHits=0;
      loseHeart();
    }
  }
}

function loseHeart(){

  if(hearts<=0)return;

  hearts--;

  heartRegen=30;

  /* NEW: blue pixel shield */
  p.shieldTimer=3;
  p.speedBoostTimer=3;
  p.shield=1;

  if(hearts<=0){
    endGame();
  }
}

function regainHeart(){

  if(hearts<3){
    hearts++;
    heartRegen=0;
  }
}

function endGame(){

  gameOver=true;

  if(score>highscore){
    highscore=score;

    localStorage.setItem(
      "pixelNatureHighscore",
      highscore
    );
  }
}

/* =========================
   UPGRADES
========================= */

function buyUpgrade(kind){

  if(kind==="nothing"){
    upgradeOpen=false;
    return;
  }

  if(!upgradeOpen||coins<upgradeCost)return;

  coins-=upgradeCost;

  if(kind==="health"){
    p.maxHp+=20;
    p.hp=Math.min(p.maxHp,p.hp+20);
  }

  if(kind==="damage"){
    p.damage+=12;
  }

  if(kind==="speed"){
    p.speed+=.4;
  }

  upgradeCounts[kind]++;
  upgradeCost+=10;
  upgradeOpen=false;
}

/* =========================
   PROJECTILES
========================= */

function shoot(){

  if(
    fireCooldown>0||
    upgradeOpen||
    gameOver||
    paused||
    victorySequence
  )return;

  const a=Math.atan2(
    mouse.y-p.y,
    mouse.x-p.x
  );

  balls.push({
    x:p.x,
    y:p.y,
    vx:Math.cos(a)*8,
    vy:Math.sin(a)*8,
    r:7,
    life:90
  });

  fireCooldown=60;

  playFireballSound();
}

/* =========================
   BOMBS
========================= */

function spawnBombPickup(){

  if(bigBoss||bossCountdown>0||bossDefeated)return;

  const x=ARENA.left+50+
    Math.random()*(ARENA.right-ARENA.left-100);

  const y=90+Math.random()*430;

  bombPickups.push({
    x,y,life:7
  });
}

const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=22;

function throwBomb(){

  if(
    gameOver||
    upgradeOpen||
    paused||
    victorySequence||
    bombCount<=0
  )return;

  const a=Math.atan2(
    mouse.y-p.y,
    mouse.x-p.x
  );

  bombCount--;

  bombs.push({
    x:p.x,
    y:p.y,
    vx:Math.cos(a)*7,
    vy:Math.sin(a)*7,
    life:120,
    r:9,
    distance:0,
    exploded:false,
    disintegrate:0,
    rotation:0
  });
}

function explodeBomb(b){

  if(b.exploded)return;

  b.exploded=true;
  b.disintegrate=BOMB_DISINTEGRATE_TIME;
  b.vx=0;
  b.vy=0;

  playBombExplosionSound();

  burst(b.x,b.y,42);

  if(bigBoss){

    const d=Math.hypot(
      b.x-bigBoss.x,
      b.y-bigBoss.y
    );

    if(d<145){

      bigBoss.hp-=bigBoss.maxHp*.20;

      bigBoss.burn=Math.max(
        bigBoss.burn,42
      );
    }
  }

  for(const e of enemies){

    const d=Math.hypot(
      b.x-e.x,
      b.y-e.y
    );

    if(d<115){

      e.hp-=
        e.type==="ogre"||
        e.type==="skeletonOgre"
        ?e.maxHp*.5
        :e.maxHp*.75;

      e.burn=Math.max(e.burn,42);
      e.burnTick=0;
    }
  }
}

/* =========================
   PARTICLES
========================= */

function burst(x,y,n=8){

  for(let i=0;i<n;i++){

    particles.push({
      x,y,
      vx:(Math.random()-.5)*4,
      vy:(Math.random()-.5)*4,
      life:22
    });
  }
}

function rectPixel(x,y,w,h,color){
  ctx.fillStyle=color;
  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,h
  );
}

========================= */

  );

    );

    rectPixel(
      GATE.x+4+i*6,
      GATE.y+3,
      2,GATE.h-6,
      "#bbb"
    );
  }
}

/* =========================
   GAME LOOP
========================= */

function updatePlayer(){

  if(upgradeOpen||victorySequence)return;

  let dx=
    (keys.d||keys.arrowright?1:0)-
    (keys.a||keys.arrowleft?1:0);

  let dy=
    (keys.s||keys.arrowdown?1:0)-
    (keys.w||keys.arrowup?1:0);

  const m=Math.hypot(dx,dy)||1;

  let speed=p.speed;

  if(p.speedBoostTimer>0){
    speed*=2;
  }

  p.x+=dx/m*speed;
  p.y+=dy/m*speed;

  p.x=Math.max(
    ARENA.left+15,
    Math.min(ARENA.right-20,p.x)
  );

  p.y=Math.max(
    ARENA.top+20,
    Math.min(ARENA.bottom-30,p.y)
  );

  if(mouse.down)shoot();
}

function updateBalls(){

  for(const b of balls){

    b.x+=b.vx;
    b.y+=b.vy;
    b.life--;
  }

  balls=balls.filter(b=>
    b.life>0&&
    b.x>ARENA.left&&
    b.x<ARENA.right&&
    b.y>ARENA.top&&
    b.y<ARENA.bottom
  );
}

function updateBombs(){

  for(const b of bombs){

    if(!b.exploded){

      b.x+=b.vx;
      b.y+=b.vy;

      b.distance+=Math.hypot(
        b.vx,b.vy
      );

      b.life--;

      if(
        b.distance>=BOMB_THROW_DISTANCE||
        b.x<=ARENA.left||
        b.x>=ARENA.right||
        b.y<=ARENA.top||
        b.y>=ARENA.bottom
      ){

        explodeBomb(b);
      }

      if(!b.exploded){

        const hit=enemies.find(e=>
          Math.hypot(
            b.x-e.x,
            b.y-e.y
          )<e.r+b.r
        );

        if(hit)explodeBomb(b);
      }

    }else{

      b.disintegrate--;
    }
  }

  bombs=bombs.filter(b=>
    !b.exploded||
    b.disintegrate>0
  );
}

function updateEnemies(){

  for(const e of enemies){

    const dx=p.x-e.x;
    const dy=p.y-e.y;

    const d=Math.hypot(dx,dy)||1;

    e.x+=dx/d*e.speed;
    e.y+=dy/d*e.speed;

    if(e.attack>0)e.attack--;

    if(
      d<e.r+14&&
      e.attack<=0
    ){

      damagePlayer(e);
    }

    for(const b of balls){

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )<e.r+b.r
      ){

        e.hp-=p.damage;
        e.burn=Math.max(e.burn,42);
        e.burnTick=0;
        b.life=0;

        burst(b.x,b.y,10);
      }
    }

    if(e.burn>0){

      e.burn--;
      e.burnTick++;

      if(e.burnTick%7===0){

        e.hp-=
          e.type==="skeletonOgre"
          ?4
          :2.5;
      }
    }
  }

  const dead=enemies.filter(e=>e.hp<=0);

  for(const e of dead){

    coins+=
      e.type==="skeletonOgre"
      ?10
      :e.type==="skeletonGoblin"
      ?2
      :e.type==="ogre"
      ?7
      :1;

    score+=
      e.type==="skeletonOgre"
      ?10
      :e.type==="skeletonGoblin"
      ?2
      :e.type==="ogre"
      ?7
      :1;

    burst(e.x,e.y,12);
  }

  enemies=enemies.filter(e=>e.hp>0);
}

function updateBoss(){

  if(!bigBoss)return;

  const dx=p.x-bigBoss.x;
  const dy=p.y-bigBoss.y;
  const d=Math.hypot(dx,dy)||1;

  /* Big Boss = 3.1 speed */
  bigBoss.x+=dx/d*3.1;
  bigBoss.y+=dy/d*3.1;

  if(bigBoss.attack>0)bigBoss.attack--;

  if(
    d<bigBoss.r+16&&
    bigBoss.attack<=0
  ){

    bigBoss.attack=35;
    loseHeart();
  }

  for(const b of balls){

    if(
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      )<
      bigBoss.r+b.r
    ){

      bigBoss.hp-=p.damage;
      bigBoss.burn=Math.max(bigBoss.burn,42);
      bigBoss.burnTick=0;
      b.life=0;

      burst(b.x,b.y,14);
    }
  }

  if(bigBoss.burn>0){

    bigBoss.burn--;
    bigBoss.burnTick++;

    if(bigBoss.burnTick%7===0){
      bigBoss.hp-=3;
    }
  }

  if(bigBoss.hp<=0){
    defeatBigBoss();
  }
}

function updateParticles(){

  for(const s of particles){

    s.x+=s.vx;
    s.y+=s.vy;
    s.life--;
  }

  particles=particles.filter(
    s=>s.life>0
  );
}

function updateShield(){

  if(p.shieldTimer>0){

    p.shieldTimer-=1/60;
    p.speedBoostTimer-=1/60;

    if(p.shieldTimer<=0){
      p.shieldTimer=0;
      p.shield=0;
    }

    if(p.speedBoostTimer<0){
      p.speedBoostTimer=0;
    }
  }
}

function updateVictory(){

  if(!victorySequence)return;

  victoryTimer-=1/60;

  /* after the short defeat animation */
  if(
    victoryTimer<=0&&
    !batDropped
  ){

    dropBat();
  }

  /* Keep the scene stopped until the player
     touches the dropped bat. */
}

function loop(){

  requestAnimationFrame(loop);

  if(!gameOver&&!paused){

    /* normal elapsed time */
    if(!victorySequence){
      elapsed+=1/60;
    }

    /* cooldowns */
    if(fireCooldown>0)
      fireCooldown-=1;

    if(batCooldown>0){

      batCooldown-=1/60;

      if(batCooldown<0)
        batCooldown=0;
    }

    if(batSwing>0){
      batSwing-=1/60;
    }

    updateShield();

    if(victorySequence){

      updateVictory();
      updateParticles();

      /* Player can still move to collect bat */
      if(!bat.collected){

        updatePlayer();
        collectBat();
      }

    }else{

      /* Boss countdown */
      if(
        !bigBoss&&
        !bossDefeated&&
        bossCountdown<=0&&
        elapsed>=nextBigBoss
      ){

        bossCountdown=3;
        bossCountdownValue=3;
      }

      if(bossCountdown>0){

        bossCountdown-=1/60;

        const newValue=
          Math.ceil(bossCountdown);

        if(
          newValue!==bossCountdownValue&&
          newValue>=1
        ){

          bossCountdownValue=newValue;
        }

        if(bossCountdown<=0){

          bossCountdown=0;
          spawnBigBoss();
        }
      }

      /* Goblin upgrades before Boss */
      if(!bossDefeated){

        const newGoblinBuff=
          Math.floor(elapsed/27);

        if(newGoblinBuff>goblinBuffLevel){
          goblinBuffLevel=newGoblinBuff;
        }
      }

      /* Skeleton upgrades after Boss */
      if(bossDefeated){

        skeletonUpgradeTimer-=1/60;

        if(skeletonUpgradeTimer<=0){

          upgradeSkeletons();
          skeletonUpgradeTimer=27;
        }
      }

      if(bigBoss){

        updateBoss();

      }else if(!bossDefeated){

        /* bombs */
        bombSpawnTimer-=1/60;

        if(bombSpawnTimer<=0){

          spawnBombPickup();
          bombSpawnTimer=20;
        }

        for(const bp of bombPickups){
          bp.life-=1/60;
        }

        bombPickups=bombPickups.filter(
          bp=>bp.life>0
        );

        if(bombCount<3){

          for(
            let i=bombPickups.length-1;
            i>=0;
            i--
          ){

            if(
              Math.hypot(
                bombPickups[i].x-p.x,
                bombPickups[i].y-p.y
              )<28
            ){

              bombCount++;
              bombPickups.splice(i,1);
            }
          }
        }

        /* upgrades */
        if(elapsed>=nextUpgrade){

          upgradeOpen=true;
          nextUpgrade+=70;
        }

        /* waves */
        const newWave=
          Math.floor(elapsed/10)+1;

        if(newWave>wave){

          wave=newWave;
          spawnWave(wave);
        }

        /* mini boss */
        const bossMark=
          Math.floor(elapsed/50);

        if(
          bossMark>0&&
          !enemies.some(
            e=>
              e.type==="ogre"&&
              e.bossMark===bossMark
          )
        ){

          if(!window.lastBossMark)
            window.lastBossMark=0;

          if(bossMark>window.lastBossMark){

            spawnEnemy("ogre");

            if(enemies.length){

              enemies[
                enemies.length-1
              ].bossMark=bossMark;
            }

            window.lastBossMark=bossMark;
          }
        }
      }

      updatePlayer();
      updateBalls();
      updateBombs();

      /* Normal enemies or skeletons */
      updateEnemies();

      /* Pickup bat if it somehow becomes active */
      collectBat();

      /* particles */
      updateParticles();

      if(heartRegen>0){

        heartRegen-=1/60;

        if(heartRegen<=0){
          regainHeart();
        }
      }
    }
  }

  draw();
}

loop();
</script>
