<script>

/* =========================

let bigBoss=null;

/* =========================

let batAbility=false;

let batSwing=0;

const BAT_COOLDOWN=17;

/* =========================
   SKELETON MODE
========================= */

let skeletonMode=false;
let skeletonLevel=0;
let skeletonUpgradeTimer=27;

/* =========================
   SHIELD
========================= */

const SHIELD_DURATION=3;
const SHIELD_SPEED_MULTIPLIER=2;

/* =========================
   AUDIO
========================= */

let audioCtx=null;
let musicStarted=false;
let musicTimer=null;
let musicStep=0;

function startMusic(){

  if(musicStarted)return;

  try{

    audioCtx=new(
      window.AudioContext||
      window.webkitAudioContext
    )();

    musicStarted=true;

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    musicTimer=setInterval(
      playMusicStep,
      280
    );

  }catch(err){

    console.log(
      "Music unavailable:",
      err
    );

  }
}

function tone(
  freq,
  duration,
  type="square",
  volume=.08
){

  if(!audioCtx)return;

  const now=
    audioCtx.currentTime;

  const osc=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  osc.type=type;
  osc.frequency.value=freq;

  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    now+.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(
    now+duration+.02
  );
}

function playFireballSound(){
  tone(
    240,
    .10,
    "square",
    .07
  );
}

function playBombExplosionSound(){

  tone(
    70,
    .28,
    "square",
    .20
  );

  setTimeout(
    ()=>tone(
      900,
      .12,
      "square",
      .08
    ),
    10
  );
}

function playBossSound(){

  tone(
    80,
    .7,
    "square",
    .25
  );
}

function playBatSound(){

  tone(
    150,
    .18,
    "square",
    .18
  );

  setTimeout(
    ()=>tone(
      65,
      .25,
      "square",
      .14
    ),
    40
  );
}

function playPickupSound(){

  tone(
    500,
    .12,
    "square",
    .12
  );

  setTimeout(
    ()=>tone(
      800,
      .12,
      "square",
      .10
    ),
    80
  );
}

function playMusicStep(){

  if(
    !audioCtx||
    gameOver||
    paused||
    victorySequence
  )return;

  const notes=[
    110,
    130.81,
    146.83,
    164.81,
    196,
    164.81,
    146.83,
    130.81,
    110,
    146.83,
    164.81,
    196,
    220,
    196,
    164.81,
    146.83
  ];

  tone(
    notes[
      musicStep%notes.length
    ],
    .25,
    "triangle",
    .055
  );

  musicStep++;
}

/* =========================
   BUTTONS
========================= */

document
.getElementById("fullscreenBtn")
.onclick=async()=>{

  try{

    if(!document.fullscreenElement){

      await document
        .documentElement

    }else{

      await document.exitFullscreen();

function togglePause(){

  if(
    gameOver||
    victorySequence
  )return;

  paused=!paused;

  document
    .getElementById("pauseBtn")
    .textContent=
      paused
      ?"RESUME"
      :"PAUSE";
}

document
.getElementById("pauseBtn")
.onclick=togglePause;

/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  e=>{

    startMusic();

    const k=
      e.key.toLowerCase();

    keys[k]=true;

    if(
      k==="p"&&
      !e.repeat
    ){

      togglePause();

    }

    if(
      k==="r"&&
      gameOver
    ){

      reset();
      return;

    }

    if(
      k==="q"&&
      !e.repeat
    ){

      throwBomb();

    }

    if(
      k==="f"&&
      !e.repeat
    ){

      useBatAbility();

    }

    /*
      Upgrade controls are disabled
      during the boss cutscene.
    */

    if(
      upgradeOpen&&
      !victorySequence
    ){

      if(e.key==="1")
        buyUpgrade("health");

      if(e.key==="2")
        buyUpgrade("damage");

      if(e.key==="3")
        buyUpgrade("speed");

      if(e.key==="4")
        buyUpgrade("nothing");

    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    keys[
      e.key.toLowerCase()
    ]=false;

  }
);

/* =========================
   MOUSE
========================= */

c.addEventListener(

    const r=
      c.getBoundingClientRect();

    mouse.x=
      (e.clientX-r.left)*

);

c.addEventListener(

window.addEventListener(

/* =========================
   RESET
========================= */

function reset(){

  p={
    x:430,
    y:305,

    speed:3.2,
    damage:28,

    maxHp:100,
    hp:100,

    shieldTimer:0,
    speedBoostTimer:0
  };

  enemies=[];
  balls=[];
  particles=[];

  score=0;
  coins=0;
  wave=1;
  elapsed=0;

  gameOver=false;
  paused=false;

  upgradeOpen=false;
  nextUpgrade=70;
  upgradeCost=10;

  upgradeCounts={
    health:0,
    damage:0,
    speed:0
  };

  goblinHits=0;
  ogreHits=0;

  hearts=3;
  heartRegen=0;

  fireCooldown=0;

  bombCount=0;
  bombPickups=[];
  bombs=[];
  bombSpawnTimer=20;

  bigBoss=null;

  nextBigBoss=200;
  bossCountdown=0;
  bossCountdownValue=0;

  goblinBuffLevel=0;

  bossDefeated=false;

  victorySequence=false;
  victoryTimer=0;

  defeatedBossAnimation=null;

  batDropped=false;

  bat={
    x:0,
    y:0,
    active:false,
    collected:false,
    pulse:0
  };

  batAbility=false;
  batCooldown=0;
  batSwing=0;

  skeletonMode=false;
  skeletonLevel=0;
  skeletonUpgradeTimer=27;

  window.lastBossMark=0;

  spawnWave(1);
}

reset();

/* =========================
   SPAWNING
========================= */

function gateSpawnPosition(){

  return{
    x:
      GATE.x-4,

    y:
      GATE.y+
      GATE.h/2+
      (Math.random()-.5)*45
  };

}

function spawnEnemy(
  type="goblin"
){

  /*
    Absolutely no normal enemies
    after the Big Boss is defeated.
  */

  if(bossDefeated)return;

  if(
    bigBoss||
    bossCountdown>0
  )return;

  const pos=
    gateSpawnPosition();

  const x=pos.x;
  const y=pos.y;

  if(type==="ogre"){

    const hp=
      260+
      Math.floor(
        elapsed/50
      )*35;

    enemies.push({

      type:"ogre",

      x,
      y,

      spawnX:x,
      spawnY:y,

      r:30,

      hp,
      maxHp:hp,

      speed:
        .42+
        Math.min(
          .18,
          elapsed/2000
        ),

      damage:3,

      attack:0,
      burn:0,
      burnTick:0,

      bossMark:0

    });

  }else{

    const buff=
      goblinBuffLevel;

    const hp=
      Math.round(
        (45+wave*8)*
        (1+buff*.20)
      );

    const damage=
      1+buff;

    const speed=
      .72+
      wave*.025+
      buff*.10;

    enemies.push({

      type:"goblin",

      x,
      y,

      spawnX:x,
      spawnY:y,

      r:14,

      hp,
      maxHp:hp,

      speed,
      damage,

      attack:0,
      burn:0,
      burnTick:0,

      bossMark:0

    });

  }

}

function spawnWave(n){

  if(
    bigBoss||
    bossCountdown>0||
    bossDefeated
  )return;

  for(
    let i=0;
    i<n;
    i++
  ){

    spawnEnemy("goblin");

  }

}

/* =========================
   BIG BOSS
========================= */

function spawnBigBoss(){

  if(
    bigBoss||
    bossDefeated
  )return;

  const pos=
    gateSpawnPosition();

  bigBoss={

    type:"bigboss",

    x:pos.x+5,
    y:pos.y,

    r:48,

    hp:2400,
    maxHp:2400,

    /* BIG BOSS SPEED = 3.1 */
    speed:3.1,

    attack:0,
    burn:0,
    burnTick:0,

    rotation:0,
    spawnFlash:35

  };

  enemies=[];

  playBossSound();

}

/* =========================
   BIG BOSS DEFEATED
========================= */

function defeatBigBoss(){

  if(
    !bigBoss||
    victorySequence
  )return;

  score+=50;
  coins+=50;

  /*
    Copy the Boss into a separate
    animation object BEFORE deleting it.
  */

  defeatedBossAnimation={
    x:bigBoss.x,
    y:bigBoss.y,

    scale:1,

    alpha:1,

    rotation:0,

    life:4,

    particles:0
  };

  /*
    Stop every normal system.
  */

  bossDefeated=true;

  skeletonMode=true;

  upgradeOpen=false;

  bossCountdown=0;

  /*
    Convert enemies that were already alive
    into skeleton versions.
  */

  convertEnemiesToSkeletons();

  /*
    Start the actual cutscene.
  */

  victorySequence=true;

  victoryTimer=4;

  batDropped=false;

  bat.active=false;

  /*
    Big Boss is now represented by
    defeatedBossAnimation.
  */

  bigBoss=null;

  /*
    Clear projectiles so nothing
    interferes with the cutscene.
  */

  balls=[];

  bombPickups=[];
  bombs=[];

  playBossSound();

}

/* =========================
   SKELETON SYSTEM
========================= */

function convertEnemiesToSkeletons(){

  for(
    const e of enemies
  ){

    if(
      e.type==="ogre"
    ){

      e.type="skeletonOgre";

      e.maxHp=
        Math.round(
          e.maxHp*1.45
        );

      e.hp=e.maxHp;

      e.speed*=1.25;

      e.damage=4;

      e.r=31;

    }else{

      e.type="skeletonGoblin";

      e.maxHp=
        Math.round(
          e.maxHp*1.45
        );

      e.hp=e.maxHp;

      e.speed*=1.25;

      e.damage=
        (e.damage||2)*1.5;

      e.r=15;

    }

  }

  skeletonLevel=0;

  skeletonUpgradeTimer=27;

}

function upgradeSkeletons(){

  skeletonLevel++;

  for(
    const e of enemies
  ){

    e.maxHp=
      Math.round(
        e.maxHp*1.25
      );

    e.hp=e.maxHp;

    e.speed*=1.10;

    if(
      e.type==="skeletonGoblin"
    ){

      e.damage*=1.18;

    }

    if(
      e.type==="skeletonOgre"
    ){

      e.damage*=1.20;

    }

  }

}

/* =========================
   VICTORY CUTSCENE
========================= */

function updateVictory(){

  if(!victorySequence)return;

  victoryTimer-=1/60;

  if(
    defeatedBossAnimation
  ){

    const t=
      Math.max(
        0,
        victoryTimer
      );

    defeatedBossAnimation.life=t;

    /*
      Boss gets smaller and fades
      during the 4-second animation.
    */

    defeatedBossAnimation.scale=
      Math.max(
        .05,
        t/4
      );

    defeatedBossAnimation.alpha=
      Math.max(
        0,
        t/4
      );

    defeatedBossAnimation.rotation+=
      .025;

    /*
      Disintegration particles.
    */

    if(
      Math.random()<.65
    ){

      particles.push({

        x:
          defeatedBossAnimation.x+
          (Math.random()-.5)*70,

        y:
          defeatedBossAnimation.y+
          (Math.random()-.5)*80,

        vx:
          (Math.random()-.5)*3,

        vy:
          -Math.random()*3,

        life:
          20+
          Math.random()*30,

        skeleton:false

      });

    }

  }

  /*
    At the end, drop the bat.
  */

  if(
    victoryTimer<=0&&
    !batDropped
  ){

    dropBat();

  }

}

/* =========================
   BAT
========================= */

function dropBat(){

  if(batDropped)return;

  batDropped=true;

  if(
    defeatedBossAnimation
  ){

    bat.x=
      defeatedBossAnimation.x;

    bat.y=
      defeatedBossAnimation.y+35;

  }else{

    bat.x=W/2;
    bat.y=H/2;

  }

  bat.active=true;
  bat.collected=false;
  bat.pulse=0;

}

function collectBat(){

  if(
    !bat.active||
    bat.collected||
    gameOver
  )return;

  const d=
    Math.hypot(
      p.x-bat.x,
      p.y-bat.y
    );

  if(d<32){

    bat.collected=true;
    bat.active=false;

    batAbility=true;

    /*
      The cutscene ends only when
      the player has collected the bat.
    */

    victorySequence=false;

    defeatedBossAnimation=null;

    playPickupSound();

  }

}

function useBatAbility(){

  if(
    !batAbility||
    batCooldown>0||
    gameOver||
    paused||
    victorySequence
  )return;

  batCooldown=BAT_COOLDOWN;

  batSwing=.45;

  playBatSound();

  /*
    Instantly kill all skeleton
    goblins and skeleton mini-bosses.
  */

  for(
    const e of enemies
  ){

    burst(
      e.x,
      e.y,
      18
    );

    e.hp=0;

  }

  /*
    They are removed immediately.
  */

  enemies=[];

}

/* =========================
   PLAYER DAMAGE
========================= */

function damagePlayer(e){

  e.attack=45;

  /*
    Shield blocks all damage.
  */

  if(
    p.shieldTimer>0
  ){

    return;

  }

  if(
    e.type==="goblin"||
    e.type==="skeletonGoblin"
  ){

    goblinHits+=
      e.damage||1;

    if(
      goblinHits>=4
    ){

      goblinHits=0;

      loseHeart();

    }

  }else{

    ogreHits++;

    if(
      ogreHits>=2
    ){

      ogreHits=0;

      loseHeart();

    }

  }

}

function loseHeart(){

  if(
    hearts<=0
  )return;

  hearts--;

  heartRegen=30;

  /*
    Blue shield for 3 seconds.
  */

  p.shieldTimer=
    SHIELD_DURATION;

  /*
    2x speed for the same 3 seconds.
  */

  p.speedBoostTimer=
    SHIELD_DURATION;

  if(
    hearts<=0
  ){

    endGame();

  }

}

function regainHeart(){

  if(
    hearts<3
  ){

    hearts++;

    heartRegen=0;

  }

}

function endGame(){

  gameOver=true;

  if(
    score>highscore
  ){

    highscore=score;

    localStorage.setItem(
      "pixelNatureHighscore",
      highscore
    );

  }

}

/* =========================
   UPGRADES
========================= */

function buyUpgrade(kind){

  /*
    Never allow upgrades during
    the Big Boss victory sequence.
  */

  if(victorySequence){

    upgradeOpen=false;
    return;

  }

  if(
    kind==="nothing"
  ){

    upgradeOpen=false;
    return;

  }

  if(
    !upgradeOpen||
    coins<upgradeCost
  )return;

  coins-=upgradeCost;

  if(
    kind==="health"
  ){

    p.maxHp+=20;

    p.hp=
      Math.min(
        p.maxHp,
        p.hp+20
      );

  }

  if(
    kind==="damage"
  ){

    p.damage+=12;

  }

  if(
    kind==="speed"
  ){

    p.speed+=.4;

  }

  upgradeCounts[kind]++;

  upgradeCost+=10;

  upgradeOpen=false;

}

/* =========================
   SHOOTING
========================= */

function shoot(){

  if(
    fireCooldown>0||
    upgradeOpen||
    gameOver||
    paused||
    victorySequence
  )return;

  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );

  balls.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*8,

    vy:
      Math.sin(a)*8,

    r:7,

    life:90

  });

  fireCooldown=60;

  playFireballSound();

}

/* =========================
   BOMBS
========================= */

function spawnBombPickup(){

  if(
    bigBoss||
    bossCountdown>0||
    bossDefeated||
    victorySequence
  )return;

  const x=
    ARENA.left+
    50+
    Math.random()*
    (
      ARENA.right-
      ARENA.left-
      100
    );

  const y=
    90+
    Math.random()*430;

  bombPickups.push({

    x,
    y,
    life:7

  });

}

const BOMB_THROW_DISTANCE=300;
const BOMB_DISINTEGRATE_TIME=22;

function throwBomb(){

  if(
    gameOver||
    upgradeOpen||
    paused||
    victorySequence||
    bombCount<=0
  )return;

  const a=
    Math.atan2(
      mouse.y-p.y,
      mouse.x-p.x
    );

  bombCount--;

  bombs.push({

    x:p.x,
    y:p.y,

    vx:
      Math.cos(a)*7,

    vy:
      Math.sin(a)*7,

    life:120,

    r:9,

    distance:0,

    exploded:false,

    disintegrate:0

  });

}

function explodeBomb(b){

  if(b.exploded)return;

  b.exploded=true;

  b.disintegrate=
    BOMB_DISINTEGRATE_TIME;

  b.vx=0;
  b.vy=0;

  playBombExplosionSound();

  burst(
    b.x,
    b.y,
    42
  );

  if(bigBoss){

    const d=
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      );

    if(d<145){

      bigBoss.hp-=
        bigBoss.maxHp*.20;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

    }

  }

  for(
    const e of enemies
  ){

    const d=
      Math.hypot(
        b.x-e.x,
        b.y-e.y
      );

    if(
      d<115
    ){

      e.hp-=
        e.type==="ogre"||
        e.type==="skeletonOgre"
        ?e.maxHp*.5
        :e.maxHp*.75;

      e.burn=
        Math.max(
          e.burn,
          42
        );

      e.burnTick=0;

    }

  }

}

/* =========================
   PARTICLES
========================= */

function burst(
  x,
  y,
  n=8
){

  for(
    let i=0;
    i<n;
    i++
  ){

    particles.push({

      x,
      y,

      vx:
        (Math.random()-.5)*4,

      vy:
        (Math.random()-.5)*4,

      life:
        22+
        Math.random()*15

    });

  }

}

/* =========================
   PLAYER
========================= */

function updatePlayer(){

  /*
    Player can move during the bat
    pickup portion of the cutscene,
    but not during the actual Boss
    disintegration animation.
  */

  if(
    upgradeOpen
  )return;

  if(
    victorySequence&&
    victoryTimer>0
  )return;

  let dx=
    (
      keys.d||
      keys.arrowright
      ?1
      :0
    )-
    (
      keys.a||
      keys.arrowleft
      ?1
      :0
    );

  let dy=
    (
      keys.s||
      keys.arrowdown
      ?1
      :0
    )-
    (
      keys.w||
      keys.arrowup
      ?1
      :0
    );

  const m=
    Math.hypot(
      dx,
      dy
    )||1;

  let speed=p.speed;

  if(
    p.speedBoostTimer>0
  ){

    speed*=
      SHIELD_SPEED_MULTIPLIER;

  }

  p.x+=
    dx/m*
    speed;

  p.y+=
    dy/m*
    speed;

  p.x=
    Math.max(
      ARENA.left+15,
      Math.min(
        ARENA.right-20,
        p.x
      )
    );

  p.y=
    Math.max(
      ARENA.top+20,
      Math.min(
        ARENA.bottom-30,
        p.y
      )
    );

  if(
    mouse.down
  ){

    shoot();

  }

}

/* =========================
   BALLS
========================= */

function updateBalls(){

  for(
    const b of balls
  ){

    b.x+=b.vx;
    b.y+=b.vy;

    b.life--;

  }

  balls=
    balls.filter(
      b=>
        b.life>0&&
        b.x>ARENA.left&&
        b.x<ARENA.right&&
        b.y>ARENA.top&&
        b.y<ARENA.bottom
    );

}

/* =========================
   BOMBS
========================= */

function updateBombs(){

  for(
    const b of bombs
  ){

    if(!b.exploded){

      b.x+=b.vx;
      b.y+=b.vy;

      b.distance+=
        Math.hypot(
          b.vx,
          b.vy
        );

      b.life--;

      if(
        b.distance>=
        BOMB_THROW_DISTANCE||
        b.x<=ARENA.left||
        b.x>=ARENA.right||
        b.y<=ARENA.top||
        b.y>=ARENA.bottom
      ){

        explodeBomb(b);

      }

      if(
        !b.exploded
      ){

        const hit=
          enemies.find(
            e=>
              Math.hypot(
                b.x-e.x,
                b.y-e.y
              )<
              e.r+b.r
          );

        if(hit){

          explodeBomb(b);

        }

      }

    }else{

      b.disintegrate--;

    }

  }

  bombs=
    bombs.filter(
      b=>
        !b.exploded||
        b.disintegrate>0
    );

}

/* =========================
   ENEMIES
========================= */

function updateEnemies(){

  for(
    const e of enemies
  ){

    const dx=
      p.x-e.x;

    const dy=
      p.y-e.y;

    const d=
      Math.hypot(
        dx,
        dy
      )||1;

    e.x+=
      dx/d*
      e.speed;

    e.y+=
      dy/d*
      e.speed;

    if(
      e.attack>0
    ){

      e.attack--;

    }

    if(
      d<e.r+14&&
      e.attack<=0
    ){

      damagePlayer(e);

    }

    for(
      const b of balls
    ){

      if(
        Math.hypot(
          b.x-e.x,
          b.y-e.y
        )<
        e.r+b.r
      ){

        e.hp-=p.damage;

        e.burn=
          Math.max(
            e.burn,
            42
          );

        e.burnTick=0;

        b.life=0;

        burst(
          b.x,
          b.y,
          10
        );

      }

    }

    if(
      e.burn>0
    ){

      e.burn--;
      e.burnTick++;

      if(
        e.burnTick%7===0
      ){

        e.hp-=
          e.type==="skeletonOgre"
          ?4
          :2.5;

      }

    }

  }

  const dead=
    enemies.filter(
      e=>e.hp<=0
    );

  for(
    const e of dead
  ){

    let reward=1;

    if(
      e.type==="ogre"
    ){

      reward=7;

    }else if(
      e.type==="skeletonGoblin"
    ){

      reward=2;

    }else if(
      e.type==="skeletonOgre"
    ){

      reward=10;

    }

    coins+=reward;
    score+=reward;

    burst(
      e.x,
      e.y,
      14
    );

  }

  enemies=
    enemies.filter(
      e=>e.hp>0
    );

}

/* =========================
   BIG BOSS UPDATE
========================= */

function updateBoss(){

  if(!bigBoss)return;

  const dx=
    p.x-bigBoss.x;

  const dy=
    p.y-bigBoss.y;

  const d=
    Math.hypot(
      dx,
      dy
    )||1;

  /*
    Big Boss speed is exactly 3.1.
  */

  bigBoss.x+=
    dx/d*3.1;

  bigBoss.y+=
    dy/d*3.1;

  if(
    bigBoss.attack>0
  ){

    bigBoss.attack--;

  }

  if(
    d<bigBoss.r+16&&
    bigBoss.attack<=0
  ){

    bigBoss.attack=35;

    loseHeart();

  }

  for(
    const b of balls
  ){

    if(
      Math.hypot(
        b.x-bigBoss.x,
        b.y-bigBoss.y
      )<
      bigBoss.r+b.r
    ){

      bigBoss.hp-=p.damage;

      bigBoss.burn=
        Math.max(
          bigBoss.burn,
          42
        );

      bigBoss.burnTick=0;

      b.life=0;

      burst(
        b.x,
        b.y,
        14
      );

    }

  }

  if(
    bigBoss.burn>0
  ){

    bigBoss.burn--;
    bigBoss.burnTick++;

    if(
      bigBoss.burnTick%7===0
    ){

      bigBoss.hp-=3;

    }

  }

  if(
    bigBoss.hp<=0
  ){

    defeatBigBoss();

  }

}

/* =========================
   SHIELD TIMER
========================= */

function updateShield(){

  if(
    p.shieldTimer>0
  ){

    p.shieldTimer-=1/60;
    p.speedBoostTimer-=1/60;

    if(
      p.shieldTimer<=0
    ){

      p.shieldTimer=0;
      p.speedBoostTimer=0;

    }

  }

}

/* =========================
   MAIN LOOP
========================= */

function loop(){

  requestAnimationFrame(loop);

  if(
    !gameOver&&
    !paused
  ){

    /*
      Time does NOT advance during
      the Boss victory cutscene.
    */

    if(
      !victorySequence
    ){

      elapsed+=1/60;

    }

    /*
      Fireball cooldown.
    */

    if(
      fireCooldown>0
    ){

      fireCooldown--;

    }

    /*
      Bat cooldown.
    */

    if(
      batCooldown>0
    ){

      batCooldown-=1/60;

      if(
        batCooldown<0
      ){

        batCooldown=0;

      }

    }

    /*
      Bat swing animation.
    */

    if(
      batSwing>0
    ){

      batSwing-=1/60;

    }

    updateShield();

    /*
      VICTORY MODE.
    */

    if(
      victorySequence
    ){

      updateVictory();

      updateParticles();

      /*
        During the actual Boss
        disintegration, the player
        is frozen.

        Once the animation ends,
        the player can walk to the bat.
      */

      if(
        victoryTimer<=0&&
        !bat.collected
      ){

        updatePlayer();

        collectBat();

      }

    }else{

      /*
        BOSS COUNTDOWN.
      */

      if(
        !bigBoss&&
        !bossDefeated&&
        bossCountdown<=0&&
        elapsed>=nextBigBoss
      ){

        bossCountdown=3;

        bossCountdownValue=3;

      }

      if(
        bossCountdown>0
      ){

        bossCountdown-=1/60;

        const newValue=
          Math.ceil(
            bossCountdown
          );

        if(
          newValue!==bossCountdownValue&&
          newValue>=1
        ){

          bossCountdownValue=
            newValue;

        }

        if(
          bossCountdown<=0
        ){

          bossCountdown=0;

          spawnBigBoss();

        }

      }

      /*
        NORMAL GOBLIN UPGRADES.
      */

      if(
        !bossDefeated
      ){

        const newGoblinBuff=
          Math.floor(
            elapsed/27
          );

        if(
          newGoblinBuff>
          goblinBuffLevel
        ){

          goblinBuffLevel=
            newGoblinBuff;

        }

      }

      /*
        SKELETON UPGRADES.
        Every 27 seconds they get
        stronger.
      */

      if(
        bossDefeated
      ){

        skeletonUpgradeTimer-=1/60;

        if(
          skeletonUpgradeTimer<=0
        ){

          upgradeSkeletons();

          skeletonUpgradeTimer=27;

        }

      }

      /*
        Big Boss.
      */

      if(
        bigBoss
      ){

        updateBoss();

      }else if(
        !bossDefeated
      ){

        /*
          Bomb spawning.
        */

        bombSpawnTimer-=1/60;

        if(
          bombSpawnTimer<=0
        ){

          spawnBombPickup();

          bombSpawnTimer=20;

        }

        for(
          const bp of bombPickups
        ){

          bp.life-=1/60;

        }

        bombPickups=
          bombPickups.filter(
            bp=>bp.life>0
          );

        /*
          Collect bombs.
        */

        if(
          bombCount<3
        ){

          for(
            let i=
              bombPickups.length-1;
            i>=0;
            i--
          ){

            if(
              Math.hypot(
                bombPickups[i].x-p.x,
                bombPickups[i].y-p.y
              )<28
            ){

              bombCount++;

              bombPickups.splice(
                i,
                1
              );

            }

          }

        }

        /*
          UPGRADES.
          Critical fix:
          they cannot open if the Boss
          has been defeated.
        */

        if(
          elapsed>=nextUpgrade&&
          !bossDefeated&&
          !victorySequence
        ){

          upgradeOpen=true;

          nextUpgrade+=70;

        }

        /*
          Normal waves.
        */

        const newWave=
          Math.floor(
            elapsed/10
          )+1;

        if(
          newWave>wave
        ){

          wave=newWave;

          spawnWave(wave);

        }

        /*
          Mini Boss.
        */

        const bossMark=
          Math.floor(
            elapsed/50
          );

        if(
          bossMark>0&&
          !enemies.some(
            e=>
              e.type==="ogre"&&
              e.bossMark===bossMark
          )
        ){

          if(
            !window.lastBossMark
          ){

            window.lastBossMark=0;

          }

          if(
            bossMark>
            window.lastBossMark
          ){

            spawnEnemy("ogre");

            if(
              enemies.length
            ){

              enemies[
                enemies.length-1
              ].bossMark=
                bossMark;

            }

            window.lastBossMark=
              bossMark;

          }

        }

      }

      /*
        Player and combat.
      */

      updatePlayer();

      updateBalls();

      updateBombs();

      updateEnemies();

      updateParticles();

      /*
        Bat collection.
      */

      collectBat();

      /*
        Heart regeneration.
      */

      if(
        heartRegen>0
      ){

        heartRegen-=1/60;

        if(
          heartRegen<=0
        ){

          regainHeart();

        }

      }

    }

  }

  draw();

}

loop();
